name: PufiStars
options:
  bundleIdPrefix: ch.hory
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: "5.0.0"
targets:
  PufiStars:
    type: application
    platform: iOS
    sources:
      - path: PufiStars
        excludes:
          - "WebContent/**"
      - path: PufiStars/WebContent
        type: folder
        buildPhase: resources
    dependencies:
      - package: RevenueCat
    preBuildScripts:
      - name: Sync web game
        script: "\"${SRCROOT}/sync_web.sh\""
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.hory.pufistars
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_KEY_CFBundleDisplayName: "Pufi"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "The microphone is used so your child can read stories out loud and so parents can record words of praise. Recordings stay on this device."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Speech recognition follows your child's reading and colours each word that was read correctly."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
