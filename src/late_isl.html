<style>
/* ===== Insula lui Pufi ===== */
.isl-ban{position:relative;width:100%;max-width:1000px;height:clamp(150px,30vh,270px);border-radius:28px;overflow:hidden;cursor:pointer;box-shadow:0 8px 0 rgba(36,50,95,.18);flex:none;border:none;padding:0;font:inherit;background:#6EC6FF}
.isl-ban:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(36,50,95,.18)}
.isl-ban svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.isl-ban .cap{position:absolute;left:12px;bottom:10px;background:rgba(255,255,255,.92);border-radius:18px;padding:6px 14px;font-weight:800;color:#24325f;text-align:left;line-height:1.15;max-width:75%}
.isl-ban .cap b{display:block;font-size:clamp(1.2rem,3.2vw,1.7rem)}
.isl-ban .cap span{font-size:clamp(.85rem,2vw,1.05rem);opacity:.85}
.isl-ban .bdg{position:absolute;right:12px;top:10px;background:#fff;border-radius:999px;padding:4px 12px;font-weight:800;font-size:clamp(1rem,2.6vw,1.35rem);color:#24325f}
.isl-ban .bdg.hot{background:#FFD43B;animation:islPulse 1s ease-in-out infinite}
@keyframes islPulse{50%{transform:scale(1.12)}}
#isl-root{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;gap:6px;box-sizing:border-box;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 10px);font-family:var(--display);color:var(--ink);background:#3BA7E5}
#isl-root[hidden]{display:none}
#isl-root .rb-top h2{margin:0;flex:1;text-align:center;font-size:clamp(1.3rem,3.6vw,2rem);color:#fff;text-shadow:0 2px 0 #24325f,0 -2px 0 #24325f,2px 0 0 #24325f,-2px 0 0 #24325f}
#isl-stage{flex:1;min-height:0;position:relative;overflow:hidden}
#isl-stage.por{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
#isl-stage.por svg{max-width:none}
#isl-stage svg{width:100%;height:100%;display:block;-webkit-user-select:none;user-select:none}
.isl-b{cursor:pointer}
#isl-pop{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:#fff;border-radius:24px;padding:12px 16px;width:min(560px,94%);box-sizing:border-box;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;font-weight:800;box-shadow:0 8px 0 rgba(36,50,95,.18);z-index:2}
#isl-pop[hidden]{display:none}
#isl-pop.mini{top:8px;bottom:auto;flex-direction:row;flex-wrap:wrap;justify-content:center;padding:6px 10px;gap:6px;width:auto;max-width:94%}
#isl-pop.mini h3{font-size:1.4rem;line-height:1}#isl-pop.mini h3 img,#isl-pop.mini h3 svg{max-height:40px;width:auto}#isl-pop.mini p{font-size:clamp(.85rem,2vw,1rem)}#isl-pop.mini .rb-b{padding:6px 12px;min-height:44px}
#isl-pop h3{margin:0;font-size:clamp(1.2rem,3vw,1.6rem)}
#isl-pop p{margin:0;font-size:clamp(1rem,2.4vw,1.2rem);line-height:1.3}
#isl-pop .bar{width:100%;height:16px;border-radius:999px;background:#E6ECF7;overflow:hidden}
#isl-pop .bar i{display:block;height:100%;background:linear-gradient(90deg,#FFD43B,#FFB020);border-radius:999px}
#isl-pop .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.isl-toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);z-index:100000;background:#fff;border:3px solid #FFB020;border-radius:999px;padding:8px 18px;font-family:var(--display);font-weight:800;font-size:clamp(1rem,2.6vw,1.3rem);color:#24325f;pointer-events:none;animation:islToast 3s ease forwards;white-space:nowrap;box-shadow:0 6px 0 rgba(36,50,95,.15)}
@keyframes islToast{0%{opacity:0;transform:translate(-50%,-20px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
/* animații în scenă */
.isl-svg .cl{animation:islCloud 60s linear infinite}
.isl-svg .cl2{animation:islCloud 85s linear infinite;animation-delay:-40s}
@keyframes islCloud{from{transform:translateX(-300px)}to{transform:translateX(1850px)}}
.isl-svg .boat{animation:islBoat 70s linear infinite}
@keyframes islBoat{from{transform:translateX(-120px)}to{transform:translateX(1680px)}}
.isl-svg .bob{animation:islBob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes islBob{50%{transform:translateY(-4px) rotate(-3deg)}}
.isl-svg .wave{animation:islWave 6s linear infinite}
.isl-svg .wave2{animation:islWave 9s linear infinite reverse}
@keyframes islWave{from{transform:translateX(0)}to{transform:translateX(-80px)}}
.isl-svg .palm{animation:islSway 4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
@keyframes islSway{50%{transform:rotate(4deg)}}
.isl-svg .tw{animation:islTw 2s ease-in-out infinite}
@keyframes islTw{50%{opacity:.2}}
.isl-svg .spin{animation:islSpin 6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes islSpin{to{transform:rotate(360deg)}}
.isl-svg .smoke{animation:islSmoke 3s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes islSmoke{0%{opacity:0;transform:translate(0,0) scale(.5)}20%{opacity:.85}100%{opacity:0;transform:translate(14px,-46px) scale(1.5)}}
.isl-svg .flag{animation:islFlag 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
@keyframes islFlag{50%{transform:scaleX(.8) skewY(4deg)}}
.isl-svg .hop{animation:islHop 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
@keyframes islHop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}}
.isl-svg .beam{animation:islBeam 5s ease-in-out infinite;transform-box:fill-box;transform-origin:right center}
@keyframes islBeam{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.15)}}
.isl-svg .an{transition:transform 2.6s linear}
.isl-svg .egg{animation:islEgg 2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.isl-svg .egg.rdy{animation:islEggR .6s ease-in-out infinite}
@keyframes islEgg{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-8deg)}92%{transform:rotate(8deg)}}
@keyframes islEggR{25%{transform:rotate(-10deg) translateY(-3px)}75%{transform:rotate(10deg) translateY(-3px)}}
.isl-svg .grow{animation:islGrow 1.3s cubic-bezier(.3,1.5,.5,1) both;transform-box:fill-box;transform-origin:bottom center}
@keyframes islGrow{0%{transform:scale(.15,.05);opacity:0}60%{transform:scale(1.08,1.12);opacity:1}100%{transform:scale(1)}}
.isl-svg .pf{animation:islPf 1.4s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes islPf{0%{opacity:1;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.4)}}
.isl-svg .tap{animation:islTapH 1.2s ease-in-out infinite}
@keyframes islTapH{50%{transform:translateY(-6px)}}
#isl-stage svg image{-webkit-user-drag:none}
.isl-svg .sn{animation:islSnow 10s linear infinite}
@keyframes islSnow{from{transform:translate(0,-40px)}to{transform:translate(60px,1080px)}}
#isl-root .isl-tb{white-space:nowrap}
#isl-root .isl-tb.hot{background:#FFD43B;animation:islPulse 1s ease-in-out infinite}
#isl-shop{position:absolute;inset:0;z-index:4;background:rgba(20,30,70,.45);display:flex;align-items:center;justify-content:center;padding:12px}
#isl-shop[hidden]{display:none}
.isl-shopbox{background:#fff;border-radius:26px;width:min(860px,96vw);max-height:88%;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;color:#24325f}
.isl-shopbox .hd{display:flex;align-items:center;gap:10px;font-weight:800;font-size:clamp(1.2rem,3vw,1.6rem)}.isl-shopbox .hd b{flex:1}
.isl-shopbox .gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(30%,150px),1fr));gap:10px}
.isl-shopbox .it{font:inherit;font-weight:800;border:3px solid #E6ECF7;background:#F7FAFF;border-radius:20px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:#24325f;min-height:132px;justify-content:flex-end}
.isl-shopbox .it .nm{font-size:clamp(.85rem,2vw,1rem);line-height:1.1;text-align:center}
.isl-shopbox .it .pr{font-size:1.1rem;background:#FFF3B0;border-radius:999px;padding:1px 10px}
.isl-shopbox .it.can{border-color:#3ECF8E}.isl-shopbox .it.own{opacity:.6}.isl-shopbox .it.own .pr{background:#D8F3E3}
#isl-pop h3 img{display:block;margin:0 auto}
.isl-svg .bb{transform-box:fill-box;transform-origin:bottom center}
.isl-svg .squash{animation:islSq .55s ease-out}
@keyframes islSq{0%{transform:scale(1)}25%{transform:scale(1.1,.86)}55%{transform:scale(.94,1.08)}100%{transform:scale(1)}}
.isl-svg .ai{transform-box:fill-box;transform-origin:bottom center;transition:transform .3s}
.isl-svg .hopn{animation:islHopN .6s ease-out}

.isl-svg .glow{animation:islGlow 3s ease-in-out infinite}
@keyframes islGlow{50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){.isl-svg *{animation-duration:0s!important;transition:none!important}}
</style>

const PIDLE=()=>winter()&&IM['pufi-winter']?'pufi-winter':'pufi-idle';
function aniHTML(e,n,sea){ if(e==='🦊') return n?img('pufi-sleep',92,'aimg'):img(PIDLE(),120,'aimg');
  const k=ANIMG[e]; const body=k&&IM[k]?img(k,92,'aimg'):`<text x="0" y="0" text-anchor="middle" font-size="64">${e}</text>`;
  return body+(n&&!sea?'<text class="tw" x="30" y="-80" font-size="30">💤</text>':''); }
function placeAnimals(svg,id,still){ const g=svg.querySelector('#isl-ani'+(id||'')); if(!g) return; const n=phase(hour())==='night'; g.innerHTML='';
  const list=['🦊'].concat(animals().slice(-12)); const out=[];
  list.forEach((e,i)=>{ const sea=SEA.includes(e); const x=e==='🦊'&&n?560:sea?120+Math.random()*200+(i%2)*1100:300+Math.random()*900, y=sea?985:e==='🦊'&&n?700:722+((i*23)%46);
    const el=document.createElementNS('http://www.w3.org/2000/svg','g'); el.setAttribute('class','an'); el.style.transform=`translate(${x}px,${y}px)`; el.dataset.e=e;
    el.innerHTML=`<g class="ai">${aniHTML(e,n,sea)}</g>`; g.appendChild(el); out.push({el,x,y,sea,e}); });
  if(!still){ out.forEach(w=>{ w.el.style.cursor='pointer'; w.el.addEventListener('click',ev=>{ ev.stopPropagation(); poke(w); }); }); if(!n) walkers=out; } }
function setPufi(w,k){ const im=w.el.querySelector('image'); if(!im||!IM[k]) return; const h=k==='pufi-walk'?118:k==='pufi-read'||k==='pufi-eat'?108:120, m=IM[k], ww=h*m.w/m.h; im.setAttribute('href',m.u); im.setAttribute('x',(-ww/2).toFixed(1)); im.setAttribute('y',-h); im.setAttribute('width',ww.toFixed(1)); im.setAttribute('height',h); }
function walk(){ walkers.forEach(w=>{ if(w.busy||Math.random()<.35) return; const nx=w.sea?Math.max(40,Math.min(1496,w.x+(Math.random()-.5)*300)):Math.max(280,Math.min(1240,w.x+(Math.random()-.5)*300)); const f=nx<w.x?-1:1; w.x=nx;
  w.el.style.transform=`translate(${nx}px,${w.y}px)`; const inner=w.el.firstChild; if(inner) inner.style.transform=`scaleX(${w.e==='🦊'?f:-f})`;
  if(w.e==='🦊'){ setPufi(w,'pufi-walk'); clearTimeout(w.t); w.t=setTimeout(()=>{ if(!w.busy) setPufi(w,PIDLE()); },2600); } }); }
function poke(w){ const inner=w.el.firstChild; try{ tick(); }catch(e){}
  if(w.e==='🦊'){ if(phase(hour())==='night'){ sayT(T().sleep); return; } w.busy=true; const P=['pufi-jump','pufi-dance','pufi-look','pufi-read','pufi-eat'].filter(k=>IM[k]); setPufi(w,P[Math.floor(Math.random()*P.length)]||'pufi-jump'); sayT(T().hi); setTimeout(()=>{ w.busy=false; setPufi(w,PIDLE()); },2200); }
  else if(!w.sea&&IM['i-apple']){ const ap=document.createElementNS('http://www.w3.org/2000/svg','g'); ap.setAttribute('class','grow'); ap.setAttribute('transform',`translate(${w.x+46} ${w.y-6})`); ap.innerHTML=img('i-apple',44)+`<text class="pf" x="0" y="-60" font-size="34" style="--dx:0px;--dy:-80px">💛</text>`; w.el.parentNode.appendChild(ap); setTimeout(()=>ap.remove(),1500); sayT(T().yum); }
  inner.classList.remove('hopn'); void inner.getBoundingClientRect(); inner.classList.add('hopn'); }
function clockHands(root){ const d=new Date(), hh=(d.getHours()%12+d.getMinutes()/60)*30, mm=d.getMinutes()*6;
  root.querySelectorAll('.isl-hh').forEach(e=>e.setAttribute('transform',`rotate(${hh})`)); root.querySelectorAll('.isl-mh').forEach(e=>e.setAttribute('transform',`rotate(${mm})`)); }
/* ---- banner pe ecranul de start ---- */
function pending(){ const sw=seen(); return KEYS.some(k=>lvOf(k)>(sw[k]||0)); }
function banner(){ reload(); const hm=document.getElementById('hm-root'); if(!hm) return; let b=document.getElementById('isl-ban');
  if(!b){ b=document.createElement('button'); b.id='isl-ban'; b.className='isl-ban'; b.onclick=openIsland; hm.insertBefore(b,document.getElementById('hm-grid')); }
  const es=eggState(), pd=pending();
  b.innerHTML=scene({slice:1,id:'b',vb:'0 250 1536 720'})+`<div class="cap"><b>🏝️ ${T().title}</b><span>${T().sub}</span></div>`+
    `<div class="bdg ${es==='ready'||pd||giftReady()?'hot':''}">${pd?'🏗️ !':es==='ready'?'🥚 !':giftReady()?'🎁 !':es==='wait'?'🥚 '+day().n+'/3':'🐾 '+animals().length}</div>`;
  b.style.background=phase(hour())==='night'?'#1C3D7A':'#2EC4D6'; const sv=b.querySelector('svg'); placeAnimals(sv,'b',true); clockHands(sv); }
new MutationObserver(()=>{ const hm=document.getElementById('hm-root'); if(hm&&!hm.hidden) banner(); }).observe(document.getElementById('hm-root')||document.body,{attributes:true,attributeFilter:['hidden']});
/* ---- ecranul insulei ---- */
const root=document.createElement('div'); root.id='isl-root'; root.hidden=true;
root.innerHTML=`<div class="rb-top"><button class="ch-btn" id="isl-back"></button><h2 id="isl-title"></h2><button class="ch-btn isl-tb" id="isl-q"></button><button class="ch-btn isl-tb" id="isl-shopb">🛍️</button><div class="ch-pill" id="isl-fr"></div><div class="ch-pill" id="isl-stars">⭐ 0</div></div><div id="isl-stage"></div>
<div id="isl-pop" hidden></div><div id="isl-shop" hidden></div>`;
document.body.appendChild(root);
const $=id=>document.getElementById('isl-'+id);
let tick=null;
function texts(){ const q=quest(); $('q').textContent=q.c?'🎁 ✓':q.n>=5?'🎁 !':`🎁 ${Math.min(q.n,5)}/5`; $('q').classList.toggle('hot',q.n>=5&&!q.c); $('shopb').textContent='🛍️ '+T().shop; $('back').textContent=HM().home||'🏠'; $('title').textContent='🏝️ '+T().title; $('fr').textContent='🐾 '+animals().length; $('stars').textContent='⭐ '+curStars(); }
function draw(grow){ const st=$('stage'); const W=st.clientWidth, H=Math.max(1,st.clientHeight), asp=W/H, por=asp<1.35;
  let vb; if(por) vb='0 120 1536 880'; else { const vh=Math.max(560,Math.min(1024,1536/asp)), vw=vh*asp>1536?1536:vh*asp, y0=Math.max(0,Math.min(1024-vh,575-vh/2)); vb=`${((1536-vw)/2).toFixed(0)} ${y0.toFixed(0)} ${vw.toFixed(0)} ${vh.toFixed(0)}`; }
  st.innerHTML=scene({grow,vb,slice:!por}); st.classList.toggle('por',por); root.style.background=phase(hour())==='night'?'#142456':'#2EC4D6'; const sv=st.querySelector('svg');
  placeAnimals(sv,'',false); clockHands(sv);
  if(por){ sv.style.width=Math.round(H*1536/880)+'px'; sv.style.height=H+'px'; st.scrollLeft=(sv.clientWidth-W)/2; } else st.scrollLeft=0;
  lastSz=W+'x'+st.clientHeight;
  sv.querySelectorAll('.isl-b').forEach(e=>e.onclick=ev=>{ ev.stopPropagation(); const bb=e.querySelector('.bb'); bb.classList.remove('grow','squash'); void bb.getBoundingClientRect(); bb.classList.add('squash'); try{ tick(); }catch(_){} building(e.dataset.b); });
  const eg=sv.querySelector('.isl-egg'); if(eg) eg.onclick=ev=>{ ev.stopPropagation(); eggTap(eg); };
  sv.querySelectorAll('.isl-d').forEach(e=>e.onclick=ev=>{ ev.stopPropagation(); const bb=e.querySelector('.bb'); bb.classList.remove('squash'); void bb.getBoundingClientRect(); bb.classList.add('squash'); try{ tick(); }catch(_){} decoTap(+e.dataset.i); });
  sv.querySelectorAll('.isl-w').forEach(e=>e.onclick=ev=>{ ev.stopPropagation(); const bb=e.querySelector('.bb'); bb.classList.remove('squash'); void bb.getBoundingClientRect(); bb.classList.add('squash'); try{ tick(); }catch(_){} });
  const gf=sv.querySelector('.isl-gift'); if(gf) gf.onclick=ev=>{ ev.stopPropagation(); claimGift(gf); };
  sv.addEventListener('click',ev=>{ if(!placing) return; ev.stopPropagation(); ev.preventDefault(); const pt=sv.createSVGPoint(); pt.x=ev.clientX; pt.y=ev.clientY; const p=pt.matrixTransform(sv.getScreenCTM().inverse());
    if(!meadow(p.x,p.y)){ sayT(T().place); try{ beep(false); }catch(_){} return; }
    const L=decos(); if(placing.i!=null) Object.assign(L[placing.i],{x:Math.round(p.x),y:Math.round(p.y)}); else L.push({k:placing.k,x:Math.round(p.x),y:Math.round(p.y)}); LS.set('isl_deco',L);
    placing=null; $('pop').hidden=true; draw(); try{ confetti(18); }catch(_){} try{ beep(true); }catch(_){} sayT(T().placed); },true);
  sv.onclick=()=>{ $('pop').hidden=true; }; }
let placing=null;
/* rotirea ecranului / redimensionarea: scena se recalculează pe noile dimensiuni ale lui #isl-stage.
   „placing” (decorațiunea în curs de așezare) și fereastra ei rămân neatinse; în portret păstrăm același punct al insulei în centru. */
let lastSz='', rzT=0;
function redrawKeep(){ const st=$('stage'); if(root.hidden||!st) return; const sz=st.clientWidth+'x'+st.clientHeight; if(sz===lastSz||!st.clientWidth||!st.clientHeight) return;
  const sv=st.querySelector('svg'); let ratio=null; if(st.classList.contains('por')&&sv&&sv.clientWidth) ratio=(st.scrollLeft+st.clientWidth/2)/sv.clientWidth;
  draw(); if(ratio!=null&&st.classList.contains('por')){ const nv=st.querySelector('svg'); if(nv) st.scrollLeft=Math.max(0,Math.min(nv.clientWidth-st.clientWidth,ratio*nv.clientWidth-st.clientWidth/2)); } }
const onRz=d=>{ clearTimeout(rzT); rzT=setTimeout(redrawKeep,d||120); };
try{ new ResizeObserver(()=>onRz()).observe($('stage')); }catch(e){}
window.addEventListener('resize',()=>onRz());
window.addEventListener('orientationchange',()=>{ onRz(350); setTimeout(redrawKeep,800); });
function decoTap(i){ const d=decos()[i]; if(!d) return; const nm=T().dn[d.k]; const el=pop(`<h3>${nm}</h3><div class="row"><button class="rb-b" data-a="s">🔊</button><button class="rb-b go" data-a="m">${T().move}</button></div>`);
  el.querySelector('[data-a=s]').onclick=()=>sayT(nm); el.querySelector('[data-a=m]').onclick=()=>startPlace({i,k:d.k}); sayT(nm); }
function startPlace(p){ placing=p; $('shop').hidden=true; const el=pop(`<h3>${img2(p.k)}</h3><p>${T().place}</p><div class="row"><button class="rb-b" data-a="s">🔊</button><button class="rb-b" data-a="x">✖</button></div>`,true);
  el.querySelector('[data-a=s]').onclick=()=>sayT(T().place); el.querySelector('[data-a=x]').onclick=()=>{ placing=null; $('pop').hidden=true; }; sayT(T().place); }
const img2=(k,h)=>IM['d-'+k]?`<img src="${IM['d-'+k].u}" alt="" style="height:${h||70}px">`:'';
function shop(){ const sh=$('shop'); const own=new Set(decos().map(d=>d.k)); const st=curStars();
  sh.innerHTML=`<div class="isl-shopbox"><div class="hd"><b>🛍️ ${T().shop}</b><span>⭐ ${st}</span><button class="rb-b" data-a="x">✖</button></div><div class="gr">${Object.keys(PRICE).map(k=>`<button class="it${own.has(k)?' own':''}${st>=PRICE[k]?' can':''}" data-k="${k}">${img2(k,64)}<span class="nm">${T().dn[k]}</span><span class="pr">${own.has(k)?'✓':'⭐ '+PRICE[k]}</span></button>`).join('')}</div></div>`;
  sh.hidden=false; $('pop').hidden=true; sh.querySelector('[data-a=x]').onclick=()=>sh.hidden=true; sh.onclick=e=>{ if(e.target===sh) sh.hidden=true; };
  sh.querySelectorAll('.it').forEach(b=>b.onclick=()=>{ const k=b.dataset.k, nm=T().dn[k]; if(own.has(k)){ sayT(nm); return; } const pr=PRICE[k], have=curStars();
    if(have<pr){ sayT(nm+'. '+T().need(pr-have)); b.classList.remove('sa-shake'); void b.offsetWidth; b.classList.add('sa-shake'); try{ beep(false); }catch(_){} return; }
    try{ stars-=pr; renderBar(); }catch(_){} last=curStars(); texts(); try{ beep(true); }catch(_){} sayT(nm+'!'); startPlace({k}); }); }
function claimGift(gf){ const q=quest(); if(q.c) return; q.c=true; LS.set('isl_q',q); try{ stars+=5; renderBar(); }catch(_){} last=curStars(); gf.innerHTML=burst(0,-50); try{ confetti(40); }catch(_){} try{ beep(true); }catch(_){} sayT(T().gift); texts(); setTimeout(()=>{ if(!root.hidden) draw(); },1500); }
function questPop(){ const q=quest(), card=HM()[q.k]||q.k; const m=q.c?T().gift:q.n>=5?T().qDone:T().quest(card,Math.min(q.n,5));
  const el=pop(`<h3>🎁</h3><p>${m}</p><div class="row"><button class="rb-b" data-a="s">🔊</button>${q.n<5?`<button class="rb-b go" data-a="p">▶ ${card}</button>`:''}</div>`);
  el.querySelector('[data-a=s]').onclick=()=>sayT(m); const pb=el.querySelector('[data-a=p]'); if(pb) pb.onclick=()=>{ close(); setTimeout(()=>{ try{ window.__hmOpen&&window.__hmOpen(q.k); }catch(e){} },30); }; sayT(m); }
function pop(html,mini){ const p=$('pop'); p.innerHTML=html; p.hidden=false; p.classList.toggle('mini',!!mini); return p; }
function building(k){ const l=lvOf(k), p=ptsOf(k), nx=TH[l], pv=l?TH[l-1]:0, name=T().b[k], card=HM()[k]||k;
  const msg=l>=4?T().max:T().grow(card);
  const el=pop(`<h3>${name}</h3><p>${l?T().lv(l)+' · ':''}⭐ ${p}${nx?' / '+nx:''}</p>${nx?`<div class="bar"><i style="width:${Math.round(Math.min(1,(p-pv)/(nx-pv))*100)}%"></i></div>`:''}<p>${msg}</p><div class="row"><button class="rb-b" data-a="s">🔊</button><button class="rb-b go" data-a="p">▶ ${card}</button></div>`);
  el.querySelector('[data-a=s]').onclick=()=>sayT(name+'. '+msg); el.querySelector('[data-a=p]').onclick=()=>{ close(); setTimeout(()=>{ try{ window.__hmOpen&&window.__hmOpen(k); }catch(e){} },30); };
  sayT(name+'. '+msg); }
let taps=0;
function eggTap(eg){ const es=eggState(); if(es==='wait'){ const m=T().eggNeed(day().n); const el=pop(`<h3>🥚</h3><p>${m}</p><div class="row"><button class="rb-b" data-a="s">🔊</button></div>`); el.querySelector('[data-a=s]').onclick=()=>sayT(m); sayT(m); return; }
  if(es!=='ready') return; taps++; $('pop').hidden=true; const g=eg.querySelector('.egg');
  if(taps<3){ g.classList.remove('rdy'); void g.getBoundingClientRect(); g.classList.add('rdy'); g.innerHTML=img('egg-2',96+taps*4,'eimg');
    try{ tick(); }catch(e){} return; }
  taps=0; const have=animals(); let pool=ANIMALS.filter(a=>!have.includes(a)&&ANIMG[a]); if(!pool.length) pool=ANIMALS.filter(a=>!have.includes(a)); if(!pool.length) pool=ANIMALS; const a=pool[Math.floor(Math.random()*pool.length)];
  have.push(a); LS.set('isl_ani',have); LS.set('isl_hatch',today());
  const svg=eg.ownerSVGElement; eg.innerHTML=img('egg-3',70,'eimg')+`<g class="grow" transform="translate(0 -40)">${ANIMG[a]&&IM[ANIMG[a]]?img(ANIMG[a],110):`<text x="0" y="0" text-anchor="middle" font-size="80">${a}</text>`}</g>`+burst(0,-60); try{ confetti&&confetti(24); }catch(e){} try{ beep&&beep(true); }catch(e){}
  const el=pop(`<h3 style="font-size:3rem;line-height:1">${a}</h3><p>${T().hatched}</p><p style="opacity:.75">${T().eggDone}</p><div class="row"><button class="rb-b" data-a="s">🔊</button></div>`); el.querySelector('[data-a=s]').onclick=()=>sayT(T().hatched+' '+T().eggDone);
  sayT(T().hatched); texts(); setTimeout(()=>{ if(!root.hidden){ eg.remove(); placeAnimals(svg,'',false); } },2600); }
function burst(x,y){ let s=''; const E=['⭐','✨','🌟','💛']; for(let i=0;i<12;i++){ const a=i/12*Math.PI*2; s+=`<text class="pf" x="${x}" y="${y}" text-anchor="middle" font-size="38" style="--dx:${(Math.cos(a)*170).toFixed(0)}px;--dy:${(Math.sin(a)*140-50).toFixed(0)}px">${E[i%4]}</text>`; } return s; }
function openIsland(){ try{ if(typeof ensureStart==='function') ensureStart(); }catch(e){} try{ const s=document.getElementById('start'); if(s&&typeof started!=='undefined'&&!started){ started=true; s.hidden=true; } }catch(e){}
  reload(); root.hidden=false; texts(); $('pop').hidden=true; taps=0;
  const sw=seen(), grow=KEYS.filter(k=>lvOf(k)>(sw[k]||0)); draw(grow);
  const ns={}; KEYS.forEach(k=>ns[k]=lvOf(k)); LS.set('isl_seen',ns);
  if(grow.length){ const sv=$('stage').querySelector('svg'); grow.forEach(k=>{ const g=sv.querySelector(`[data-b="${k}"]`); if(g) g.insertAdjacentHTML('beforeend',burst(0,-BLD[k].h*.6)); }); try{ confetti&&confetti(20); }catch(e){}
    sayT(grow.length===1?T().up(T().b[grow[0]],lvOf(grow[0])):T().title+'! '+T().sub); }
  else if(eggState()==='ready') sayT(T().eggReady); else sayT(T().title+'. '+T().sub);
  clearInterval(tick); tick=setInterval(()=>{ if(root.hidden) return; walk(); if(++walkT%8===0) clockHands(root); $('stars').textContent='⭐ '+curStars(); },2700); setTimeout(walk,400); }
function close(){ placing=null; $('shop').hidden=true; root.hidden=true; clearInterval(tick); walkers=[]; try{ speechSynthesis.cancel(); }catch(e){} banner(); }
$('back').onclick=close; $('shopb').onclick=shop; $('q').onclick=questPop;
window.openIsland=openIsland; window.__islBanner=banner;
(window.__LR=window.__LR||[]).push(()=>{ banner(); if(!root.hidden){ texts(); } });
setTimeout(banner,0);
})();
</script>
