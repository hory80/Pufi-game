let nodes=0;
function qs(st,a,bt,qd){ nodes++; const stand=evalS(st); if(stand>=bt) return bt; if(stand>a) a=stand; if(qd>5) return a;
  const ms=gen(st,true).sort((x,y)=>ordr(st.b,y)-ordr(st.b,x));
  for(const m of ms){ const n=make(st,m); if(attacked(n.b,kpos(n.b,st.side),-st.side)) continue;
    const v=-qs(n,-bt,-a,qd+1); if(v>=bt) return bt; if(v>a) a=v; }
  return a; }
function neg(st,d,a,bt,ply){ nodes++;
  if(d<=0) return qs(st,a,bt,0);
  const ms=gen(st,false).sort((x,y)=>ordr(st.b,y)-ordr(st.b,x)); let n0=0;
  for(const m of ms){ const n=make(st,m); if(attacked(n.b,kpos(n.b,st.side),-st.side)) continue; n0++;
    const v=-neg(n,d-1,-bt,-a,ply+1); if(v>=bt) return bt; if(v>a) a=v; if(nodes>120000) break; }
  if(!n0) return inCheck(st)?-MATE+ply:0;
  return a; }
function rootScores(st,d){ nodes=0; const ms=legal(st);
  return ms.map(m=>({m,v:-neg(make(st,m),d-1,-MATE*2,MATE*2,1)})); }
function pick(st,lvl){
  const ms=legal(st); if(!ms.length) return null;
  if(lvl==='easy'){ /* jucător începător: mai ales întâmplător, uneori ia piese gratuite */
    const free=ms.filter(m=>(m.fl&1)&&!attacked(make(st,m).b,m.t,-st.side));
    if(free.length&&Math.random()<.45) return free[Math.floor(Math.random()*free.length)];
    const mates=ms.filter(m=>{ const n=make(st,m); return inCheck(n)&&!legal(n).length; }); if(mates.length&&Math.random()<.5) return mates[0];
    return ms[Math.floor(Math.random()*ms.length)]; }
  const d=lvl==='mid'?1:3, noise=lvl==='mid'?60:12;
  const sc=rootScores(st,d).map(o=>({m:o.m,v:o.v+(Math.abs(o.v)>MATE/2?0:Math.random()*noise)}));
  sc.sort((x,y)=>y.v-x.v); return sc[0].m; }
function startPos(){ const b=Array(64).fill(0), back=[4,2,3,5,6,3,2,4];
  for(let c=0;c<8;c++){ b[c]=-back[c]; b[8+c]=-1; b[48+c]=1; b[56+c]=back[c]; }
  return {b,side:1,cr:15,ep:-1,hm:0}; }
const key=st=>st.b.join('')+st.side+st.cr+st.ep;
function insufficient(b){ const o=b.filter(p=>p&&Math.abs(p)!==6); if(!o.length) return true;
  if(o.length===1&&(Math.abs(o[0])===2||Math.abs(o[0])===3)) return true; return false; }

/* ================= stare UI ================= */
let G=null, H=[], K=[], opp='easy', me=1, colPick=1, sel=-1, lm=[], last=null, over=false, busy=false, tip=null, hints=true, gen_=0, view='setup', D={wins:{},save:null};
try{ D=Object.assign(D,JSON.parse(localStorage.getItem('cg_data')||'{}')); hints=localStorage.getItem('cg_hints')!=='0'; colPick=+(localStorage.getItem('cg_col')||1); }catch(e){}
const save=()=>{ try{ localStorage.setItem('cg_data',JSON.stringify(D)); }catch(e){} };
const human=()=>opp==='two'||G.side===me;
const flip=()=>opp!=='two'&&me===-1;
const botName=()=>X().opp[opp][1];
function persist(){ D.save=over?null:{G,H:H.slice(-60),K:K.slice(-200),opp,me,last}; save(); }

function sizeBoard(){ const w=$('wrap'), bd=$('board'); const s=Math.max(160,Math.floor(Math.min(w.clientWidth,w.clientHeight)));
  bd.style.width=bd.style.height=s+'px'; bd.style.setProperty('--pc',(s/8*.8)+'px'); }
function danger(){ const out=new Set(); if(!hints||over||!human()) return out; const b=G.b, s=G.side;
  for(let i=0;i<64;i++){ const p=b[i]; if(!p||(p>0?1:-1)!==s||Math.abs(p)===6) continue;
    if(attacked(b,i,-s)){ const t=Math.abs(p); if(!attacked(b,i,s)||t>=4) out.add(i); } }
  return out; }
function render(){
  const bd=$('board'); bd.innerHTML=''; const dz=danger(), chk=inCheck(G)?kpos(G.b,G.side):-1, F=flip();
  const show=sel>=0&&hints, tg=lm.filter(m=>m.f===sel).map(m=>m.t);
  for(let v=0;v<64;v++){ const s=F?63-v:v, r=s>>3, c=s&7, vr=v>>3, vc=v&7, d=document.createElement('div');
    d.className='ch-sq '+((r+c)%2?'d':'l'); d.id='cg-sq'+s;
    if(last&&(s===last[0]||s===last[1])) d.classList.add('last');
    if(s===sel) d.classList.add('sel');
    if(dz.has(s)) d.classList.add('cg-danger');
    if(s===chk) d.classList.add('cg-check');
    if(tip&&(s===tip.f||s===tip.t)) d.classList.add('cg-tip');
    const p=G.b[s];
    if(p){ const e=document.createElement('span'); e.className='ch-pc '+(p>0?'w':'b')+(last&&s===last[1]?' pop':''); e.textContent=GL[Math.abs(p)]; d.appendChild(e); }
    if(show&&tg.includes(s)){ const m=document.createElement('span'); m.className=p||(lm.find(x=>x.f===sel&&x.t===s).fl&2)?'ch-ring':'ch-dot'; d.appendChild(m); }
    if(vc===0){ const m=document.createElement('span'); m.className='ch-co r'; m.textContent=8-r; d.appendChild(m); }
    if(vr===7){ const m=document.createElement('span'); m.className='ch-co f'; m.textContent='abcdefgh'[c]; d.appendChild(m); }
    d.onclick=()=>tap(s); bd.appendChild(d); }
  renderCaps();
}
function renderCaps(){
  const cnt={}; [1,-1].forEach(s=>{ cnt[s]={1:8,2:2,3:2,4:2,5:1}; }); let mat=0;
  G.b.forEach(p=>{ if(!p) return; const s=p>0?1:-1, t=Math.abs(p); if(t<6){ cnt[s][t]--; mat+=PV[t]*s; } });
  const strip=(col)=>{ /* piesele culorii col luate de adversar */ let h=''; [5,4,3,2,1].forEach(t=>{ for(let i=0;i<Math.max(0,cnt[col][t]);i++) h+=`<span class="${col>0?'w':'b'}">${GL[t]}</span>`; }); return h; };
  const bottom=opp==='two'?1:me, top=-bottom, adv=Math.round(mat/100)*bottom;
  $('capT').innerHTML=(opp!=='two'?`<span class="who">${X().opp[opp][0]}</span>`:'')+strip(bottom)+(adv<0?`<span class="adv">+${-adv}</span>`:'');
  $('capB').innerHTML=strip(top)+(adv>0?`<span class="adv">+${adv}</span>`:'');
}
function status(t,speak){ $('status').textContent=t; $('status').dataset.say=t; if(speak) sp(t); }
function turnText(){ return opp==='two'?(G.side===1?X().turnW:X().turnB):(G.side===me?X().yourTurn:X().thinks(botName())); }
function shake(){ const b=$('board'); b.classList.remove('ch-shake'); void b.offsetWidth; b.classList.add('ch-shake'); }

function tap(s){
  if(over||busy||!human()) return; const p=G.b[s], mine=p&&(p>0?1:-1)===G.side;
  const mv=lm.filter(m=>m.f===sel&&m.t===s);
  if(sel>=0&&mv.length){ if(mv.length>1) return askPromo(mv); return play(mv[0],true); }
  if(mine){ sel=sel===s?-1:s; try{tick()}catch(e){} render(); return; }
  if(sel>=0){ const t=Math.abs(G.b[sel]); const pseudo=gen(G,false).some(m=>m.f===sel&&m.t===s);
    const txt=pseudo?X().kingBad:X().cant(cap1(X().N[t])); try{beep(false)}catch(e){} shake(); status(txt,true); sel=-1; render(); return; }
  if(p&&opp==='two'){ status(X().notYours,true); }
}
function askPromo(mv){
  const w=$('wrap'), o=document.createElement('div'); o.className='cg-promo';
  o.innerHTML=`<div><b>${X().promoQ}</b><div class="row">${[5,4,3,2].map(t=>`<button data-t="${t}" class="${G.side>0?'':'b'}">${GL[t]}</button>`).join('')}</div></div>`;
  o.querySelectorAll('button').forEach(b=>b.onclick=()=>{ o.remove(); play(mv.find(m=>m.pr===+b.dataset.t),true); });
  w.appendChild(o); sp(X().promoQ);
}
function play(m,byHuman){
  const prev=G, mover=prev.side, pt=Math.abs(prev.b[m.f]);
  H.push(prev); K.push(key(prev)); G=make(prev,m); last=[m.f,m.t]; sel=-1; tip=null;
  const capT=G.cap?Math.abs(G.cap):0;
  try{ tick(); }catch(e){}
  lm=legal(G); render(); persist();
  if(checkEnd()) return;
  const chk=inCheck(G); let say_='';
  if(opp==='two'){ say_=(chk?X().check+' ':'')+(m.pr?X().promo+' ':'')+(G.side===1?X().turnW:X().turnB).replace(/ [⚪⚫]/,''); status(G.side===1?X().turnW:X().turnB); if(chk||m.pr) sp(say_); else if(capT) try{beep(true)}catch(e){} }
  else if(byHuman){
    if(capT){ try{beep(true); confetti(6);}catch(e){} if(capT>=2) say_=X().youTook(X().NA[capT])+' '; }
    if(m.fl&4) say_+=X().castle+' '; if(m.pr) say_+=X().promo+' '; if(chk) say_+=X().check;
    status(X().thinks(botName())); if(say_) sp(say_);
    busy=true; const g=gen_; setTimeout(()=>botTurn(g),say_?1100:550);
  } else {
    if(capT) say_=X().botTook(botName(),X().NY[capT]); else if(m.fl&4) say_=X().castle; else say_=X().botMoved(botName(),X().NA[pt]);
    if(chk) say_+=' '+X().checkYou;
    const dz=danger(); if(dz.size&&!chk&&hints) say_+=' '+X().danger;
    status(chk?X().checkYou:X().yourTurn); sp(say_); busy=false;
  }
}
function botTurn(g){ if(g!==gen_||over||view!=='play') return; const t0=Date.now(); const m=pick(G,opp);
  const wait=Math.max(0,500-(Date.now()-t0)); setTimeout(()=>{ if(g!==gen_||!m) return; play(m,false); },wait); }
function checkEnd(){
  let txt=null, res=null;
  if(!lm.length){ if(inCheck(G)){ const winner=-G.side; res=opp==='two'?'w':(winner===me?'win':'lose');
      txt=opp==='two'?(winner===1?X().mateW:X().mateB):(winner===me?X().mateWin:X().mateLose(botName())); }
    else { txt=X().stale; res='draw'; } }
  else if(insufficient(G.b)){ txt=X().insuf; res='draw'; }
  else if(G.hm>=100){ txt=X().fifty; res='draw'; }
  else { const k=key(G); if(K.filter(x=>x===k).length>=2){ txt=X().rep; res='draw'; } }
  if(!txt) return false;
  over=true; busy=false; status(txt,true); render(); try{ window.__lvDone&&window.__lvDone(1); }catch(_e){} 
  if(res==='win'){ const n={easy:1,mid:2,hard:3}[opp]; D.wins[opp]=(D.wins[opp]||0)+1; stars+=n; try{ renderBar(); confetti(40); beep(true); }catch(e){} }
  else if(res==='w'||res==='draw'){ stars+=1; try{ renderBar(); confetti(14); }catch(e){} }
  else { try{ beep(false); }catch(e){} }
  $('stars').textContent='⭐ '+stars; D.save=null; save(); return true;
}
function newGame(){
  gen_++; G=startPos(); H=[]; K=[]; sel=-1; last=null; over=false; busy=false; tip=null;
  me=opp==='two'?1:(colPick===0?(Math.random()<.5?1:-1):colPick);
  lm=legal(G); openPlay(); render();
  status(turnText()); sp(opp==='two'?X().intro2:X().intro(me));
  if(opp!=='two'&&me===-1){ busy=true; const g=gen_; setTimeout(()=>botTurn(g),1600); }
  persist();
}
function resume(){ const s=D.save; gen_++; G=s.G; H=s.H||[]; K=s.K||[]; opp=s.opp; me=s.me; last=s.last; sel=-1; over=false; busy=false; tip=null;
  lm=legal(G); openPlay(); render(); status(turnText(),true);
  if(!human()){ busy=true; const g=gen_; setTimeout(()=>botTurn(g),800); } }
function undo(){
  if(!H.length||(busy&&!over)) return; gen_++; over=false; busy=false; tip=null; sel=-1;
  do { G=H.pop(); K.pop(); } while(H.length&&opp!=='two'&&G.side!==me);
  if(opp!=='two'&&G.side!==me){ /* robotul a început partida: refacem prima lui mutare */ }
  last=null; lm=legal(G); render(); persist(); status(turnText());
  if(!human()){ busy=true; const g=gen_; setTimeout(()=>botTurn(g),600); }
}
function giveTip(){
  if(over||busy||!human()) return; nodes=0;
  const sc=rootScores(G,2).sort((a,b)=>b.v-a.v); if(!sc.length) return; tip=sc[0].m; sel=-1; render();
  sp(X().tipSay(X().ND[Math.abs(G.b[tip.f])]));
}

/* ================= ecrane ================= */
function top(){ $('hint').textContent=hints?X().hintsOn:X().hintsOff; $('hint').setAttribute('aria-pressed',hints);
  $('back').textContent=view==='setup'?X().back:X().menu; $('stars').textContent='⭐ '+stars;
  $('undo').textContent=X().undo; $('tipB').textContent=X().tip; $('say').textContent=X().listen; $('new').textContent=X().newg; }
function showSetup(){
  view='setup'; gen_++; busy=false; $('play').hidden=true; const S=$('setup'); S.hidden=false; $('title').textContent='♟️ '+X().title; top();
  let h='';
  if(D.save){ const o=X().opp[D.save.opp]; h+=`<button class="cg-opp cont" id="cg-cont"><span class="ic">${o[0]}</span><span class="nm">${X().cont}</span></button>`; }
  h+=`<h3>${X().who}</h3><div class="cg-opps">`+['easy','mid','hard','two'].map(k=>{ const o=X().opp[k];
    return `<button class="cg-opp" data-k="${k}" data-lk="cg:${k}"><span class="ic">${o[0]}</span><span class="nm">${o[1]}</span><span class="lv">${o[2]}${k!=='two'?' · '+X().wins(D.wins[k]||0):''}</span></button>`; }).join('')+`</div>`;
  h+=`<h3>${X().color}</h3><div class="cg-cols">`+[[1,X().white],[-1,X().black],[0,X().rand]].map(([v,t])=>`<button data-c="${v}" aria-pressed="${colPick===v}">${t}</button>`).join('')+`</div>`;
  S.innerHTML=h;
  S.querySelectorAll('.cg-opp[data-k]').forEach(b=>b.onclick=()=>{ opp=b.dataset.k; newGame(); });
  S.querySelectorAll('.cg-cols button').forEach(b=>b.onclick=()=>{ colPick=+b.dataset.c; try{localStorage.setItem('cg_col',colPick)}catch(e){} showSetup(); });
  const c=$('cont'); if(c) c.onclick=resume;
}
function openPlay(){ view='play'; $('setup').hidden=true; $('play').hidden=false; top();
  $('title').textContent='♟️ '+(opp==='two'?X().opp.two[1]:X().opp[opp][0]+' '+X().opp[opp][1]);
  requestAnimationFrame(()=>{ sizeBoard(); }); sizeBoard(); }
$('back').onclick=()=>{ try{ speechSynthesis.cancel(); }catch(e){}
  if(view==='play'){ showSetup(); return; } root.hidden=true; if(window.openChess) window.openChess(); };
$('hint').onclick=()=>{ hints=!hints; try{localStorage.setItem('cg_hints',hints?'1':'0')}catch(e){} top(); if(view==='play') render(); };
$('undo').onclick=undo; $('tipB').onclick=giveTip; $('new').onclick=()=>{ D.save=null; save(); newGame(); };
$('say').onclick=()=>sp($('status').dataset.say||''); $('status').onclick=()=>sp($('status').dataset.say||'');
addEventListener('resize',()=>{ if(!root.hidden&&view==='play') sizeBoard(); });
(window.__LR=window.__LR||[]).push(()=>{ if(root.hidden) return; if(view==='play'){ top(); render(); try{ status(turnText()); }catch(e){} } else showSetup(); });
newGame=(f=>(...a)=>{ if(window.__gate&&window.__gate('cg',opp)) return showSetup(); return f(...a); })(newGame); resume=(f=>(...a)=>{ if(D.save&&window.__gate&&window.__gate('cg',D.save.opp)) return showSetup(); return f(...a); })(resume);
window.openChessGame=()=>{ root.hidden=false; showSetup(); };
window.__cg={startPos,legal,make,pick,gen,inCheck,attacked,rootScores,get G(){return G},get nodes(){return nodes}};
})();
</script>
