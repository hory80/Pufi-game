<script>
/* Robotică: traduceri lipsă (mecanică + circuite v2) pentru 9 limbi + textele capitolului 2 de circuite în 12 limbi */
(function(){
const A={
fr:{lv:['Mets un lapin au même endroit de l’autre côté !','La balançoire est penchée ! Fais glisser le chien sur la planche, plus loin du milieu.','L’éléphant est lourd ! Une souris peut-elle le soulever ? Mets-la le plus loin possible !','Fais glisser un animal à droite pour que la balançoire soit droite !','Encore une ! Tu peux aussi utiliser deux animaux.'],
 lvHeavyL:'Le côté gauche est plus lourd.',lvHeavyR:'Le côté droit est plus lourd.',lvPow:'Les tours montrent avec quelle force chaque côté pousse.',
 gFacts:{fast:'Un vélo fonctionne pareil : le petit engrenage arrière tourne plus vite que les pédales !',dir:'Les horloges aussi : les engrenages se poussent les uns les autres.',chain:'L’engrenage du milieu transmet simplement le mouvement.'},
 teeth:n=>`${n} dents`,
 bike:['Appuie longtemps sur Pédaler ! Les pédales font tourner le grand engrenage, et la chaîne fait tourner le petit à l’arrière.','Fais un tour de pédale et compte : combien de fois la roue arrière tourne-t-elle ?','Fais la course avec l’escargot ! Choisis la bonne vitesse pour gagner.','En haut de la colline ! Choisis la vitesse qui rend la montée facile.','Dernière question : pour monter, tu choisis le grand ou le petit engrenage arrière ?'],
 pedal:'🦶 Pédaler',oneTurn:'↻ Un tour de pédale',gEasy:'🐢 Facile',gMid:'🚲 Moyen',gFast:'🚀 Rapide',
 bikeWhy:['La chaîne relie les deux engrenages. Quand tu pédales, la roue arrière tourne et le vélo avance !','Oui ! L’engrenage des pédales a deux fois plus de dents, donc la roue arrière tourne deux fois.','Tu as gagné ! Le petit engrenage arrière fait beaucoup de tours, tu vas vite sur le plat.','Tu as réussi ! Le grand engrenage arrière rend le pédalage facile, même si tu vas moins vite.','Exactement ! Le grand engrenage arrière est pour les côtes, le petit pour la vitesse.'],
 lost:'L’escargot a gagné ! Essaie la vitesse rapide 🚀.',hard:'Ouf, c’est dur ! Essaie la vitesse facile 🐢.',bigCog:'🐢 Grand engrenage',smallCog:'🚀 Petit engrenage',countQ:'Combien de fois la roue arrière a-t-elle tourné ?',rampUp:'⬆',rampDown:'⬇',
 cg:['Allume l’ampoule !','Allume l’ampoule avec l’interrupteur !','Démarre le ventilateur pour rafraîchir RoboPufi !','Fais sonner la sonnette !','Allume deux ampoules, l’une après l’autre !','Allume les deux ampoules le plus fort possible !','Allume la LED rouge ! Attention : la LED a un plus et un moins.','Le feu tricolore : chaque LED avec son interrupteur !','Le coffre-fort : l’ampoule s’allume seulement si les deux interrupteurs sont allumés !','L’escalier : l’ampoule s’allume avec n’importe quel interrupteur !','La maison de RoboPufi : ampoule, ventilateur et sonnette, démarrés par un seul interrupteur !','Le labo : construis ce que tu veux !'],
 cwhy:['L’électricité sort du plus, traverse l’ampoule et revient au moins. Un cercle complet !','L’interrupteur ouvre et ferme le chemin de l’électricité.','Le moteur transforme l’électricité en mouvement.','La sonnette transforme l’électricité en son !','Les ampoules l’une après l’autre se partagent l’électricité, alors elles brillent moins.','Quand chaque ampoule a son propre chemin vers la pile, les deux brillent fort !','La LED laisse passer l’électricité dans un seul sens.','Chaque LED a son interrupteur, comme un feu tricolore !','L’ampoule s’allume seulement avec les deux interrupteurs. Comme la porte d’un coffre-fort !','L’ampoule s’allume avec n’importe quel interrupteur. Comme la lumière de l’escalier !','Un seul interrupteur démarre toute la maison !',''],
 dim:'Les ampoules sont faibles. Relie chaque ampoule directement à la pile !',ledRev:'La LED a un plus et un moins. Relie la patte plus de la LED vers le plus de la pile !',
 bypass:c=>`Le fil contourne ${c} ! L’électricité prend le chemin le plus facile.`,cn:{bulb:'l’ampoule',motor:'le ventilateur',buzz:'la sonnette',led:'la LED',res:'la résistance',pot:'le bouton tournant'},
 andH:'L’ampoule doit s’éteindre quand tu éteins n’importe quel interrupteur.',orH:'L’ampoule doit s’allumer avec chaque interrupteur tout seul.',indepH:'Chaque interrupteur doit allumer seulement sa LED.',masterH:'Quand tu éteins l’interrupteur, tout doit s’arrêter.',
 loose:'Les fils gris ne portent pas d’électricité. Tu peux les garder ou les effacer.',swOut:'L’ampoule est allumée, mais l’interrupteur n’est pas sur le chemin de l’électricité ! Mets-le entre la pile et l’ampoule.',swLoose:'L’interrupteur n’est relié à rien. Branche-le dans le circuit !'},
es:{lv:['¡Pon un conejo en el mismo sitio del otro lado!','¡El balancín está torcido! Arrastra el perro por la tabla, más lejos del centro.','¡El elefante pesa mucho! ¿Puede un ratón levantarlo? ¡Ponlo lo más lejos posible!','¡Arrastra un animal a la derecha para que el balancín quede recto!','¡Una más! También puedes usar dos animales.'],
 lvHeavyL:'El lado izquierdo pesa más.',lvHeavyR:'El lado derecho pesa más.',lvPow:'Las torres muestran con cuánta fuerza empuja cada lado.',
 gFacts:{fast:'¡La bicicleta funciona igual: el engranaje pequeño de atrás gira más rápido que los pedales!',dir:'Los relojes también: los engranajes se empujan unos a otros.',chain:'El engranaje del medio solo pasa el movimiento.'},
 teeth:n=>`${n} dientes`,
 bike:['¡Mantén pulsado Pedalear! Los pedales giran el engranaje grande y la cadena gira el pequeño de atrás.','Da una vuelta de pedal y cuenta: ¿cuántas veces gira la rueda de atrás?','¡Echa una carrera con el caracol! Elige la marcha correcta para ganar.','¡Cuesta arriba! Elige la marcha que hace fácil subir.','Última pregunta: para subir, ¿eliges el engranaje grande o el pequeño de atrás?'],
 pedal:'🦶 Pedalear',oneTurn:'↻ Una vuelta de pedal',gEasy:'🐢 Fácil',gMid:'🚲 Media',gFast:'🚀 Rápida',
 bikeWhy:['La cadena une los dos engranajes. ¡Cuando pedaleas, la rueda de atrás gira y la bici avanza!','¡Sí! El engranaje de los pedales tiene el doble de dientes, así que la rueda de atrás gira dos veces.','¡Ganaste! El engranaje pequeño de atrás da muchas vueltas, así vas rápido en llano.','¡Lo lograste! El engranaje grande de atrás hace fácil pedalear, aunque vayas más despacio.','¡Exacto! El engranaje grande de atrás es para cuestas, el pequeño para la velocidad.'],
 lost:'¡Ganó el caracol! Prueba la marcha rápida 🚀.',hard:'¡Uf, qué difícil! Prueba la marcha fácil 🐢.',bigCog:'🐢 Engranaje grande',smallCog:'🚀 Engranaje pequeño',countQ:'¿Cuántas veces giró la rueda de atrás?',rampUp:'⬆',rampDown:'⬇',
 cg:['¡Enciende la bombilla!','¡Enciende la bombilla con el interruptor!','¡Arranca el ventilador para refrescar a RoboPufi!','¡Haz sonar el timbre!','¡Enciende dos bombillas, una después de otra!','¡Enciende las dos bombillas lo más fuerte posible!','¡Enciende el LED rojo! Cuidado: el LED tiene un más y un menos.','El semáforo: ¡cada LED con su interruptor!','La caja fuerte: ¡la bombilla solo se enciende si los dos interruptores están encendidos!','La escalera: ¡la bombilla se enciende con cualquiera de los interruptores!','La casa de RoboPufi: ¡bombilla, ventilador y timbre, todo con un solo interruptor!','El laboratorio: ¡construye lo que quieras!'],
 cwhy:['La electricidad sale del más, pasa por la bombilla y vuelve al menos. ¡Un círculo completo!','El interruptor abre y cierra el camino de la electricidad.','El motor convierte la electricidad en movimiento.','¡El timbre convierte la electricidad en sonido!','Las bombillas una tras otra se reparten la electricidad, por eso brillan menos.','¡Cuando cada bombilla tiene su propio camino a la pila, las dos brillan fuerte!','El LED deja pasar la electricidad en una sola dirección.','¡Cada LED tiene su interruptor, como un semáforo!','La bombilla solo se enciende con los dos interruptores. ¡Como la puerta de una caja fuerte!','La bombilla se enciende con cualquier interruptor. ¡Como la luz de la escalera!','¡Un solo interruptor pone en marcha toda la casa!',''],
 dim:'Las bombillas brillan poco. ¡Conecta cada bombilla directamente a la pila!',ledRev:'El LED tiene un más y un menos. ¡Conecta la pata más del LED hacia el más de la pila!',
 bypass:c=>`¡El cable rodea ${c}! La electricidad toma el camino más fácil.`,cn:{bulb:'la bombilla',motor:'el ventilador',buzz:'el timbre',led:'el LED',res:'la resistencia',pot:'la rueda'},
 andH:'La bombilla debe apagarse al apagar cualquiera de los interruptores.',orH:'La bombilla debe encenderse con cada interruptor por separado.',indepH:'Cada interruptor debe encender solo su LED.',masterH:'Al apagar el interruptor, todo debe pararse.',
 loose:'Los cables grises no llevan electricidad. Puedes dejarlos o borrarlos.',swOut:'¡La bombilla está encendida, pero el interruptor no está en el camino de la electricidad! Ponlo entre la pila y la bombilla.',swLoose:'El interruptor no está conectado a nada. ¡Conéctalo al circuito!'},
it:{lv:['Metti un coniglio nello stesso punto dall’altra parte!','L’altalena è storta! Trascina il cane sull’asse, più lontano dal centro.','L’elefante è pesante! Un topolino può sollevarlo? Mettilo più lontano che puoi!','Trascina un animale a destra perché l’altalena sia dritta!','Ancora una! Puoi usare anche due animali.'],
 lvHeavyL:'Il lato sinistro è più pesante.',lvHeavyR:'Il lato destro è più pesante.',lvPow:'Le torri mostrano quanto forte spinge ogni lato.',
 gFacts:{fast:'La bicicletta funziona così: l’ingranaggio piccolo dietro gira più veloce dei pedali!',dir:'Anche gli orologi: gli ingranaggi si spingono a vicenda.',chain:'L’ingranaggio in mezzo passa solo il movimento.'},
 teeth:n=>`${n} denti`,
 bike:['Tieni premuto Pedala! I pedali girano l’ingranaggio grande e la catena gira quello piccolo dietro.','Fai un giro di pedale e conta: quante volte gira la ruota dietro?','Sfida la lumaca! Scegli la marcia giusta per vincere.','Su per la collina! Scegli la marcia che rende facile salire.','Ultima domanda: per salire scegli l’ingranaggio grande o quello piccolo dietro?'],
 pedal:'🦶 Pedala',oneTurn:'↻ Un giro di pedale',gEasy:'🐢 Facile',gMid:'🚲 Media',gFast:'🚀 Veloce',
 bikeWhy:['La catena collega i due ingranaggi. Quando pedali, la ruota dietro gira e la bici va avanti!','Sì! L’ingranaggio dei pedali ha il doppio dei denti, quindi la ruota dietro gira due volte.','Hai vinto! L’ingranaggio piccolo dietro fa tanti giri, così vai veloce in pianura.','Ce l’hai fatta! L’ingranaggio grande dietro rende facile pedalare, anche se vai più piano.','Esatto! L’ingranaggio grande dietro è per le salite, quello piccolo per la velocità.'],
 lost:'Ha vinto la lumaca! Prova la marcia veloce 🚀.',hard:'Uff, che fatica! Prova la marcia facile 🐢.',bigCog:'🐢 Ingranaggio grande',smallCog:'🚀 Ingranaggio piccolo',countQ:'Quante volte ha girato la ruota dietro?',rampUp:'⬆',rampDown:'⬇',
 cg:['Accendi la lampadina!','Accendi la lampadina con l’interruttore!','Avvia il ventilatore per rinfrescare RoboPufi!','Fai suonare il campanello!','Accendi due lampadine, una dopo l’altra!','Accendi tutte e due le lampadine più forte che puoi!','Accendi il LED rosso! Attenzione: il LED ha un più e un meno.','Il semaforo: ogni LED con il suo interruttore!','La cassaforte: la lampadina si accende solo se tutti e due gli interruttori sono accesi!','Le scale: la lampadina si accende con uno qualsiasi degli interruttori!','La casa di RoboPufi: lampadina, ventilatore e campanello, tutto con un solo interruttore!','Il laboratorio: costruisci quello che vuoi!'],
 cwhy:['L’elettricità esce dal più, passa nella lampadina e torna al meno. Un cerchio completo!','L’interruttore apre e chiude la strada dell’elettricità.','Il motore trasforma l’elettricità in movimento.','Il campanello trasforma l’elettricità in suono!','Le lampadine una dopo l’altra si dividono l’elettricità, quindi brillano meno.','Quando ogni lampadina ha la sua strada verso la pila, tutte e due brillano forte!','Il LED fa passare l’elettricità in una sola direzione.','Ogni LED ha il suo interruttore, come un semaforo!','La lampadina si accende solo con tutti e due gli interruttori. Come la porta di una cassaforte!','La lampadina si accende con qualsiasi interruttore. Come la luce delle scale!','Un solo interruttore accende tutta la casa!',''],
 dim:'Le lampadine sono deboli. Collega ogni lampadina direttamente alla pila!',ledRev:'Il LED ha un più e un meno. Collega la gamba più del LED verso il più della pila!',
 bypass:c=>`Il filo gira intorno a ${c}! L’elettricità prende la strada più facile.`,cn:{bulb:'la lampadina',motor:'il ventilatore',buzz:'il campanello',led:'il LED',res:'la resistenza',pot:'la manopola'},
 andH:'La lampadina deve spegnersi quando spegni uno qualsiasi degli interruttori.',orH:'La lampadina deve accendersi con ogni interruttore da solo.',indepH:'Ogni interruttore deve accendere solo il suo LED.',masterH:'Quando spegni l’interruttore, tutto deve fermarsi.',
 loose:'I fili grigi non portano elettricità. Puoi tenerli o cancellarli.',swOut:'La lampadina è accesa, ma l’interruttore non è sulla strada dell’elettricità! Mettilo tra la pila e la lampadina.',swLoose:'L’interruttore non è collegato a niente. Mettilo nel circuito!'},
pt:{lv:['Põe um coelho no mesmo sítio do outro lado!','O baloiço está torto! Arrasta o cão pela tábua, mais longe do meio.','O elefante é pesado! Um rato consegue levantá-lo? Põe-no o mais longe possível!','Arrasta um animal para a direita para o baloiço ficar direito!','Mais uma! Também podes usar dois animais.'],
 lvHeavyL:'O lado esquerdo é mais pesado.',lvHeavyR:'O lado direito é mais pesado.',lvPow:'As torres mostram com que força cada lado empurra.',
 gFacts:{fast:'A bicicleta funciona assim: a roda dentada pequena de trás gira mais depressa do que os pedais!',dir:'Os relógios também: as rodas dentadas empurram-se umas às outras.',chain:'A roda dentada do meio só passa o movimento.'},
 teeth:n=>`${n} dentes`,
 bike:['Mantém carregado Pedalar! Os pedais giram a roda dentada grande e a corrente gira a pequena de trás.','Dá uma volta de pedal e conta: quantas vezes gira a roda de trás?','Corrida com o caracol! Escolhe a mudança certa para ganhar.','Subida! Escolhe a mudança que torna a subida fácil.','Última pergunta: para subir, escolhes a roda dentada grande ou a pequena de trás?'],
 pedal:'🦶 Pedalar',oneTurn:'↻ Uma volta de pedal',gEasy:'🐢 Fácil',gMid:'🚲 Média',gFast:'🚀 Rápida',
 bikeWhy:['A corrente liga as duas rodas dentadas. Quando pedalas, a roda de trás gira e a bicicleta anda!','Sim! A roda dos pedais tem o dobro dos dentes, por isso a roda de trás gira duas vezes.','Ganhaste! A roda dentada pequena de trás dá muitas voltas, por isso vais depressa no plano.','Conseguiste! A roda dentada grande de trás torna fácil pedalar, mesmo indo mais devagar.','Exatamente! A roda grande de trás é para subidas, a pequena é para velocidade.'],
 lost:'O caracol ganhou! Experimenta a mudança rápida 🚀.',hard:'Ufa, que difícil! Experimenta a mudança fácil 🐢.',bigCog:'🐢 Roda grande',smallCog:'🚀 Roda pequena',countQ:'Quantas vezes girou a roda de trás?',rampUp:'⬆',rampDown:'⬇',
 cg:['Acende a lâmpada!','Acende a lâmpada com o interruptor!','Liga a ventoinha para refrescar o RoboPufi!','Faz tocar a campainha!','Acende duas lâmpadas, uma depois da outra!','Acende as duas lâmpadas o mais forte possível!','Acende o LED vermelho! Cuidado: o LED tem um mais e um menos.','O semáforo: cada LED com o seu interruptor!','O cofre: a lâmpada só acende se os dois interruptores estiverem ligados!','A escada: a lâmpada acende com qualquer um dos interruptores!','A casa do RoboPufi: lâmpada, ventoinha e campainha, tudo com um só interruptor!','O laboratório: constrói o que quiseres!'],
 cwhy:['A eletricidade sai do mais, passa pela lâmpada e volta ao menos. Um círculo completo!','O interruptor abre e fecha o caminho da eletricidade.','O motor transforma eletricidade em movimento.','A campainha transforma eletricidade em som!','Lâmpadas uma depois da outra dividem a eletricidade, por isso brilham menos.','Quando cada lâmpada tem o seu caminho até à pilha, as duas brilham com força!','O LED só deixa passar a eletricidade num sentido.','Cada LED tem o seu interruptor, como um semáforo!','A lâmpada só acende com os dois interruptores. Como a porta de um cofre!','A lâmpada acende com qualquer interruptor. Como a luz da escada!','Um só interruptor liga a casa toda!',''],
 dim:'As lâmpadas estão fracas. Liga cada lâmpada diretamente à pilha!',ledRev:'O LED tem um mais e um menos. Liga a perna mais do LED para o mais da pilha!',
 bypass:c=>`O fio contorna ${c}! A eletricidade vai pelo caminho mais fácil.`,cn:{bulb:'a lâmpada',motor:'a ventoinha',buzz:'a campainha',led:'o LED',res:'a resistência',pot:'o botão rotativo'},
 andH:'A lâmpada tem de apagar quando desligas qualquer um dos interruptores.',orH:'A lâmpada tem de acender com cada interruptor sozinho.',indepH:'Cada interruptor só deve acender o seu LED.',masterH:'Quando desligas o interruptor, tudo tem de parar.',
 loose:'Os fios cinzentos não levam eletricidade. Podes deixá-los ou apagá-los.',swOut:'A lâmpada está acesa, mas o interruptor não está no caminho da eletricidade! Põe-no entre a pilha e a lâmpada.',swLoose:'O interruptor não está ligado a nada. Liga-o ao circuito!'},
nl:{lv:['Zet een konijn op dezelfde plek aan de andere kant!','De wip staat scheef! Sleep de hond over de plank, verder van het midden.','De olifant is zwaar! Kan een muis hem optillen? Zet hem zo ver mogelijk weg!','Sleep een dier naar rechts zodat de wip recht staat!','Nog één! Je mag ook twee dieren gebruiken.'],
 lvHeavyL:'De linkerkant is zwaarder.',lvHeavyR:'De rechterkant is zwaarder.',lvPow:'De torens laten zien hoe hard elke kant duwt.',
 gFacts:{fast:'Een fiets werkt net zo: het kleine tandwiel achter draait sneller dan de trappers!',dir:'Klokken ook: de tandwielen duwen elkaar rond.',chain:'Het middelste tandwiel geeft de beweging alleen door.'},
 teeth:n=>`${n} tanden`,
 bike:['Houd Trappen ingedrukt! De trappers draaien het grote tandwiel en de ketting draait het kleine achteraan.','Trap één rondje en tel: hoe vaak draait het achterwiel?','Race tegen de slak! Kies de goede versnelling om te winnen.','De heuvel op! Kies de versnelling waarmee klimmen makkelijk is.','Laatste vraag: om te klimmen kies je het grote of het kleine tandwiel achter?'],
 pedal:'🦶 Trappen',oneTurn:'↻ Eén rondje trappen',gEasy:'🐢 Makkelijk',gMid:'🚲 Midden',gFast:'🚀 Snel',
 bikeWhy:['De ketting verbindt de twee tandwielen. Als je trapt, draait het achterwiel en rijdt de fiets!','Ja! Het trappertandwiel heeft twee keer zoveel tanden, dus het achterwiel draait twee keer.','Gewonnen! Het kleine tandwiel achter draait veel rondjes, dus je gaat snel op een vlakke weg.','Gelukt! Het grote tandwiel achter maakt trappen makkelijk, ook al ga je langzamer.','Precies! Het grote tandwiel achter is voor heuvels, het kleine voor snelheid.'],
 lost:'De slak heeft gewonnen! Probeer de snelle versnelling 🚀.',hard:'Pff, dit is zwaar! Probeer de makkelijke versnelling 🐢.',bigCog:'🐢 Groot tandwiel',smallCog:'🚀 Klein tandwiel',countQ:'Hoe vaak draaide het achterwiel?',rampUp:'⬆',rampDown:'⬇',
 cg:['Laat het lampje branden!','Laat het lampje branden met de schakelaar!','Zet de ventilator aan om RoboPufi af te koelen!','Laat de bel rinkelen!','Laat twee lampjes branden, de een na de ander!','Laat beide lampjes zo fel mogelijk branden!','Laat de rode led branden! Let op: de led heeft een plus en een min.','Het stoplicht: elke led met zijn eigen schakelaar!','De kluis: het lampje brandt alleen als beide schakelaars aan staan!','De trap: het lampje gaat aan met elke schakelaar!','Het huis van RoboPufi: lamp, ventilator en bel, allemaal met één schakelaar!','Het lab: bouw wat je maar wilt!'],
 cwhy:['De stroom gaat uit de plus, door het lampje en terug naar de min. Een hele cirkel!','De schakelaar opent en sluit de weg voor de stroom.','De motor maakt van stroom beweging.','De bel maakt van stroom geluid!','Lampjes na elkaar delen de stroom, dus ze branden zwakker.','Als elk lampje zijn eigen weg naar de batterij heeft, branden ze allebei fel!','De led laat de stroom maar één kant op door.','Elke led heeft zijn eigen schakelaar, net als een stoplicht!','Het lampje brandt alleen met beide schakelaars aan. Net als de deur van een kluis!','Het lampje gaat aan met elke schakelaar. Net als het licht op de trap!','Eén schakelaar zet het hele huis aan!',''],
 dim:'De lampjes zijn zwak. Verbind elk lampje direct met de batterij!',ledRev:'De led heeft een plus en een min. Verbind het pluspootje van de led met de plus van de batterij!',
 bypass:c=>`De draad gaat om ${c} heen! Stroom neemt de makkelijkste weg.`,cn:{bulb:'het lampje',motor:'de ventilator',buzz:'de bel',led:'de led',res:'de weerstand',pot:'de draaiknop'},
 andH:'Het lampje moet uitgaan als je een van de schakelaars uitzet.',orH:'Het lampje moet met elke schakelaar alleen aangaan.',indepH:'Elke schakelaar mag alleen zijn eigen led aanzetten.',masterH:'Als je de schakelaar uitzet, moet alles stoppen.',
 loose:'Grijze draden geven geen stroom. Je mag ze houden of wissen.',swOut:'Het lampje brandt, maar de schakelaar zit niet op de weg van de stroom! Zet hem tussen de batterij en het lampje.',swLoose:'De schakelaar is nergens mee verbonden. Zet hem in de kring!'},
pl:{lv:['Postaw królika w tym samym miejscu po drugiej stronie!','Huśtawka jest krzywa! Przesuń psa po desce, dalej od środka.','Słoń jest ciężki! Czy mysz może go podnieść? Postaw ją jak najdalej!','Przesuń zwierzątko w prawo, żeby huśtawka była prosto!','Jeszcze raz! Możesz też użyć dwóch zwierzątek.'],
 lvHeavyL:'Lewa strona jest cięższa.',lvHeavyR:'Prawa strona jest cięższa.',lvPow:'Wieże pokazują, jak mocno pcha każda strona.',
 gFacts:{fast:'Rower działa tak samo: małe kółko z tyłu kręci się szybciej niż pedały!',dir:'Zegary też: zębatki popychają się nawzajem.',chain:'Środkowa zębatka tylko przekazuje ruch.'},
 teeth:n=>`zęby: ${n}`,

de:{cx:{mat:['Detektiv-Test: Welche Dinge lassen Strom durch? Wähle einen Gegenstand!','Metalle lassen Strom durch: Sie sind Leiter. Holz, Plastik und Stoff nicht: Sie sind Isolatoren. Darum sind Kabel aus Metall und mit Plastik umhüllt!'],
  btn:['Klingel mit Taster: Verbinde sie und drück dann dreimal auf den Knopf!','Der Klingelknopf ist ein Schalter, der nur geschlossen ist, solange du drückst. Lässt du los, öffnet ihn eine Feder wieder.'],
  ser:['Super-Ventilator! Nimm beide Batterien, damit RoboPufis Ventilator ganz schnell dreht!','Zwei Batterien hintereinander schieben den Strom doppelt so stark. Darum sind Spielzeuge mit mehr Batterien stärker!'],
  pot:['Pufis Lampe: Ein Drehknopf verändert das Licht!','Der Drehknopf heißt Potentiometer. Er bremst den Strom: Je mehr er bremst, desto schwächer das Licht!'],
  res:['Zwei Batterien sind zu viel für eine kleine LED! Bring sie zum Leuchten, ohne dass sie durchbrennt.','Der Widerstand bremst den Strom und schützt die LED. Jede LED hat einen kleinen Widerstand als Freund!'],
  sun:['Sonnenenergie! Verbinde das Solarpanel mit dem Ventilator.','Das Solarpanel verwandelt Sonnenlicht in Strom. Ohne Sonne kein Strom!']},

  press:'Der Stromkreis ist fertig! Jetzt drück den roten Knopf.',press2:'Ding-dong! Nochmal drücken!',
  btnOut:'Die Klingel läutet ohne Knopf! Setz den Knopf in den Weg des Stroms.',
  serH:'Der Ventilator ist langsam. Schalte die Batterien hintereinander: Plus der einen an Minus der anderen!',
  oppH:'Die Batterien drücken gegeneinander! Verbinde Plus mit Minus.',
  potHi:'Tippe auf den Drehknopf, bis die Lampe hell leuchtet, wie die Sonne!',potLo:'Pufi will schlafen. Dreh den Knopf, bis das Licht schwach ist, wie der Mond!',
  turn:'Tippe auf den Drehknopf, um ihn zu drehen!',potOut:'Der Drehknopf ist nicht im Weg des Stroms. Setz ihn zwischen Batterie und Lampe!',
  burn:'Puff! Die LED ist durchgebrannt: Zwei Batterien sind zu viel für sie. Setz den Widerstand davor, damit er den Strom bremst!',
  resOut:'Die LED leuchtet, aber der Widerstand ist nicht im Stromkreis. Nimm beide Batterien und den Widerstand!',
  sunOn:'Verbinde das Solarpanel mit dem Ventilator. Die Sonne gibt ihm Kraft!',sunOff:'Es läuft! Tippe jetzt auf die Sonne, damit eine Wolke sie verdeckt. Was passiert?',cutH:'Kabel gewählt. Tippe auf die Schere, um es zu entfernen.'}},
en:{cx:{mat:['Detective test: which things let electricity through? Pick a thing!','Metals let electricity through: they are conductors. Wood, plastic and fabric do not: they are insulators. That is why wires are made of metal, covered in plastic!'],
  btn:['Doorbell with a button: wire it up, then press the button three times!','The doorbell button is a switch that is closed only while you press it. When you let go, a spring opens it again.'],
  ser:['Super fan! Use both batteries so RoboPufi’s fan spins really fast!','Two batteries one after the other push the electricity twice as hard. That is why toys with more batteries are stronger!'],
  pot:['Pufi’s lamp: a turning knob changes the light!','The turning knob is called a potentiometer. It slows the electricity down: the more it slows it, the weaker the light!'],
  res:['Two batteries are too much for a little LED! Light it without burning it.','The resistor slows the electricity down and protects the LED. Every LED has a little resistor as its friend!'],
  sun:['Solar power! Connect the solar panel to the fan.','The solar panel turns sunlight into electricity. No sun, no electricity!']},

  oppH:'The batteries are pushing against each other! Connect plus to minus.',
  potHi:'Tap the knob to turn it, until the bulb shines brightly, like the sun!',potLo:'Pufi wants to sleep. Turn the knob until the light is weak, like the moon!',
  turn:'Tap the knob to turn it!',potOut:'The knob is not on the electricity’s path. Put it between the battery and the bulb!',
  burn:'Poof! The LED burnt out: two batteries are too much for it. Put the resistor in front of it, to slow the electricity down!',

  sunOn:'Connect the solar panel to the fan. The sun gives it power!',sunOff:'It works! Now tap the sun so a cloud covers it. What happens?',cutH:'Wire picked. Tap the scissors to cut it.'}},
fr:{cx:{mat:['Test du détective : quels objets laissent passer l’électricité ? Choisis un objet !','Les métaux laissent passer l’électricité : ce sont des conducteurs. Le bois, le plastique et le tissu non : ce sont des isolants. C’est pour ça que les fils sont en métal, entourés de plastique !'],
  btn:['La sonnette à bouton : branche-la, puis appuie trois fois sur le bouton !','Le bouton de la sonnette est un interrupteur fermé seulement pendant que tu appuies. Quand tu lâches, un ressort le rouvre.'],
  ser:['Super ventilateur ! Utilise les deux piles pour que le ventilateur de RoboPufi tourne très vite !','Deux piles l’une après l’autre poussent l’électricité deux fois plus fort. C’est pour ça que les jouets avec plus de piles sont plus forts !'],
  pot:['La lampe de Pufi : un bouton tournant change la lumière !','Le bouton tournant s’appelle un potentiomètre. Il freine l’électricité : plus il freine, plus la lumière est faible !'],
  res:['Deux piles, c’est trop pour une petite LED ! Allume-la sans la brûler.','La résistance freine l’électricité et protège la LED. Chaque LED a une petite résistance comme amie !'],
  sun:['L’énergie solaire ! Relie le panneau solaire au ventilateur.','Le panneau solaire transforme la lumière du soleil en électricité. Sans soleil, pas d’électricité !']},

  btnOut:'La sonnette sonne sans le bouton ! Mets le bouton sur le chemin de l’électricité.',
  serH:'Le ventilateur est lent. Mets les piles l’une après l’autre : le plus de l’une au moins de l’autre !',
  oppH:'Les piles se poussent l’une contre l’autre ! Relie le plus au moins.',
  potHi:'Touche le bouton tournant pour le tourner, jusqu’à ce que l’ampoule brille fort, comme le soleil !',potLo:'Pufi veut dormir. Tourne le bouton jusqu’à ce que la lumière soit faible, comme la lune !',
  turn:'Touche le bouton tournant pour le tourner !',potOut:'Le bouton tournant n’est pas sur le chemin de l’électricité. Mets-le entre la pile et l’ampoule !',
  burn:'Pouf ! La LED a grillé : deux piles, c’est trop pour elle. Mets la résistance devant elle pour freiner l’électricité !',
  resOut:'La LED brille, mais la résistance n’est pas dans le circuit. Utilise les deux piles et la résistance !',

es:{cx:{mat:['Prueba de detective: ¿qué cosas dejan pasar la electricidad? ¡Elige un objeto!','Los metales dejan pasar la electricidad: son conductores. La madera, el plástico y la tela no: son aislantes. ¡Por eso los cables son de metal, cubiertos de plástico!'],
  btn:['Timbre con pulsador: conéctalo y luego aprieta el botón tres veces.','El botón del timbre es un interruptor que solo se cierra mientras lo aprietas. Cuando lo sueltas, un muelle lo vuelve a abrir.'],
  ser:['¡Súper ventilador! Usa las dos pilas para que el ventilador de RoboPufi gire muy rápido.','Dos pilas una tras otra empujan la electricidad el doble de fuerte. ¡Por eso los juguetes con más pilas son más fuertes!'],
  pot:['La lámpara de Pufi: ¡una rueda giratoria cambia la luz!','La rueda giratoria se llama potenciómetro. Frena la electricidad: ¡cuanto más frena, más débil es la luz!'],
  res:['¡Dos pilas son demasiado para un LED pequeño! Enciéndelo sin quemarlo.','La resistencia frena la electricidad y protege el LED. ¡Cada LED tiene una pequeña resistencia como amiga!'],
  sun:['¡Energía solar! Conecta el panel solar al ventilador.','El panel solar convierte la luz del sol en electricidad. ¡Sin sol, no hay electricidad!']},

it:{cx:{mat:['Test del detective: quali cose fanno passare l’elettricità? Scegli un oggetto!','I metalli fanno passare l’elettricità: sono conduttori. Il legno, la plastica e la stoffa no: sono isolanti. Per questo i fili sono di metallo, coperti di plastica!'],
  btn:['Campanello con pulsante: collegalo, poi premi il pulsante tre volte!','Il pulsante del campanello è un interruttore chiuso solo mentre lo premi. Quando lo lasci, una molla lo riapre.'],
  ser:['Super ventilatore! Usa tutte e due le pile perché il ventilatore di RoboPufi giri velocissimo!','Due pile una dopo l’altra spingono l’elettricità il doppio. Per questo i giocattoli con più pile sono più forti!'],
  pot:['La lampada di Pufi: una manopola cambia la luce!','La manopola si chiama potenziometro. Frena l’elettricità: più frena, più la luce è debole!'],
  res:['Due pile sono troppe per un piccolo LED! Accendilo senza bruciarlo.','La resistenza frena l’elettricità e protegge il LED. Ogni LED ha una piccola resistenza come amica!'],
  sun:['Energia solare! Collega il pannello solare al ventilatore.','Il pannello solare trasforma la luce del sole in elettricità. Senza sole, niente elettricità!']},

pl:{cx:{mat:['Test detektywa: które rzeczy przepuszczają prąd? Wybierz przedmiot!','Metale przepuszczają prąd: to przewodniki. Drewno, plastik i materiał nie: to izolatory. Dlatego kable są z metalu, owinięte plastikiem!'],
  btn:['Dzwonek z przyciskiem: podłącz go, a potem naciśnij przycisk trzy razy!','Przycisk dzwonka to włącznik, który jest zamknięty tylko, gdy go naciskasz. Kiedy puścisz, sprężynka znów go otwiera.'],
  ser:['Superwiatrak! Użyj obu baterii, żeby wiatrak RoboPufiego kręcił się bardzo szybko!','Dwie baterie jedna za drugą pchają prąd dwa razy mocniej. Dlatego zabawki z większą liczbą baterii są silniejsze!'],
  pot:['Lampka Pufiego: pokrętło zmienia światło!','Pokrętło to potencjometr. Hamuje prąd: im mocniej hamuje, tym słabsze światło!'],
