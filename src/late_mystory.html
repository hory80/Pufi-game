<style>
/* ===== Povestea mea: textul scris, lipit sau dictat de părinte ===== */
.rd-card.my{background:#FFF3B0;box-shadow:0 8px 0 #E8C95A}
.rd-card.mynew{background:#fff;border:3px dashed #5B7FDE;box-shadow:none}
.rd-stage>.rd-story,.rd-stage>.rd-stories{flex:0 1 auto;min-height:0}
.rd-stories{overflow-y:auto;align-content:start;padding:4px 4px 14px;-webkit-overflow-scrolling:touch}
.rd-card .my-del{position:absolute;top:6px;left:8px;font-size:1.2rem;background:#fff;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.rd-card .my-del.sure{background:#E8505B;color:#fff;width:auto;padding:0 10px;border-radius:999px}
.rd-card .my-ed{position:absolute;top:6px;right:8px;font-size:1.3rem;background:#fff;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.my-ov{position:fixed;inset:0;z-index:99990;background:rgba(36,50,95,.55);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 10px);box-sizing:border-box}
.my-box{background:#fff;border-radius:26px;width:min(720px,96vw);max-height:100%;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;color:#24325f;font-family:var(--display);box-sizing:border-box}
.my-box h3{margin:0;font-size:clamp(1.3rem,3.4vw,1.8rem)}
.my-box input,.my-box textarea{font:inherit;font-size:clamp(1.05rem,2.6vw,1.3rem);border:3px solid #DCE3F2;border-radius:16px;padding:10px 12px;color:#24325f;width:100%;box-sizing:border-box;font-weight:700;-webkit-user-select:text;user-select:text;touch-action:auto}
.my-box textarea{min-height:min(36vh,260px);resize:vertical;line-height:1.45}
.my-box textarea.rec{border-color:#FF5D7A;box-shadow:0 0 0 4px rgba(255,93,122,.2)}
.my-ics{display:flex;gap:6px;flex-wrap:wrap}
.my-ics button{font-size:1.6rem;width:52px;height:52px;border-radius:14px;border:3px solid #E6ECF7;background:#F7FAFF;cursor:pointer}
.my-ics button.on{border-color:#5B7FDE;background:#E8EEFF}
.my-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.my-row button{font:inherit;font-weight:800;font-size:clamp(1rem,2.5vw,1.2rem);border:3px solid #24325f;background:#fff;color:#24325f;border-radius:999px;padding:6px 16px;min-height:48px;cursor:pointer}
.my-row button.go{background:#3ECF8E;border-color:#2bb57a;color:#fff}
.my-row button.red{border-color:#E8505B;color:#E8505B}
.my-cnt{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;opacity:.75}
.my-cnt.over{color:#E8505B;opacity:1}
.my-note{font-weight:700;font-size:.95rem;opacity:.75;margin:0}
</style>

const X=()=>TX[lang]||TX.en;
const FREE_LEN=150, FREE_N=1;
const LS={get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }};

const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICS=['📝','🦊','🌈','🚀','🐶','🏰','🌻','⚽'];
/* silabe colorate pentru română (reguli simple: V-CV, VC-CV, VC-CCV) */
function syllRo(w){ const V='aeiouăâîAEIOUĂÂÎ', isV=c=>V.includes(c); if(w.length<4) return w;
  const out=[]; let cur='', i=0; const L=[...w];
  while(i<L.length){ cur+=L[i];
    if(isV(L[i])){ let j=i+1; while(j<L.length&&isV(L[j])) j++; /* grupuri de vocale rămân împreună */
      if(j>i+1){ cur+=L.slice(i+1,j).join(''); i=j-1; }
      let k=i+1, c=0; while(k<L.length&&!isV(L[k])){ c++; k++; }
      if(k>=L.length){ cur+=L.slice(i+1).join(''); out.push(cur); return out.join('·'); }
      if(c===1){ out.push(cur); cur=''; }
      else if(c===2){ const pair=(L[i+1]+L[i+2]).toLowerCase(); if(/^(ch|gh|[bcdfghptv][lr])$/.test(pair)){ out.push(cur); cur=''; } else { cur+=L[i+1]; out.push(cur); cur=''; i++; } }
      else if(c>=3){ cur+=L[i+1]; out.push(cur); cur=''; i++; } }
    i++; }
  if(cur) out.push(cur); return out.join('·'); }
const HY={};
function prep(text){ let t=text.replace(/\r/g,'').replace(/[<>]/g,'').replace(/\n+/g,'. ').replace(/\s+/g,' ').replace(/\.\s*\./g,'.').trim(); if(!t) return '';
  if(!/[.!?]$/.test(t)) t+='.';
  const PN={de:'De1996',en:'EnUs',fr:'Fr',it:'It',es:'Es',pt:'Pt',nl:'Nl',pl:'Pl',uk:'Uk',ru:'Ru'}[lang];
  if(PN&&window.createHyphenator&&window['hyphenationPatterns'+PN]){ try{ HY[lang]=HY[lang]||window.createHyphenator(window['hyphenationPatterns'+PN],{hyphenChar:'·',minWordLength:4}); return HY[lang](t); }catch(e){} }
  if(lang==='ro') t=t.split(' ').map(w=>{ const m=w.match(/^([^\p{L}]*)([\p{L}-]+)([^\p{L}]*)$/u); return m?m[1]+syllRo(m[2])+m[3]:w; }).join(' ');
  return t; }
async function gate(){ try{ if(window.__parentsGate&&window.native) return !!(await window.__parentsGate()); }catch(e){} return true; }
let openStoryRef=null;
window.__rdMy=(grid,openStory)=>{ openStoryRef=openStory;
  list().forEach((st,i)=>{ const b=document.createElement('button'); b.className='rd-card my'; b.innerHTML=`<span class="ic">${st.ic||'📝'}</span><span class="nm">${esc(st.title||X().def)}</span><span class="my-ed" data-e="1">✏️</span><span class="my-del" data-d="1">🗑</span>`;
    b.onclick=async e=>{ const dz=e.target.closest('[data-d]'); if(dz){ e.stopPropagation();
      if(!dz.classList.contains('sure')){ if(!(await gate())) return; dz.classList.add('sure'); dz.textContent='🗑 ?'; setTimeout(()=>{ if(dz.isConnected){ dz.classList.remove('sure'); dz.textContent='🗑'; } },4000); return; }
      const L2=list(); L2.splice(i,1); LS.set('rd_my',L2); refresh(); return; }
    if(e.target.closest('[data-e]')){ e.stopPropagation(); if(await gate()) editor(i); return; } openStory([st.ic||'📝',esc(st.title||X().def),prep(st.text)]); }; grid.appendChild(b); });
  const nb=document.createElement('button'); nb.className='rd-card mynew'; nb.dataset.lk='rd:my'; nb.innerHTML=`<span class="ic">✍️</span><span class="nm">${X().neu}</span>`;
  nb.onclick=async()=>{ if(locked()&&list().length>=FREE_N){ if(window.__paywall) window.__paywall(); return; } if(await gate()) editor(-1); }; grid.appendChild(nb); };
function editor(i){ const L=list(), st=i>=0?L[i]:{ic:'📝',title:'',text:''}; const lim=locked()?FREE_LEN:0;
  const ov=document.createElement('div'); ov.className='my-ov'; const box=document.createElement('div'); box.className='my-box'; ov.appendChild(box);
  box.innerHTML=`<h3>${X().card}</h3><div class="my-ics">${ICS.map(c=>`<button data-ic="${c}" class="${c===st.ic?'on':''}">${c}</button>`).join('')}</div>
   <input id="my-t" maxlength="40" placeholder="${X().title}"><textarea id="my-x" placeholder="${X().ph}"></textarea>
   <div class="my-row"><button data-a="paste">${X().paste}</button><button data-a="dict">${X().dict}</button><span class="my-cnt" id="my-c"></span></div>
   <p class="my-note">${X().kb}${lim?' '+X().free(lim):''}</p>
   <div class="my-row"><button class="go" data-a="save">${X().save}</button>${i>=0?`<button class="red" data-a="del">${X().del}</button>`:''}<button data-a="x">${X().close}</button></div>`;
  document.body.appendChild(ov); const $t=box.querySelector('#my-t'), $x=box.querySelector('#my-x'), $c=box.querySelector('#my-c'); $t.value=st.title||''; $x.value=st.text||''; let ic=st.ic||'📝';
  const cnt=()=>{ const n=$x.value.length; $c.textContent=lim?`${n} / ${lim}`:String(n); $c.classList.toggle('over',!!lim&&n>lim); if(lim&&n>lim){ $x.value=$x.value.slice(0,lim); cnt(); } };
  $x.addEventListener('input',cnt); cnt();
  box.querySelectorAll('[data-ic]').forEach(b=>b.onclick=()=>{ ic=b.dataset.ic; box.querySelectorAll('[data-ic]').forEach(x=>x.classList.toggle('on',x===b)); });
  box.querySelector('[data-a=paste]').onclick=async()=>{ try{ const t=await navigator.clipboard.readText(); if(t){ $x.value=($x.value?$x.value+' ':'')+t; cnt(); } }catch(e){ $x.focus(); } };
  /* dictare: în aplicație folosim recunoașterea vorbirii; în browser, microfonul tastaturii */
  const N=window.native; let rec=false, base='', seg='', onP=null, onE=null, keep='';
  const db=box.querySelector('[data-a=dict]'); if(!N) db.hidden=true;
  const stopRec=()=>{ if(!rec) return; keep=$x.value; rec=false; db.textContent=X().dict; $x.classList.remove('rec'); try{ N.off('asr.partial',onP); N.off('asr.end',onE); N.call('asr.stop').then(()=>{ if($x.value!==keep){ $x.value=keep; cnt(); } }); }catch(e){} setTimeout(()=>{ if(!rec&&keep&&$x.value!==keep){ $x.value=keep; cnt(); } },400); };
  db.onclick=async()=>{ if(rec) return stopRec(); if(window.__micEnsure&&!(await window.__micEnsure())) return; rec=true; db.textContent=X().stop; $x.classList.add('rec'); base=$x.value?$x.value.replace(/\s*$/,' '):''; seg='';
    onP=p=>{ if(!rec) return; const t=(p.text||'').trim(); if(!t) return;
      /* iPad-ul poate reîncepe transcrierea după o pauză: păstrăm ce s-a spus înainte */
      if(seg&&t.length<seg.length*.7&&!t.toLowerCase().startsWith(seg.slice(0,Math.min(6,seg.length)).toLowerCase())){ base=(base+seg).replace(/\s*$/,' '); }
      seg=t; $x.value=base+seg; cnt(); if(p.final){ base=$x.value.replace(/\s*$/,' '); seg=''; } };
    onE=()=>{ if(rec){ base=$x.value.replace(/\s*$/,' '); seg=''; setTimeout(()=>{ if(rec) N.call('asr.start',{lang,words:[]}); },250); } };
    N.on('asr.partial',onP); N.on('asr.end',onE); const ok=await N.call('asr.start',{lang,words:[]}); if(!(ok===true||(ok&&ok.ok))){ stopRec(); if(window.__micFail) window.__micFail(ok&&ok.reason); } };
  const close=()=>{ stopRec(); ov.remove(); };
  box.querySelector('[data-a=x]').onclick=close;
  box.querySelector('[data-a=save]').onclick=()=>{ const text=$x.value.trim(); if(!text){ $x.placeholder=X().empty; $x.focus(); return; }
    const L2=list(), o={ic,title:$t.value.trim()||X().def,text:lim?text.slice(0,lim):text}; if(i>=0) L2[i]=o; else L2.push(o); LS.set('rd_my',L2); close(); refresh(); };
  const d=box.querySelector('[data-a=del]'); let sure=false; if(d) d.onclick=()=>{ if(!sure){ sure=true; d.textContent=X().del+' ?'; d.style.background='#E8505B'; d.style.color='#fff'; setTimeout(()=>{ if(sure){ sure=false; d.textContent=X().del; d.style.background=''; d.style.color=''; } },4000); return; } const L2=list(); L2.splice(i,1); LS.set('rd_my',L2); close(); refresh(); };
  setTimeout(()=>{ (i>=0?$x:$t).focus(); },50); }
/* reafișează lista de povești dacă e deschisă */
function refresh(){ const g=document.querySelector('.rd-stories'); if(!g||!openStoryRef) return; g.querySelectorAll('.rd-card.my,.rd-card.mynew').forEach(e=>e.remove()); window.__rdMy(g,openStoryRef); }
(window.__LR=window.__LR||[]).push(()=>refresh());
/* la poveștile lungi, cuvântul citit acum rămâne mereu la vedere */
{ const rr=document.getElementById('rd-root'); if(rr){ let lastHl=null; new MutationObserver(ms=>{ for(const m of ms){ const t=m.target; if(t.classList&&t.classList.contains('rd-w')&&t.classList.contains('hl')&&t!==lastHl){ lastHl=t; const box=t.closest('.rd-story'); if(box&&box.scrollHeight>box.clientHeight+4){ const r=t.getBoundingClientRect(), br=box.getBoundingClientRect(); if(r.top<br.top+10||r.bottom>br.bottom-10) box.scrollTo({top:box.scrollTop+(r.top-br.top)-br.height*.35,behavior:'smooth'}); } } } }).observe(rr,{subtree:true,attributes:true,attributeFilter:['class']}); } }
