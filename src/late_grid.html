 lv:['Le soir au village','Le soleil','Le vent','Le lac de barrage','Les voitures électriques','L’usine','La tempête','Le mélange idéal'],
 intro:['Le soir tombe et les gens allument la lumière. Appuie sur plus à la centrale à charbon pour que les deux colonnes soient égales : autant d’électricité produite que consommée !','Les panneaux solaires font de l’électricité avec la lumière du soleil. Quand le soleil ne suffit pas, allume la centrale à gaz.','Les éoliennes font de l’électricité quand le vent souffle. Le vent change ! Aide avec la centrale à gaz.','À midi, le soleil fait trop d’électricité. Pompe l’eau en haut dans le lac ! Le soir, laisse-la redescendre : la turbine fait de l’électricité.','La centrale nucléaire tourne tout le temps, même la nuit. La nuit, on consomme peu : recharge les voitures électriques ! Le matin, elles doivent être pleines.','L’usine a besoin de beaucoup d’électricité quand elle travaille. Démarre les centrales à temps : le charbon démarre lentement, le gaz vite.','Une tempête arrive ! Quand le vent est trop fort, les éoliennes s’arrêtent pour ne pas casser. Sois prêt !','Tu as maintenant toutes les centrales. Fais le mélange idéal : de la lumière pour tous et le moins de fumée possible !'],
 ev:{dinner:'Tout le monde prépare le dîner ! Il faut plus d’électricité.',sleep:'Les gens vont se coucher. On consomme moins : baisse la centrale !',cloud:'Un nuage arrive ! Les panneaux solaires produisent moins.',sunset:'Le soleil se couche. Les panneaux solaires ne produisent plus !',windStop:'Le vent s’est arrêté ! Les éoliennes ne tournent plus.',windBack:'Le vent souffle de nouveau !',noon:'Il est midi et le soleil est fort. Trop d’électricité ? Pompe l’eau dans le lac !',evening:'Le soir arrive. Laisse l’eau du lac couler et faire de l’électricité !',morning:'Bonjour ! Les gens se lèvent et allument la lumière.',factoryOn:'L’usine démarre ses machines ! Il faut beaucoup d’électricité.',lunch:'Pause de midi à l’usine. Elle consomme moins.',factoryOff:'L’usine s’est arrêtée. Baisse les centrales.',storm:'Tempête ! Les éoliennes se sont arrêtées pour ne pas casser.',stormEnd:'La tempête est passée. Les éoliennes repartent.',night:'C’est la nuit. On consomme peu, mais la centrale nucléaire continue. Recharge les voitures !'},
 low:'Pas assez d’électricité ! Les maisons s’éteignent.',high:'Trop d’électricité ! Les fils chauffent.',ok:'Parfait ! Les colonnes sont égales.',lakeEmpty:'Le lac est vide !',lakeFull:'Le lac est plein !',pump:'La pompe monte l’eau dans le lac.',gen:'L’eau coule dans la turbine et fait de l’électricité.',stop:'Le barrage se repose.',evOn:'La voiture se recharge.',evOff:'La voiture ne se recharge plus.',evFull:'La voiture est pleine !',

 f:{coal:'La centrale à charbon brûle du charbon. Elle fait beaucoup d’électricité, mais aussi beaucoup de fumée, et démarre lentement.',gas:'La centrale à gaz démarre vite. Elle fait moins de fumée que le charbon.',nuc:'La centrale nucléaire fait beaucoup d’électricité sans fumée, jour et nuit. Elle ne peut pas s’arrêter vite.',solar:'Les panneaux solaires font de l’électricité avec la lumière du soleil. La nuit, ils ne marchent pas.',wind:'Les éoliennes font de l’électricité quand le vent souffle.',hydro:'Le barrage : quand on a trop d’électricité, on pompe l’eau en haut dans le lac. Quand on en a besoin, l’eau descend et fait tourner la turbine.',houses:'Les maisons : les gens utilisent l’électricité pour la lumière, la cuisine et les jeux.',factory:'L’usine utilise beaucoup d’électricité pour ses machines.',ev:'Les voitures électriques se rechargent à la prise. Le mieux, c’est de les recharger quand on a de l’électricité en trop.',scale:'La colonne jaune, c’est l’électricité qu’on fabrique. La colonne bleue, c’est celle qu’on utilise. Elles doivent être égales !'}},
es:{title:'⚡ La red eléctrica',zone:['🏙️','La red eléctrica'],zoneSay:'¡Haz electricidad para toda la ciudad! Mantén la producción igual al consumo.',back:'⬅ Atrás',next:'Siguiente nivel ▶',again:'↺ Otra vez',levels:'⬅ Niveles',prod:'Producción',cons:'Consumo',
 lv:['La tarde en el pueblo','El sol','El viento','El embalse','Los coches eléctricos','La fábrica','La tormenta','La mezcla ideal'],
 intro:['Anochece y la gente enciende la luz. Toca más en la central de carbón para que las dos columnas sean iguales: ¡tanta electricidad como usamos!','Los paneles solares hacen electricidad con la luz del sol. Cuando el sol no basta, enciende la central de gas.','Los molinos de viento hacen electricidad cuando sopla el viento. ¡El viento cambia! Ayuda con la central de gas.','A mediodía el sol hace demasiada electricidad. ¡Bombea el agua arriba al lago! Por la tarde, déjala bajar: la turbina hace electricidad.','La central nuclear funciona siempre, también de noche. De noche usamos poco: ¡carga los coches eléctricos! Por la mañana deben estar llenos.','La fábrica necesita mucha electricidad cuando trabaja. Enciende las centrales a tiempo: el carbón arranca despacio, el gas rápido.','¡Viene una tormenta! Cuando el viento es demasiado fuerte, los molinos se paran para no romperse. ¡Prepárate!','Ya tienes todas las centrales. Haz la mezcla ideal: ¡luz para todos y el menor humo posible!'],
 ev:{dinner:'¡Todos preparan la cena! Hace falta más electricidad.',sleep:'La gente se va a dormir. Usamos menos: ¡baja la central!',cloud:'¡Viene una nube! Los paneles solares hacen menos electricidad.',sunset:'Se pone el sol. ¡Los paneles solares ya no hacen electricidad!',windStop:'¡El viento ha parado! Los molinos están quietos.',windBack:'¡Vuelve a soplar el viento!',noon:'Es mediodía y el sol es fuerte. ¿Demasiada electricidad? ¡Bombea agua al lago!',evening:'Llega la tarde. ¡Deja que el agua del lago baje y haga electricidad!',morning:'¡Buenos días! La gente se despierta y enciende la luz.',factoryOn:'¡La fábrica enciende sus máquinas! Hace falta mucha electricidad.',lunch:'Pausa de comida en la fábrica. Usa menos.',factoryOff:'La fábrica se ha parado. Baja las centrales.',storm:'¡Tormenta! Los molinos se han parado para no romperse.',stormEnd:'La tormenta ha pasado. Los molinos vuelven a girar.',night:'Es de noche. Usamos poco, pero la central nuclear sigue. ¡Carga los coches!'},
 low:'¡Poca electricidad! Las casas se apagan.',high:'¡Demasiada electricidad! Los cables se calientan.',ok:'¡Perfecto! Las columnas son iguales.',lakeEmpty:'¡El lago está vacío!',lakeFull:'¡El lago está lleno!',pump:'La bomba sube el agua al lago.',gen:'El agua pasa por la turbina y hace electricidad.',stop:'La presa descansa.',evOn:'El coche se está cargando.',evOff:'El coche ya no se carga.',evFull:'¡El coche está lleno!',
 done:['','Se acabó el día. ¡La próxima vez mantén las columnas más iguales!','¡Muy bien! La ciudad tuvo electricidad casi todo el tiempo.','¡Genial! ¡Equilibrio perfecto todo el día!'],evMiss:'Los coches no se han cargado del todo.',smoke:'¡Demasiado humo! Usa más sol, viento y agua.',free:'Puedes seguir jugando con la red.',
 f:{coal:'La central de carbón quema carbón. Hace mucha electricidad, pero también mucho humo, y arranca despacio.',gas:'La central de gas arranca rápido. Hace menos humo que el carbón.',nuc:'La central nuclear hace mucha electricidad sin humo, de día y de noche. No puede pararse rápido.',solar:'Los paneles solares hacen electricidad con la luz del sol. De noche no funcionan.',wind:'Los molinos de viento hacen electricidad cuando sopla el viento.',hydro:'La presa: cuando sobra electricidad, bombeamos agua arriba al lago. Cuando la necesitamos, el agua baja y hace girar la turbina.',houses:'Las casas: la gente usa electricidad para la luz, la comida y los juegos.',factory:'La fábrica usa mucha electricidad para sus máquinas.',ev:'Los coches eléctricos se cargan en el enchufe. Es mejor cargarlos cuando sobra electricidad.',scale:'La columna amarilla es la electricidad que hacemos. La azul es la que usamos. ¡Tienen que ser iguales!'}},
it:{title:'⚡ La rete elettrica',zone:['🏙️','La rete elettrica'],zoneSay:'Fai la corrente per tutta la città! Tieni la produzione uguale al consumo.',back:'⬅ Indietro',next:'Livello successivo ▶',again:'↺ Ancora',levels:'⬅ Livelli',prod:'Produzione',cons:'Consumo',
 lv:['Sera al villaggio','Il sole','Il vento','Il lago della diga','Le auto elettriche','La fabbrica','La tempesta','Il mix ideale'],
 intro:['Si fa sera e la gente accende la luce. Tocca più sulla centrale a carbone, così le due colonne sono uguali: tanta corrente quanta ne usiamo!','I pannelli solari fanno corrente con la luce del sole. Quando il sole non basta, accendi la centrale a gas.','Le pale eoliche fanno corrente quando soffia il vento. Il vento cambia! Aiutati con la centrale a gas.','A mezzogiorno il sole fa troppa corrente. Pompa l’acqua su nel lago! La sera lasciala scendere: la turbina fa corrente.','La centrale nucleare va sempre, anche di notte. Di notte usiamo poco: ricarica le auto elettriche! Al mattino devono essere piene.','La fabbrica ha bisogno di tanta corrente quando lavora. Accendi le centrali in tempo: il carbone parte piano, il gas veloce.','Arriva la tempesta! Quando il vento è troppo forte, le pale si fermano per non rompersi. Preparati!','Ora hai tutte le centrali. Fai il mix ideale: luce per tutti e meno fumo possibile!'],
 ev:{dinner:'Tutti preparano la cena! Serve più corrente.',sleep:'La gente va a dormire. Usiamo meno: abbassa la centrale!',cloud:'Arriva una nuvola! I pannelli solari fanno meno corrente.',sunset:'Il sole tramonta. I pannelli solari non fanno più corrente!',windStop:'Il vento si è fermato! Le pale sono ferme.',windBack:'Il vento soffia di nuovo!',noon:'È mezzogiorno e il sole è forte. Troppa corrente? Pompa l’acqua nel lago!',evening:'Arriva la sera. Lascia scendere l’acqua del lago e fai corrente!',morning:'Buongiorno! La gente si sveglia e accende la luce.',factoryOn:'La fabbrica accende le macchine! Serve tanta corrente.',lunch:'Pausa pranzo in fabbrica. Usa meno corrente.',factoryOff:'La fabbrica si è fermata. Abbassa le centrali.',storm:'Tempesta! Le pale si sono fermate per non rompersi.',stormEnd:'La tempesta è passata. Le pale ripartono.',night:'È notte. Usiamo poco, ma la centrale nucleare continua. Ricarica le auto!'},
 low:'Troppa poca corrente! Le case si spengono.',high:'Troppa corrente! I fili si scaldano.',ok:'Perfetto! Le colonne sono uguali.',lakeEmpty:'Il lago è vuoto!',lakeFull:'Il lago è pieno!',pump:'La pompa porta l’acqua su nel lago.',gen:'L’acqua passa nella turbina e fa corrente.',stop:'La diga riposa.',evOn:'L’auto si sta ricaricando.',evOff:'L’auto non si ricarica più.',evFull:'L’auto è piena!',
 done:['','La giornata è finita. La prossima volta tieni le colonne più uguali!','Bravo! La città ha avuto corrente quasi sempre.','Super! Equilibrio perfetto tutto il giorno!'],evMiss:'Le auto non sono del tutto cariche.',smoke:'Troppo fumo! Usa più sole, vento e acqua.',free:'Puoi continuare a giocare con la rete.',
 f:{coal:'La centrale a carbone brucia carbone. Fa tanta corrente, ma anche tanto fumo, e parte piano.',gas:'La centrale a gas parte veloce. Fa meno fumo del carbone.',nuc:'La centrale nucleare fa tanta corrente senza fumo, giorno e notte. Non si può fermare in fretta.',solar:'I pannelli solari fanno corrente con la luce del sole. Di notte non funzionano.',wind:'Le pale eoliche fanno corrente quando soffia il vento.',hydro:'La diga: quando c’è corrente in più, pompiamo l’acqua su nel lago. Quando serve, l’acqua scende e fa girare la turbina.',houses:'Le case: la gente usa la corrente per la luce, la cucina e i giochi.',factory:'La fabbrica usa tanta corrente per le macchine.',ev:'Le auto elettriche si ricaricano alla presa. È meglio ricaricarle quando c’è corrente in più.',scale:'La colonna gialla è la corrente che facciamo. Quella blu è la corrente che usiamo. Devono essere uguali!'}},
pt:{title:'⚡ A rede elétrica',zone:['🏙️','A rede elétrica'],zoneSay:'Faça energia para a cidade toda! Mantenha a produção igual ao consumo.',back:'⬅ Voltar',next:'Próximo nível ▶',again:'↺ De novo',levels:'⬅ Níveis',prod:'Produção',cons:'Consumo',
 lv:['A noite na vila','O sol','O vento','A represa','Os carros elétricos','A fábrica','A tempestade','A mistura ideal'],
 intro:['Está escurecendo e as pessoas acendem a luz. Toque no mais da usina a carvão para as duas colunas ficarem iguais: tanta energia quanto usamos!','Os painéis solares fazem energia com a luz do sol. Quando o sol não basta, ligue a usina a gás.','As turbinas eólicas fazem energia quando o vento sopra. O vento muda! Ajude com a usina a gás.','Ao meio-dia o sol faz energia demais. Bombeie a água para cima, para o lago! À noite, deixe a água descer: a turbina faz energia.','A usina nuclear funciona o tempo todo, até de noite. De noite usamos pouco, então carregue os carros elétricos! De manhã eles precisam estar cheios.','A fábrica precisa de muita energia quando trabalha. Ligue as usinas a tempo: o carvão liga devagar, o gás rápido.','Vem aí uma tempestade! Quando o vento é forte demais, as turbinas eólicas param para não quebrar. Fique pronto!','Agora você tem todas as usinas. Faça a mistura ideal: luz para todos e o mínimo de fumaça!'],
 ev:{dinner:'Todo mundo está fazendo o jantar! Precisamos de mais energia.',sleep:'As pessoas vão dormir. Usamos menos: diminua a usina!',cloud:'Vem uma nuvem! Os painéis solares fazem menos energia.',sunset:'O sol está se pondo. Os painéis solares não fazem mais energia!',windStop:'O vento parou! As turbinas estão paradas.',windBack:'O vento voltou a soprar!',noon:'É meio-dia e o sol está forte. Energia demais? Bombeie água para o lago!',evening:'Está anoitecendo. Deixe a água do lago descer e fazer energia!',morning:'Bom dia! As pessoas acordam e acendem a luz.',factoryOn:'A fábrica liga as máquinas! Precisamos de muita energia.',lunch:'Hora do almoço na fábrica. Ela usa menos.',factoryOff:'A fábrica parou. Diminua as usinas.',storm:'Tempestade! As turbinas eólicas pararam para não quebrar.',stormEnd:'A tempestade passou. As turbinas voltam a girar.',night:'É noite. Usamos pouco, mas a usina nuclear continua. Carregue os carros!'},
 low:'Pouca energia! As casas apagam.',high:'Energia demais! Os fios esquentam.',ok:'Perfeito! As colunas estão iguais.',lakeEmpty:'O lago está vazio!',lakeFull:'O lago está cheio!',pump:'A bomba sobe a água para o lago.',gen:'A água passa pela turbina e faz energia.',stop:'A represa está parada.',evOn:'O carro está carregando.',evOff:'O carro parou de carregar.',evFull:'O carro está cheio!',
 done:['','O dia acabou. Da próxima vez, deixe as colunas mais iguais!','Muito bem! A cidade teve energia quase o tempo todo.','Demais! Equilíbrio perfeito o dia todo!'],evMiss:'Os carros não carregaram totalmente.',smoke:'Fumaça demais! Use mais sol, vento e água.',free:'Você pode continuar brincando com a rede.',
 f:{coal:'A usina a carvão queima carvão. Faz muita energia, mas também muita fumaça, e liga devagar.',gas:'A usina a gás liga rápido. Faz menos fumaça que o carvão.',nuc:'A usina nuclear faz muita energia sem fumaça, dia e noite. Ela não pode parar rápido.',solar:'Os painéis solares fazem energia com a luz do sol. De noite não funcionam.',wind:'As turbinas eólicas fazem energia quando o vento sopra.',hydro:'A represa: quando sobra energia, bombeamos a água para cima, para o lago. Quando precisamos, a água desce e gira a turbina.',houses:'As casas: as pessoas usam energia para a luz, a comida e as brincadeiras.',factory:'A fábrica usa muita energia para as máquinas.',ev:'Os carros elétricos carregam na tomada. É melhor carregar quando sobra energia.',scale:'A coluna amarela é a energia que fazemos. A azul é a energia que usamos. Elas precisam ser iguais!'}},
nl:{title:'⚡ Het stroomnet',zone:['🏙️','Het stroomnet'],zoneSay:'Maak stroom voor de hele stad! Houd maken en gebruiken gelijk.',back:'⬅ Terug',next:'Volgend level ▶',again:'↺ Nog eens',levels:'⬅ Levels',prod:'Gemaakt',cons:'Gebruikt',
 lv:['Avond in het dorp','De zon','De wind','Het stuwmeer','Elektrische auto’s','De fabriek','De storm','De perfecte mix'],
 intro:['Het wordt avond en de mensen doen het licht aan. Tik op plus bij de kolencentrale, zodat de twee zuilen gelijk zijn: evenveel stroom maken als we gebruiken!','Zonnepanelen maken stroom van zonlicht. Is de zon niet genoeg, zet dan de gascentrale aan.','Windmolens maken stroom als het waait. De wind verandert! Help met de gascentrale.','Om twaalf uur maakt de zon te veel stroom. Pomp het water omhoog in het meer! ’s Avonds laat je het terugstromen: de turbine maakt stroom.','De kerncentrale draait altijd, ook ’s nachts. ’s Nachts gebruiken we weinig, dus laad de elektrische auto’s op! ’s Ochtends moeten ze vol zijn.','De fabriek heeft veel stroom nodig als hij werkt. Zet de centrales op tijd aan: kolen starten langzaam, gas snel.','Er komt een storm! Als het te hard waait, stoppen de windmolens zodat ze niet kapotgaan. Wees klaar!','Nu heb je alle centrales. Maak de perfecte mix: licht voor iedereen en zo weinig mogelijk rook!'],
 ev:{dinner:'Iedereen kookt het avondeten! We hebben meer stroom nodig.',sleep:'De mensen gaan slapen. We gebruiken minder: zet de centrale lager!',cloud:'Er komt een wolk! De zonnepanelen maken minder stroom.',sunset:'De zon gaat onder. De zonnepanelen maken geen stroom meer!',windStop:'De wind is gestopt! De molens staan stil.',windBack:'Het waait weer!',noon:'Het is middag en de zon is sterk. Te veel stroom? Pomp water in het meer!',evening:'Het wordt avond. Laat het water uit het meer stromen en stroom maken!',morning:'Goedemorgen! De mensen staan op en doen het licht aan.',factoryOn:'De fabriek zet de machines aan! We hebben veel stroom nodig.',lunch:'Lunchpauze in de fabriek. Hij gebruikt minder.',factoryOff:'De fabriek is gestopt. Zet de centrales lager.',storm:'Storm! De windmolens zijn gestopt zodat ze niet kapotgaan.',stormEnd:'De storm is voorbij. De molens draaien weer.',night:'Het is nacht. We gebruiken weinig, maar de kerncentrale draait door. Laad de auto’s op!'},
 low:'Te weinig stroom! De huizen worden donker.',high:'Te veel stroom! De draden worden heet.',ok:'Perfect! De zuilen zijn gelijk.',lakeEmpty:'Het meer is leeg!',lakeFull:'Het meer is vol!',pump:'De pomp duwt het water omhoog in het meer.',gen:'Het water stroomt door de turbine en maakt stroom.',stop:'De stuwdam rust.',evOn:'De auto laadt op.',evOff:'De auto laadt niet meer.',evFull:'De auto is vol!',
 done:['','De dag is voorbij. Houd de zuilen de volgende keer meer gelijk!','Goed zo! De stad had bijna altijd stroom.','Super! De hele dag perfect in evenwicht!'],evMiss:'De auto’s zijn niet helemaal vol.',smoke:'Te veel rook! Gebruik meer zon, wind en water.',free:'Je kunt verder spelen met het net.',
 f:{coal:'De kolencentrale verbrandt kolen. Hij maakt veel stroom, maar ook veel rook, en start langzaam.',gas:'De gascentrale start snel. Hij maakt minder rook dan kolen.',nuc:'De kerncentrale maakt veel stroom zonder rook, dag en nacht. Hij kan niet snel stoppen.',solar:'Zonnepanelen maken stroom van zonlicht. ’s Nachts werken ze niet.',wind:'Windmolens maken stroom als het waait.',hydro:'De stuwdam: hebben we stroom over, dan pompen we water omhoog in het meer. Hebben we stroom nodig, dan stroomt het water omlaag en draait de turbine.',houses:'De huizen: mensen gebruiken stroom voor licht, eten en spelen.',factory:'De fabriek gebruikt veel stroom voor de machines.',ev:'Elektrische auto’s laden op aan het stopcontact. Het best laden we ze als we stroom over hebben.',scale:'De gele zuil is de stroom die we maken. De blauwe zuil is de stroom die we gebruiken. Ze moeten gelijk zijn!'}},
pl:{title:'⚡ Sieć elektryczna',zone:['🏙️','Sieć elektryczna'],zoneSay:'Zrób prąd dla całego miasta! Niech produkcja będzie równa zużyciu.',back:'⬅ Wstecz',next:'Następny poziom ▶',again:'↺ Jeszcze raz',levels:'⬅ Poziomy',prod:'Produkcja',cons:'Zużycie',
 lv:['Wieczór na wsi','Słońce','Wiatr','Zbiornik wodny','Samochody elektryczne','Fabryka','Burza','Idealny miks'],
 intro:['Robi się wieczór i ludzie zapalają światło. Naciśnij plus przy elektrowni węglowej, żeby słupki były równe: tyle prądu, ile zużywamy!','Panele słoneczne robią prąd ze światła słońca. Gdy słońca jest za mało, włącz elektrownię gazową.','Wiatraki robią prąd, gdy wieje wiatr. Wiatr się zmienia! Pomóż elektrownią gazową.','W południe słońce robi za dużo prądu. Pompuj wodę w górę do jeziora! Wieczorem pozwól jej spłynąć: turbina zrobi prąd.','Elektrownia atomowa działa cały czas, także w nocy. W nocy zużywamy mało, więc ładuj samochody elektryczne! Rano mają być pełne.','Fabryka potrzebuje dużo prądu, gdy pracuje. Włączaj elektrownie na czas: węglowa rusza powoli, gazowa szybko.','Nadchodzi burza! Gdy wiatr jest za silny, wiatraki się zatrzymują, żeby się nie zepsuć. Bądź gotowy!','Masz teraz wszystkie elektrownie. Zrób idealny miks: światło dla wszystkich i jak najmniej dymu!'],
 ev:{dinner:'Wszyscy gotują kolację! Potrzeba więcej prądu.',sleep:'Ludzie idą spać. Zużywamy mniej: zmniejsz elektrownię!',cloud:'Nadchodzi chmura! Panele słoneczne robią mniej prądu.',sunset:'Słońce zachodzi. Panele słoneczne już nie robią prądu!',windStop:'Wiatr ucichł! Wiatraki stoją.',windBack:'Znowu wieje wiatr!',noon:'Jest południe i słońce mocno świeci. Za dużo prądu? Pompuj wodę do jeziora!',evening:'Robi się wieczór. Pozwól wodzie z jeziora spłynąć i robić prąd!',morning:'Dzień dobry! Ludzie wstają i zapalają światło.',factoryOn:'Fabryka włącza maszyny! Potrzeba dużo prądu.',lunch:'Przerwa obiadowa w fabryce. Zużywa mniej.',factoryOff:'Fabryka się zatrzymała. Zmniejsz elektrownie.',storm:'Burza! Wiatraki się zatrzymały, żeby się nie zepsuć.',stormEnd:'Burza minęła. Wiatraki znowu się kręcą.',night:'Jest noc. Zużywamy mało, ale elektrownia atomowa dalej działa. Ładuj samochody!'},

uk:{title:'⚡ Електромережа',zone:['🏙️','Електромережа'],zoneSay:'Зроби струм для всього міста! Тримай виробництво рівним споживанню.',back:'⬅ Назад',next:'Наступний рівень ▶',again:'↺ Ще раз',levels:'⬅ Рівні',prod:'Виробляємо',cons:'Споживаємо',
 lv:['Вечір у селі','Сонце','Вітер','Водосховище','Електромобілі','Завод','Буря','Ідеальна суміш'],
 intro:['Настає вечір, і люди вмикають світло. Натисни плюс біля вугільної електростанції, щоб стовпчики були рівні: стільки струму, скільки споживаємо!','Сонячні панелі роблять струм із сонячного світла. Коли сонця замало, увімкни газову електростанцію.','Вітряки роблять струм, коли дме вітер. Вітер змінюється! Допоможи газовою електростанцією.','Опівдні сонце робить забагато струму. Качай воду вгору в озеро! Увечері відпусти її вниз: турбіна зробить струм.','Атомна електростанція працює весь час, навіть уночі. Уночі ми споживаємо мало, тож заряджай електромобілі! Зранку вони мають бути повні.','Заводу потрібно багато струму, коли він працює. Вмикай електростанції вчасно: вугільна запускається повільно, газова швидко.','Насувається буря! Коли вітер надто сильний, вітряки зупиняються, щоб не зламатися. Будь готовий!','Тепер у тебе всі електростанції. Зроби ідеальну суміш: світло для всіх і якомога менше диму!'],

 intro:['Наступает вечер, и люди включают свет. Нажми плюс у угольной электростанции, чтобы столбики были равны: столько тока, сколько мы тратим!','Солнечные панели делают ток из солнечного света. Когда солнца мало, включи газовую электростанцию.','Ветряки делают ток, когда дует ветер. Ветер меняется! Помоги газовой электростанцией.','В полдень солнце делает слишком много тока. Качай воду наверх в озеро! Вечером отпусти её вниз: турбина сделает ток.','Атомная электростанция работает всё время, даже ночью. Ночью мы тратим мало, так что заряжай электромобили! Утром они должны быть полными.','Заводу нужно много тока, когда он работает. Включай электростанции вовремя: угольная запускается медленно, газовая быстро.','Надвигается буря! Когда ветер слишком сильный, ветряки останавливаются, чтобы не сломаться. Будь готов!','Теперь у тебя все электростанции. Сделай идеальную смесь: свет для всех и как можно меньше дыма!'],

 intro:['Esteledik, és az emberek felkapcsolják a villanyt. Nyomd meg a pluszt a szénerőműnél, hogy a két oszlop egyforma legyen: annyi áramot csinálunk, amennyit használunk!','A napelemek a napfényből csinálnak áramot. Ha a nap nem elég, kapcsold be a gázerőművet.','A szélkerekek akkor csinálnak áramot, amikor fúj a szél. A szél változik! Segíts a gázerőművel.','Délben a nap túl sok áramot csinál. Pumpáld fel a vizet a tóba! Este engedd vissza: a turbina áramot csinál.','Az atomerőmű mindig működik, éjjel is. Éjjel keveset használunk, ezért töltsd az elektromos autókat! Reggelre tele kell lenniük.','A gyárnak sok áram kell, amikor dolgozik. Kapcsold be időben az erőműveket: a szén lassan indul, a gáz gyorsan.','Jön a vihar! Ha túl erős a szél, a szélkerekek megállnak, hogy ne törjenek el. Légy készen!','Most már minden erőműved megvan. Csináld meg a tökéletes keveréket: fény mindenkinek és minél kevesebb füst!'],

ro:{story:['Curentul se face în centrală și merge pe fire până la case. Fiecare bec are nevoie de un fulger. Apasă săgeata în sus ca să faci fulgere!','Soarele face curent cu panourile solare. Când soarele nu ajunge, pornește centrala pe gaz.','Morile de vânt fac curent când bate vântul. Dar vântul nu bate mereu!','Când avem curent în plus, urcăm apa în lac. Seara lăsăm apa să coboare și face curent. Lacul e ca o baterie!','Centrala atomică face mereu la fel de mult curent, și noaptea. Noaptea, curentul în plus încarcă mașinile electrice.','Fabrica are nevoie de mult curent. Folosește centrala atomică, cea pe cărbune și cea pe gaz.','Vine furtuna! Morile de vânt se opresc și nu e soare. Noroc că ai apă în lac!','Ai toate centralele! Fă curent pentru tot orașul cu cât mai puțin fum. Fumul murdărește aerul.'],

en:{story:['Power is made in the power plant and travels along wires to the houses. Every lamp needs one lightning bolt. Tap the up arrow to make lightning bolts!','The sun makes power with solar panels. When the sun is not enough, turn on the gas power plant.','Wind turbines make power when the wind blows. But the wind does not always blow!','When we have extra power, we pump water up into the lake. In the evening the water flows down and makes power. The lake is like a battery!','The nuclear power plant always makes the same amount of power, even at night. At night, the extra power charges the electric cars.','The factory needs lots of power. Use the nuclear, the coal and the gas power plants.','A storm is coming! The wind turbines stop and there is no sun. Luckily you have water in the lake!','You have all the power plants! Make power for the whole town with as little smoke as possible. Smoke makes the air dirty.'],

fr:{story:['L’électricité est fabriquée dans la centrale et voyage par les fils jusqu’aux maisons. Chaque lampe a besoin d’un éclair. Appuie sur la flèche vers le haut pour faire des éclairs !','Le soleil fait de l’électricité avec les panneaux solaires. Quand le soleil ne suffit pas, allume la centrale à gaz.','Les éoliennes font de l’électricité quand le vent souffle. Mais le vent ne souffle pas toujours !','Quand on a de l’électricité en trop, on monte l’eau dans le lac. Le soir, l’eau redescend et fait de l’électricité. Le lac est comme une pile !','La centrale nucléaire fait toujours autant d’électricité, même la nuit. La nuit, l’électricité en trop recharge les voitures électriques.','L’usine a besoin de beaucoup d’électricité. Utilise la centrale nucléaire, celle à charbon et celle à gaz.','Une tempête arrive ! Les éoliennes s’arrêtent et il n’y a pas de soleil. Heureusement, il y a de l’eau dans le lac !','Tu as toutes les centrales ! Fais de l’électricité pour toute la ville avec le moins de fumée possible. La fumée salit l’air.'],

es:{story:['La electricidad se hace en la central y viaja por los cables hasta las casas. Cada bombilla necesita un rayo. ¡Toca la flecha hacia arriba para hacer rayos!','El sol hace electricidad con los paneles solares. Cuando el sol no basta, enciende la central de gas.','Los molinos de viento hacen electricidad cuando sopla el viento. ¡Pero el viento no sopla siempre!','Cuando sobra electricidad, subimos el agua al lago. Por la tarde el agua baja y hace electricidad. ¡El lago es como una pila!','La central nuclear hace siempre la misma electricidad, también de noche. De noche, la electricidad que sobra carga los coches eléctricos.','La fábrica necesita mucha electricidad. Usa la central nuclear, la de carbón y la de gas.','¡Viene una tormenta! Los molinos se paran y no hay sol. ¡Menos mal que hay agua en el lago!','¡Tienes todas las centrales! Haz electricidad para toda la ciudad con el menor humo posible. El humo ensucia el aire.'],

it:{story:['La corrente si fa nella centrale e viaggia sui fili fino alle case. Ogni lampadina ha bisogno di un fulmine. Tocca la freccia in su per fare fulmini!','Il sole fa corrente con i pannelli solari. Quando il sole non basta, accendi la centrale a gas.','Le pale eoliche fanno corrente quando soffia il vento. Ma il vento non soffia sempre!','Quando c’è corrente in più, portiamo l’acqua su nel lago. La sera l’acqua scende e fa corrente. Il lago è come una pila!','La centrale nucleare fa sempre la stessa corrente, anche di notte. Di notte, la corrente in più ricarica le auto elettriche.','La fabbrica ha bisogno di tanta corrente. Usa la centrale nucleare, quella a carbone e quella a gas.','Arriva la tempesta! Le pale si fermano e non c’è sole. Per fortuna c’è acqua nel lago!','Hai tutte le centrali! Fai corrente per tutta la città con meno fumo possibile. Il fumo sporca l’aria.'],

pt:{story:['A energia é feita na usina e viaja pelos fios até as casas. Cada lâmpada precisa de um raio. Toque na seta para cima para fazer raios!','O sol faz energia com os painéis solares. Quando o sol não basta, ligue a usina a gás.','As turbinas eólicas fazem energia quando o vento sopra. Mas o vento não sopra sempre!','Quando sobra energia, subimos a água para o lago. À noite a água desce e faz energia. O lago é como uma pilha!','A usina nuclear faz sempre a mesma energia, até de noite. De noite, a energia que sobra carrega os carros elétricos.','A fábrica precisa de muita energia. Use a usina nuclear, a de carvão e a de gás.','Vem aí uma tempestade! As turbinas param e não tem sol. Ainda bem que tem água no lago!','Você tem todas as usinas! Faça energia para a cidade toda com o mínimo de fumaça. A fumaça suja o ar.'],

nl:{story:['Stroom wordt gemaakt in de centrale en gaat door draden naar de huizen. Elke lamp heeft één bliksem nodig. Tik op de pijl omhoog om bliksems te maken!','De zon maakt stroom met zonnepanelen. Is de zon niet genoeg, zet dan de gascentrale aan.','Windmolens maken stroom als het waait. Maar het waait niet altijd!','Hebben we stroom over, dan pompen we water omhoog in het meer. ’s Avonds stroomt het omlaag en maakt stroom. Het meer is net een batterij!','De kerncentrale maakt altijd evenveel stroom, ook ’s nachts. ’s Nachts laadt de extra stroom de elektrische auto’s op.','De fabriek heeft veel stroom nodig. Gebruik de kerncentrale, de kolencentrale en de gascentrale.','Er komt een storm! De windmolens stoppen en er is geen zon. Gelukkig zit er water in het meer!','Je hebt alle centrales! Maak stroom voor de hele stad met zo weinig mogelijk rook. Rook maakt de lucht vies.'],

pl:{story:['Prąd robi się w elektrowni i płynie kablami do domów. Każda lampa potrzebuje jednego pioruna. Naciśnij strzałkę w górę, żeby robić pioruny!','Słońce robi prąd panelami słonecznymi. Gdy słońca jest za mało, włącz elektrownię gazową.','Wiatraki robią prąd, gdy wieje wiatr. Ale wiatr nie wieje zawsze!','Gdy mamy za dużo prądu, pompujemy wodę do jeziora. Wieczorem woda spływa i robi prąd. Jezioro jest jak bateria!','Elektrownia atomowa robi zawsze tyle samo prądu, także w nocy. W nocy nadmiar prądu ładuje samochody elektryczne.','Fabryka potrzebuje dużo prądu. Użyj elektrowni atomowej, węglowej i gazowej.','Nadchodzi burza! Wiatraki stają i nie ma słońca. Na szczęście w jeziorze jest woda!','Masz wszystkie elektrownie! Zrób prąd dla całego miasta z jak najmniejszym dymem. Dym brudzi powietrze.'],

uk:{story:['Струм роблять на електростанції, і він біжить дротами до будинків. Кожній лампочці потрібна одна блискавка. Натисни стрілку вгору, щоб робити блискавки!','Сонце робить струм сонячними панелями. Коли сонця замало, увімкни газову електростанцію.','Вітряки роблять струм, коли дме вітер. Але вітер дме не завжди!','Коли струму забагато, ми качаємо воду вгору в озеро. Увечері вода стікає вниз і робить струм. Озеро — як батарейка!','Атомна електростанція завжди робить однаково струму, навіть уночі. Уночі зайвий струм заряджає електромобілі.','Заводу потрібно багато струму. Використовуй атомну, вугільну і газову електростанції.','Насувається буря! Вітряки зупиняються, і сонця немає. Добре, що в озері є вода!','У тебе всі електростанції! Зроби струм для всього міста з якомога меншим димом. Дим забруднює повітря.'],

ru:{story:['Ток делают на электростанции, и он бежит по проводам к домам. Каждой лампочке нужна одна молния. Нажми стрелку вверх, чтобы делать молнии!','Солнце делает ток солнечными панелями. Когда солнца мало, включи газовую электростанцию.','Ветряки делают ток, когда дует ветер. Но ветер дует не всегда!','Когда тока слишком много, мы качаем воду наверх в озеро. Вечером вода стекает вниз и делает ток. Озеро как батарейка!','Атомная электростанция всегда делает одинаково тока, даже ночью. Ночью лишний ток заряжает электромобили.','Заводу нужно много тока. Используй атомную, угольную и газовую электростанции.','Надвигается буря! Ветряки останавливаются, и солнца нет. Хорошо, что в озере есть вода!','У тебя все электростанции! Сделай ток для всего города с как можно меньшим дымом. Дым пачкает воздух.'],

hu:{story:['Az áramot az erőműben csinálják, és vezetékeken megy a házakig. Minden lámpának egy villám kell. Nyomd meg a felfelé nyilat, hogy villámokat csinálj!','A nap napelemekkel csinál áramot. Ha a nap nem elég, kapcsold be a gázerőművet.','A szélkerekek akkor csinálnak áramot, amikor fúj a szél. De a szél nem fúj mindig!','Ha túl sok az áram, felpumpáljuk a vizet a tóba. Este a víz lefolyik és áramot csinál. A tó olyan, mint egy elem!','Az atomerőmű mindig ugyanannyi áramot csinál, éjjel is. Éjjel a fölösleges áram tölti az elektromos autókat.','A gyárnak sok áram kell. Használd az atom-, a szén- és a gázerőművet.','Jön a vihar! A szélkerekek megállnak, és nincs nap. Szerencsére van víz a tóban!','Minden erőműved megvan! Csinálj áramot az egész városnak minél kevesebb füsttel. A füst bepiszkítja a levegőt.'],

/* ---------------- calcul ---------------- */
const curM=()=>G.L.mo[Math.min(G.mi,G.L.mo.length-1)];
function outOf(k){ const m=curM(); if(k==='nuc') return G.L.nuc||0; if(k==='solar') return m.sun||0; if(k==='wind') return m.wind||0; if(k==='hydro') return Math.max(0,G.hy); return G.lv[k]||0; }
function made(){ return G.L.pl.reduce((s,k)=>s+outOf(k),0); }
function usedParts(){ const m=curM(); return {bulbs:m.need,pump:Math.max(0,-G.hy),cars:G.cars.filter(c=>c.on).length}; }
function used(){ const u=usedParts(); return u.bulbs+u.pump+u.cars; }

function play(li){ stop(); const L=LV[li]; const my=gen;
  G={li,L,mi:0,lv:{coal:0,gas:0},hy:0,lake:L.lake||0,cars:[...Array(L.cars||0)].map(()=>({c:0,on:false})),smoke:0,lock:true,idle:0,hintEl:null,said:''};
  main.innerHTML='';
  const h=el('div','gr-head'); const face=el('div','gr-face','🤖'); const bub=el('div','gr-bub'); const rep=el('button','gr-rep','🔊'); const help=el('button','gr-rep gr-help','❓'); const tl=el('div','gr-tl'); const tipEl=el('div','gr-tip'); h.append(face,bub,rep,help); main.append(h,tl,tipEl);
  const eq=el('div','gr-eq'); main.append(eq);
  const stg=el('div','gr-stage'); main.append(stg); const pan=el('div','gr-panel'); main.append(pan);
  Object.assign(G,{bub,tl,eq,stg,pan,tipEl,helpB:help}); help.onclick=()=>askHelp(); const again=()=>{ G.idle=Math.min(G.idle,0); sp(G.momT||bub.textContent.replace(/^[^\p{L}]+/u,'')); }; bub.onclick=again; rep.onclick=again; face.onclick=()=>{ sp(X().f.scale); };
  scene(); panel(); timeline(); equation();
  /* povestea nivelului: o carte mare, cu ▶ */
  const card=el('div','gr-story',`<div class="pics">${L.ic} ${L.pl.map(k=>PL[k].ic).join(' ')}${L.cars?' 🚗':''}${L.factory?' 🏭':''}</div><div class="tx">${X().story[li]}</div>`);
  const go=el('button','rb-b go big',X().go); card.append(go); stg.append(card); msg('📖 '+X().story[li]); G.momT=X().story[li]; sp(X().story[li]);
  go.onclick=()=>{ card.remove(); snd(660,.1); startMoment(); };
  if(!G.tick){ const loop=()=>{ if(gen!==my||!G) return; G.idle+=.5; if(!G.lock&&G.idle>=(window.__grFast?1:20)&&G.helpB) G.helpB.classList.add('gr-pulse'); later(loop,500); }; later(loop,500); } }

function explain(){ const L=G.L, m=curM(), x=X(); const parts=[];
  if(L.pl.includes('nuc')&&G.mi===0) parts.push(x.nucN(L.nuc));
  if(L.pl.includes('solar')) parts.push(m.sun?x.sunN(m.sun):x.noSun);
  if(L.pl.includes('wind')) parts.push(m.wind?x.windN(m.wind):x.noWind);
  const nat=(m.sun||0)+(m.wind||0)+(L.nuc||0), step=(G.lv.coal||0)+(G.lv.gas||0), P=made(), U=used();
  const store=L.pl.includes('hydro')||G.cars.length;
  if(nat>=m.need&&step>0) parts.push(x.enough);
  else if(P<U) parts.push(!L.pl.some(k=>PL[k].ctl==='step')&&L.pl.includes('hydro')?x.restLake(U-P):x.rest(U-P));
  else if(P>U){ if(!store) parts.push(x.lessPl(P-U)); else { const both=L.pl.includes('hydro')&&G.cars.length; const e=x.extra(P-U); parts.push(both?e:e.split('. ')[0]+'. '+SUF[(typeof lang!=='undefined'&&SUF[lang])?lang:'en'][L.pl.includes('hydro')?0:1]); } }
  else parts.push(x.exact);
  return parts.join(' '); }
function startMoment(){ const m=G.L.mo[G.mi]; G.idle=0; G.help=0; if(G.helpB) G.helpB.classList.remove('gr-pulse'); clearHint(); timeline(); scene(); panel(); equation();
  const t=`${X().mom[m.m]}. ${X().ev2[m.e]} ${why()}${X().goal}`; msg(MIC[m.m]+' '+t); G.momT=t; tip(''); G.lock=true; snd(880,.1); later(()=>snd(1100,.12),130);
  sp(t).then(()=>{ if(G){ G.lock=false; G.idle=0; check(true); } }); later(()=>{ if(G&&G.lock&&!G.waitNext){ G.lock=false; } },20000); }

function changed(){ if(!G) return; G.idle=0; G.help=0; if(G.helpB) G.helpB.classList.remove('gr-pulse'); clearHint(); scene(); panel(); equation(); clearTimeout(G.fbT); G.fbT=setTimeout(()=>check(false),1200); }
function check(quiet){ if(!G||G.lock) return; const P=made(), U=used();
  if(P===U){ G.lock=true; G.waitNext=true; clearHint(); G.eq.classList.add('ok'); [523,659,784].forEach((f,i)=>later(()=>snd(f,.15),i*110));
    tip('✅ '+X().ok,G.mi<G.L.mo.length-1?'▶':'🏁',()=>{ G.waitNext=false; tip(''); snd(660,.08); next(); }); sp(X().ok); return; }
  if(quiet) return; tip(''); }
function next(){ if(!G) return; const L=G.L; G.eq.classList.remove('ok');
  /* se aplică momentul: lacul, mașinile, fumul */
  G.lake=Math.max(0,Math.min(CAP,G.lake-G.hy)); G.cars.forEach(c=>{ if(c.on) c.c=Math.min(CARCAP,c.c+1); if(c.c>=CARCAP) c.on=false; });
  G.smoke+=G.lv.coal*PL.coal.smoke+G.lv.gas*PL.gas.smoke; G.hy=0;
  G.mi++; if(G.mi>=L.mo.length) return finish(); startMoment(); }

/* ---------------- mânuța care arată ce să apeși ---------------- */
function clearHint(){ if(G&&G.hintEl){ G.hintEl.classList.remove('gr-hint'); G.hintEl=null; } }
function hint(){ if(!G) return; const P=made(), U=used(); if(P===U) return; const q=s=>G.pan.querySelector(s); let b=null, t='';
  if(U>P){ /* lipsesc fulgere */
    const car=G.cars.findIndex(c=>c.on); if(car>=0){ b=q(`[data-car="${car}"]`); t=X().carTip; }
    else if(G.hy<0){ b=q('[data-hy="dn"]'); t=X().hintDown; }
    else if(G.L.pl.includes('hydro')&&G.lake>G.hy){ b=q('[data-hy="dn"]'); t=X().genTip; }
    else { const k=['gas','coal'].find(k=>G.L.pl.includes(k)&&G.lv[k]<(G.L.cap&&G.L.cap[k]||PL[k].max)); if(k){ b=q(`[data-k="${k}"][data-d="up"]`); t=X().hintUp; } } }
  else { /* fulgere în plus */
    const k=['coal','gas'].find(k=>G.L.pl.includes(k)&&G.lv[k]>0);
    if(G.hy>0){ b=q('[data-hy="up"]'); t=X().hintUp; }
    else if(k){ b=q(`[data-k="${k}"][data-d="dn"]`); t=X().hintDown; }
    else { const car=G.cars.findIndex(c=>!c.on&&c.c<CARCAP); if(car>=0){ b=q(`[data-car="${car}"]`); t=X().carTip; } else if(G.L.pl.includes('hydro')&&G.lake-G.hy<CAP){ b=q('[data-hy="up"]'); t=X().pumpTip; } } }
  if(b){ G.hintEl=b; b.classList.add('gr-hint'); tip('👆 '+t); sp(t); } }

/* ---------------- linia de timp și „ecuația” ---------------- */
function timeline(){ const L=G.L; G.tl.innerHTML=L.mo.map((m,i)=>`<span class="${i<G.mi?'done':i===G.mi?'cur':''}">${i<G.mi?'✔️':MIC[m.m]}</span>`).join('<i></i>'); }
function equation(){ const P=made(), u=usedParts(), U=u.bulbs+u.pump+u.cars; const n=Math.max(P,U,1);
  let r1='', r2=''; for(let i=0;i<n;i++){ r1+=i<P?`<b class="${i>=U?'over':''}">⚡</b>`:`<b class="miss"></b>`; }
  const ap=APPL[curM().e]||['💡']; const items=[...Array(u.bulbs)].map((_,i)=>ap[i%ap.length]).concat([...Array(u.pump)].map(()=>'💧'),[...Array(u.cars)].map(()=>'🔋'));
  for(let i=0;i<n;i++) r2+=i<U?`<b>${items[i]}</b>`:`<b class="miss"></b>`;
  G.eq.innerHTML=`<div class="row"><span class="lb">⚡ <span class="t">${X().makes}</span></span><div class="cells">${r1}</div><span class="num">${P}</span></div><div class="row"><span class="lb">💡 <span class="t">${X().uses}</span></span><div class="cells">${r2}</div><span class="num">${U}</span></div><div class="mood">${P===U?'😊':P<U?'😟':'😵'}</div>`;
  G.eq.onclick=()=>sp(X().f.scale); }

/* ---------------- scena ---------------- */
const SKY={morning:['#FFB88C','#FFE7C7'],noon:['#6EC6FF','#D6F0FF'],afternoon:['#8FD0FF','#E6F6FF'],evening:['#7B5EA7','#FF9E7A'],night:['#141E3C','#2C3E70'],late:['#0B1228','#1D2A52']};
const SUNP={morning:[120,170],noon:[300,60],afternoon:[480,110],evening:[600,190],night:null,late:null};
function scene(){ const L=G.L, m=curM(), n=L.pl.length, por=innerWidth<innerHeight*.9; G.por=por; const big=L.factory||G.cars.length;
  const W=por?560:900, H=por?(big?620:540):(big?400:350); const gy=por?250:250; const pw=Math.min(150,(por?540:520)/n);
  const town=por?{hx:[70,165,260,355,450],hy:420,fx:280,fy:540,cx:60,cy:540,sc:1.35}:{hx:[592,660,728,796,864],hy:gy,fx:705,fy:350,cx:470,cy:350,sc:1.25};
  const night=m.m==='night'||m.m==='late'; const sk=SKY[m.m]; let s=`<svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="gr-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sk[0]}"/><stop offset="1" stop-color="${sk[1]}"/></linearGradient></defs>
  <rect width="${W}" height="${H}" rx="22" fill="url(#gr-sky)"/>`;
  if(night) s+=[...Array(16)].map((_,i)=>`<circle cx="${(i*137)%(W-20)+10}" cy="${(i*53)%120+12}" r="2" fill="#fff"/>`).join('')+`<g transform="translate(${W-120} 60)"><circle r="22" fill="#F4F1DE"/><circle cx="9" cy="-6" r="19" fill="${sk[0]}"/></g>`;
  else { const sp0=SUNP[m.m]; s+=`<circle cx="${sp0[0]*(W/900)}" cy="${sp0[1]}" r="28" fill="#FFD23F"/>`; if(m.e==='cloudy'||m.e==='storm') s+=`<text x="${sp0[0]*(W/900)-10}" y="${sp0[1]+22}" font-size="64">${m.e==='storm'?'⛈️':'☁️'}</text>`; }
  s+=`<rect y="${gy}" width="${W}" height="${H-gy}" fill="${night?'#3E6B4A':'#7BC47F'}"/><rect y="${gy-8}" width="${W}" height="10" fill="${night?'#355C40':'#5FAF66'}"/>`;
  if(por) s+=`<rect y="${town.hy-8}" width="${W}" height="10" fill="${night?'#355C40':'#5FAF66'}"/>`;
  /* fire: de la centrale la oraș, cu fulgere care curg */
  const P=made(), U=used(); const line=por?`M30 ${gy-60} L${W-30} ${gy-60} L${W-30} ${town.hy-70}`:`M30 ${gy-60} L${W-20} ${gy-60}`;
  s+=`<path d="${line}" stroke="#24325F" stroke-width="4" fill="none"/>`+(P>0?`<path class="gr-flowa" d="${line}" stroke="${P>U?'#FF5D3A':'#FFE45C'}" stroke-width="5" stroke-dasharray="10 18" fill="none" style="animation-duration:${Math.max(.4,2.2-P*.2)}s"/>`:'');
  L.pl.forEach((k,i)=>{ const cx=20+pw*i+pw/2; const o=outOf(k); s+=`<g class="gr-pl" data-k="${k}" style="cursor:pointer" transform="translate(${cx} ${gy})">${plantSVG(k,o)}`;
    for(let j=0;j<o;j++){ const col=j%3, row=Math.floor(j/3); s+=`<text class="gr-tok" x="${-24+col*24}" y="${-150-row*26}" font-size="24" text-anchor="middle" style="animation-delay:${(j*.12).toFixed(2)}s">⚡</text>`; }
    s+=`</g>`; });
  /* case: ferestre aprinse cât au fulgere */
  /* aparatele din case: fiecare fulger pornește un aparat (☕ 🍞 📺 ❄️ …); fără fulger rămâne stins */
  const lit=Math.min(m.need,Math.max(0,P-(U-m.need))); const ap=APPL[m.e]||['💡']; const all=[...Array(m.need)].map((_,i)=>({ic:ap[i%ap.length],on:i<lit}));
  const home=all.filter(a=>a.ic!=='🏭'), fac=all.filter(a=>a.ic==='🏭'); const box=[[],[],[],[],[]]; home.forEach((a,i)=>box[i%5].push(a));
  town.hx.forEach((x,i)=>{ const its=box[i]; const anyOn=its.some(a=>a.on);
    const inside=its.map((a,j)=>`<g transform="translate(${its.length>1?(j?11:-11):0} -26)"><rect x="-11" y="-11" width="22" height="22" rx="4" fill="${a.on?'#FFE45C':'#7C8798'}"/><text y="7" font-size="16" text-anchor="middle" opacity="${a.on?1:.35}">${a.ic}</text></g>`).join('');
    s+=`<g class="gr-cn" data-k="houses" style="cursor:pointer" transform="translate(${x} ${town.hy}) scale(${town.sc})"><rect x="-26" y="-52" width="52" height="52" fill="${['#FFB4A2','#B5E3D8','#FFE5A8','#C8D4FF','#F9C5E8'][i]}" stroke="#24325F" stroke-width="2.5"/><path d="M-32 -50 L0 -76 L32 -50 Z" fill="#E4572E" stroke="#24325F" stroke-width="2.5"/>${inside||`<rect x="-8" y="-36" width="16" height="14" fill="${night?'#3B4A7A':'#BFD9F2'}"/>`}<rect x="-5" y="-12" width="10" height="12" fill="#7A4E2D"/>${anyOn&&night?'<circle r="40" cy="-26" fill="#FFE45C" opacity=".12"/>':''}</g>`; });
  G.facOn=fac.length?fac.filter(a=>a.on).length/fac.length:0;
  if(L.factory){ const on=G.facOn>0; s+=`<g class="gr-cn" data-k="factory" style="cursor:pointer" transform="translate(${town.fx} ${town.fy})"><rect x="-70" y="-50" width="140" height="50" fill="#9AA5B8" stroke="#24325F" stroke-width="2.5"/><path d="M-70 -50 L-45 -68 L-45 -50 L-20 -68 L-20 -50 L5 -68 L5 -50 Z" fill="#7D8799" stroke="#24325F" stroke-width="2"/><rect x="40" y="-90" width="14" height="40" fill="#7D8799"/><text x="-10" y="-14" font-size="30" text-anchor="middle" class="${on?'gr-spin':''}" opacity="${on?1:.4}">⚙️</text>${[...Array(5)].map((_,j)=>`<rect x="${-62+j*20}" y="-44" width="14" height="10" fill="${j<Math.round(G.facOn*5)?'#FFE45C':'#5B6578'}"/>`).join('')}<text x="30" y="-14" font-size="24">🏭</text></g>`; }
  G.cars.forEach((c,i)=>{ const x=town.cx+i*80; s+=`<g class="gr-car" data-i="${i}" style="cursor:pointer" transform="translate(${x} ${town.cy})"><rect x="-6" y="-58" width="12" height="40" rx="4" fill="${c.on?'#2FB06A':'#9AA5B8'}" stroke="#24325F" stroke-width="2"/><text x="0" y="-26" font-size="14" text-anchor="middle">🔌</text><text x="22" y="-2" font-size="42" text-anchor="middle">🚙</text>${[0,1].map(j=>`<rect x="${4+j*22}" y="6" width="20" height="12" rx="4" fill="${j<c.c?'#2FB06A':'#fff'}" stroke="#24325F" stroke-width="2"/>`).join('')}${c.on?`<path d="M0 -18 Q0 -4 12 -10" stroke="#24325F" stroke-width="3" fill="none"/><text x="34" y="-40" font-size="20" class="gr-tok">⚡</text>`:''}</g>`; });
  s+=`</svg>`; G.stg.querySelectorAll('svg').forEach(x=>x.remove()); G.stg.insertAdjacentHTML('afterbegin',s); const svg=G.stg.querySelector('svg'); G.svg=svg;
  svg.querySelectorAll('.gr-pl').forEach(g=>g.onclick=()=>{ const k=g.dataset.k; sp(X().f[k]); tip(PL[k].ic+' '+X().f[k]); });
  svg.querySelectorAll('.gr-cn').forEach(g=>g.onclick=()=>{ const k=g.dataset.k; sp(X().f[k]); tip(X().f[k]); });
  svg.querySelectorAll('.gr-car').forEach(g=>g.onclick=()=>toggleCar(+g.dataset.i)); }

function plantSVG(k,o){ switch(k){
  case 'coal': return `<rect x="-38" y="-48" width="62" height="48" fill="#8B8F99" stroke="#24325F" stroke-width="2.5"/><rect x="14" y="-104" width="16" height="60" fill="#6E7380" stroke="#24325F" stroke-width="2"/><rect x="-30" y="-36" width="12" height="12" fill="${o?'#FFE07A':'#556'}"/><rect x="-10" y="-36" width="12" height="12" fill="${o?'#FFE07A':'#556'}"/><text x="-12" y="-6" font-size="18">🪨</text>${o?[0,1,2].map(i=>`<circle class="gr-puff" cx="${22+i*4}" cy="-110" r="${6+o*2}" fill="#555" style="animation-delay:${i*.8}s"/>`).join(''):''}`;
  case 'gas': return `<rect x="-34" y="-40" width="56" height="40" fill="#B9C3D6" stroke="#24325F" stroke-width="2.5"/><rect x="8" y="-74" width="12" height="36" fill="#9AA5B8" stroke="#24325F" stroke-width="2"/><ellipse cx="-12" cy="-52" rx="16" ry="10" fill="#E8EDF5" stroke="#24325F" stroke-width="2"/><text x="-12" y="-12" font-size="${o?18+o*3:16}" text-anchor="middle" opacity="${o?1:.25}">🔥</text>${o?[0,1].map(i=>`<circle class="gr-puff" cx="${14+i*3}" cy="-80" r="${4+o}" fill="#999" style="animation-delay:${i*1.1}s"/>`).join(''):''}`;
  case 'nuc': return `<path d="M-40 0 Q-24 -50 -32 -96 L32 -96 Q24 -50 40 0 Z" fill="#DDE3EA" stroke="#24325F" stroke-width="2.5"/><text x="0" y="-30" font-size="26" text-anchor="middle">⚛️</text>${[0,1,2].map(i=>`<circle class="gr-puff" cx="${-10+i*10}" cy="-104" r="12" fill="#fff" style="animation-delay:${i*.7}s"/>`).join('')}`;
  case 'solar': return [-36,0,36].map(x=>`<g transform="translate(${x} -16)"><path d="M-16 -22 L16 -22 L20 6 L-20 6 Z" fill="${o?'#3C6FD8':'#2B3A66'}" stroke="#24325F" stroke-width="2"/><path d="M-18 -8 L18 -8 M0 -22 L0 6" stroke="#9DB7FF" stroke-width="1.5"/><line x1="0" y1="6" x2="0" y2="16" stroke="#24325F" stroke-width="3"/></g>`).join('');
  case 'wind': return [-30,30].map((x,i)=>`<g transform="translate(${x} 0)"><line x1="0" y1="0" x2="0" y2="-${96-i*14}" stroke="#E9EEF5" stroke-width="7"/><g transform="translate(0 -${96-i*14})"><g class="${o?'gr-spin':''}" style="animation-duration:${o?Math.max(.5,3-o*.6):0}s">${[0,120,240].map(a=>`<path d="M0 0 L-5 -44 Q0 -50 5 -44 Z" fill="#fff" stroke="#24325F" stroke-width="1.5" transform="rotate(${a})"/>`).join('')}<circle r="5" fill="#24325F"/></g></g></g>`).join('');
  case 'hydro': { const lk=G.lake; return `<path d="M-70 0 L-20 -120 L40 -120 L70 0 Z" fill="#8E7E6E" stroke="#5B4636" stroke-width="2"/><rect x="-28" y="-146" width="70" height="30" rx="8" fill="#5B4636"/>${[...Array(CAP)].map((_,i)=>`<text x="${-20+i*11}" y="-124" font-size="12" opacity="${i<lk?1:.2}">💧</text>`).join('')}<path d="M10 -116 Q0 -60 -40 -14" stroke="#5DB7F0" stroke-width="8" fill="none"/>${G.hy?`<path class="gr-flowa${G.hy<0?' rev':''}" d="M10 -116 Q0 -60 -40 -14" stroke="#fff" stroke-width="3" stroke-dasharray="6 10" fill="none"/>`:''}<rect x="-62" y="-22" width="36" height="22" fill="#B9C3D6" stroke="#24325F" stroke-width="2"/><text x="-44" y="-5" font-size="14" text-anchor="middle" class="${G.hy?'gr-spin':''}">⚙️</text>`; }
  } return ''; }

/* ---------------- panoul cu săgeți mari ---------------- */
function panel(){ if(!G) return; const pan=G.pan; pan.innerHTML=''; const L=G.L;
  L.pl.forEach(k=>{ const p=PL[k]; const c=el('div','gr-pc'); const o=outOf(k); const ic=el('span','ic',p.ic); ic.onclick=()=>{ sp(X().f[k]); tip(p.ic+' '+X().f[k]); }; c.append(ic);
    if(k==='hydro'){ const up=el('button','',`⬆️`), dn=el('button','',`⬇️`); up.dataset.hy='up'; dn.dataset.hy='dn';
      up.onclick=()=>{ if(G.lock) return; if(G.lake-G.hy>=CAP){ snd(200,.1,'square',.05); return; } G.hy--; snd(600,.08); changed(); };
      dn.onclick=()=>{ if(G.lock) return; if(G.hy>=G.lake){ snd(200,.1,'square',.05); return; } G.hy++; snd(800,.08); changed(); };
      c.append(el('span','cnt',`<span>💧${G.lake}</span><span>${G.hy<0?'⬆️'+(-G.hy):G.hy>0?'⚡'+G.hy:'·'}</span>`),up,dn); }
    else { c.append(el('span','cnt',`<span>⚡${o}</span>`));
      if(p.ctl==='step'){ const mx=L.cap&&L.cap[k]||p.max; const up=el('button','','▲'), dn=el('button','','▼'); up.dataset.k=k; up.dataset.d='up'; dn.dataset.k=k; dn.dataset.d='dn';
        up.onclick=()=>{ if(G.lock) return; if(G.lv[k]>=mx){ snd(200,.1,'square',.05); return; } G.lv[k]++; snd(760,.06,'square',.06); changed(); };
        dn.onclick=()=>{ if(G.lock) return; if(G.lv[k]<=0){ snd(200,.1,'square',.05); return; } G.lv[k]--; snd(500,.06,'square',.06); changed(); }; c.append(up,dn); }
      else if(p.ctl==='fixed') c.append(el('span','lock','🔒'));
      else c.append(el('span','lock',k==='solar'?'🌤️':'🍃')); }
    pan.append(c); });
  if(G.cars.length){ const c=el('div','gr-pc'); const ic=el('span','ic','🔌'); ic.onclick=()=>{ sp(X().f.ev); tip(X().f.ev); }; c.append(ic);
    G.cars.forEach((car,i)=>{ const b=el('button',car.on?'sel':'',`🚙<small>${'▮'.repeat(car.c)}${'▯'.repeat(CARCAP-car.c)}</small>`); b.dataset.car=i; b.style.width='64px'; b.onclick=()=>toggleCar(i); c.append(b); }); pan.append(c); } }
function toggleCar(i){ if(!G||G.lock) return; const c=G.cars[i]; if(!c.on&&c.c>=CARCAP){ tip('🔋 '+X().carFull); sp(X().carFull); return; } c.on=!c.on; snd(c.on?900:450,.1); changed(); }

function finish(){ const L=G.L, li=G.li; let s=3; const extra=[]; G.lock=true; timeline();
  if(L.smoke){ const n=Math.round(G.smoke); s=n<=4?3:n<=8?2:1; extra.push(X().smokeN(n)); if(s<3) extra.push(X().smoke); }
  const p=prog(); p[li]=Math.max(p[li]||0,s); LS.set('grid_prog',p); award(s); try{ window.__lvDone&&window.__lvDone(1); }catch(e){} try{ confetti(24); }catch(e){}
  const t=X().done[s]+(extra.length?' '+extra.join(' '):''); msg('🎉 '+t); G.momT=t; tip('');
  const r=el('div','gr-res',`<div class="st">${'★'.repeat(s)}${'☆'.repeat(3-s)}</div>`); const row=el('div','row');
  if(li<LV.length-1){ const n=el('button','rb-b go',X().next); n.onclick=()=>play(li+1); row.append(n); }
  const a=el('button','rb-b',X().again); a.onclick=()=>play(li); const b=el('button','rb-b',X().levels); b.onclick=()=>levels(); row.append(a,b); r.append(row); main.append(r);
  sp(t); }

addEventListener('resize',()=>{ if(G&&G.svg&&(innerWidth<innerHeight*.9)!==G.por) scene(); });

/* limba se schimbă: refă textele */
window.addEventListener('pufi:lang',()=>{ if(!root.hidden){ $('title').textContent=X().title; $('back').textContent=X().back; if(!G) levels(); } });
})();
</script>
