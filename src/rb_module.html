 {m:["R....B"],max:1,loop:1,ic:'🔁'},{m:["R....","....B"],max:2,loop:1,ic:'🔂'},{m:["R.....","#####.","B....."],max:3,loop:1,ic:'🐍'},
 {m:["R.#*.",".##..","..#.#","#...B"],max:8,loop:1,ic:'🧩'},{m:["..*....",".#####.",".#B..#.",".#.#.#.","R..#..*"],max:7,loop:1,ic:'🏆'}];
const DIRS={U:[-1,0,'⬆'],D:[1,0,'⬇'],L:[0,-1,'⬅'],R:[0,1,'➡']};
function parseMap(m){ let start,goal; const st=new Set();
  const grid=m.map((row,r)=>[...row].map((ch,c)=>{ if(ch==='R'){ start={r,c}; return '.'; } if(ch==='B'){ goal={r,c}; return 'B'; } if(ch==='*'){ st.add(r+','+c); return '.'; } return ch; }));
  return {grid,start,goal,st,rows:m.length,cols:m[0].length}; }
function bfs(P){ const q=[[P.start.r,P.start.c]], prev={}, seen=new Set([P.start.r+','+P.start.c]);
  while(q.length){ const [r,c]=q.shift(); if(r===P.goal.r&&c===P.goal.c) break;
    for(const k in DIRS){ const nr=r+DIRS[k][0], nc=c+DIRS[k][1], key=nr+','+nc; if(nr<0||nc<0||nr>=P.rows||nc>=P.cols||seen.has(key)) continue; const t=P.grid[nr][nc]; if(t==='#'||t==='~') continue; seen.add(key); prev[key]=[r,c]; q.push([nr,nc]); } }
  const path=[]; let k=P.goal.r+','+P.goal.c; if(!prev[k]) return null; while(k!==P.start.r+','+P.start.c){ const [r,c]=k.split(',').map(Number); path.unshift([r,c]); const p=prev[k]; k=p[0]+','+p[1]; } return path; }

  const F=frame(L.loop&&L.max?X().loopIntro:P.st.size?X().starIntro:X().progIntro);
  const W=P.cols*100, H=P.rows*100;
  let s=`<svg viewBox="-6 -6 ${W+12} ${H+12}" preserveAspectRatio="xMidYMid meet"><rect x="-6" y="-6" width="${W+12}" height="${H+12}" rx="20" fill="#9BD58A"/>`;
  P.grid.forEach((row,r)=>row.forEach((t,c)=>{ const x=c*100,y=r*100;
    s+=`<rect x="${x+3}" y="${y+3}" width="94" height="94" rx="14" fill="${t==='~'?'#6EC1FF':((r+c)%2?'#D9F3CF':'#C7ECBA')}"/>`;
    if(t==='~') s+=`<text x="${x+50}" y="${y+64}" font-size="40" text-anchor="middle">🌊</text>`;
    if(t==='#') s+=`<text x="${x+50}" y="${y+70}" font-size="62" text-anchor="middle">🪨</text>`;

    if(P.st.has(r+','+c)) s+=`<text class="rb-star" data-k="${r},${c}" x="${x+50}" y="${y+68}" font-size="50" text-anchor="middle">⭐</text>`;
  }));

  F.stage.innerHTML=s; const svg=F.stage.firstChild, bot=svg.querySelector('#rb-pb'), fc=svg.querySelector('.rb-fc'), fx=svg.querySelector('#rb-fx');
  const place=(p,instant)=>{ if(instant) bot.style.transition='none'; bot.style.transform=`translate(${p.c*100+50}px,${p.r*100+58}px) scale(.56)`; if(instant){ void bot.getBoundingClientRect(); bot.style.transition=''; } };

  const strip=el('div','rb-strip');
  const ANG={R:0,D:90,L:180,U:270};
  function plan(){ const g=svg.querySelector('#rb-plan'); if(!g) return; let out='', pos={...P.start}; const vis={}; let stop=false;
    const arrow=(x,y,d,bad)=>`<g transform="translate(${x} ${y}) rotate(${ANG[d]})"><circle r="27" fill="${bad?'#FFD0D8':'#fff'}" opacity=".85"/><path d="M-20 -7 L4 -7 L4 -17 L22 0 L4 17 L4 7 L-20 7 Z" fill="${bad?'#FF5D7A':'#8C6CF2'}" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/></g>`;
    prog.forEach(b=>{ for(let k=0;k<b.n&&!stop;k++){ const [dr,dc]=DIRS[b.d], nr=pos.r+dr, nc=pos.c+dc;

    errs++; boing(); drawStrip(-1,bi);

    if(running) return; if(!prog.length){ sp(X().empty); return; }
    running=true; runB.disabled=true; resetStars(); place(P.start,true); let pos={...P.start}; const got=new Set(); bot.classList.add('go');
    for(let bi=0;bi<prog.length;bi++){ const b=prog[bi]; drawStrip(bi);
      for(let k=0;k<b.n;k++){ if(myGen!==gen) return; const [dr,dc]=DIRS[b.d]; const nr=pos.r+dr, nc=pos.c+dc; face(dc);
        if(nr<0||nc<0||nr>=P.rows||nc>=P.cols){ bot.classList.remove('go'); return fail(bi,'edge',pos,dr,dc); }

        pos={r:nr,c:nc}; place(pos); step(); await wait(430);
        if(t==='~'){ bot.classList.remove('go'); return fail(bi,'water',pos); }
        const key=nr+','+nc; if(P.st.has(key)&&!got.has(key)){ got.add(key); chime(); const st=svg.querySelector(`.rb-star[data-k="${key}"]`); if(st) st.style.display='none'; }
        if(t==='B'){ bot.classList.remove('go'); return win(got); }
      } }
    bot.classList.remove('go'); return fail(-1,'short',pos);
  }
  async function win(got){
    drawStrip(); fx.textContent='⚡'; react(bot,'happy',1500); robo2(); award();
    const s=1+(got.size===P.st.size?1:0)+(errs===0?1:0);
    await spW(X().progWin,1500); if(myGen!==gen) return;
    finish('p'+li,s,null,li<PL.length-1?()=>progLevel(li+1):null);
  }
  function hint(){ if(running) return; const path=bfs(P); if(!path) return; errs++; const g=svg.querySelector('#rb-foot'); g.innerHTML='';

    timers.push(setTimeout(()=>g.innerHTML='',path.length*180+1800)); }
}

function genLever(nL,nR){ for(let tries=0;tries<800;tries++){ const rp=shuf([1,2,3,4]).slice(0,nR), rw=rp.map(()=>RR(1,4)); const T=rp.reduce((s,d,i)=>s+d*rw[i],0); const lp=shuf([1,2,3,4]).slice(0,nL);
    const combos=[]; const rec=(i,acc,arr)=>{ if(i===nL){ if(acc===T) combos.push(arr.slice()); return; } for(let w=1;w<=4;w++){ arr.push(w); rec(i+1,acc+w*lp[i],arr); arr.pop(); } }; rec(0,0,[]);
    if(!combos.length) continue; const lw=combos[R(combos.length)]; if(nL===1&&nR===1&&lw[0]===rw[0]) continue;
    const tray=new Set(rw); while(tray.size<Math.min(4,rw.length+2)) tray.add(RR(1,4)); return {L:lp.map((d,i)=>[lw[i],d]),R:{},tray:[...tray].sort(),ghost:null}; }
  return {L:[[2,3]],R:{},tray:[2,3],ghost:null}; }

  function tower(sideX,n,col,hide){ let s=''; for(let i=0;i<n;i++) s+=`<rect x="${sideX-16}" y="${380-i*17}" width="32" height="14" rx="4" fill="${col}" stroke="rgba(0,0,0,.2)"/>`; return s+`<text x="${sideX}" y="${372-n*17}" font-size="22" font-weight="800" text-anchor="middle" fill="#24325F">${hide?'?':n}</text>`; }

function gears(li){ li=li||0;

  function loop(now){ if(myGen!==gen) return; const dt=Math.min(.05,(now-last)/1000); last=now;

  const Lv=LR[li]; let busy=false, errs=0, b, lt, svg, last, stars=(Lv.stars||[]).map(s=>s.slice()), bees=(Lv.bees||[]).map(([x,y0,y1,v])=>({x,y0,y1,v,y:y0,d:1})), warned=false;

  const F=frame(intro,stars.length); F.bub.onclick=()=>sp(intro);

/* --- 3. atingere: găsește partea + „Pufi spune” (memorie de secvențe) --- */
const TCH=[{ic:'🖐️',n:5},{ic:'🧠',seq:[2,2,3]},{ic:'🧠🧠',seq:[3,3,4]},{ic:'⚡🧠',seq:[3,4,4],fast:true},{ic:'🧠🧠🧠',seq:[4,5,5],fast:true},{ic:'🏆',seq:[5,6,7],fast:true}];

function touchGame(li){ li=li||0;
  stopAll(); view='touch'; setTop(false); back=sBack('touch'); curRestart=()=>touchGame(li); const myGen=gen;

    else if(p==='head'){ react(svg,'giggle',900); [600,700,800,700,600].forEach((f,i)=>setTimeout(()=>snd(f,.07,'sine',.1),i*80)); }
    else if(p==='belly'){ react(svg,'love',1100); snd(500,.25,'sine',.12); }

    else if(p==='arm'){ react(svg,'wave',1100); blip(); } }
  const glow=p=>{ const g=svg.querySelector(`[data-part="${p}"]`); if(g){ g.classList.remove('rb-hl'); void g.getBoundingClientRect(); g.classList.add('rb-hl'); setTimeout(()=>g.classList.remove('rb-hl'),Lv.fast?380:600); } snd(PTONE[p],.25,'triangle',.12); };

function ryb2rgb(r,y,b){ const C=[[1,1,1],[1,0,0],[1,1,0],[1,.5,0],[.163,.373,.6],[.5,0,.5],[0,.66,.2],[.42,.24,.06]];

  const w=W/tot, k=K/tot; rgb=rgb.map(v=>v*(1-w)+w); rgb=rgb.map(v=>v*(1-.82*k));
