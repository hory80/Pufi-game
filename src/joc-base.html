/* 8. vânătoarea de sunete: care poze încep cu sunetul? ce nu se potrivește? */
function gHunt(){
  const lg=LG(), V=VOC[lg], stg=$('stage'); stg.innerHTML=''; msg('');
  const cand=[...HUNTL[lg]].concat(HUNTLONG[lg]).filter(u=>V.filter(w=>startsUnit(w[1],u,lg)).length>=4);
  const u=(task.lastU&&cand.length>1)?pick(cand.filter(x=>x!==task.lastU)):pick(cand); task.lastU=u;
  const yes=mix(V.filter(w=>startsUnit(w[1],u,lg))), no=mix(V.filter(w=>!w[1].startsWith(u[0])));
  const nYes=2+rnd2(3), set=mix(yes.slice(0,nYes).concat(no.slice(0,6-nYes))), ex=yes[nYes]||yes[0];
  const head=el('div','rd-hhead',`<span class="u">${unitCase(u)}</span><span class="ex">${ex[0]}</span>`); stg.appendChild(head);
  const g=el('div','rd-hgrid'); stg.appendChild(g); let found=0, errs=0;
  set.forEach((w,i)=>{ const ok=startsUnit(w[1],u,lg), b=el('button','rd-hcard',`<span class="e">${w[0]}</span><span class="w"></span>`); b.id='rd-h'+i;
    b.onclick=()=>{ if(busy||b.classList.contains('yes')||b.classList.contains('no')) return;
      const d=cs(w[1]); b.querySelector('.w').innerHTML=ok?`<b>${d.slice(0,u.length)}</b>${d.slice(u.length)}`:d;
      if(ok){ b.classList.add('yes'); try{tick()}catch(e){} speak(sw(w[1])); found++;
        if(found===nYes){ g.querySelectorAll('.rd-hcard:not(.yes)').forEach((c,j)=>{ c.classList.add('no'); const ww=set[[...g.children].indexOf(c)]; c.querySelector('.w').innerHTML=cs(ww[1]); });
          setTimeout(()=>win(R2().huntDone,gHunt),700); } }
      else { b.classList.add('no'); errs++; oops(b,null); speak(R2().huntNo(sw(w[1]))); } };
    g.appendChild(b); });
  const multi=u.length>1;
  setTask(R2().huntTask(unitCase(u)), R2().huntSay(multi&&lg!=='ro'?'':u, sw(ex[1]), multi&&lg!=='ro'));
}

/* 9. unde auzi sunetul: început / mijloc / sfârșit */
function posInfo(W,lg){ let t=toks(W,lg); const D=POSDROP[lg]; if(D){ let n=0; while(n<2&&t.length>3&&D.includes(t[t.length-1])){ t=t.slice(0,-1); n++; } } return t; }
function gPos(){
  const lg=LG(), V=VOC[lg], stg=$('stage'); stg.innerHTML=''; msg('');
  const want=rnd2(3); let pickd=null;
  for(let k=0;k<400&&!pickd;k++){ const w=pick(V), t=posInfo(w[1],lg); if(t.length<3) continue;
    const L=pick([...POSL[lg]]), idx=t.map((x,i)=>x===L?i:-1).filter(i=>i>=0); if(idx.length!==1) continue;
    if(t.some(x=>x.length>1&&x.includes(L))) continue; if(w[1].split(L).length!==2) continue;
    const p=idx[0]===0?0:idx[0]===t.length-1?2:1; if(p!==want&&k<300) continue; pickd={w,L,p,i:idx[0]}; }
  if(!pickd) return gPos();
  const {w,L,p,i}=pickd;
  stg.appendChild(el('div','rd-emoji',w[0]));
  const word=el('div','rd-word rd-posw','?'); word.style.visibility='hidden'; stg.appendChild(word);
  const row=el('div','rd-posrow'); stg.appendChild(row);
  R2().posLbl.forEach((lb,k)=>{ const b=el('button','rd-posb',`<span class="bx">${k===0?'●○○':k===1?'○●○':'○○●'}</span><span>${lb}</span>`); b.id='rd-pos'+k;
    b.onclick=()=>{ if(busy) return;
      if(k===p){ b.classList.add('right'); word.style.visibility='visible'; word.innerHTML=tokHTML(w[1],lg,(kk,x)=>x===L&&kk===i); win(R2().posRight(csL(L),sw(w[1]),lb),gPos); }
      else { oops(b,R2().posWrong); setTimeout(()=>speak(sw(w[1])),900); } };
    row.appendChild(b); });
  const r2=el('div','rd-row'); const lb=el('button','rd-btn',R2().listen); lb.onclick=()=>speak(sw(w[1])); r2.appendChild(lb); stg.appendChild(r2);
  setTask(R2().posTask(csL(L)), R2().posSay(L,sw(w[1])));
}

/* 10. bule cu litere: grupuri de litere (AU, SCH, CI, SH…) */
function gBubble(){
  const lg=LG(), V=VOC[lg], stg=$('stage'); stg.innerHTML=''; msg('');
  const fams=FAM[lg].filter(f=>V.filter(w=>toks(w[1],lg).some(x=>f.includes(x))).length>=3);
  if(!task.fam||task.famLeft<=0||!fams.includes(task.fam)){ task.fam=pick(fams.filter(f=>f!==task.fam))||fams[0]; task.famLeft=3; }
  const f=task.fam; task.famLeft--;
  const pool=V.filter(w=>{ const t=toks(w[1],lg); return t.some(x=>f.includes(x))&&t.length<=7; });
  const w=pick(pool.filter(x=>x!==task.lastW))||pool[0]; task.lastW=w;
  const t=toks(w[1],lg), disp=cs(w[1]); let off=0; const parts=t.map(x=>{ const s=disp.slice(off,off+x.length); off+=x.length; return {x,s,big:x.length>1}; });
  stg.appendChild(el('div','rd-fam',f.map(unitCase).join(' · ')));
  const em=el('div','rd-emoji',w[0]); stg.appendChild(em);
  const sl=el('div','rd-slots'); const slots=parts.map(o=>{ const s=el('div','rd-slot'+(o.big?' big':'')); sl.appendChild(s); return s; }); stg.appendChild(sl);
  const area=el('div','rd-bblArea'); stg.appendChild(area); let k=0, miss=0;
  mix(parts.map((o,i)=>({...o,i}))).forEach((o,j)=>{ const b=el('button','rd-bbl'+(o.big?' big':''),o.s); b.id='rd-bb'+j;
    b.style.setProperty('--h',[200,320,150,40,270,100][j%6]); b.style.setProperty('--d',(2.4+Math.random()*1.6)+'s'); b.style.animationDelay=(-Math.random()*3)+'s';
    b.onclick=()=>{ if(busy||b.classList.contains('pop')) return;
      if(o.s===parts[k].s){ b.classList.add('pop'); slots[k].textContent=o.s; slots[k].classList.add('on'); try{tick()}catch(e){} k++; miss=0;
        area.querySelectorAll('.hint').forEach(x=>x.classList.remove('hint'));
        if(k===parts.length){ em.classList.add('win'); win(R2().bubbleDone(sw(w[1])),gBubble); } }
      else { oops(b,null); miss++; if(miss>=2){ const nx=[...area.children].find(x=>!x.classList.contains('pop')&&x.textContent===parts[k].s); if(nx) nx.classList.add('hint'); } } };
    area.appendChild(b); });
  const row=el('div','rd-row'); const lb=el('button','rd-btn',R2().listen); lb.onclick=()=>speak(sw(w[1])); row.appendChild(lb); stg.appendChild(row);
  setTask(R2().bubbleTask(f.map(unitCase).join(' / ')), R2().bubbleSay(sw(w[1])));
}

/* 11. cuvinte gemene: poza + 3 cuvinte care arată la fel */
function lev(a,b){ const d=[...Array(b.length+1).keys()]; for(let i=1;i<=a.length;i++){ let p=d[0]; d[0]=i; for(let j=1;j<=b.length;j++){ const t=d[j]; d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1)); p=t; } } return d[b.length]; }
function gTwins(){
  const lg=LG(), V=VOC[lg], stg=$('stage'); stg.innerHTML=''; msg('');
  const w=pick(V.filter(x=>x!==task.lastW)); task.lastW=w;
  const sc=V.filter(x=>x!==w).map(x=>({x,s:lev(x[1],w[1])-(x[1][0]===w[1][0]?2:0)-(x[1].slice(0,2)===w[1].slice(0,2)?1:0)+Math.random()*.9})).sort((a,b)=>a.s-b.s);
  const opts=mix([w,sc[0].x,sc[1].x]);
  const box=el('div','rd-twins'); box.appendChild(el('div','rd-emoji',w[0])); const col=el('div','rd-twcol'); box.appendChild(col); stg.appendChild(box);
  let errs=0;
  opts.forEach((x,i)=>{ const b=el('button','rd-tw',cs(x[1])); b.id='rd-tw'+i;
    b.onclick=()=>{ if(busy||b.classList.contains('wrong')) return;
      if(x===w){ b.classList.add('right'); win(R2().twinsRight(sw(w[1])),gTwins); }
      else { b.classList.add('wrong'); errs++; oops(b,null); speak(R2().twinsWrong(sw(x[1]))); } };
    col.appendChild(b); });
  setTask(R2().twinsSay);
}

const RUN={alpha:gAlpha,fish:gFish,train:gTrain,build:gBuild,read:gRead,story:gStory,write:gWrite,hunt:gHunt,pos:gPos,bubble:gBubble,twins:gTwins};

    grp.forEach(g=>{ const b=el('button','rd-card'+(NEWG.includes(g)?' new':''),`<span class="ic">${GN(g)[0]}</span><span class="nm">${GN(g)[1]}</span>`); b.id='rd-g-'+g; b.dataset.lk='rd:'+g; if(NEWG.includes(g)) b.dataset.new=({ro:'NOU',de:'NEU',en:'NEW'})[lang]||((L10N.misc||{})[lang]||{}).newB||'NEW'; b.onclick=()=>openGame(g); m.appendChild(b); }); }); if(window.__comicCard){ const c=window.__comicCard(); m.insertBefore(c,m.children[1]||null); } }

  const o=new Set([tk.n]); const cand=[tk.n+1,tk.n-1,tk.n+5,tk.n-5,tk.n+10,tk.n-10,Math.floor(tk.n%10)*10+Math.floor(tk.n/10)];

  shuffleA([...o]).forEach(v=>{ const b=document.createElement('button'); b.textContent=v;
    b.onclick=()=>{ if(busy||b.classList.contains('wrong')) return;
      if(v===tk.n){ b.classList.add('right'); setEye(true); busy=true; setTimeout(success,200); }
      else { errs++; b.classList.add('wrong'); try{ beep(false); }catch(e){} shake(); sp(X().readWrong); } };
    box.appendChild(b); });
}
const shuffleA=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
function shake(){ const b=$('board'); b.classList.remove('sa-shake'); void b.offsetWidth; b.classList.add('sa-shake'); }
function hint(){
  if(!tk||busy||tk.wait||freeMode) return; errs++;
  const tgt=stateOf(tk.n);
  tgt.forEach((t,r)=>{ const c=rods[r]; if(t.h!==c.h) $(`b${r}h`).classList.add('need');
    for(let i=0;i<4;i++){ if((i<t.e)!==(i<c.e)) $(`b${r}e${i}`).classList.add('need'); } });
  let msg=X().hintBlink;
  if(tk.f5&&direct(val(),tk.b)===false&&val()===tk.a) msg=X().f5a(tk.b);
  if(tk.f10&&val()===tk.a) msg=X().f10a(tk.b);
  if(tk.f5s&&val()===tk.a) msg=X().f5s(tk.b);
  sp(msg);
}
/* ---------- meniu ---------- */
function labels(){
  $('title').textContent=X().title; $('back').textContent=view==='menu'?X().back:X().map;
  $('hint').textContent=X().hint; $('check').textContent=X().check; $('clear').textContent=X().clear; $('again').textContent=X().again;
  $('eye').textContent=eye?X().eyeOn:X().eyeOff; $('unlock').textContent=unlockAll?X().unlockOn:X().unlockOff;
  $('ovNext').textContent=X().next; $('ovAgain').textContent=X().again2; $('ovMap').textContent=X().map; pillUpd();
}
function card(ic,n,t,st,cls,fn){ const b=document.createElement('button'); b.className='sa-card'+(cls?' '+cls:'');
  b.innerHTML=`<span class="ic">${ic}</span>${n?`<span class="n">${n}</span>`:''}<span class="t">${t}</span>${st!=null?`<span class="st">${'★'.repeat(st)}${'☆'.repeat(3-st)}</span>`:''}`; b.onclick=fn; return b; }
function showMenu(){
  view='menu'; freeMode=false; tk=null; try{ speechSynthesis.cancel(); }catch(e){}
  $('menu').hidden=false; $('play').hidden=true; $('unlock').hidden=false; labels();
  const m=$('menu'); m.innerHTML=''; if(window.__saGuide) try{ window.__saGuide(m); }catch(e){} if(window.__saArena) try{ window.__saArena(m); }catch(e){}
  const cur=LV.findIndex((_,i)=>isOpen(i)&&!(best[i]>0));
  [0,1,2].forEach(w=>{ const h=document.createElement('h3'); h.className='sa-world'; h.textContent=X().worlds[w]; m.appendChild(h);
    const row=document.createElement('div'); row.className='sa-row';
    LV.forEach((L,i)=>{ if(L.w!==w) return; const open=isOpen(i);
      const cb=card(L.ic,X().lvl(i+1),X().names[i],best[i]||0,(open?'':'lock')+(i===cur?' cur':''),()=>{ if(!open){ sp(X().locked); return; } startLevel(i); }); cb.dataset.lk='sa:w'+w; row.appendChild(cb); });
    m.appendChild(row); });
  const h=document.createElement('h3'); h.className='sa-world'; h.textContent=X().extra; m.appendChild(h);
  const row=document.createElement('div'); row.className='sa-row';
  row.appendChild(card(X().free[0],'',X().free[1],null,'',startFree));
  row.appendChild(card(X().ten[0],'',X().ten[1],null,'',()=>{ root.hidden=true; try{ game='abacus'; sbMode='ten'; store('joc','abacus'); store('modSoroban','ten'); syncChips(); next(); }catch(e){} }));
  m.appendChild(row);
}
function enterPlay(){ view='play'; $('menu').hidden=true; $('play').hidden=false; $('unlock').hidden=true; $('ov').hidden=true; labels(); }
function startLevel(i){
  li=i; done=0; errs=0; tk=null; freeMode=false; const L=LV[i]; nR=L.rods; rods=stateOf(0); eye=!!L.eye;
  enterPlay(); $('dots').hidden=false; dots(); build(); setEye(eye);
  setTask('🦉 '+X().intro[i]); busy=true;
  spW(X().intro[i],1800).then(()=>{ if(view==='play'&&li===i&&!freeMode) newTask(); });
}
function startFree(){
  freeMode=true; tk=null; nR=3; rods=stateOf(0); eye=true; enterPlay(); $('dots').hidden=true; build(); setEye(true);
  $('ans').hidden=true; $('again').hidden=true; $('flash').hidden=true; $('hint').hidden=true; $('check').hidden=true; $('clear').hidden=false; $('eye').hidden=false;
  readOnly=false; busy=false; $('svg').classList.remove('ro'); setTask('🎨 '+X().freeTask); sp(X().freeTask);
}
/* ---------- butoane ---------- */
$('back').onclick=()=>{ if(view==='menu'){ root.hidden=true; try{ speechSynthesis.cancel(); }catch(e){} } else showMenu(); };
$('unlock').onclick=()=>{ unlockAll=!unlockAll; try{ localStorage.setItem('sa_all',unlockAll?'1':'0'); }catch(e){} showMenu(); };
$('eye').onclick=()=>setEye(!eye);
$('clear').onclick=()=>{ if(busy||readOnly) return; rods=stateOf(0); clack(nR-1); clearNeed(); draw(); if(freeMode) onChange(); };
$('hint').onclick=hint;
$('again').onclick=()=>{ if(!tk||busy) return; errs++; $('flash').innerHTML=`<span>${tk.n}</span>`; $('flash').hidden=false; setTimeout(()=>$('flash').hidden=true,1200); };
$('check').onclick=()=>{ if(!tk||busy||tk.wait) return; const v=val(); if(v===tk.n){ busy=true; success(); return; }
  errs++; try{ beep(false); }catch(e){} shake(); setTask('🤔 '+X().have(v)); sp(X().have(v)); };
const rep=()=>{ if(view!=='play') return; if(freeMode) return sp(String(val())); if(!tk) return; const L=LV[li]; let q;
  if(L.type==='show') q=X().show(tk.n); else if(L.type==='add') q=X().add(tk.a,tk.b); else if(L.type==='sub') q=X().sub(tk.a,tk.b);
  else if(L.type==='read') q=X().read; else if(L.type==='flash') q=tk.wait?X().flash1:X().flash2; else q=tk.wait?X().anz1:X().anz2; sp(q); };
$('owl').onclick=rep; $('task').onclick=rep;
$('ovNext').onclick=()=>startLevel(Math.min(li+1,LV.length-1));
$('ovAgain').onclick=()=>startLevel(li);
$('ovMap').onclick=showMenu;
startLevel=(f=>i=>{ if(window.__gate&&window.__gate('sa','w'+LV[i].w)) return showMenu(); return f(i); })(startLevel);
(window.__LR=window.__LR||[]).push(()=>{ if(root.hidden) return; if(view==='play'){ if(freeMode) startFree(); else startLevel(li); } else showMenu(); });
window.openSoroban=()=>{ root.hidden=false; showMenu(); };
window.saLabel=()=>{ const b=document.getElementById('sbAcad'); if(b) b.textContent=X().acad; if(!root.hidden){ if(view==='menu') showMenu(); else labels(); } };
/* legătura cu pagina principală */
try{
  const gab=document.getElementById('gAb'); if(gab) gab.onclick=()=>{ try{ if(synth) synth.cancel(); }catch(e){} window.openSoroban(); };
  const ab=document.getElementById('abModes');
  ['sbShow','sbAddB'].forEach(id=>{ const b=document.getElementById(id); if(b) b.hidden=true; });
  if(ab&&!document.getElementById('sbAcad')){ const b=document.createElement('button'); b.id='sbAcad'; b.onclick=()=>window.openSoroban(); ab.insertBefore(b,ab.firstChild); }
  if(typeof sbMode!=='undefined'&&sbMode!=='ten'){ sbMode='ten'; }
  window.saLabel();
}catch(e){}
window.__sa={gen,direct,stateOf,LV};
})();
</script>
