<title>Pufi – Școala jocurilor</title>
<style>
/* Layout: one-screen play area — game tabs + options on top, star bar, then either the counting card with three answer tiles or a 2×2 grid of big flags. Single bright look by choice. */
:root{
  --sky:#DDF1FF; --ink:#24325F; --sun:#FFC83D; --berry:#FF5D7A; --leaf:#3BC48A; --card:#FFFFFF; --soft:#EAF0FB; --plum:#8C6CF2; --wood:#B9773E; --wood2:#F6E7D3;
  --display:"Baloo 2","Chalkboard SE","Comic Sans MS",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;overflow:hidden}body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--display);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow-x:hidden;
  background-image:radial-gradient(circle at 8% 12%,#fff 0 46px,transparent 47px),radial-gradient(circle at 13% 10%,#fff 0 34px,transparent 35px),
  radial-gradient(circle at 88% 8%,#fff 0 40px,transparent 41px),radial-gradient(circle at 93% 11%,#fff 0 30px,transparent 31px)}
.wrap{height:100%;overflow:hidden;box-sizing:border-box;padding-inline:16px;padding-block:10px;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:880px;margin:0 auto}
.tabs{width:100%;display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.tabs button{flex:1 1 110px}
.tabs .stars{flex:0 0 auto}
.tabs button{font:inherit;font-weight:800;font-size:clamp(.95rem,min(2.4vw,3vh),1.5rem);border:3px solid var(--ink);background:var(--card);color:var(--ink);border-radius:18px;padding:3px 8px;white-space:nowrap;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#fff}
.tabs .pufiTab{background:var(--sun)}
.top{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{font:inherit;font-weight:800;font-size:clamp(.9rem,min(2.2vw,2.4vh),1.1rem);border:3px solid var(--ink);background:var(--card);color:var(--ink);border-radius:14px;padding:2px 10px;cursor:pointer}
.chips{gap:6px!important}
.chips button[aria-pressed="true"]{background:var(--sun)}
.modes button[aria-pressed="true"]{background:var(--plum);color:#fff}
.langs button[aria-pressed="true"]{background:var(--leaf);color:#fff}
.progress{width:100%;display:flex;align-items:center;gap:10px}
.stars{font-size:clamp(1.1rem,min(3.5vw,3vh),1.6rem);font-weight:800;background:var(--card);border-radius:16px;padding:2px 12px;white-space:nowrap;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;line-height:1}
.bar{width:80px;display:grid;grid-template-columns:repeat(10,1fr);gap:2px}
.bar span{height:6px;border-radius:3px;background:var(--soft);border:1px solid #B9D9F2}
.bar span.on{background:var(--sun);border-color:#D99A12}
.view{width:100%;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:10px}
.card{width:100%;background:var(--card);border-radius:28px;padding-inline:16px;padding-block:12px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 0 #B9D9F2;flex:1;min-height:0}
.pics{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;min-height:0;width:100%}
.group{display:grid;gap:6px;border-radius:20px;padding:10px;justify-items:center}
.group.a{background:#FFE6EB} .group.b{background:#DDF6EA} .group.s{background:#FFF3D1}
.item{font-size:var(--sz,3rem);line-height:1;position:relative;display:inline-block;animation:pin .35s backwards}
.item.gone{animation:pin .35s backwards,leave .6s ease forwards;animation-delay:var(--d),calc(var(--d) + .9s)}
.item.gone::after{content:"✖";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--berry);font-size:.9em;opacity:0;animation:xin .3s forwards;animation-delay:calc(var(--d) + 1.3s)}
@keyframes pin{from{transform:scale(0) rotate(-20deg);opacity:0}}
@keyframes leave{to{opacity:.3;transform:translateY(-8px) scale(.85)}}
@keyframes xin{to{opacity:1}}
.op-sign{font-size:3rem;font-weight:800}
.sum{font-size:clamp(2.2rem,min(11vw,9vh),6rem);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.sum .qa{color:var(--berry)} .sum .qb{color:var(--leaf)} .sum.sub .qb{color:var(--plum)}
.sum .box{display:inline-block;min-width:1.2em;border-bottom:8px solid var(--sun);text-align:center}
.answers{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.answers button{font:inherit;font-weight:800;font-size:clamp(2rem,min(9vw,8vh),5rem);background:var(--sun);color:var(--ink);border:none;border-radius:26px;padding-block:6px;box-shadow:0 8px 0 #D99A12;cursor:pointer;transition:transform .08s,opacity .25s}
.answers button:active,.flags button:active{transform:translateY(6px)}
.answers button.wrong{background:#E3E7EF;box-shadow:0 8px 0 #B8BFCC;color:#8A93A8}
.answers button.right{background:var(--leaf);box-shadow:0 8px 0 #24935F;color:#fff}
.flagq{font-size:clamp(1.4rem,min(6vw,5vh),3.2rem);font-weight:800;text-align:center;line-height:1.1;text-wrap:balance}
.flagq b{color:var(--plum)}
.flags{width:100%;flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px}
.flags button{font:inherit;background:var(--card);border:4px solid transparent;border-radius:26px;box-shadow:0 8px 0 #B9D9F2;padding-block:4px;min-height:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;transition:transform .08s,opacity .25s;color:var(--ink)}
.flags .fl{font-size:clamp(3rem,min(17vw,15vh),9rem);line-height:1.05}
.flags .nm{font-size:clamp(1rem,min(3vw,2.6vh),1.5rem);font-weight:800;min-height:1.3em;visibility:hidden}
.flags button.right{border-color:var(--leaf);background:#DDF6EA}
.flags button.right .nm,.flags button.wrong .nm{visibility:visible}
.flags button.wrong{opacity:.45;filter:grayscale(.7)}
.sbWrap{width:100%;flex:1;min-height:0;display:flex;justify-content:center}
#sb{width:100%;height:100%;max-width:680px;display:block}
#sb .fr{fill:var(--wood)} #sb .in{fill:var(--wood2)} #sb .rod{stroke:var(--wood);stroke-width:5} #sb .beam{fill:var(--wood)} #sb .dot{fill:var(--card)}
#sb .bead{cursor:pointer;transition:transform .18s ease;stroke:rgba(36,50,95,.35);stroke-width:2}
#sb .bead.h{fill:var(--berry)} #sb .bead.e{fill:var(--sun)}
#sb .lbl{fill:var(--ink);font:800 22px var(--display);text-anchor:middle}
body.waiting #sb .bead{pointer-events:none}
.sbHint{font-size:clamp(.95rem,min(2.6vw,2.3vh),1.2rem);font-weight:600;opacity:.8;text-align:center;font-family:system-ui,sans-serif}
.cherryBox{width:100%;flex:1 1 0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:min(14px,1.5vh);overflow:hidden}
.cx{display:grid;grid-template-columns:repeat(5,auto);column-gap:.3em;align-items:center;justify-items:center;font-size:clamp(1.6rem,min(11vw,7vh),5.5rem);font-weight:800;line-height:1}
.cx .qa{color:var(--berry)} .cx .qb{color:var(--leaf)} .cx .box{min-width:1.2em;border-bottom:8px solid var(--sun);text-align:center}
.cx .cherry{grid-column:3;width:1.9em;height:1.25em}
.cherry line{stroke:#2F8F4E;stroke-width:5;stroke-linecap:round}
.cherry circle{fill:var(--berry)} .cherry.dim circle{fill:#F2B8C4}
.cherry text{fill:#fff;font:800 30px var(--display);text-anchor:middle;dominant-baseline:central}
.frames{display:flex;gap:14px;width:100%;justify-content:center}
.tf{width:min(44%,300px,34vh);display:grid;grid-template-columns:repeat(5,1fr);gap:min(5px,.6vh);background:var(--card);border:4px solid var(--ink);border-radius:14px;padding:6px;box-sizing:border-box}
.tf span{aspect-ratio:1;border-radius:50%;background:var(--soft)}
.tf span.r{background:var(--berry)} .tf span.g{background:var(--leaf)}
.tf span.need{box-shadow:inset 0 0 0 4px var(--plum);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.tf span.need{animation:none}#sb .bead{transition:none}}
.mapbox{position:fixed;inset:0;z-index:3;background:var(--sky);box-sizing:border-box;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;align-items:center;gap:10px}
.mapwrap{position:relative;width:100%;flex:1;min-height:0;background:#BFE3FA;border-radius:26px;overflow:hidden;box-shadow:0 8px 0 #9CC6E4;line-height:0}
#map{width:100%;height:100%;display:block}
#map .land{fill:#FFFFFF;stroke:#9CC6E4;stroke-width:.6;vector-effect:non-scaling-stroke}
#map .target{fill:var(--berry);stroke:#B8233F;stroke-width:1.2;vector-effect:non-scaling-stroke}
#map .ring{fill:none;stroke:var(--berry);transform-box:fill-box;transform-origin:center;animation:ring 1.4s ease-out infinite}
@keyframes ring{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.8);opacity:0}}
.mapcap{font-size:clamp(1.3rem,min(5vw,4.2vh),2.6rem);font-weight:800;text-align:center;line-height:1.15;text-wrap:balance}
.postcard{position:absolute;left:12px;bottom:12px;max-width:min(46%,340px);background:var(--card);border-radius:20px;padding:10px 14px;box-shadow:0 6px 0 rgba(36,50,95,.18);line-height:1.15;transform:rotate(-2deg);animation:card .5s 1.2s backwards}
.pcEmo{font-size:clamp(2.4rem,min(8vw,9vh),4.8rem);letter-spacing:.05em;line-height:1.1}
.pcTxt{font-size:clamp(1rem,min(2.8vw,2.6vh),1.4rem);font-weight:800}
@keyframes card{from{transform:rotate(-12deg) scale(.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.postcard{animation:none}}
.mons{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:900px}
.mon{font:inherit;border:none;background:var(--card);border-radius:20px;padding:6px;box-shadow:0 6px 0 #9CC6E4;display:flex;flex-direction:column;gap:4px;cursor:pointer;color:var(--ink);animation:monIn .45s backwards;min-width:0}
.mon:active{transform:translateY(4px);box-shadow:0 2px 0 #9CC6E4}
@keyframes monIn{from{transform:scale(.5) rotate(-6deg);opacity:0}}
.mart{position:relative;display:flex;align-items:center;justify-content:center;border-radius:14px;height:clamp(64px,13vh,140px);overflow:hidden}
.mart::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16%;background:rgba(255,255,255,.28)}
.mart .me{font-size:clamp(2.4rem,9vh,5.5rem);line-height:1;position:relative;z-index:1;filter:drop-shadow(0 4px 4px rgba(0,0,0,.2))}
.mart .ma{position:absolute;right:8%;top:8%;font-size:clamp(1.1rem,4vh,2.4rem);z-index:1}
.mart.tilt .me{transform:rotate(9deg)}
.mart .me.pyr{filter:sepia(1) saturate(1.8) brightness(1.08) drop-shadow(0 4px 4px rgba(0,0,0,.2))}
.mart.big{height:clamp(140px,32vh,320px);border-radius:22px;flex:0 0 auto}
.mart.big .me{font-size:clamp(4.5rem,20vh,11rem)}
.mart.big .ma{font-size:clamp(2rem,8vh,4.5rem)}
.bg-sky{background:linear-gradient(#8FD3FF,#E3F6FF)} .bg-sunset{background:linear-gradient(#FF9F6B,#FFE3B0)} .bg-night{background:linear-gradient(#2B3A78,#7C6BD6)}
.bg-sea{background:linear-gradient(#A6E4F7,#2E9BD6)} .bg-sand{background:linear-gradient(#FFE29A,#F2A65A)} .bg-snow{background:linear-gradient(#CFE7FF,#FFFFFF)} .bg-green{background:linear-gradient(#D4F2D8,#5CBF77)}
.mnm{font-weight:800;font-size:clamp(.85rem,min(2.4vw,2.3vh),1.15rem);line-height:1.1;text-align:center;min-height:2.2em;display:flex;align-items:center;justify-content:center}
.monPop{position:absolute;inset:0;z-index:5;background:rgba(36,50,95,.55);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.monCard{background:var(--card);border-radius:28px;padding:16px;max-width:640px;width:100%;display:flex;flex-direction:column;gap:10px;max-height:100%;overflow:auto;box-sizing:border-box;animation:monIn .35s}
#monArt{display:flex;flex-direction:column}
.monCard h3{margin:0;font-size:clamp(1.5rem,4vw,2.3rem);text-align:center;line-height:1.1;text-wrap:balance}
.monCard p{margin:0;font-size:clamp(1.1rem,2.8vw,1.5rem);font-weight:600;line-height:1.35;text-align:center}
.monBtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.mart.photo::after{display:none}
.mart.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mart.photo.big{height:clamp(160px,40vh,420px)}
.monCred{text-align:center;font-size:.8rem;opacity:.65;font-family:system-ui,sans-serif}
.mapBtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.fbWrap{max-width:860px}
.fbList{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fbCard{font:inherit;border:3px solid transparent;background:var(--soft);border-radius:20px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;color:var(--ink);animation:monIn .4s backwards;min-width:0}
.fbCard.on{border-color:var(--sun);background:#FFF6DA}
.fbPic{position:relative;width:clamp(72px,17vh,140px);aspect-ratio:1;border-radius:50%;background:linear-gradient(#3BC48A,#24935F);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(36,50,95,.2)}
.fbPic img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;border-radius:50%}
.fbCr{font-size:.55rem;opacity:.55;line-height:1.1;word-break:break-word}
.fbInit{color:#fff;font-weight:800;font-size:clamp(1.4rem,5vh,2.4rem)}
.fbBall{position:absolute;right:-2px;bottom:-2px;font-size:clamp(1.2rem,4vh,1.9rem)}
.fbNm{font-weight:800;font-size:clamp(.95rem,min(2.4vw,2.4vh),1.25rem);text-align:center;line-height:1.1}
.fbTx{font-size:clamp(.8rem,min(2vw,2vh),1.05rem);font-weight:600;text-align:center;line-height:1.25;opacity:.85}
.nextBtn.fb{background:var(--sun);color:var(--ink);box-shadow:0 8px 0 #D99A12}
.nextBtn.alt{background:var(--plum);box-shadow:0 8px 0 #5B3FC4}
@media (prefers-reduced-motion:reduce){.mon,.monCard{animation:none}}
.mapcap .cap{font-size:.8em}.mapcap .cap b{color:var(--plum)}
.mapcap .fl{font-size:1.4em;vertical-align:middle;margin-right:.2em}
.nextBtn{font:inherit;font-weight:800;font-size:clamp(1.5rem,min(5vw,4vh),2.6rem);background:var(--leaf);color:#fff;border:none;border-radius:26px;padding:6px 40px;box-shadow:0 8px 0 #24935F;cursor:pointer}
.nextBtn:active{transform:translateY(6px);box-shadow:0 2px 0 #24935F}
body.waiting .nextBtn{opacity:.5;pointer-events:none}
@media (prefers-reduced-motion:reduce){#map .ring{animation:none}}
body.waiting .answers button,body.waiting .flags button:not(.right):not(.wrong){opacity:.5;filter:saturate(.4);pointer-events:none}
body.waiting .flags button{pointer-events:none}
.answers button:focus-visible,.chips button:focus-visible,.talk button:focus-visible,.tabs button:focus-visible,.flags button:focus-visible{outline:4px solid var(--berry);outline-offset:3px}
.msg{font-size:clamp(1.2rem,min(4vw,3.4vh),2rem);font-weight:800;min-height:1.4em;text-align:center}
.talk{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.talk button,.talk select{font:inherit;font-weight:800;font-size:1rem;border:3px solid var(--ink);background:var(--card);color:var(--ink);border-radius:999px;padding:3px 14px;cursor:pointer;max-width:100%}
.start{position:fixed;inset:0;background:var(--sky);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-inline:16px;z-index:5;text-align:center}
.start h1{font-size:clamp(2.4rem,8vw,4.5rem);margin:0;line-height:1.05;text-wrap:balance}
.start .parade{font-size:clamp(2.2rem,7vw,3.6rem);letter-spacing:.1em}
.start .go{font:inherit;font-weight:800;font-size:clamp(2rem,6vw,3rem);background:var(--leaf);color:#fff;border:none;border-radius:30px;padding:14px 44px;box-shadow:0 8px 0 #24935F;cursor:pointer}
.start .chips button{font-size:1.4rem;padding:6px 20px}

.pop{animation:pop .45s ease}
@keyframes pop{40%{transform:scale(1.06)}}
.shake{animation:shake .35s}

/* Layout: full-screen canvas side-scroller; translucent round touch pads in the bottom corners, HUD pills on top. Single bright storybook look by choice. */

#pf-game{position:fixed;inset:0;touch-action:none}
#pf-cv{display:block;width:100%;height:100%}
.pf-hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none}
.pf-pill{background:rgba(255,255,255,.92);border-radius:999px;padding:2px 18px;font-weight:800;font-size:clamp(1.2rem,3vw,1.7rem);box-shadow:0 4px 0 rgba(36,50,95,.15);white-space:nowrap}
.pf-hudR{display:flex;gap:8px}
.pf-hud button{pointer-events:auto;font:inherit;font-size:clamp(1.3rem,3vw,1.7rem);width:2.2em;height:2.2em;border-radius:50%;border:none;background:rgba(255,255,255,.92);box-shadow:0 4px 0 rgba(36,50,95,.15);cursor:pointer}
.pf-ctrl{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;gap:16px;touch-action:none}
.pf-ctrl.pf-l{left:18px}.pf-ctrl.pf-r{right:18px}
.pf-ctrl button{width:clamp(78px,11vw,112px);height:clamp(78px,11vw,112px);border-radius:50%;border:4px solid rgba(36,50,95,.25);background:rgba(255,255,255,.72);box-shadow:0 6px 0 rgba(36,50,95,.22);font-size:clamp(2rem,5vw,3rem);font-weight:800;color:var(--ink);touch-action:none;cursor:pointer;padding:0}
.pf-ctrl.pf-r button{width:clamp(100px,14vw,144px);height:clamp(100px,14vw,144px);background:rgba(255,200,61,.88)}
.pf-ctrl button.pf-on{transform:translateY(5px);box-shadow:0 1px 0 rgba(36,50,95,.22);background:#fff}
.pf-overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding-inline:16px;text-align:center;background:rgba(189,231,255,.94);z-index:5}
.pf-overlay h1{font-size:clamp(2.4rem,8vw,4.6rem);margin:0;line-height:1.05;text-wrap:balance}
.pf-overlay p{margin:0;font-size:clamp(1.2rem,3.5vw,1.8rem);font-weight:600}
.pf-hero{font-size:clamp(3rem,10vw,5rem);line-height:1}
.pf-big{font:inherit;font-weight:800;font-size:clamp(1.8rem,5vw,2.8rem);background:var(--leaf);color:#fff;border:none;border-radius:28px;padding:10px 42px;box-shadow:0 8px 0 #24935F;cursor:pointer}
.pf-big:active{transform:translateY(6px);box-shadow:0 2px 0 #24935F}
.pf-chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pf-chips button{font:inherit;font-weight:800;font-size:clamp(1rem,2.6vw,1.3rem);border:3px solid var(--ink);background:var(--card);color:var(--ink);border-radius:14px;padding:3px 14px;cursor:pointer}
.pf-chips button[aria-pressed="true"]{background:var(--sun)}
.pf-langs button[aria-pressed="true"]{background:var(--leaf);color:#fff}
.pf-help{font-size:clamp(1rem,2.8vw,1.3rem)!important;opacity:.85}
button:focus-visible{outline:4px solid var(--berry);outline-offset:3px}

#pf-root{position:fixed;inset:0;z-index:50;background:#BDE7FF;font-family:var(--display);color:var(--ink)}
.pf-back{font:inherit;font-weight:800;font-size:clamp(1rem,2.8vw,1.3rem);border:3px solid var(--ink);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 18px;cursor:pointer}
#ch-root{position:fixed;inset:0;z-index:50;background:var(--sky);color:var(--ink);font-family:var(--display);display:flex;flex-direction:column;gap:8px;box-sizing:border-box;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 10px);overflow:hidden}
.ch-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ch-top h2{flex:1 1 160px;margin:0;font-size:clamp(1.3rem,3.4vw,2rem);text-align:center;line-height:1.1}

.ch-pc{position:relative;font-family:"Apple Symbols","Segoe UI Symbol","DejaVu Sans","Noto Sans Symbols2",serif;font-size:var(--pc);line-height:1;pointer-events:none}

.ch-em{position:relative;font-size:calc(var(--pc)*.72);line-height:1;pointer-events:none}

.ch-co.r{left:3px;top:2px}.ch-co.f{right:3px;bottom:2px}
.ch-msg{font-size:clamp(1.05rem,min(3vw,3vh),1.6rem);font-weight:800;min-height:1.3em;text-align:center}
.ch-bottom{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

@keyframes rdFlip{0%,49.9%{transform:scaleX(-1)}50%,100%{transform:scaleX(1)}}

.rd-ripple{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:3px solid rgba(255,255,255,.8);animation:rdRip .9s ease-out forwards;pointer-events:none}
@keyframes rdRip{to{transform:scale(5);opacity:0}}
.rd-bub.mini{width:8px;height:8px}
.rd-aqua{position:absolute;inset:0;z-index:6;background:rgba(36,50,95,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;box-sizing:border-box}
.rd-aqua h3{margin:0;color:#fff;font-size:clamp(1.5rem,4vw,2.2rem)}
.rd-tank{position:relative;width:100%;max-width:760px;flex:1;max-height:60%;border-radius:24px;border:6px solid #E3F2FA;background:linear-gradient(#8FDDF5,#2E9BD6);overflow:hidden}
.rd-aq{position:absolute;left:3%;font:inherit;border:none;background:none;font-size:clamp(2.4rem,7vw,4rem);cursor:pointer;animation:rdSwim2 14s ease-in-out infinite}
.rd-aq.rd-jmp{animation:rdJump .7s,rdSwim2 14s ease-in-out infinite}
.rd-aqua .rd-pill{font-size:1.2rem}
.rd-line{position:absolute;width:3px;height:0;background:#24325F;transform-origin:top center;transition:height .35s ease-out;z-index:2;pointer-events:none}
@media (prefers-reduced-motion:reduce){.rd-fish2,.rd-fish2 .f,.rd-bub,.rd-boat{animation:none!important}}
.rd-lt.used{visibility:hidden}
.rd-emoji.small{font-size:clamp(2.6rem,min(8vw,9vh),4.5rem)}
.rd-slot.cur{background:#FFF1C2;border-radius:10px 10px 0 0}
.rd-padBox{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
.rd-padBox .rd-pad{flex:1;min-height:120px}
/* citeste si alege */
.rd-word{font-size:clamp(3rem,min(11vw,13vh),7rem);font-weight:800;letter-spacing:.05em;background:var(--card);border-radius:24px;padding:6px 30px;box-shadow:0 8px 0 #B9D9F2}
.rd-pics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;max-width:760px}
.rd-pic{font:inherit;font-size:clamp(3.5rem,min(11vw,13vh),7rem);border:none;border-radius:24px;background:var(--card);box-shadow:0 8px 0 #B9D9F2;padding:10px 0;cursor:pointer}
.rd-pic.right{background:#DDF6EA}
.rd-pic.wrong{opacity:.4}
/* povesti */
.rd-stories{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px;width:100%;max-width:900px}
.rd-story{background:var(--card);border-radius:24px;padding:16px clamp(14px,3vw,34px);box-shadow:0 8px 0 #B9D9F2;max-width:900px;width:100%;box-sizing:border-box;overflow:auto;max-height:100%}
.rd-story h3{margin:0 0 6px;font-size:clamp(1.4rem,3.6vw,2.2rem);text-align:center}
.rd-text{font-size:clamp(1.5rem,min(4.6vw,5vh),2.6rem);font-weight:700;line-height:1.6;text-align:left}
.rd-w{cursor:pointer;border-radius:8px;padding:0 2px;transition:background .15s}
.rd-w.hl{background:var(--sun)}
.rd-w.read{color:var(--plum)}
.rd-text.syl .sy.s0{color:#2B6FD6}
.rd-text.syl .sy.s1{color:#E0384F}
.rd-w.read .sy{opacity:.55}
.rd-w.hl{background:var(--sun)}
.rd-w.hl .sy{opacity:1}

/* scris */
.rd-strip{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding:4px 2px;scrollbar-width:thin}
.rd-strip button{font:inherit;font-weight:800;font-size:1.3rem;min-width:2.2em;height:2.2em;border:3px solid var(--ink);border-radius:12px;background:var(--card);color:var(--ink);cursor:pointer;flex:0 0 auto}
.rd-strip button.cur{background:var(--sun)}
.rd-strip button.done{background:#DDF6EA}
.rd-pad{flex:1;min-height:0;width:100%;max-width:820px;background:var(--card);border-radius:24px;box-shadow:0 8px 0 #B9D9F2;touch-action:none;display:block}
.rd-pad .ln{stroke:#B9D9F2;stroke-width:.8}
.rd-pad .ln.mid{stroke-dasharray:3 3}
.rd-pad .ghost{fill:none;stroke:#D5DEF0;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
.rd-pad .gdot{fill:#E3EAF6}
.rd-pad .done{fill:none;stroke:var(--leaf);stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
.rd-pad .ddone{fill:var(--leaf)}
.rd-pad .prog{fill:none;stroke:var(--berry);stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
.rd-pad .guide{fill:none;stroke:var(--plum);stroke-width:1.6;stroke-dasharray:2.5 3;stroke-linecap:round}
.rd-pad .start{fill:var(--leaf);stroke:#fff;stroke-width:1.5}
.rd-pad .num{fill:#fff;font:800 7px var(--display);text-anchor:middle;dominant-baseline:central}
.rd-pad .arrow{fill:var(--plum)}
.rd-pad .trail{fill:none;stroke:rgba(36,50,95,.25);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.rd-pad .pulse{animation:rdPulse 1s infinite;transform-box:fill-box;transform-origin:center}
@keyframes rdPulse{50%{transform:scale(1.35)}}
@media (prefers-reduced-motion:reduce){.rd-fish{animation:none}.rd-pad .pulse,.rd-alphaCard,.rd-emoji,.rd-wagon.full{animation:none}}

const monL=()=>({ro:0,de:1,en:2}[lang]??2);
function monName(m){ return (m._t&&m._t[lang])?m._t[lang][0]:m[3].split('|')[monL()]; }
function monStory(m){ return (m._t&&m._t[lang])?m._t[lang][1]:m[4+monL()]; }
const MONU=()=>TR('mon',MON_UI), FBU=()=>TR('fb',FB_UI);
function monArt(m,big,key){ if(key&&PHOTOS.has(key)) return `<span class="mart photo${big?' big':''}"><img src="foto/${key}.jpg" alt=""></span>`;
  const bg=m[2].split(' ');
  return `<span class="mart bg-${bg[0]}${bg[1]?' '+bg[1]:''}${big?' big':''}"><span class="me${m[0]==='🔺'?' pyr':''}">${m[0]}</span>${m[1]?`<span class="ma">${m[1]}</span>`:''}</span>`; }
function showMons(c){
  const list=MON[c[3]], box=$('mons'); box.innerHTML=''; if(!list){ box.hidden=true; return; }
  list.forEach((m,i)=>{ const b=document.createElement('button'); b.className='mon'; b.id='mon'+i;
    b.style.animationDelay=(i*.18)+'s';
    const key=c[3]+'-'+(i+1);
    b.innerHTML=monArt(m,false,key)+`<span class="mnm">${monName(m)}</span>`;
    b.onclick=()=>openMon(m,key); box.appendChild(b); });
  box.hidden=false;
  const ab=$('anthemBtn'); ab.hidden=!ANTHEMS.has(c[3]); ab.dataset.code=c[3]; updAnthemBtn();
  const fbb=$('fbBtn'); fbb.hidden=!FB[c[3]]; fbb.textContent=FBU().btn;
}
function openMon(m,key){
  stopAnthem(); $('monArt').innerHTML=monArt(m,true,key);
  $('monCred').textContent=PHOTOS.has(key)?'📷 '+MONU().photo+': '+(PHOTO_CRED[key]||'')+(PHOTO_CRED[key]?' · ':'')+'Wikimedia Commons':''; $('monTitle').textContent=monName(m); $('monText').textContent=monStory(m);
  $('monClose').textContent=MONU().close; $('monSay').textContent=MONU().listen;
  $('monPop').hidden=false; try{tick()}catch(e){}
  say(monName(m)+'. '+monStory(m));
  $('monSay').onclick=()=>say(monName(m)+'. '+monStory(m));
}
const anthemAudio=new Audio(); anthemAudio.preload='none';
anthemAudio.onended=()=>updAnthemBtn();
function updAnthemBtn(){ const ab=$('anthemBtn'); if(ab) ab.textContent=anthemAudio.paused?MONU().play:MONU().stop; }
function stopAnthem(){ try{ anthemAudio.pause(); anthemAudio.currentTime=0; }catch(e){} updAnthemBtn(); }
function toggleAnthem(){ const code=$('anthemBtn').dataset.code;
  if(!anthemAudio.paused){ stopAnthem(); return; }
  try{ if(synth) synth.cancel(); }catch(e){}
  const src='imn/'+code+'.mp3'; if(!anthemAudio.src.endsWith(src)) anthemAudio.src=src;
  anthemAudio.currentTime=0; anthemAudio.play().then(updAnthemBtn).catch(()=>updAnthemBtn()); updAnthemBtn(); }
function closeMon(){ $('monPop').hidden=true; try{ if(synth) synth.cancel(); }catch(e){} }

function openFb(c){
  const list=FB[c[3]]; if(!list) return; stopAnthem();
  const nm=c[T().i]; $('fbTitle').textContent=FBU().title(c[0]+' '+nm.charAt(0).toUpperCase()+nm.slice(1));
  const box=$('fbList'); box.innerHTML='';
  list.forEach((p,i)=>{ const key=c[3]+'-'+(i+1), b=document.createElement('button'); b.className='fbCard'; b.id='fb'+i;
    b.style.animationDelay=(i*.15)+'s';
    const pic=FB_PHOTOS.has(key)?`<img src="fotbal/${key}.jpg" alt="">`:`<span class="fbInit">${fbName(p).split(' ').map(w=>w[0]).slice(0,2).join('')}</span>`;
    b.innerHTML=`<span class="fbPic">${pic}<span class="fbBall">⚽</span></span><span class="fbNm">${fbName(p)}</span><span class="fbTx">${fbFact(p)}</span>${FB_CRED[key]?`<span class="fbCr">📷 ${FB_CRED[key]} · Wikimedia</span>`:''}`;
    b.onclick=()=>{ box.querySelectorAll('.fbCard').forEach(x=>x.classList.remove('on')); b.classList.add('on'); say(fbName(p)+'. '+fbFact(p)); };
    box.appendChild(b); });
  $('fbClose').textContent=MONU().close; $('fbPop').hidden=false;
  say(FBU().say(nm));
}

function tick(){ try{ ctx=ctx||new (window.AudioContext||window.webkitAudioContext)(); const o=ctx.createOscillator(),g=ctx.createGain();
  o.type='square'; o.frequency.value=1200; const t=ctx.currentTime; g.gain.setValueAtTime(.04,t); g.gain.exponentialRampToValueAtTime(.001,t+.05);
  o.connect(g).connect(ctx.destination); o.start(t); o.stop(t+.06);}catch(e){} }
function tapBead(r,k){ if(locked) return; const rd=sbRods[r];
  if(k==='h') rd.h=!rd.h; else { const i=+k; rd.e = i<rd.e ? i : i+1; }
  tick(); drawSB(); }
function nextAbacus(){
  const ten=sbMode==='ten';
  $('sbWrap').hidden=ten; $('sbHint').hidden=ten; $('sbCheck').hidden=ten; $('cherryBox').hidden=!ten; $('abAns').hidden=!ten; $('abmsg').textContent='';
  if(ten) return nextTen();

  else { [a,b]=__fresh('sba'+max,()=>(x=>[x,1+rnd(max-x)])(1+rnd(max-1)),Math.min(8,max)); sbTarget=a+b; setSB(a); abSay=T().addSay(a,b); $('abq').textContent=`${a} + ${b} = ?`; }
  speakLocked(abSay);
}
$('sbCheck').onclick=()=>{ if(locked) return; const v=sbVal();
  if(v===sbTarget){ locked=true; win(sbMode==='show'?T().showRight(v):T().res(a,T().plus,b,v), $('abmsg'), $('sbWrap')); }
  else { beep(false); $('abmsg').textContent=T().tryMsg;
    $('sbWrap').classList.remove('shake');void $('sbWrap').offsetWidth;$('sbWrap').classList.add('shake');
    speakLocked(sbMode==='show'?T().showWrong(v,sbTarget):T().addWrong(v)); } };

/* ---------- metoda japoneză „face 10” (sakuranbo) ---------- */
function nextTen(){
  [tenA,tenB]=__fresh('ten',()=>{ const x=6+rnd(4), lo=11-x; return [x,lo+rnd(10-lo)]; },8); tenStep=1;
  renderTen(false);

}
function renderTen(split){

    <svg class="cherry${split?'':' dim'}" viewBox="0 0 120 80" aria-hidden="true"><line x1="60" y1="2" x2="27" y2="40"/><line x1="60" y1="2" x2="93" y2="40"/>
    <circle cx="27" cy="56" r="22"/><circle cx="93" cy="56" r="22"/><text x="27" y="57">${split?need:'?'}</text><text x="93" y="57">${split?rest:'?'}</text></svg>`;
  const f1=$('tf1'), f2=$('tf2'); f1.innerHTML=''; f2.innerHTML='';
  for(let i=0;i<10;i++){ const s=document.createElement('span'); s.className= i<tenA?'r':(split?'g':'need'); f1.appendChild(s); }
  for(let i=0;i<10;i++){ const s=document.createElement('span'); if(split&&i<rest) s.className='g'; f2.appendChild(s); }
}
function answersFor(ans,lo,hi){
  const opts=new Set([ans]);
  while(opts.size<3){ const d=ans+(Math.random()<.5?-1:1)*(1+rnd(2)); if(d>=lo&&d<=hi) opts.add(d); }
  const box=$('abAns'); box.innerHTML='';
  shuffle([...opts]).forEach((v,i)=>{const bt=document.createElement('button'); bt.id='ab'+i; bt.textContent=v; bt.onclick=()=>pickTen(bt,v); box.appendChild(bt);});
}
function wrongTen(bt,v){ bt.classList.add('wrong'); beep(false); $('abmsg').textContent=T().tryMsg;
  $('cherryBox').classList.remove('shake');void $('cherryBox').offsetWidth;$('cherryBox').classList.add('shake');
  speakLocked(T().wrongSay(v)); }
function pickTen(bt,v){
  if(locked||bt.classList.contains('wrong')) return;
  const need=10-tenA, rest=tenB-need;
  if(tenStep===1){
    if(v!==need) return wrongTen(bt,v);
    locked=true; bt.classList.add('right'); beep(true); renderTen(true); tenStep=2;
    $('abmsg').textContent=`🍒 ${tenB} = ${need} + ${rest}`;
    speakLocked(T().tenR1(tenA,need,tenB,rest)).then(()=>setTimeout(()=>{
      if(game!=='abacus'||sbMode!=='ten'||tenStep!==2) return;
      abSay=T().tenQ2(rest); $('abq').textContent=`10 + ${rest} = ?`; $('abmsg').textContent='';
      answersFor(10+rest,10,19); speakLocked(abSay);
    }, voiceOn?300:1600));
  }else{
    if(v!==tenA+tenB) return wrongTen(bt,v);
    locked=true; bt.classList.add('right'); $('tenBox').textContent=v;

  }
}

  /* pagina principală e ascunsă (ecran de start sau alt card): nu citim nicio întrebare */
  const hid=[...document.querySelectorAll('[id$="-root"]')].some(e=>!e.hidden); if(hid) return;

$('repeat').onclick=()=>{ if(!locked||document.body.classList.contains('waiting')) speakLocked(question()); };
$('mute').onclick=()=>{ voiceOn=!voiceOn; if(!voiceOn&&synth) synth.cancel();
  $('mute').textContent=voiceOn?T().on:T().off; $('mute').setAttribute('aria-pressed',!voiceOn);
  if(voiceOn) speakLocked(question()); else { locked=false; document.body.classList.remove('waiting'); } };
$('voice').onchange=e=>{ voice=voices.find(v=>v.name===e.target.value)||voice; store('voce_'+lang,voice?voice.name:''); say(T().sample); };
$('startBtn').onclick=()=>{ started=true; $('start').hidden=true;
  try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
  speakLocked(T().hello+question()); };

buildSB(); applyLang(); syncChips(); renderBar(); next();

<script>
(()=>{

/* ---------------- texte ---------------- */
const TXT={
  ro:{title:'Aventura lui Pufi', sub:'Ajută-l pe Pufi să ajungă acasă!', play:'▶ Joacă', level:n=>`Nivelul ${n}`,
      help:'◀ ▶ mergi · ⬆ sari (poți sări de două ori!)', exit:'⬅ Înapoi la jocuri', won:'Bravo! Pufi a ajuns acasă!', all:'Ai terminat toate nivelurile!',
      starsTxt:n=>`Ai adunat ⭐ ${n} stele`, next:'▶ Nivelul următor', again:'↺ Încă o dată',
      sayStart:'Hai, Pufi! Adună stele și mergi acasă!', sayWon:n=>`Bravo! Pufi a ajuns acasă! Ai adunat ${n} stele.`,
      sayAll:'Ești un campion! Ai terminat toate nivelurile!', code:'ro'},
  de:{title:'Pufis Abenteuer', sub:'Hilf Pufi nach Hause!', play:'▶ Spielen', level:n=>`Level ${n}`,
      help:'◀ ▶ laufen · ⬆ springen (zweimal geht auch!)', exit:'⬅ Zurück zu den Spielen', won:'Super! Pufi ist zu Hause!', all:'Du hast alle Level geschafft!',
      starsTxt:n=>`Du hast ⭐ ${n} Sterne gesammelt`, next:'▶ Nächstes Level', again:'↺ Nochmal',
      sayStart:'Los, Pufi! Sammle Sterne und lauf nach Hause!', sayWon:n=>`Super! Pufi ist zu Hause! Du hast ${n} Sterne gesammelt.`,
      sayAll:'Du bist ein Champion! Alle Level geschafft!', code:'de'},
  en:{title:"Pufi's Adventure", sub:'Help Pufi get home!', play:'▶ Play', level:n=>`Level ${n}`,
      help:'◀ ▶ walk · ⬆ jump (you can jump twice!)', exit:'⬅ Back to games', won:'Well done! Pufi is home!', all:'You finished all the levels!',
      starsTxt:n=>`You collected ⭐ ${n} stars`, next:'▶ Next level', again:'↺ Play again',
      sayStart:"Let's go, Pufi! Collect stars and go home!", sayWon:n=>`Well done! Pufi is home! You collected ${n} stars.`,
      sayAll:'You are a champion! You finished all the levels!', code:'en'}
};
const DE_N=['null','eins','zwei','drei','vier','fünf','sechs','sieben','acht','neun','zehn','elf','zwölf','dreizehn','vierzehn','fünfzehn','sechzehn','siebzehn','achtzehn','neunzehn'];
const DE_T=['','','zwanzig','dreißig','vierzig','fünfzig','sechzig','siebzig','achtzig','neunzig'];
const deNum=n=>n<20?DE_N[n]:((n%10)?((n%10)===1?'ein':DE_N[n%10])+'und':'')+DE_T[Math.floor(n/10)];
let lang='ro', muted=false, levelIdx=0;
const store=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
try{ lang=localStorage.getItem('pufi_lang')||'ro'; levelIdx=+localStorage.getItem('pufi_level')||0; muted=localStorage.getItem('pufi_mute')==='1'; }catch(e){}
if(!TXT[lang]) lang='ro';
const T=()=>TXT[lang];
const $=id=>document.getElementById('pf-'+id); const root=document.getElementById('pf-root');

/* ---------------- voce + sunete ---------------- */
const synth=window.speechSynthesis; let actx=null;
function bestVoice(){ try{ const vs=synth.getVoices().filter(v=>v.lang.toLowerCase().startsWith(lang));
  const sc=v=>(/premium/i.test(v.name)?50:0)+(/enhanced|erweitert|îmbunătățit/i.test(v.name)?40:0)+(/natural|neural|google/i.test(v.name)?30:0);
  return vs.sort((a,b)=>sc(b)-sc(a))[0]||null; }catch(e){ return null; } }
function say(t){ if(muted||!synth) return; try{ if(lang==='de') t=t.replace(/\b\d{1,2}\b/g,m=>deNum(+m)); if(lang==='ro'&&typeof fixRoFem==='function') t=fixRoFem(t);
  synth.cancel(); const u=new SpeechSynthesisUtterance(t); const v=bestVoice(); u.lang=v?v.lang:({de:'de-DE',en:'en-GB'}[lang]||'ro-RO'); if(v) u.voice=v; u.rate=.9; synth.speak(u);}catch(e){} }
function tone(type,f1,f2,dur,vol=.15,delay=0){
  if(muted) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  const t=actx.currentTime+delay, o=actx.createOscillator(), g=actx.createGain(); o.type=type;
  o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+.02);}catch(e){} }
const SFX={
  jump:()=>tone('square',320,640,.14,.08), dbl:()=>tone('triangle',520,1100,.18,.12),
  star:()=>{tone('triangle',988,988,.08,.12);tone('triangle',1319,1319,.16,.12,.07);},
  stomp:()=>tone('square',420,120,.18,.12), bump:()=>tone('sine',200,140,.2,.15),
  spring:()=>tone('sine',200,900,.35,.15), box:()=>{tone('square',660,660,.06,.08);tone('triangle',1046,1568,.2,.1,.05);},
  fall:()=>tone('sine',700,250,.35,.12),
  win:()=>[523,659,784,1046].forEach((f,i)=>tone('triangle',f,f,.22,.15,i*.13))
};

/* ---------------- niveluri ---------------- */
const TS=48, ROWS=12;
const LEVELS=[
 {w:72, pits:[], steps:[[48,1],[49,2]],
  plats:[[14,7,3],[30,6,4],[42,7,3]], boxes:[[22,6],[37,6]],
  coins:[[7,8,4],[14,6,3],[30,5,4],[42,6,3],[53,8,5]], snails:[26,40,58], springs:[], house:64},
 {w:96, pits:[[18,2],[33,2],[58,3]], steps:[[24,1],[25,2],[26,1]],
  plats:[[17,7,4],[32,6,4],[40,5,3],[56,6,5],[70,7,3]], boxes:[[12,6],[47,6],[75,6]],
  coins:[[6,8,4],[17,6,4],[32,5,4],[40,4,3],[56,5,5],[70,6,3],[79,8,4]], snails:[10,29,45,64,82], springs:[51], house:88},
 {w:116, pits:[[15,2],[28,3],[46,2],[60,3],[80,3],[96,2]], steps:[[40,1],[41,2],[42,3],[100,1],[101,2]],
  plats:[[13,7,5],[27,6,5],[35,4,3],[45,7,4],[59,6,5],[66,4,3],[79,6,5],[95,7,4]], boxes:[[21,6],[53,6],[72,6],[90,6]],
  coins:[[5,8,3],[13,6,5],[27,5,5],[35,3,3],[45,6,4],[59,5,5],[66,3,3],[79,5,5],[87,8,3],[95,6,4],[104,8,3]],
  snails:[9,20,37,52,70,86,105], springs:[33,76], house:108}
];
const solidCh=c=>c==='#'||c==='B'||c==='b';
let L, P, parts=[], stars=0, state='start', camX=0, time=0, lastSafe=null, winT=0, bumps={};

function build(spec){
  const g=[...Array(ROWS)].map(()=>Array(spec.w).fill(' '));
  for(let x=0;x<spec.w;x++){ g[10][x]='#'; g[11][x]='#'; }
  spec.pits.forEach(([x,w])=>{ for(let i=x;i<x+w;i++){ g[10][i]=' '; g[11][i]=' '; } });
  spec.steps.forEach(([x,h])=>{ for(let y=10-h;y<10;y++) g[y][x]='#'; });
  spec.plats.forEach(([x,y,w])=>{ for(let i=x;i<x+w;i++) if(g[y][i]===' ') g[y][i]='='; });
  spec.boxes.forEach(([x,y])=>g[y][x]='B');
  const coins=[]; spec.coins.forEach(([x,y,n])=>{ for(let i=0;i<n;i++) if(g[y][x+i]===' ') coins.push({x:(x+i)*TS+TS/2,y:y*TS+TS/2,got:false}); });
  const top=x=>{ for(let y=0;y<ROWS;y++){ const c=g[y][x]; if(solidCh(c)||c==='=') return y; } return ROWS; };
  const snails=spec.snails.map(x=>({x:x*TS+4,y:top(x)*TS-30,w:40,h:30,vx:-38,alive:true,poof:0}));
  const springs=spec.springs.map(x=>({x:x*TS+6,y:top(x)*TS-24,w:36,h:24,t:0}));
  return {g,w:spec.w,coins,snails,springs,house:spec.house*TS};
}
const tile=(tx,ty)=> (ty<0||ty>=ROWS||tx<0||tx>=L.w)?' ':L.g[ty][tx];
const hard=(tx,ty)=> (tx<0||tx>=L.w)?true:solidCh(tile(tx,ty));

function startLevel(i){
  levelIdx=i; store('pufi_level',i); L=build(LEVELS[i]); stars=0; parts=[]; bumps={};
  P={x:2*TS,y:9*TS-40+8,w:32,h:40,vx:0,vy:0,ground:false,face:1,coyote:0,buf:0,jumps:0,inv:0,sq:0,run:0};
  lastSafe={x:P.x,y:P.y}; camX=0; state='play'; updHud();
}

/* ---------------- fizică ---------------- */
function moveX(o,dx){
  o.x+=dx; const t0=Math.floor(o.y/TS), t1=Math.floor((o.y+o.h-1)/TS);
  if(dx>0){ const tx=Math.floor((o.x+o.w-1)/TS); for(let ty=t0;ty<=t1;ty++) if(hard(tx,ty)){ o.x=tx*TS-o.w; o.vx=0; return true; } }
  else if(dx<0){ const tx=Math.floor(o.x/TS); for(let ty=t0;ty<=t1;ty++) if(hard(tx,ty)){ o.x=(tx+1)*TS; o.vx=0; return true; } }
  return false;
}
function moveY(o,dy){
  const prevBottom=o.y+o.h; o.y+=dy; o.ground=false;
  const tx0=Math.floor(o.x/TS), tx1=Math.floor((o.x+o.w-1)/TS);
  if(dy>0){ const ty=Math.floor((o.y+o.h-1)/TS);
    for(let tx=tx0;tx<=tx1;tx++){ const c=tile(tx,ty);
      if(solidCh(c)||(c==='='&&prevBottom<=ty*TS+.5)){ o.y=ty*TS-o.h; o.vy=0; o.ground=true; return null; } } }
  else if(dy<0){ const ty=Math.floor(o.y/TS); let hit=null;
    for(let tx=tx0;tx<=tx1;tx++) if(solidCh(tile(tx,ty))){ const d=Math.abs((tx+.5)*TS-(o.x+o.w/2)); if(!hit||d<hit.d) hit={tx,ty,d}; }
    if(hit){ o.y=(hit.ty+1)*TS; o.vy=0; return hit; } }
  return null;
}
const keys={left:false,right:false,jump:false}; let jumpPress=false;
function doJump(dbl){
  P.vy=dbl?-640:-700; P.coyote=0; P.buf=0; P.sq=-.25;
  if(dbl){ SFX.dbl(); for(let i=0;i<8;i++) parts.push({x:P.x+P.w/2,y:P.y+P.h,vx:(Math.random()-.5)*220,vy:Math.random()*80,life:.5,c:'#FFFFFF',r:5}); }
  else SFX.jump();
}
function hitOverlap(a,b,pad=4){ return a.x+pad<b.x+b.w && a.x+a.w-pad>b.x && a.y+pad<b.y+b.h && a.y+a.h>b.y; }
function burst(x,y,n,c){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=80+Math.random()*180; parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:.6+Math.random()*.3,c,r:4+Math.random()*4,star:Math.random()<.5}); } }

function step(dt){
  time+=dt;
  if(state==='won'){ winT+=dt; if(Math.random()<.5) burst(L.house+2*TS+(Math.random()-.5)*300, 3*TS+Math.random()*120, 2, ['#FFC83D','#FF5D7A','#3BC48A','#8C6CF2'][Math.floor(Math.random()*4)]); }
  if(state==='play'){
    const ax=(keys.left?-1:0)+(keys.right?1:0), MAX=270;
    if(ax){ P.vx+=ax*1700*dt; P.vx=Math.max(-MAX,Math.min(MAX,P.vx)); P.face=ax; }
    else { const f=1900*dt; P.vx=Math.abs(P.vx)<=f?0:P.vx-Math.sign(P.vx)*f; }
    if(P.ground){ P.coyote=.12; P.jumps=0; } else P.coyote-=dt;
    if(jumpPress){ jumpPress=false;
      if(P.coyote>0) doJump(false); else if(P.jumps<1){ P.jumps++; doJump(true); } else P.buf=.15; }
    else P.buf-=dt;
    if(P.buf>0&&P.coyote>0) doJump(false);
    const g=(keys.jump&&P.vy<0)?1080:1900;
    P.vy=Math.min(P.vy+g*dt,900);
    moveX(P,P.vx*dt);
    const wasAir=!P.ground, vyBefore=P.vy;
    const head=moveY(P,P.vy*dt);
    if(P.ground&&wasAir&&vyBefore>300) P.sq=.22;
    if(head){ const k=head.tx+','+head.ty;
      if(L.g[head.ty][head.tx]==='B'){ L.g[head.ty][head.tx]='b'; bumps[k]=.25; stars++; updHud(); SFX.box();
        parts.push({x:(head.tx+.5)*TS,y:head.ty*TS-10,vx:0,vy:-260,life:.7,c:'#FFC83D',r:16,star:true,big:true}); }
      else { bumps[k]=.15; SFX.bump(); } }
    P.sq*=Math.pow(.0005,dt); P.inv=Math.max(0,P.inv-dt);
    if(P.ground&&Math.abs(P.vx)>20) P.run+=dt*Math.abs(P.vx)/30;
    if(P.ground){ const fy=Math.floor((P.y+P.h+2)/TS);
      if(hard(Math.floor(P.x/TS),fy)&&hard(Math.floor((P.x+P.w-1)/TS),fy)||tile(Math.floor(P.x/TS),fy)==='='&&tile(Math.floor((P.x+P.w-1)/TS),fy)==='=') lastSafe={x:P.x,y:P.y}; }
    if(P.y>ROWS*TS+80){ SFX.fall(); burst(lastSafe.x+16,lastSafe.y+20,12,'#FFFFFF'); P.x=lastSafe.x; P.y=lastSafe.y-6; P.vx=0; P.vy=0; P.inv=1; }

    L.coins.forEach(c=>{ if(!c.got&&Math.abs(c.x-(P.x+P.w/2))<30&&Math.abs(c.y-(P.y+P.h/2))<36){ c.got=true; stars++; updHud(); SFX.star(); burst(c.x,c.y,8,'#FFC83D'); } });
    L.springs.forEach(s=>{ s.t=Math.max(0,s.t-dt); if(P.vy>=0&&hitOverlap(P,s,2)&&P.y+P.h-s.y<22){ P.y=s.y-P.h; P.vy=-1150; P.jumps=0; s.t=.3; P.sq=-.3; SFX.spring(); } });
    L.snails.forEach(s=>{
      if(!s.alive){ s.poof+=dt; return; }
      const blocked=moveX(s,s.vx*dt);
      const ahead=s.vx>0?Math.floor((s.x+s.w+1)/TS):Math.floor((s.x-1)/TS), below=Math.floor((s.y+s.h+2)/TS);
      const c=tile(ahead,below); if(blocked||!(solidCh(c)||c==='=')) s.vx=-s.vx;
      if(hitOverlap(P,s,6)){
        if(P.vy>0&&P.y+P.h-s.y<22){ s.alive=false; P.vy=-540; P.jumps=0; stars++; updHud(); SFX.stomp(); burst(s.x+20,s.y+10,14,'#B9B4FF'); }
        else if(P.inv<=0){ P.vx=(P.x<s.x?-1:1)*330; P.vy=-330; P.inv=1.2; SFX.bump(); }
      }
    });
    if(P.x+P.w/2>L.house+2*TS){ state='won'; winT=0; P.vx=0; SFX.win(); setTimeout(showWin,1500); }
  }
  for(const k in bumps){ bumps[k]-=dt; if(bumps[k]<=0) delete bumps[k]; }
  parts.forEach(p=>{ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=(p.big?500:600)*dt; p.life-=dt; });
  parts=parts.filter(p=>p.life>0);
  const tgt=P.x+P.w/2-viewW*.4; camX+= (Math.max(0,Math.min(L.w*TS-viewW,tgt))-camX)*Math.min(1,dt*8);
}

/* ---------------- desen ---------------- */
const cv=$('cv'), ctx=cv.getContext('2d');
let W=0,H=0,dpr=1,scale=1,viewW=0,offY=0;
function resize(){ W=innerWidth; H=innerHeight; dpr=Math.min(devicePixelRatio||1,2);
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  scale=Math.min(H/(ROWS*TS+120), W/(9*TS)); viewW=W/scale; offY=H-ROWS*TS*scale; }
addEventListener('resize',resize);

function starPath(x,y,r,rot=0){ ctx.beginPath(); for(let i=0;i<10;i++){ const a=rot-Math.PI/2+i*Math.PI/5, rr=i%2?r*.45:r; ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);} ctx.closePath(); }
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h); }

function drawBg(){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#8FD3FF'); g.addColorStop(1,'#E3F6FF'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#FFF6C9'; ctx.beginPath(); ctx.arc(W-90,110,46,0,7); ctx.fill();
  [[.15,'#B6E6C2',.55,70],[.35,'#93D6A6',.68,50]].forEach(([f,c,base,amp])=>{
    ctx.fillStyle=c; ctx.beginPath(); ctx.moveTo(0,H);
    for(let sx=0;sx<=W+20;sx+=20){ const wx=sx/scale+camX*f; ctx.lineTo(sx, offY+(ROWS*TS*base+Math.sin(wx/170)*amp+Math.sin(wx/63)*amp*.3)*scale); }
    ctx.lineTo(W,H); ctx.fill(); });
  ctx.fillStyle='rgba(255,255,255,.92)';
  for(let i=0;i<9;i++){ const wx=i*420+80, sx=((wx-camX*.3)*scale)%(W+300); const x=sx<-150?sx+W+300:sx, y=offY+(60+(i%3)*55)*scale;
    ctx.beginPath(); ctx.arc(x,y,26*scale,0,7); ctx.arc(x+30*scale,y-12*scale,32*scale,0,7); ctx.arc(x+62*scale,y,24*scale,0,7); ctx.fill(); }
}
function drawTile(c,tx,ty){
  const x=tx*TS, y=ty*TS + (bumps[tx+','+ty]?-Math.sin(bumps[tx+','+ty]/.25*Math.PI)*10:0);
  if(c==='#'){
    ctx.fillStyle='#C98B4F'; ctx.fillRect(x,y,TS+.5,TS+.5);
    ctx.fillStyle='#B57A42'; if((tx*7+ty*3)%4===0){ ctx.beginPath(); ctx.arc(x+14,y+30,4,0,7); ctx.arc(x+34,y+16,3,0,7); ctx.fill(); }
    if(tile(tx,ty-1)!=='#'){ ctx.fillStyle='#5CCB5F'; ctx.fillRect(x,y,TS+.5,14); ctx.fillStyle='#4AB34E';
      for(let i=0;i<4;i++){ ctx.beginPath(); ctx.arc(x+6+i*12,y+14,6,0,Math.PI); ctx.fill(); } }
  } else if(c==='='){
    rr(x+1,y+2,TS-2,20,8); ctx.fillStyle='#F2B35E'; ctx.fill(); ctx.strokeStyle='#B97A2E'; ctx.lineWidth=3; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+TS/2,y+5); ctx.lineTo(x+TS/2,y+19); ctx.stroke();
  } else if(c==='B'||c==='b'){
    rr(x+2,y+2,TS-4,TS-4,8); ctx.fillStyle=c==='B'?'#8C6CF2':'#CFC6F5'; ctx.fill();
    ctx.strokeStyle=c==='B'?'#5B3FC4':'#A99FD8'; ctx.lineWidth=3; ctx.stroke();
    if(c==='B'){ ctx.fillStyle='#FFC83D'; ctx.fillRect(x+TS/2-4,y+2,8,TS-4); ctx.fillRect(x+2,y+TS/2-4,TS-4,8);
      starPath(x+TS/2,y+TS/2,9+Math.sin(time*5)*1.5); ctx.fillStyle='#FFF6C9'; ctx.fill(); }
  }
}
function drawStar(x,y,r,rot){ starPath(x,y,r,rot); ctx.fillStyle='#FFC83D'; ctx.fill(); ctx.strokeStyle='#E09B12'; ctx.lineWidth=2.5; ctx.stroke(); }
function drawPufi(){
  if(P.inv>0&&Math.floor(time*12)%2) ctx.globalAlpha=.45;
  const cx=P.x+P.w/2, by=P.y+P.h, f=P.face, sx=1+P.sq, sy=1-P.sq;
  ctx.save(); ctx.translate(cx,by); ctx.scale(sx,sy);
  const leg=P.ground&&Math.abs(P.vx)>20?Math.sin(P.run)*6:0;
  ctx.fillStyle='#E07A1F'; ctx.beginPath(); ctx.ellipse(-8+leg,-3,7,5,0,0,7); ctx.ellipse(8-leg,-3,7,5,0,0,7); ctx.fill();
  ctx.fillStyle='#FF9F43'; ctx.beginPath(); ctx.ellipse(-f*20,-20,9,14,-f*.9,0,7); ctx.fill();
  ctx.fillStyle='#FFFFFF'; ctx.beginPath(); ctx.ellipse(-f*25,-30,5,6,-f*.9,0,7); ctx.fill();
  ctx.fillStyle='#FF9F43'; ctx.beginPath(); ctx.ellipse(0,-22,19,21,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-15,-34); ctx.lineTo(-13,-52); ctx.lineTo(-2,-40); ctx.closePath(); ctx.moveTo(15,-34); ctx.lineTo(13,-52); ctx.lineTo(2,-40); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#4A2B14'; ctx.beginPath(); ctx.moveTo(-13,-48); ctx.lineTo(-12,-52); ctx.lineTo(-9,-46); ctx.closePath(); ctx.moveTo(13,-48); ctx.lineTo(12,-52); ctx.lineTo(9,-46); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#FFE6C7'; ctx.beginPath(); ctx.ellipse(f*3,-14,11,10,0,0,7); ctx.fill();
  ctx.fillStyle='#FFFFFF'; ctx.beginPath(); ctx.ellipse(-6+f*4,-27,5.5,6.5,0,0,7); ctx.ellipse(6+f*4,-27,5.5,6.5,0,0,7); ctx.fill();
  ctx.fillStyle='#24325F'; ctx.beginPath(); ctx.arc(-6+f*6,-26,3,0,7); ctx.arc(6+f*6,-26,3,0,7); ctx.fill();
  ctx.fillStyle='#24325F'; ctx.beginPath(); ctx.arc(f*10,-18,2.6,0,7); ctx.fill();
  ctx.fillStyle='rgba(255,93,122,.55)'; ctx.beginPath(); ctx.arc(-12+f*3,-18,3.5,0,7); ctx.arc(12+f*3,-18,3.5,0,7); ctx.fill();
  ctx.restore(); ctx.globalAlpha=1;
}
function drawSnail(s){
  if(!s.alive) return; const d=s.vx>0?1:-1, x=s.x+s.w/2, y=s.y+s.h, wob=Math.sin(time*6+s.x)*1.5;
  ctx.save(); ctx.translate(x,y); ctx.scale(d,1);
  ctx.fillStyle='#FFE7A8'; ctx.beginPath(); ctx.ellipse(4,-6,22,7,0,0,7); ctx.fill();
  ctx.strokeStyle='#FFE7A8'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(18,-10); ctx.lineTo(22,-24+wob); ctx.moveTo(14,-10); ctx.lineTo(14,-23-wob); ctx.stroke();
  ctx.fillStyle='#24325F'; ctx.beginPath(); ctx.arc(22,-25+wob,3,0,7); ctx.arc(14,-24-wob,3,0,7); ctx.fill();
  ctx.fillStyle='#7C83FD'; ctx.beginPath(); ctx.arc(-4,-16,14,0,7); ctx.fill();
  ctx.strokeStyle='#4B52C9'; ctx.lineWidth=2.5; ctx.beginPath(); for(let a=0;a<12;a+=.3){ const r=1+a*1.05; ctx.lineTo(-4+Math.cos(a)*r,-16+Math.sin(a)*r);} ctx.stroke();
  ctx.restore();
}
function drawSpring(s){
  const k=s.t>0?Math.sin(s.t/.3*Math.PI)*.5:0, h=s.h*(1-k*.6), x=s.x, y=s.y+s.h;
  ctx.fillStyle='#24325F'; rr(x,y-6,s.w,6,3); ctx.fill();
  ctx.strokeStyle='#3BC48A'; ctx.lineWidth=4; ctx.beginPath();
  for(let i=0;i<=6;i++) ctx.lineTo(x+(i%2?s.w-6:6), y-6-(h-12)*i/6); ctx.stroke();
  ctx.fillStyle='#FF5D7A'; rr(x-4,y-h-2,s.w+8,10,5); ctx.fill();
}
function drawHouse(){
  const x=L.house, y=10*TS;
  ctx.fillStyle='#FFF4E0'; ctx.fillRect(x,y-2.6*TS,4*TS,2.6*TS); ctx.strokeStyle='#E3C9A0'; ctx.lineWidth=3; ctx.strokeRect(x,y-2.6*TS,4*TS,2.6*TS);
  ctx.fillStyle='#B97A2E'; ctx.fillRect(x+3*TS-6,y-4.1*TS,22,60);
  ctx.fillStyle='#FF5D7A'; ctx.beginPath(); ctx.moveTo(x-20,y-2.6*TS); ctx.lineTo(x+2*TS,y-4.6*TS); ctx.lineTo(x+4*TS+20,y-2.6*TS); ctx.closePath(); ctx.fill();
  rr(x+1.55*TS,y-1.8*TS,.9*TS,1.8*TS,[18,18,0,0]); ctx.fillStyle='#B97A2E'; ctx.fill();
  ctx.fillStyle='#FFC83D'; ctx.beginPath(); ctx.arc(x+2.3*TS,y-.9*TS,4,0,7); ctx.fill();
  ctx.fillStyle='#BDE7FF'; ctx.fillRect(x+.4*TS,y-1.9*TS,.8*TS,.8*TS); ctx.fillRect(x+2.8*TS,y-1.9*TS,.8*TS,.8*TS);
  ctx.strokeStyle='#FFF4E0'; ctx.lineWidth=3; [x+.8*TS,x+3.2*TS].forEach(cx=>{ ctx.beginPath(); ctx.moveTo(cx,y-1.9*TS); ctx.lineTo(cx,y-1.1*TS); ctx.stroke(); });

function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0); drawBg(); if(!L) return;

function bindBtn(el,key){
  const ids=new Set();
  const upd=()=>{ const was=keys[key]; keys[key]=ids.size>0; el.classList.toggle('pf-on',keys[key]); if(key==='jump'&&!was&&keys.jump) jumpPress=true; };
  el.addEventListener('pointerdown',e=>{ e.preventDefault(); ids.add(e.pointerId); try{el.setPointerCapture(e.pointerId)}catch(_){ } upd(); });
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,e=>{ ids.delete(e.pointerId); upd(); }));
  el.addEventListener('contextmenu',e=>e.preventDefault());
}

        R:'Der Turm geht gerade: nach vorne, nach hinten, nach links und nach rechts, so weit er will.',
        B:'Der Läufer geht nur schräg und bleibt immer auf seiner Farbe.',
        N:'Der Springer springt wie ein L: zwei Schritte gerade und einen zur Seite. Er kann über andere Figuren springen!',
        P:'Der Bauer geht einen Schritt nach vorne. Beim ersten Mal darf er zwei Schritte gehen. Am Ende wird er zur Dame!'},
  learnTask:'Tippe auf die Figur und ziehe dreimal.', learnDone:n=>`Super! Jetzt weißt du, wie ${n} zieht.`,
  promo:'Wow! Der Bauer ist am Ende angekommen und wird zur Dame!',
  starsTask:(n,k)=>`Sammle alle ${k} Sterne mit ${n}.`, starsDone:m=>`Du hast alle Sterne in ${m} Zügen gesammelt!`,
  captureTask:x=>`Fang ${x}!`, gotIt:x=>`Du hast ${x} gefangen!`, notTarget:x=>`Hoppla! Du sollst ${x} fangen.`,
  escapeTask:'Dein König steht im Schach! Bring ihn in Sicherheit.', safe:'Der König ist in Sicherheit!',
  mateTask:'Setze schachmatt mit einem einzigen Zug!', mate:'Schachmatt! Du hast gewonnen!', notMate:'Das ist kein Matt. Versuch es nochmal!', mateHint:'Tipp: Versuch es mit der blinkenden Figur.',
  pawnsTask:'Bring einen weißen Bauern ans Ende! Der Roboter spielt Schwarz.', pawnsWin:'Dein Bauer ist am Ende! Du hast gewonnen!',
  pawnsLose:'Der Roboter hat diesmal gewonnen. Nochmal?', botStuck:'Der Roboter kann nicht mehr ziehen. Du hast gewonnen!',
  youStuck:'Du kannst nicht mehr ziehen. Der Roboter gewinnt diesmal.', botThinks:'Der Roboter denkt nach…', yourTurn:'Du bist dran!',
  cant:n=>`${n} kann da nicht hin.`, kingBad:'Dort wäre der König angegriffen!' }
};

CH.en={ tab:'♟️ Chess', title:'Chess School', back:'⬅ Back', menu:'⬅ Menu', hintsOn:'💡 Help: ON', hintsOff:'💡 Help: OFF',
  lvl:n=>`Level ${n}`, next:'🔄 New puzzle', again:'↺ Play again', listen:'🔊 Listen', moves:n=>`Moves: ${n}`,
  names:{K:'The king',Q:'The queen',R:'The rook',B:'The bishop',N:'The knight',P:'The pawn'},
  short:{K:'King',Q:'Queen',R:'Rook',B:'Bishop',N:'Knight',P:'Pawn'},
  nom:{K:'the king',Q:'the queen',R:'the rook',B:'the bishop',N:'the knight',P:'the pawn'},
  dat:{K:'the king',Q:'the queen',R:'the rook',B:'the bishop',N:'the knight',P:'the pawn'},
  blackAcc:{Q:'the black queen',R:'the black rook',B:'the black bishop',N:'the black knight',P:'the black pawn'},
  games:{learn:['🎓','The pieces'],stars:['⭐','Collect the stars'],capture:['🍽️','Catch the piece'],escape:['🛡️','Save the king'],mate:['👑','Checkmate!'],pawns:['⚔️','Pawn battle']},
  desc:{K:'The king is the most important piece. He moves just one step, in any direction.',
        Q:'The queen is the strongest piece. She moves straight and diagonally, as far as she wants.',
        R:'The rook moves straight: forwards, backwards, left and right, as far as it wants.',
        B:'The bishop moves only diagonally and always stays on the same colour.',
        N:'The knight jumps in an L shape: two steps straight and one to the side. It can jump over other pieces!',
        P:'The pawn moves forward one step. The first time it can move two steps. When it reaches the end, it becomes a queen!'},
  learnTask:'Tap the piece and move it 3 times.', learnDone:n=>`Super! Now you know how ${n} moves.`,
  promo:'Wow! The pawn reached the end and turned into a queen!',
  starsTask:(n,k)=>`Collect all ${k} stars with ${n}.`, starsDone:m=>`You collected all the stars in ${m} moves!`,
  captureTask:x=>`Catch ${x}!`, gotIt:x=>`You caught ${x}!`, notTarget:x=>`Oops! You need to catch ${x}.`,
  escapeTask:'Your king is in check! Move him to a safe square.', safe:'The king is safe!',
  mateTask:'Give checkmate in just one move!', mate:'Checkmate! You won!', notMate:'That is not checkmate. Try again!', mateHint:'Hint: try the blinking piece.',
  pawnsTask:'Get a white pawn to the other side! The robot plays black.', pawnsWin:'Your pawn reached the end! You won!',
  pawnsLose:'The robot won this time. Shall we try again?', botStuck:'The robot cannot move any more. You won!',
  youStuck:'You cannot move any more. The robot wins this time.', botThinks:'The robot is thinking…', yourTurn:'Your turn!',
  cant:n=>`${n} cannot go there.`, kingBad:'The king would be attacked there!' };
const C=()=>TR('ch',CH);
const GAMES=['learn','stars','capture','escape','mate','pawns'];

/* ---------- motor de șah ---------- */
const rc=s=>[s>>3,s&7], sq=(r,c)=>r*8+c, on=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
const D={R:[[1,0],[-1,0],[0,1],[0,-1]],B:[[1,1],[1,-1],[-1,1],[-1,-1]]}; D.Q=D.R.concat(D.B); D.K=D.Q;
const NJ=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]];
function pseudo(b,s,att){
  const p=b[s]; if(!p||p.t==='X') return []; const [r,c]=rc(s), out=[];
  const step=(rr,cc)=>{ if(!on(rr,cc)) return; const q=b[sq(rr,cc)]; if(!q||(q.t!=='X'&&(att||q.c!==p.c))) out.push(sq(rr,cc)); };
  if(p.t==='N') NJ.forEach(([a,d])=>step(r+a,c+d));
  else if(p.t==='K') D.K.forEach(([a,d])=>step(r+a,c+d));
  else if(p.t==='P'){ const d=p.c==='w'?-1:1, st=p.c==='w'?6:1;
    if(!att&&on(r+d,c)&&!b[sq(r+d,c)]){ out.push(sq(r+d,c)); if(r===st&&!b[sq(r+2*d,c)]) out.push(sq(r+2*d,c)); }
    [-1,1].forEach(dc=>{ const rr=r+d,cc=c+dc; if(!on(rr,cc)) return; const q=b[sq(rr,cc)];
      if(att?(!q||q.t!=='X'):(q&&q.t!=='X'&&q.c!==p.c)) out.push(sq(rr,cc)); }); }
  else D[p.t].forEach(([a,d])=>{ let rr=r+a,cc=c+d; while(on(rr,cc)){ const q=b[sq(rr,cc)];
    if(!q) out.push(sq(rr,cc)); else { if(q.t!=='X'&&(att||q.c!==p.c)) out.push(sq(rr,cc)); break; } rr+=a; cc+=d; } });
  return out;
}
function attacked(b,s,by){ for(let i=0;i<64;i++){ const p=b[i]; if(p&&p.c===by&&pseudo(b,i,true).includes(s)) return true; } return false; }
const kingSq=(b,c)=>b.findIndex(p=>p&&p.t==='K'&&p.c===c);
const inCheck=(b,c)=>{ const k=kingSq(b,c); return k>=0&&attacked(b,k,c==='w'?'b':'w'); };
function doMove(b,f,t){ const n=b.slice(), p=n[f]; n[t]=(p.t==='P'&&((p.c==='w'&&t<8)||(p.c==='b'&&t>=56)))?{t:'Q',c:p.c}:p; n[f]=null; return n; }
const legal=(b,f)=>pseudo(b,f,false).filter(t=>!inCheck(doMove(b,f,t),b[f].c));
function allLegal(b,c){ const o=[]; for(let i=0;i<64;i++){ const p=b[i]; if(p&&p.c===c) legal(b,i).forEach(t=>o.push([i,t])); } return o; }
const isMate=(b,c)=>inCheck(b,c)&&allLegal(b,c).length===0;
const empty=()=>Array(64).fill(null);
function randSq(b,r0=0,r1=7){ for(let i=0;i<500;i++){ const s=sq(r0+rnd(r1-r0+1),rnd(8)); if(!b[s]) return s; } return b.findIndex(x=>!x); }
function parse(str){ const b=empty(); str.split('/').forEach((side,i)=>side.trim().split(/\s+/).forEach(tok=>{ const t=tok[0], c=tok.charCodeAt(1)-97, r=8-(+tok[2]); b[sq(r,c)]={t,c:i?'b':'w'}; })); return b; }
const MATES=['Kb6 Rh1 / Ka8','Kf7 Ra1 / Kh8','Ka6 Qb1 / Ka8','Ke6 Qa1 / Ke8','Ke1 Ra7 Rb1 / Kh8','Kg1 Ra1 / Kg8 Pf7 Pg7 Ph7',
  'Kg1 Re1 / Ka8 Pa7 Pb7','Kg1 Qd1 / Kg8 Pf7 Pg7 Ph7','Ka1 Ng5 / Kh8 Rg8 Pg7 Ph7','Ka1 Qg4 Bd4 / Kh8 Pg7 Ph7'];

/* ---------- stare ---------- */
let hints=true, lv={}, mode=null, piece='R', Bd=empty(), sel=-1, legalFrom=[], busy=false, last=null, task={}, view='menu';
try{ hints=localStorage.getItem('ch_hints')!=='0'; lv=JSON.parse(localStorage.getItem('ch_lv')||'{}')||{}; piece=localStorage.getItem('ch_piece')||'R'; }catch(e){}
const L=m=>lv[m]||1;
const praise=()=>{ const p=T().praise; return p[rnd(p.length)]; };
function speak(t){ return (typeof say==='function')?say(t):Promise.resolve(false); }
function msg(t){ $('msg').textContent=t||''; }
function setTask(t,speakIt=true){ task.text=t; $('task').textContent=t; if(speakIt) speak(t); }

/* ---------- desen ---------- */
function sizeBoard(){ const w=$('boardWrap'), bd=$('board'); const s=Math.max(160,Math.floor(Math.min(w.clientWidth,w.clientHeight)));
  bd.style.width=bd.style.height=s+'px'; bd.style.setProperty('--pc',(s/8*.8)+'px'); }
function render(){
  const bd=$('board'); bd.innerHTML='';
  const show=sel>=0&&(hints||mode==='learn');
  let bad=[]; if(show&&Bd[sel]&&Bd[sel].t==='K'&&mode==='escape') bad=pseudo(Bd,sel,false).filter(t=>!legalFrom.includes(t));
  for(let s=0;s<64;s++){
    const [r,c]=rc(s), d=document.createElement('div');
    d.className='ch-sq '+((r+c)%2?'d':'l'); d.id='ch-sq'+s; d.setAttribute('role','gridcell');
    if(last&&(s===last[0]||s===last[1])) d.classList.add('last');
    if(s===sel) d.classList.add('sel');
    if(task.hintFrom===s&&sel<0) d.classList.add('hint');
    const p=Bd[s];
    if(p){ const e=document.createElement('span');
      if(p.t==='X'){ e.className='ch-em'; e.textContent='🌲'; }
      else { e.className='ch-pc '+p.c+(last&&s===last[1]?' pop':''); e.textContent=GL[p.t]; }
      d.appendChild(e); }
    else if(task.stars&&task.stars.has(s)){ const e=document.createElement('span'); e.className='ch-em star'; e.textContent='⭐'; d.appendChild(e); }
    if(show&&legalFrom.includes(s)){ const m=document.createElement('span'); m.className=p?'ch-ring':'ch-dot'; d.appendChild(m); }
    if(show&&bad.includes(s)){ const m=document.createElement('span'); m.className='ch-bad'; m.textContent='✖'; d.appendChild(m); }
    if(c===0){ const m=document.createElement('span'); m.className='ch-co r'; m.textContent=8-r; d.appendChild(m); }
    if(r===7){ const m=document.createElement('span'); m.className='ch-co f'; m.textContent='abcdefgh'[c]; d.appendChild(m); }
    d.onclick=()=>tap(s); bd.appendChild(d);
  }
}
function shake(){ const b=$('board'); b.classList.remove('ch-shake'); void b.offsetWidth; b.classList.add('ch-shake'); }

/* ---------- interacțiune ---------- */
function tap(s){
  if(busy) return; const p=Bd[s];
  if(sel>=0&&s!==sel&&legalFrom.includes(s)) return makeMove(sel,s);
  if(p&&p.c==='w'){ if(sel===s){ sel=-1; legalFrom=[]; } else { sel=s; legalFrom=legal(Bd,s); try{tick()}catch(e){} } render(); return; }
  if(sel>=0){ const t=Bd[sel].t; try{beep(false)}catch(e){} shake();
    const m=(mode==='escape'&&t==='K'&&pseudo(Bd,sel,false).includes(s))?C().kingBad:C().cant(C().names[t]);
    msg(m); speak(m); sel=-1; legalFrom=[]; render(); }
}
function makeMove(f,t){
  const prev=Bd, p=Bd[f], cap=Bd[t];
  Bd=doMove(Bd,f,t); last=[f,t]; sel=-1; legalFrom=[]; task.moves=(task.moves||0)+1;
  try{tick()}catch(e){}
  let gotStar=false; if(task.stars&&task.stars.has(t)){ task.stars.delete(t); gotStar=true; try{ tone2(); }catch(e){} }
  render(); onMoved(f,t,p,cap,prev,gotStar);
}
function tone2(){ beep(true); }
function undo(prev,text){ busy=true; try{beep(false)}catch(e){} shake(); msg(text);
  speak(text).then(()=>{}); setTimeout(()=>{ Bd=prev; last=null; busy=false; render(); },900); }
function win(text,next=true){
  try{ window.__lvDone&&window.__lvDone(1); }catch(_e){} busy=true; stars++; renderBar(); updStars(); try{ beep(true); confetti(14); }catch(e){}
  const p=praise(); msg(p+' 🎉'); lv[mode]=L(mode)+1; store('ch_lv',JSON.stringify(lv));
  speak(text+' '+p).then(sp=>setTimeout(()=>{ busy=false; if(next&&view==='play') newTask(); }, sp?500:1600));
}
function onMoved(f,t,p,cap,prev,gotStar){
  if(mode==='learn'){
    task.count++;
    if(p.t==='P'&&t<8){ msg('👑'); speak(C().promo); }
    if(task.count>=3) return win(C().learnDone(C().nom[task.piece]));
    msg('👍 '+task.count+' / 3');
    if(p.t==='P'&&t<8) setTimeout(()=>{ if(view==='play'&&mode==='learn'){ Bd=empty(); Bd[sq(6,4)]={t:'P',c:'w'}; last=null; render(); } },1400);
  } else if(mode==='stars'){
    msg((gotStar?'⭐ ':'')+C().moves(task.moves));
    if(!task.stars.size) return win(C().starsDone(task.moves));
  } else if(mode==='capture'){
    if(t===task.target) return win(C().gotIt(C().blackAcc[task.tt]));
    undo(prev,C().notTarget(C().blackAcc[task.tt]));
  } else if(mode==='escape'){
    return win(C().safe);
  } else if(mode==='mate'){
    if(isMate(Bd,'b')) return win(C().mate);
    task.tries=(task.tries||0)+1;
    if(task.tries>=2){ const sol=allLegal(prev,'w').find(([a,b2])=>isMate(doMove(prev,a,b2),'b')); if(sol) task.hintFrom=sol[0]; }
    undo(prev,C().notMate+(task.tries>=2?' '+C().mateHint:''));
  } else if(mode==='pawns'){
    if(p.t==='P'&&t<8) return win(C().pawnsWin,false), showAgain();
    if(!allLegal(Bd,'b').length) return win(C().botStuck,false), showAgain();
    busy=true; msg(C().botThinks); setTimeout(botMove,800);
  }
}
function botMove(){
  if(view!=='play'||mode!=='pawns') return;
  const mv=allLegal(Bd,'b'); if(!mv.length){ busy=false; return win(C().botStuck,false), showAgain(); }
  let best=mv[0], bs=-1e9;
  mv.forEach(([f,t])=>{ const [r]=rc(t); let s=r*3+Math.random()*12; if(r===7) s+=1000; if(Bd[t]) s+=40;
    const nb=doMove(Bd,f,t); if(attacked(nb,t,'w')) s-=attacked(nb,t,'b')?8:35; if(s>bs){ bs=s; best=[f,t]; } });
  if(Math.random()<.25&&!mv.some(([f,t])=>t>=56)) best=mv[rnd(mv.length)];
  const [f,t]=best; Bd=doMove(Bd,f,t); last=[f,t]; try{tick()}catch(e){} render();
  if(t>=56){ busy=true; msg(C().pawnsLose); try{beep(false)}catch(e){} speak(C().pawnsLose); return showAgain(); }
  if(!allLegal(Bd,'w').length){ busy=true; msg(C().youStuck); speak(C().youStuck); return showAgain(); }
  busy=false; msg(C().yourTurn);
}
function showAgain(){ $('newBtn').textContent=C().again; }

/* ---------- generatoare de exerciții ---------- */
function genStars(t,n,rocks){
  for(let k=0;k<300;k++){
    const b=empty(), start=t==='P'?sq(6,rnd(8)):rnd(64); b[start]={t,c:'w'};
    for(let i=0;i<rocks;i++){ const s=randSq(b); b[s]={t:'X',c:null}; }
    const st=new Set(), seen=new Set([start]); let cur=start, ok=true;
    for(let i=0;i<n;i++){ const tmp=b.slice(); tmp[start]=null; tmp[cur]={t,c:'w'};
      const opts=pseudo(tmp,cur,false).filter(s=>!seen.has(s)); if(!opts.length){ ok=false; break; }
      const nx=opts[rnd(opts.length)]; st.add(nx); seen.add(nx); cur=nx; }
    if(ok) return {b,stars:st};
  }
}
function genCapture(lvl){
  const types=lvl<=1?['R','B','N','Q']:['Q','R','B','N','P'], nW=lvl<=1?1:(lvl<=3?2:3), nDec=lvl>=4?Math.min(2,lvl-3):0;
  for(let k=0;k<800;k++){
    const b=empty(), tt=['Q','R','B','N','P'][rnd(5)], ts=randSq(b,tt==='P'?1:0,tt==='P'?6:7); b[ts]={t:tt,c:'b'};
    for(let i=0;i<nDec;i++){ let dt; do{ dt=['Q','R','B','N','P'][rnd(5)]; }while(dt===tt); b[randSq(b,1,6)]={t:dt,c:'b'}; }
    const ws=[]; for(let i=0;i<nW;i++){ const wt=types[rnd(types.length)], s=randSq(b,wt==='P'?2:0,wt==='P'?6:7); b[s]={t:wt,c:'w'}; ws.push(s); }
    if(ws.filter(s=>legal(b,s).includes(ts)).length===1) return {b,target:ts,tt};
  }
}
function genEscape(lvl){
  const types=lvl<=1?['R','B']:['R','B','Q','N'];
  for(let k=0;k<800;k++){
    const b=empty(), ks=sq(1+rnd(6),1+rnd(6)); b[ks]={t:'K',c:'w'};
    b[randSq(b)]={t:types[rnd(types.length)],c:'b'}; if(!inCheck(b,'w')) continue;
    if(lvl>=3) b[randSq(b)]={t:types[rnd(types.length)],c:'b'};
    const n=allLegal(b,'w').length; if(inCheck(b,'w')&&n>=1&&n<=6) return {b};
  }
}
function pawnsStart(){ const b=empty(); for(let c=0;c<8;c++){ b[sq(6,c)]={t:'P',c:'w'}; b[sq(1,c)]={t:'P',c:'b'}; } return b; }

function newTask(){
  sel=-1; legalFrom=[]; last=null; busy=false; task={moves:0}; msg(''); $('newBtn').textContent=C().next;
  const lvl=L(mode); $('title').textContent=C().games[mode][0]+' '+C().games[mode][1]+' · '+C().lvl(lvl);
  renderPick();
  if(mode==='learn'){ Bd=empty(); Bd[piece==='P'?sq(6,4):sq(4,3)]={t:piece,c:'w'}; task.piece=piece; task.count=0;
    $('task').textContent=C().learnTask; render(); speak(C().desc[piece]+' '+C().learnTask); task.text=C().desc[piece]+' '+C().learnTask; return; }
  if(mode==='stars'){ const n=Math.min(2+Math.floor((lvl-1)/2),6), rocks=lvl>=3?Math.min(lvl-1,6):0;
    const g=genStars(piece,piece==='P'?Math.min(n,3):n,piece==='P'?0:rocks); Bd=g.b; task.stars=g.stars;
    setTask(C().starsTask(C().dat[piece],task.stars.size)); }
  else if(mode==='capture'){ const g=genCapture(lvl); Bd=g.b; task.target=g.target; task.tt=g.tt; setTask(C().captureTask(C().blackAcc[g.tt])); }
  else if(mode==='escape'){ const g=genEscape(lvl); Bd=g.b; setTask(C().escapeTask); }
  else if(mode==='mate'){ Bd=parse(MATES[(lvl-1)%MATES.length]); setTask(C().mateTask); }
  else if(mode==='pawns'){ Bd=pawnsStart(); setTask(C().pawnsTask); msg(C().yourTurn); }
  render();
}
function renderPick(){
  const pk=$('pick'); pk.innerHTML='';
  if(mode!=='learn'&&mode!=='stars'){ pk.hidden=true; return; } pk.hidden=false;
  (mode==='learn'?['K','Q','R','B','N','P']:['R','B','Q','K','N','P']).forEach(t=>{
    const b=document.createElement('button'); b.id='ch-pk'+t; b.setAttribute('aria-pressed',t===piece);
    b.innerHTML=`<span class="g">${GL[t]}</span>${C().short[t]}`;
    b.onclick=()=>{ if(busy) return; piece=t; store('ch_piece',t); newTask(); }; pk.appendChild(b); });
}

/* ---------- ecrane ---------- */
function updStars(){ $('stars').textContent='⭐ '+stars; }
function updTop(){ $('hintBtn').textContent=hints?C().hintsOn:C().hintsOff; $('hintBtn').setAttribute('aria-pressed',hints); updStars();
  $('sayBtn').textContent=C().listen; $('backBtn').textContent=view==='menu'?C().back:C().menu; }
function showMenu(){
  view='menu'; busy=false; $('play').hidden=true; $('menu').hidden=false; $('title').textContent='♟️ '+C().title; updTop();
  const m=$('menu'); m.innerHTML='';
  if(window.openChessGame){ const b=document.createElement('button'); b.className='ch-card'; b.id='ch-g-game'; b.style.background='#FFE9A8'; b.style.boxShadow='0 8px 0 #E8C66A';
    b.innerHTML=`<span class="ic">🤖♟️</span><span class="nm">${(({ro:'Joacă o partidă',de:'Partie spielen',en:'Play a game'})[lang]||((L10N.misc||{})[lang]||{}).playGame||'Play a game')}</span><span class="lv">${(({ro:'cu robotul sau cu un prieten',de:'gegen Roboter oder Freund',en:'vs robot or a friend'})[lang]||((L10N.misc||{})[lang]||{}).vsRobot||'vs robot or a friend')}</span>`;
    b.onclick=()=>{ root.hidden=true; try{ speechSynthesis.cancel(); }catch(e){} window.openChessGame(); }; m.appendChild(b); }
  GAMES.forEach(g=>{ const b=document.createElement('button'); b.className='ch-card'; b.id='ch-g-'+g; b.dataset.lk='ch:'+g;
    b.innerHTML=`<span class="ic">${C().games[g][0]}</span><span class="nm">${C().games[g][1]}</span><span class="lv">${C().lvl(L(g))}</span>`;
    b.onclick=()=>openGame(g); m.appendChild(b); });
}
function openGame(g){ mode=g; view='play'; $('menu').hidden=true; $('play').hidden=false; updTop(); requestAnimationFrame(()=>{ sizeBoard(); newTask(); }); }
$('backBtn').onclick=()=>{ if(view==='menu'){ root.hidden=true; try{ speechSynthesis.cancel(); }catch(e){} } else showMenu(); };
$('hintBtn').onclick=()=>{ hints=!hints; store('ch_hints',hints?'1':'0'); updTop(); render(); };
$('sayBtn').onclick=()=>{ if(task.text) speak(task.text); };
$('task').onclick=()=>{ if(task.text) speak(task.text); };
$('newBtn').onclick=()=>{ if(view==='play'){ busy=false; newTask(); } };
addEventListener('resize',()=>{ if(!root.hidden&&view==='play') sizeBoard(); });
openGame=(f=>g=>{ if(window.__gate&&window.__gate('ch',g)) return showMenu(); return f(g); })(openGame);
(window.__LR=window.__LR||[]).push(()=>{ if(root.hidden) return; if(view==='play') openGame(mode); else showMenu(); });
window.openChess=()=>{ root.hidden=false; showMenu(); };
window.__chess={pseudo,legal,allLegal,isMate,inCheck,parse,MATES,doMove,genStars,genCapture,genEscape};

function parseStroke(str){
  const t=str.trim().split(/\s+/); let i=0; const pts=[];
  if(t[0]==='D') return {dot:[+t[1],+t[2]]};
  while(i<t.length){ const c=t[i++];
    if(c==='L'){ while(i<t.length&&!isNaN(+t[i])){ pts.push([+t[i],+t[i+1]]); i+=2; } }
    else if(c==='A'){ const [cx,cy,rx,ry,a0,a1]=t.slice(i,i+6).map(Number); i+=6; const n=Math.max(8,Math.ceil(Math.abs(a1-a0)/6));
      for(let k=0;k<=n;k++){ const a=(a0+(a1-a0)*k/n)*Math.PI/180; pts.push([cx+rx*Math.cos(a),cy+ry*Math.sin(a)]); } } }
  const out=[pts[0]];
  for(let k=1;k<pts.length;k++){ const [x0,y0]=out[out.length-1], [x1,y1]=pts[k], d=Math.hypot(x1-x0,y1-y0), n=Math.floor(d/2.5);
    for(let s=1;s<=n;s++) out.push([x0+(x1-x0)*s/n,y0+(y1-y0)*s/n]); if(d>0.01&&n===0) out.push([x1,y1]); }
  return {pts:out};
}

function traceLetter(ch,stg,onDone,opts={}){
  const strokes=(glyph(ch)||[]).map(parseStroke);
  const NS='http://www.w3.org/2000/svg', svg=document.createElementNS(NS,'svg'); svg.setAttribute('viewBox','-5 -18 110 124'); svg.setAttribute('class','rd-pad'); svg.id='rd-pad';
  const mk=(tag,attrs,parent=svg)=>{ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); parent.appendChild(e); return e; };
  [[10,''],[40,' mid'],[80,''],[100,' mid']].forEach(([y,c])=>mk('line',{x1:-5,y1:y,x2:105,y2:y,class:'ln'+c}));
  strokes.forEach(s=>{ if(s.dot) mk('circle',{cx:s.dot[0],cy:s.dot[1],r:5,class:'gdot'}); else mk('path',{d:pathD(s.pts),class:'ghost'}); });
  const doneG=mk('g',{}), prog=mk('path',{class:'prog',d:''}), guide=mk('path',{class:'guide',d:''}), trail=mk('path',{class:'trail',d:''}), marks=mk('g',{});
  stg.appendChild(svg);
  let si=0, pi=0, tracking=false, trailPts=[], offWarned=false;
  if(!opts.silent) setTask(R().writeTask(ch), R().writeTask(ch));
  if(opts.free) return freeTrace(svg,mk,strokes,stg,onDone);
  function drawMarks(){ marks.innerHTML=''; guide.setAttribute('d',''); if(si>=strokes.length) return; const s=strokes[si];
    if(s.dot){ const c=mk('circle',{cx:s.dot[0],cy:s.dot[1],r:6,class:'start pulse'},marks); mk('text',{x:s.dot[0],y:s.dot[1],class:'num'},marks).textContent=si+1; return; }
    guide.setAttribute('d',pathD(s.pts.slice(pi)));
    const p=s.pts[pi], q=s.pts[Math.min(pi+6,s.pts.length-1)], ang=Math.atan2(q[1]-p[1],q[0]-p[0]);
    const ax=p[0]+Math.cos(ang)*12, ay=p[1]+Math.sin(ang)*12, a=ang, w=4;
    mk('path',{class:'arrow',d:`M${(ax+Math.cos(a)*5).toFixed(1)} ${(ay+Math.sin(a)*5).toFixed(1)} L${(ax+Math.cos(a+2.4)*w).toFixed(1)} ${(ay+Math.sin(a+2.4)*w).toFixed(1)} L${(ax+Math.cos(a-2.4)*w).toFixed(1)} ${(ay+Math.sin(a-2.4)*w).toFixed(1)}Z`},marks);
    mk('circle',{cx:p[0],cy:p[1],r:6,class:'start'+(pi===0?' pulse':'')},marks); mk('text',{x:p[0],y:p[1],class:'num'},marks).textContent=si+1; }
  function finishStroke(){ const s=strokes[si]; if(s.dot) mk('circle',{cx:s.dot[0],cy:s.dot[1],r:5,class:'ddone'},doneG); else mk('path',{d:pathD(s.pts),class:'done'},doneG);
    prog.setAttribute('d',''); si++; pi=0; try{ tick(); }catch(e){} drawMarks(); if(si>=strokes.length){ tracking=false; onDone(); } }
  const pt=e=>{ const m=svg.getScreenCTM().inverse(), p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; const r=p.matrixTransform(m); return [r.x,r.y]; };
  const TOL=13;
  svg.addEventListener('pointerdown',e=>{ if(busy||si>=strokes.length) return; e.preventDefault(); try{ svg.setPointerCapture(e.pointerId); }catch(_){}
    const p=pt(e), s=strokes[si]; trailPts=[p];
    if(s.dot){ if(Math.hypot(p[0]-s.dot[0],p[1]-s.dot[1])<TOL+4) finishStroke(); return; }
    if(Math.hypot(p[0]-s.pts[pi][0],p[1]-s.pts[pi][1])<TOL+4){ tracking=true; offWarned=false; } });
  svg.addEventListener('pointermove',e=>{ if(!tracking) return; const p=pt(e), s=strokes[si]; trailPts.push(p); trail.setAttribute('d',pathD(trailPts.slice(-60)));
    let best=-1; for(let k=pi;k<Math.min(pi+10,s.pts.length);k++) if(Math.hypot(p[0]-s.pts[k][0],p[1]-s.pts[k][1])<TOL) best=k;
    if(best>pi){ pi=best; prog.setAttribute('d',pathD(s.pts.slice(0,pi+1))); drawMarks(); }
    else { let near=Infinity; for(let k=Math.max(0,pi-3);k<Math.min(pi+12,s.pts.length);k++) near=Math.min(near,Math.hypot(p[0]-s.pts[k][0],p[1]-s.pts[k][1]));
      if(near>TOL*2){ tracking=false; if(!offWarned){ offWarned=true; oops(svg,null); msg(R().offTrack); } } }
    if(pi>=s.pts.length-2){ tracking=false; finishStroke(); } });
  const up=()=>{ tracking=false; setTimeout(()=>{ if(!tracking) trail.setAttribute('d',''); },300); };
  svg.addEventListener('pointerup',up); svg.addEventListener('pointercancel',up);
  drawMarks();
}

function freeTrace(svg,mk,strokes,stg,onDone){
  const all=strokes.flatMap(s=>s.dot?[s.dot]:s.pts), hit=new Array(all.length).fill(false), ink=mk('g',{});
  let cur=null, curPts=[], outside=0, total=0, finished=false;
  const pt=e=>{ const m=svg.getScreenCTM().inverse(), p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; const r=p.matrixTransform(m); return [r.x,r.y]; };
  const mark=p=>{ let near=Infinity; for(let i=0;i<all.length;i++){ const d=Math.hypot(p[0]-all[i][0],p[1]-all[i][1]); if(d<near) near=d; if(d<11) hit[i]=true; } total++; if(near>18) outside++; };
  const reset=()=>{ ink.innerHTML=''; hit.fill(false); outside=0; total=0; };
  const check=()=>{ const cov=hit.filter(Boolean).length/all.length;
    if(cov>=.85){ if(outside/Math.max(1,total)>.35){ oops(svg,null); msg(R().freeBad); setTimeout(reset,500); return; }
      finished=true; ink.querySelectorAll('path').forEach(p=>p.setAttribute('class','done')); onDone(); } };
  svg.addEventListener('pointerdown',e=>{ if(busy||finished) return; e.preventDefault(); try{ svg.setPointerCapture(e.pointerId); }catch(_){}
    const p=pt(e); curPts=[p]; cur=mk('path',{class:'prog',d:''},ink); mark(p); cur.setAttribute('d',pathD([p,[p[0]+.1,p[1]]])); });
  svg.addEventListener('pointermove',e=>{ if(!cur) return; const p=pt(e), l=curPts[curPts.length-1]; if(Math.hypot(p[0]-l[0],p[1]-l[1])<1.2) return;
    const n=Math.ceil(Math.hypot(p[0]-l[0],p[1]-l[1])/2); for(let i=1;i<=n;i++) mark([l[0]+(p[0]-l[0])*i/n,l[1]+(p[1]-l[1])*i/n]);
    curPts.push(p); cur.setAttribute('d',pathD(curPts)); });
  const up=()=>{ if(!cur) return; cur=null; check(); };
  svg.addEventListener('pointerup',up); svg.addEventListener('pointercancel',up);
  const row=el('div','rd-row'); const cb=el('button','rd-btn',R().clear); cb.onclick=()=>{ if(!finished) reset(); }; row.appendChild(cb); stg.appendChild(row);
}
