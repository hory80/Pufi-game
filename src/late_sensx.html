 thIntro:['Winter im Gewächshaus! Die Pflanzen brauchen Wärme. Sag RoboPufi, was er tun soll, wenn der Sensor Kälte spürt, und drück dann Start.','Ein Sommertag: Nachts ist es kalt, mittags sehr heiß. Mach eine Regel für kalt und eine für heiß!','Pflanzen brauchen auch Licht! Mach Regeln für kalt, für heiß und für dunkel.'],
 thCond:{cold:'Wenn es kalt ist',hot:'Wenn es heiß ist',dark:'Wenn es dunkel ist'},thAct:{heat:'schalte die Heizung ein',fan:'schalte den Ventilator ein',lamp:'mach die Lampe an',none:'tu nichts'},

en:{menu:{sonar:['🦇','The distance sensor'],thermo:['🌡️','The greenhouse'],sort:['🎨','The colour sensor']},

 sonNext:'Now he goes faster! Press Start and stop him on the green spot.',

 sonNext:'Maintenant il va plus vite ! Appuie sur Départ et arrête-le sur la place verte.',
 sonAuto:'Maintenant RoboPufi va très vite et freine tout seul ! Choisis le drapeau où il doit commencer à freiner.',

es:{menu:{sonar:['🦇','El sensor de distancia'],thermo:['🌡️','El invernadero'],sort:['🎨','El sensor de color']},
 sonIntro:'RoboPufi tiene un sensor de distancia, como el murciélago: envía un sonido y escucha el eco. ¡Cuanto más se acerca, más rápido pita! Pulsa Empezar y luego STOP para aparcar en la plaza verde.',
 sonNext:'¡Ahora va más rápido! Pulsa Empezar y páralo en la plaza verde.',

 thCond:{cold:'Cuando hace frío',hot:'Cuando hace calor',dark:'Cuando está oscuro'},thAct:{heat:'enciende la calefacción',fan:'enciende el ventilador',lamp:'enciende la lámpara',none:'no hagas nada'},
 thUnset:'¡Toca el signo de interrogación y elige qué hace RoboPufi!',thFrz:'¡Brrr! Las plantas se han helado. ¿Qué debe hacer RoboPufi cuando hace frío?',thHot:'¡Uf! Las plantas se marchitaron por el calor. ¿Qué debe hacer RoboPufi cuando hace calor?',thDark:'Las plantas no tuvieron luz de noche y no crecen. ¿Qué debe hacer RoboPufi cuando está oscuro?',

 sonIntro:'O RoboPufi tem um sensor de distância, como o morcego: envia um som e ouve o eco. Quanto mais perto, mais depressa apita! Carrega em Começar e depois em STOP para estacionar no lugar verde.',
