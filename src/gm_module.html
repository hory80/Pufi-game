  stopAll(); curRestart=()=>patGame(li); const myGen=gen; const Lv=PATL[li]; let ri=0, errs=0, busy=false, seq=[], holes=[], fill={}, opts=[], svg; const ROUNDS=5;

    return {s,hs}; }
  function setup(){ const g=fresh('pt'+li,gen1,4); seq=g.s; holes=g.hs; fill={};
    const need=holes.map(h=>seq[h]); const pool=[...need]; const all=[...new Set(seq.map(t=>JSON.stringify(t)))].map(x=>JSON.parse(x)); shuf(all).forEach(t=>{ if(pool.length<4&&!pool.some(p=>eq(p,t))) pool.push(t); });

/* ================= 1. TABLA CU ELASTICE ================= */
const area2=P=>{ let s=0; for(let i=0;i<P.length;i++){ const [x1,y1]=P[i],[x2,y2]=P[(i+1)%P.length]; s+=x1*y2-x2*y1; } return s; };
const segX=(a,b,c,d)=>{ const o=(p,q,r)=>Math.sign((q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0])); return o(a,b,c)*o(a,b,d)<0&&o(c,d,a)*o(c,d,b)<0; };
function simple(P){ const n=P.length; for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){ if(Math.abs(i-j)===1||(i===0&&j===n-1)) continue; if(segX(P[i],P[(i+1)%n],P[j],P[(j+1)%n])) return false; } return true; }
const d2=(a,b)=>(a[0]-b[0])**2+(a[1]-b[1])**2;
function clean(P){ const out=[]; const n=P.length; for(let i=0;i<n;i++){ const a=P[(i-1+n)%n], b=P[i], c=P[(i+1)%n]; if((b[0]-a[0])*(c[1]-b[1])-(b[1]-a[1])*(c[0]-b[0])!==0) out.push(b); } return out; }

    if(right&&s.every(v=>v===s[0])) return {n,kind:'sq',side2:s[0]}; if(right) return {n,kind:'rect'}; }
  return {n,kind:n}; }
const OLD={tri:0,sq:1,rect:2,sq3:3,area:4,a4:5,perim:6,tri6:7};
const rr=()=>{ const w=RR(2,5), h=RR(2,4); return [[1,1],[1+w,1],[1+w,1+h],[1,1+h]]; };
const rp=()=>{ const w=RR(2,5), h=RR(1,3); return [[1,2],[1+w,2],[1+w,2+h],[1,2+h]]; };
const GEOL=[{ic:'🔺',t:['tri','sq','rect']},{ic:'🟩',t:['sq3','area','a4']},{ic:'🏡',t:['perim','tri6','area']},{ic:'⬠',t:['pent','hex','a6']},{ic:'🏆',t:null}];
function geoGame(li){ li=li||0;
  stopAll(); curRestart=()=>geoGame(li); const myGen=gen; const Lv=GEOL[li];
  const plan=(Lv.t||fresh('gmix',()=>shuf(['tri','sq','rect','sq3','area','a4','perim','tri6','pent','hex','a6']).slice(0,4),2)).map(t=>({t,poly:t==='area'?fresh('ga',rr,4):t==='perim'?fresh('gp',rp,4):null}));
  let ti=0, errs=0, P=[], closed=false, busy=false, svg, ghost='';
  const F=frame(X().geoIntro,plan.length), N=7, S=70, O=50, pp=([x,y])=>[O+x*S,O+y*S];
  const TT=T=>OLD[T.t]!=null?X().geoT[OLD[T.t]]:XN().geoX[T.t], TH=T=>OLD[T.t]!=null?X().geoHint[OLD[T.t]]:XN().geoXH[T.t];
  function draw(extra){ const T=plan[ti]; let s=`<svg viewBox="0 0 520 520"><rect x="6" y="6" width="508" height="508" rx="24" fill="#D9A066" stroke="#A86B32" stroke-width="6"/>`;
    for(let i=0;i<N-1;i++) for(let j=0;j<N-1;j++) s+=`<rect x="${O+i*S+2}" y="${O+j*S+2}" width="${S-4}" height="${S-4}" rx="6" fill="rgba(255,255,255,.12)"/>`;

  async function ok(msg){ busy=true; chime(); award(); F.dot(ti+1); try{ confetti(12); }catch(e){} F.set('🎉 '+msg); await spW(msg,1700); if(myGen!==gen) return; ti++; busy=false; P=[]; closed=false; if(ti>=plan.length) return finish('ggeo'+li,rate(errs),nxt('geo',li)); task(); }

      const opts=shuf([...new Set([ans,ans+1,ans-1,ans+2,ans-2].filter(v=>v>0))].slice(0,4)); if(!opts.includes(ans)) opts[0]=ans; shuf(opts).forEach(v=>{ const b=el('button','gm-num',String(v)); b.onclick=()=>answer(v,ans,b); box.appendChild(b); }); F.ctrl.append(box,btn(X().hint,'',hint)); }

  const SOL={tri:[[1,1],[4,1],[1,4]],sq:[[1,1],[3,1],[3,3],[1,3]],rect:[[1,1],[5,1],[5,3],[1,3]],sq3:[[1,1],[4,1],[4,4],[1,4]],a4:[[1,1],[3,1],[3,3],[1,3]],tri6:[[1,1],[5,1],[1,4]],pent:[[2,1],[4,1],[5,3],[3,5],[1,3]],hex:[[2,1],[4,1],[5,3],[4,5],[2,5],[1,3]],a6:[[1,1],[4,1],[4,3],[1,3]]};
