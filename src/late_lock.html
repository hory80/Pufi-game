<style>
[data-lk].pl-lock{position:relative;filter:saturate(.55);opacity:.8}
[data-lk].pl-lock::after{content:'🔒';position:absolute;top:6px;right:8px;font-size:1.15rem;line-height:1;filter:none}
.pl-ov{position:fixed;inset:0;z-index:99998;background:rgba(36,50,95,.55);display:flex;align-items:center;justify-content:center}
.pl-box{background:#fff;border-radius:26px;padding:22px 24px;width:min(460px,90vw);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;font-weight:800;color:#24325f;box-sizing:border-box}
.pl-box .big{font-size:3rem;line-height:1}
.pl-box p{margin:0;font-size:1.1rem;line-height:1.35}
.pl-box button{font:inherit;font-weight:800;font-size:1.05rem;border:3px solid #24325f;background:#fff;color:#24325f;border-radius:999px;padding:8px 18px;cursor:pointer}
.pl-box button.go{background:#3ecf8e;border-color:#2bb57a;color:#fff}
.pl-box .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
</style>
<script>
/* Versiunea gratuită vs „Deblochează tot”.
   Pe web nu se blochează nimic. În aplicație decide aplicația nativă (iap.status):
   true = totul deblocat (cumpărat, perioada gratuită de lansare sau instalat înainte de data-limită). */
(()=>{
const FREE={mw:['add','cmp','sb','ten'],tm:['explore','balloon','cuckoo','pizza','wake','order'],rd:['alpha','fish','hunt','read','story','my'],ch:['learn','stars'],cg:['easy','two'],
  gm:['geo','tan'],rb:['prog','gar'],sa:['w0','sprint','g0','g1','g2','g3','g4'],pq:['0','1'],nt:[]};
const TXT={ro:{msg:'Jocul acesta e în versiunea completă.',ask:'Roagă un părinte să te ajute.',par:'👨‍👩‍👧 Pentru părinți',close:'✖ Închide'},
 de:{msg:'Dieses Spiel gehört zur Vollversion.',ask:'Frag einen Erwachsenen um Hilfe.',par:'👨‍👩‍👧 Für Eltern',close:'✖ Schließen'},
 en:{msg:'This game is part of the full version.',ask:'Ask a grown-up to help you.',par:'👨‍👩‍👧 For parents',close:'✖ Close'},
 fr:{msg:'Ce jeu fait partie de la version complète.',ask:'Demande à un adulte de t’aider.',par:'👨‍👩‍👧 Pour les parents',close:'✖ Fermer'},
 it:{msg:'Questo gioco fa parte della versione completa.',ask:'Chiedi aiuto a un adulto.',par:'👨‍👩‍👧 Per i genitori',close:'✖ Chiudi'},
 es:{msg:'Este juego es parte de la versión completa.',ask:'Pide ayuda a un adulto.',par:'👨‍👩‍👧 Para los padres',close:'✖ Cerrar'},
 pt:{msg:'Este jogo faz parte da versão completa.',ask:'Peça ajuda a um adulto.',par:'👨‍👩‍👧 Para os pais',close:'✖ Fechar'},
 nl:{msg:'Dit spel hoort bij de volledige versie.',ask:'Vraag een volwassene om hulp.',par:'👨‍👩‍👧 Voor ouders',close:'✖ Sluiten'},
 pl:{msg:'Ta gra jest w pełnej wersji.',ask:'Poproś dorosłego o pomoc.',par:'👨‍👩‍👧 Dla rodziców',close:'✖ Zamknij'},
 hu:{msg:'Ez a játék a teljes verzió része.',ask:'Kérj segítséget egy felnőttől.',par:'👨‍👩‍👧 Szülőknek',close:'✖ Bezárás'},
 uk:{msg:'Ця гра є в повній версії.',ask:'Попроси дорослого допомогти.',par:'👨‍👩‍👧 Для батьків',close:'✖ Закрити'},
 ru:{msg:'Эта игра есть в полной версии.',ask:'Попроси взрослого помочь.',par:'👨‍👩‍👧 Для родителей',close:'✖ Закрыть'}};
const T=()=>TXT[lang]||TXT.en;
const NT=()=>((window.L10N||{}).nt||{})[lang]||((window.L10N||{}).nt||{}).en||{};
const isLocked=(mod,key)=>!!window.native&&window.__premium===false&&!(FREE[mod]||[]).includes(String(key));
window.__isLocked=isLocked;
function paint(){ document.querySelectorAll('[data-lk]').forEach(e=>{ const [m,k]=e.dataset.lk.split(':'); e.classList.toggle('pl-lock',isLocked(m,k)); }); }
window.__lkPaint=paint;
let pt=0; new MutationObserver(()=>{ if(pt) return; pt=requestAnimationFrame(()=>{ pt=0; paint(); }); }).observe(document.body,{childList:true,subtree:true});
function paywall(){
  if(document.querySelector('.pl-ov')) return;
  try{ speechSynthesis.cancel(); }catch(e){}
  const ov=document.createElement('div'); ov.className='pl-ov'; const b=document.createElement('div'); b.className='pl-box'; ov.appendChild(b);
  const base=()=>{ b.innerHTML=`<div class="big">🔒</div><p>${T().msg}</p><p style="font-weight:600">${T().ask}</p><div class="row"><button class="go" data-a="par">${T().par}</button><button data-a="x">${T().close}</button></div>`;
    b.querySelector('[data-a=x]').onclick=()=>ov.remove();
    b.querySelector('[data-a=par]').onclick=async()=>{ const ok=window.native?await window.native.call('gate',{lang}):true; if(ok) buy(); }; };
  const buy=async()=>{ b.innerHTML=`<div class="big">💎</div><p>${NT().buyT||''}</p><div class="row"></div><button data-a="x">${T().close}</button>`;
    b.querySelector('[data-a=x]').onclick=()=>ov.remove(); const row=b.querySelector('.row');
    const price=await window.native.call('iap.price'); const bb=document.createElement('button'); bb.className='go'; bb.textContent=NT().buy?NT().buy(price):'Unlock';
    bb.onclick=async()=>{ window.__setPremium(!!await window.native.call('iap.buy')); if(window.__premium) ov.remove(); };
    const rs=document.createElement('button'); rs.textContent=NT().restore||'Restore';
    rs.onclick=async()=>{ window.__setPremium(!!await window.native.call('iap.restore')); if(window.__premium) ov.remove(); };
    row.append(bb,rs); };
  base(); ov.onclick=e=>{ if(e.target===ov) ov.remove(); }; document.body.appendChild(ov);
  try{ typeof say==='function'&&say(T().msg+' '+T().ask); }catch(e){}
}
window.__paywall=paywall;
window.__gate=(mod,key)=>{ if(!isLocked(mod,key)) return false; paywall(); return true; };
/* starea vine de la aplicația nativă; la schimbare reafișăm ecranele */
window.__setPremium=v=>{ const was=window.__premium; window.__premium=!!v; paint(); if(was!==window.__premium) (window.__LR||[]).forEach(f=>{ try{ f(); }catch(e){} }); };
paint();
})();
</script>
