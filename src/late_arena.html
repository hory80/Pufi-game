<style>
/* ===== Arena Anzan: concursuri de viteză la soroban ===== */
#sp-root{position:fixed;inset:0;z-index:58;display:flex;flex-direction:column;gap:8px;box-sizing:border-box;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(env(safe-area-inset-bottom,0px) + 10px);font-family:var(--display);color:#fff;background:radial-gradient(ellipse at 50% 0%,#4B3AA8 0%,#25306B 55%,#141B45 100%);overflow:hidden}
#sp-root[hidden]{display:none}
#sp-root .sp-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#sp-root .sp-top h2{flex:1 1 160px;margin:0;text-align:center;font-size:clamp(1.3rem,3.6vw,2rem);text-shadow:0 0 18px rgba(255,212,59,.6)}
#sp-root .ch-btn,#sp-root .ch-pill{color:#24325f}
.sp-body{flex:1;min-height:0;overflow:auto;width:100%;max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding-bottom:8px}
.sp-hero{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.08);border-radius:26px;padding:12px 16px}
.sp-hero .fox{font-size:clamp(3rem,10vh,4.6rem);line-height:1;animation:spBob 2s ease-in-out infinite;position:relative}
.sp-hero .fox svg{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);width:76%}
.sp-hero .who{flex:1;font-weight:800;font-size:clamp(1.05rem,2.8vw,1.5rem);line-height:1.2}
.sp-hero .who small{display:block;font-size:.72em;opacity:.8;font-weight:700}
@keyframes spBob{50%{transform:translateY(-5px)}}
.sp-shelf{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.sp-shelf .bt{width:clamp(46px,8vw,70px);position:relative;opacity:.35;filter:grayscale(.6);cursor:pointer;background:none;border:none;padding:0}
.sp-shelf .bt.got{opacity:1;filter:none}
.sp-shelf .bt.nx{opacity:1;filter:none;animation:spPulse 1.2s ease-in-out infinite}
.sp-shelf .bt svg{width:100%;display:block}
@keyframes spPulse{50%{transform:scale(1.15)}}
.sp-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:12px}
.sp-card{background:#fff;color:#24325f;border-radius:26px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 0 rgba(0,0,0,.25);position:relative}
.sp-card h3{margin:0;font-size:clamp(1.25rem,3vw,1.6rem);display:flex;align-items:center;gap:8px}
.sp-card p{margin:0;font-weight:700;opacity:.8;font-size:clamp(.95rem,2.2vw,1.1rem)}
.sp-card .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.sp-b{font:inherit;font-weight:800;font-size:clamp(1rem,2.5vw,1.25rem);border:3px solid #24325f;background:#fff;color:#24325f;border-radius:999px;padding:6px 18px;cursor:pointer;min-height:50px}
.sp-b.go{background:#3ECF8E;border-color:#2bb57a;color:#fff}
.sp-b.gold{background:#FFD43B;border-color:#E0A800}
.sp-b:active{transform:translateY(3px)}
.sp-set{display:flex;flex-direction:column;gap:10px;background:#fff;color:#24325f;border-radius:26px;padding:14px 16px}
.sp-set .ln{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;border-bottom:2px dashed #E6ECF7;padding-bottom:8px}
.sp-set .ln:last-child{border-bottom:none}
.sp-set .lb{font-weight:800;font-size:clamp(1rem,2.4vw,1.2rem)}
.sp-chips{display:flex;gap:6px;flex-wrap:wrap}
.sp-chips button{font:inherit;font-weight:800;font-size:clamp(.95rem,2.2vw,1.1rem);border:3px solid #DCE3F2;background:#F5F7FD;color:#24325f;border-radius:999px;padding:5px 12px;cursor:pointer;min-height:44px}
.sp-chips button.on{background:#5B4BD6;border-color:#4436B5;color:#fff}
.sp-step{display:flex;align-items:center;gap:6px}
.sp-step button{font:inherit;font-weight:800;font-size:1.5rem;width:48px;height:48px;border-radius:50%;border:3px solid #24325f;background:#fff;color:#24325f;cursor:pointer;line-height:1}
.sp-step b{min-width:4.2em;text-align:center;font-size:clamp(1.2rem,3vw,1.5rem)}
.sp-note{font-weight:800;color:#5B4BD6;text-align:center}
/* ecranul de joc */
.sp-run{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;width:100%;max-width:1100px;margin:0 auto}
.sp-hud{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.sp-hud .p{background:rgba(255,255,255,.14);border-radius:999px;padding:4px 14px;font-weight:800;font-size:clamp(1rem,2.6vw,1.35rem);font-variant-numeric:tabular-nums}
.sp-hud .p.warn{background:#E8505B;animation:spPulse .8s infinite}
.sp-hud .p.fire{background:#FF9F43}
.sp-main{flex:1;min-height:0;display:grid;grid-template-columns:1fr minmax(260px,36%);gap:12px}
@media (max-aspect-ratio:1/1){.sp-main{grid-template-columns:1fr;grid-template-rows:1fr auto}}
.sp-stage{position:relative;min-height:0;border-radius:28px;background:rgba(0,0,0,.25);box-shadow:inset 0 0 0 3px rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;overflow:hidden;transition:background .2s}
.sp-stage.ok{background:rgba(62,207,142,.45)}.sp-stage.no{background:rgba(232,80,91,.45)}
.sp-num{font-size:clamp(4rem,22vmin,12rem);font-weight:800;font-variant-numeric:tabular-nums;line-height:1;text-shadow:0 0 30px rgba(255,212,59,.75);color:#FFF3B0}
.sp-num.neg{color:#FFB3C0;text-shadow:0 0 30px rgba(255,107,181,.7)}
.sp-dot{width:26px;height:26px;border-radius:50%;background:#FFD43B;box-shadow:0 0 24px #FFD43B;animation:spPulse .5s infinite}
.sp-col{display:flex;flex-direction:column;align-items:flex-end;font-variant-numeric:tabular-nums;font-weight:800;line-height:1.1;color:#FFF3B0;padding:10px 24px}
.sp-col span{display:block}
.sp-col .ln2{border-top:4px solid #FFF3B0;width:100%;margin-top:6px;text-align:right;color:#fff}
.sp-ear{font-size:clamp(5rem,20vmin,10rem);animation:spPulse 1s infinite}
.sp-cnt{font-size:clamp(5rem,26vmin,13rem);font-weight:800;color:#FFD43B;animation:spIn .9s ease-out}
@keyframes spIn{0%{transform:scale(2.2);opacity:0}30%{opacity:1}100%{transform:scale(1)}}
.sp-fb{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#fff;color:#24325f;border-radius:999px;padding:6px 18px;font-weight:800;font-size:clamp(1.1rem,3vw,1.6rem);white-space:nowrap}
.sp-side{display:flex;flex-direction:column;gap:8px;min-height:0}
.sp-out{background:#fff;color:#24325f;border-radius:20px;min-height:clamp(54px,9vh,78px);display:flex;align-items:center;justify-content:center;font-size:clamp(2rem,6vh,3.2rem);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.sp-out.ph{color:#9AA5C8;font-size:clamp(1.2rem,3.4vh,1.7rem)}
.sp-keys{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:8px}
.sp-keys button{font:inherit;font-weight:800;font-size:clamp(1.6rem,5vh,2.6rem);border:none;border-radius:18px;background:#fff;color:#24325f;box-shadow:0 5px 0 rgba(0,0,0,.3);cursor:pointer;min-height:48px;touch-action:manipulation}
.sp-keys button:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.sp-keys .ok{background:#3ECF8E;color:#fff}.sp-keys .del{background:#FFE0C7}
.sp-keys.off button{opacity:.35;pointer-events:none}
@media (max-aspect-ratio:1/1){.sp-keys{grid-template-columns:repeat(6,1fr);grid-auto-rows:auto}.sp-keys button{order:var(--o,20)}.sp-keys button{min-height:clamp(50px,7.5vh,70px)}}
.sp-track{position:absolute;left:12px;right:12px;top:10px;height:44px;border-radius:999px;background:rgba(255,255,255,.12)}
.sp-track span{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:30px;transition:left .5s ease-out;line-height:1}
.sp-track .fin{right:6px;left:auto;transform:translateY(-50%)}
.sp-res{display:flex;flex-direction:column;align-items:center;gap:10px;background:#fff;color:#24325f;border-radius:28px;padding:16px;text-align:center}
.sp-res .big{font-size:clamp(2.6rem,9vh,4.2rem);font-weight:800;line-height:1}
.sp-res h3{margin:0;font-size:clamp(1.3rem,3.4vw,1.8rem)}
.sp-res table{border-collapse:collapse;font-weight:800;font-variant-numeric:tabular-nums}
.sp-res td{padding:3px 10px;border-bottom:1px solid #E6ECF7}
.sp-res td.q{font-size:.85em;opacity:.75;max-width:52vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-res .no{color:#E8505B}.sp-res .yes{color:#2bb57a}
.sp-belt-win svg{width:min(260px,60vw);animation:spIn 1.2s ease-out}
.sp-fire{animation:spFire .6s ease-out}
@keyframes spFire{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
/* card în meniul sorobanului */
.sa-arena{font:inherit;width:100%;flex:none;border:none;border-radius:24px;padding:12px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;color:#fff;text-align:left;background:linear-gradient(120deg,#5B4BD6,#25306B);box-shadow:0 7px 0 #1a2150;position:relative;overflow:hidden}
.sa-arena:active{transform:translateY(5px);box-shadow:0 2px 0 #1a2150}
.sa-arena .ic{font-size:clamp(2.4rem,7vh,3.4rem);line-height:1}
.sa-arena b{display:block;font-size:clamp(1.25rem,3.2vw,1.7rem)}
.sa-arena span.s{font-weight:700;opacity:.85;font-size:clamp(.9rem,2.2vw,1.1rem)}
.sa-arena .bl{margin-left:auto;width:clamp(60px,10vw,90px);flex:none}
.sa-arena::after{content:'';position:absolute;top:-40%;left:-30%;width:30%;height:180%;background:rgba(255,255,255,.18);transform:rotate(20deg);animation:spShine 3.5s ease-in-out infinite}
@keyframes spShine{0%,60%{left:-30%}100%{left:130%}}
</style>

const rnd=d=>d<=1?RR(1,9):RR(10**(d-1),10**d-1);
function genSeq(d,n,mix){ const a=[], lo=d<=1?1:10**(d-1), hi=10**d-1; let tot=0, prev=0;
  for(let i=0;i<n;i++){ let x, neg=false;
    if(i>0&&mix&&tot>lo&&Math.random()<.42){ const top=Math.min(hi,tot-1); if(top>=lo){ neg=true; let k=0; do{ x=RR(lo,top); }while(x===prev&&top>lo&&k++<8); } }
    if(!neg){ let k=0; do{ x=rnd(d); }while(x===prev&&k++<8); }
    a.push(neg?-x:x); tot+=neg?-x:x; prev=x; }
  return {seq:a,ans:tot}; }
function genItem(c){
  if(c.type==='mul'){ const a=rnd(c.d), b=Math.max(2,rnd(c.d2||1)); return {kind:'mul',a,b,ans:a*b}; }
  if(c.type==='div'){ const q=Math.max(2,rnd(c.d)), b=Math.max(2,rnd(c.d2||1)); return {kind:'div',a:q*b,b,ans:q}; }
  const g=genSeq(c.d,c.n,c.mix); return {kind:c.type,seq:g.seq,ans:g.ans}; }

  const save=()=>{ LS.set('sp_cfg',c); draw(); };
  const chips=(lab,opts,cur,set)=>{ const ln=el('div','ln'); ln.appendChild(el('div','lb',lab)); const ch=el('div','sp-chips'); opts.forEach(([v,t])=>{ const b=el('button',v===cur?'on':'',t); b.onclick=()=>{ set(v); save(); }; ch.appendChild(b); }); ln.appendChild(ch); box.appendChild(ln); };
  const step=(lab,key,fmt)=>{ const ln=el('div','ln'); ln.appendChild(el('div','lb',lab)); const st=el('div','sp-step'); const L=V[key]; let i=Math.max(0,L.indexOf(c[key])); if(L.indexOf(c[key])<0) c[key]=L[0];
    const mk=(t,dv)=>{ const b=el('button','',t); b.onclick=()=>{ i=Math.max(0,Math.min(L.length-1,L.indexOf(c[key])+dv)); c[key]=L[i]; save(); }; return b; };
    st.append(mk('−',-1),el('b','',fmt?fmt(c[key]):c[key]),mk('+',1)); ln.appendChild(st); box.appendChild(ln); };
  function draw(){ box.innerHTML='';
    chips(X().type,['flash','cols','listen','mul','div'].map((v,i)=>[v,X().types[i]]),c.type,v=>c.type=v);
    step(X().digits,'d');
    if(c.type==='mul'||c.type==='div') step(X().digits2,'d2');
    else { step(X().count,'n'); chips(X().ops,[[0,X().opAdd],[1,X().opMix]],c.mix,v=>c.mix=v); }
    if(c.type==='flash') step(X().speed,'s',v=>v+' s');
    if(c.type==='listen') step(X().pause,'p',v=>v+' s');
    step(X().tasks,'tasks');
    if(c.type==='cols'||c.type==='mul'||c.type==='div') step(X().limit,'lim',v=>v?v+' '+X().min:X().noLimit);
    if(c.type==='flash') box.appendChild(el('div','sp-note',X().total(+(c.s*c.n).toFixed(2))));
    const row=el('div','ln'); const go=el('button','sp-b go',X().start); go.style.cssText='flex:1;font-size:1.5rem'; go.onclick=()=>start({mode:'custom',cfg:Object.assign({},c)}); row.appendChild(go);
    const sb=el('button','sp-b','🔊'); sb.onclick=()=>sp(X().customInfo+' '+cfgDesc(c)); row.appendChild(sb); box.appendChild(row); }
  draw(); }
/* ---- rularea unei probe ---- */
let actx=null; function tick(f,d){ try{ actx=actx||(typeof ctx!=='undefined'&&ctx)||new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime; o.type='sine'; o.frequency.value=f||880; g.gain.setValueAtTime(.09,t); g.gain.exponentialRampToValueAtTime(.001,t+(d||.06)); o.connect(g).connect(actx.destination); o.start(t); o.stop(t+(d||.06)+.02); }catch(e){} }
function stopRun(){ if(run){ run.dead=true; clearInterval(run.timer); } run=null; document.removeEventListener('keydown',onKey); try{ speechSynthesis.cancel(); }catch(e){} }
const fmtT=s=>{ s=Math.max(0,Math.ceil(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
function start(o){ stopRun(); view='run'; const c=o.cfg; run={...o,c,i:0,ok:0,items:[],ans:'',busy:true,combo:0,t0:0,deadline:0,dead:false};
  top('🏁 '+(o.mode==='exam'||o.mode==='practice'?X().belts[o.belt]:o.mode==='sprint'?X().sprint.replace(/^\S+\s/,''):X().custom.replace(/^\S+\s/,'')));
  body.innerHTML=`<div class="sp-run"><div class="sp-hud"><div class="p" id="sp-prog"></div><div class="p" id="sp-clock" hidden></div><div class="p fire" id="sp-combo" hidden></div><button class="sp-b" id="sp-say" style="min-height:40px;padding:2px 12px">🔊</button></div>
   <div class="sp-main"><div class="sp-stage" id="sp-stage"></div><div class="sp-side"><div class="sp-out ph" id="sp-out"></div><div class="sp-keys off" id="sp-keys"></div></div></div></div>`;
  const keys=$('keys'); ['7','8','9','4','5','6','1','2','3','⌫','0','✔'].forEach(k=>{ const b=el('button',k==='✔'?'ok':k==='⌫'?'del':'',k); b.style.setProperty('--o',{'0':10,'⌫':11,'✔':12}[k]||k); b.onpointerdown=e=>{ e.preventDefault(); press(k); }; keys.appendChild(b); });
  if(o.mode!=='sprint'&&o.mode!=='exam'){ const s=el('button','del',X().skip); s.style.gridColumn='span 3'; s.style.fontSize='1.2rem'; s.onpointerdown=e=>{ e.preventDefault(); if(!run||run.busy) return; submit(true); }; keys.appendChild(s); }
  $('say').onclick=()=>{ if(!run) return; const it=run.items[run.i]; if(run.c.type==='flash'||run.c.type==='listen'){ sp(X().ask); return; } if(it) sp(speakQ(it)); };
  document.addEventListener('keydown',onKey); prog(); countdown(); }
function onKey(e){ if(!run||root.hidden) return; if(/^[0-9]$/.test(e.key)) press(e.key); else if(e.key==='Backspace') press('⌫'); else if(e.key==='Enter') press('✔'); }
function prog(){ if(!run) return; $('prog').textContent=run.mode==='sprint'?'✅ '+run.ok:`${Math.min(run.i+1,run.c.tasks)} / ${run.c.tasks}`; }
async function countdown(){ const my=run, st=$('stage'); sp(X().ready);
  for(const n of ['3','2','1']){ if(run!==my) return; st.innerHTML=`<div class="sp-cnt">${n}</div>`; tick(660,.12); await wait(800); }
  if(run!==my) return; tick(990,.25); run.t0=performance.now();
  if(run.c.lim){ run.deadline=run.t0+run.c.lim*60000; $('clock').hidden=false; run.timer=setInterval(()=>{ if(!run||run!==my) return; const left=(run.deadline-performance.now())/1000; $('clock').textContent='⏱ '+fmtT(left); $('clock').classList.toggle('warn',left<=10); if(left<=0){ clearInterval(run.timer); timeUp(); } },250); }
  else { $('clock').hidden=false; run.timer=setInterval(()=>{ if(run===my) $('clock').textContent='⏱ '+fmtT((performance.now()-run.t0)/1000); },500); }
  next(); }
function speakQ(it){ if(it.kind==='mul') return `${it.a} ${X().times} ${it.b}`; if(it.kind==='div') return `${it.a} ${X().divby} ${it.b}`; return it.seq.map((v,i)=>(i?(v<0?X().minus:X().plus)+' ':'')+Math.abs(v)).join(', '); }
function setOut(){ const o=$('out'); if(!o) return; o.classList.toggle('ph',!run.ans); o.textContent=run.ans||(run.busy?'…':X().ask); }
async function next(){ const my=run; if(!run||run.dead) return; if(run.i>=run.c.tasks) return finish();
  const it=genItem(run.c); run.items[run.i]=it; it.given=null; run.ans=''; run.busy=true; setOut(); prog(); $('keys').classList.add('off');
  const st=$('stage'); st.className='sp-stage';
  const trackHTML=run.mode==='sprint'?`<div class="sp-track"><span id="sp-ghost" style="left:4%">👻</span><span id="sp-me" style="left:4%">🦊</span><span class="fin">🏁</span></div>`:'';
  if(it.kind==='flash'){ st.innerHTML='<div class="sp-dot"></div>'; await wait(700); const ms=run.c.s*1000, show=Math.max(60,ms*.78), gap=Math.max(40,ms-show);
    for(const v of it.seq){ if(run!==my||run.dead) return; st.innerHTML=`<div class="sp-num${v<0?' neg':''}">${v<0?'−':''}${Math.abs(v)}</div>`; if(ms>=300) tick(1046,.04); await hold(show); if(run!==my) return; st.innerHTML=''; await hold(gap); }
    if(run!==my) return; st.innerHTML='<div class="sp-num" style="opacity:.5">?</div>'; }
  else if(it.kind==='listen'){ st.innerHTML='<div class="sp-ear">👂</div>'; await sp(X().listen); await wait(400);
    for(let i=0;i<it.seq.length;i++){ if(run!==my||run.dead) return; const v=it.seq[i]; const t=(i?(v<0?X().minus:X().plus)+' ':'')+Math.abs(v); const ok=await sp(t);
      if(ok===false){ st.innerHTML=`<div class="sp-num${v<0?' neg':''}">${v<0?'−':''}${Math.abs(v)}</div>`; await wait(1200); st.innerHTML='<div class="sp-ear">👂</div>'; } await wait(run.c.p*1000); }
    if(run!==my) return; st.innerHTML='<div class="sp-num" style="opacity:.5">?</div>'; }
  else if(it.kind==='cols'){ const n=it.seq.length, H=st.clientHeight-(run.mode==='sprint'?64:20), mx=Math.max(...it.seq.map(v=>String(Math.abs(v)).length))+1, fs=Math.max(16,Math.min(74,H/((n+1)*1.18+.6),(st.clientWidth-50)/(mx*.62)))+'px';
    st.innerHTML=trackHTML+`<div class="sp-col" style="font-size:${fs};${run.mode==='sprint'?'margin-top:50px':''}">${it.seq.map(v=>`<span>${v<0?'−':''}${Math.abs(v)}</span>`).join('')}<span class="ln2">?</span></div>`; }
  else { st.innerHTML=trackHTML+`<div class="sp-num" style="font-size:clamp(3rem,13vmin,8rem)">${it.a} ${it.kind==='mul'?'×':'÷'} ${it.b}</div>`; }
  if(run.mode==='sprint') moveTrack();
  run.busy=false; setOut(); $('keys').classList.remove('off'); }
function hold(ms){ return new Promise(r=>{ const t0=performance.now(); const f=()=>{ if(performance.now()-t0>=ms-8) r(); else requestAnimationFrame(f); }; requestAnimationFrame(f); }); }
function press(k){ if(!run||run.busy) return;
  if(k==='⌫'){ run.ans=run.ans.slice(0,-1); setOut(); return; }
  if(k==='✔'){ if(run.ans) submit(false); return; }
  if(run.ans.length>=9) return; run.ans=(run.ans==='0'?'':run.ans)+k; setOut();
  if(run.mode==='sprint'&&+run.ans===run.items[run.i].ans) submit(false); }
async function submit(skip){ const my=run, it=run.items[run.i]; run.busy=true; $('keys').classList.add('off');
  it.given=skip?null:+run.ans; const ok=!skip&&it.given===it.ans; const st=$('stage');
  if(ok){ run.ok++; run.combo++; st.classList.add('ok'); tick(1320,.08); setTimeout(()=>tick(1760,.1),70);
    if(run.combo>=3){ const c=$('combo'); c.hidden=false; c.textContent='🔥 x'+run.combo; c.classList.remove('sp-fire'); void c.offsetWidth; c.classList.add('sp-fire'); if(run.combo%5===0) try{ confetti(14); }catch(e){} } }
  else { run.combo=0; $('combo').hidden=true; st.classList.add('no'); try{ beep(false); }catch(e){} }
  if(!ok||run.mode!=='sprint') st.insertAdjacentHTML('beforeend',`<div class="sp-fb">${ok?'✅ '+X().ok:'❌ '+X().was(it.ans)}</div>`);
  await wait(run.mode==='sprint'?(ok?250:1100):(ok?650:1500)); if(run!==my||run.dead) return;
  run.i++; if(run.mode==='sprint') run.c.tasks=run.i+1; next(); }
function moveTrack(){ const rec=(LS.get('sp_rec',{})['s'+run.lvl])||0, goal=Math.max(rec,8)+2, me=$('me'), gh=$('ghost'); if(!me) return;
  me.style.left=(4+Math.min(1,run.ok/goal)*84)+'%'; const el2=(performance.now()-run.t0)/60000; gh.style.left=(4+Math.min(1,rec*el2/goal)*84)+'%'; gh.style.opacity=rec?1:0; }
setInterval(()=>{ if(run&&run.mode==='sprint'&&!run.busy) moveTrack(); },500);
function timeUp(){ if(!run||run.dead) return; const my=run; run.busy=true; try{ beep(false); }catch(e){}
  if(run.mode==='sprint'){ run.items.length=run.i; run.c.tasks=run.i; } else { for(let k=run.i;k<run.c.tasks;k++){ if(!run.items[k]) run.items[k]=genItem(run.c); run.items[k].given=null; } }
  $('stage').innerHTML=`<div class="sp-cnt" style="font-size:clamp(2.4rem,9vmin,5rem)">⏰ ${X().timeUp}</div>`; sp(X().timeUp); setTimeout(()=>{ if(run===my) finish(true); },1400); }
function finish(){ if(!run) return; const r=run; if(r.ok>0){ try{ window.__lvDone&&window.__lvDone(1); }catch(_e){} } clearInterval(r.timer); r.dead=true; document.removeEventListener('keydown',onKey); view='res'; top('🏁 '+X().res);
  const total=r.mode==='sprint'?r.ok:r.c.tasks, secs=(performance.now()-r.t0)/1000; let head='', extra='', stars2=0, speak='';
  if(r.mode==='sprint'){ const recs=LS.get('sp_rec',{}), k='s'+r.lvl, old=recs[k]||0; const isRec=r.ok>old; if(isRec){ recs[k]=r.ok; LS.set('sp_rec',recs); }
    head=`<div class="big">🏁 ${r.ok}</div><h3>${X().solved(r.ok)}</h3>${isRec?`<h3 style="color:#E0A800">${X().newRec}</h3>`:`<p>🏆 ${X().record}: ${old}</p>`}`; stars2=Math.floor(r.ok/5)+(isRec?2:0); speak=X().solved(r.ok)+(isRec?' '+X().newRec:''); if(isRec) try{ confetti(60); }catch(e){} }
  else { const pass=r.mode==='exam'&&r.ok>=r.c.need, pct=Math.round(r.ok/total*100);
    head=`<div class="big">${r.ok} / ${total}</div><h3>${X().score(r.ok,total)} · ${pct}%</h3><p>⏱ ${X().time}: ${fmtT(secs)}</p>`;
    stars2=Math.max(r.ok?1:0,Math.floor(r.ok/3)); speak=X().score(r.ok,total);
    if(r.mode==='exam'){ if(pass){ const nb=r.belt; if(got<=nb){ got=nb+1; LS.set('sp_belt',got); } head=`<div class="sp-belt-win">${beltSVG(nb)}</div><h3>${X().passed(X().belts[nb])}</h3>`+head; stars2+=5; speak=X().passed(X().belts[nb]); try{ confetti(80); }catch(e){} }
      else { extra=`<p style="font-weight:800">${X().failed(r.c.need)}</p>`; speak+='. '+X().failed(r.c.need); } } }
  const bad=r.items.slice(0,total).filter(it=>it&&it.given!==it.ans);
  let tbl=''; if(r.mode!=='sprint'){ tbl=bad.length?`<h3>${X().mistakes}</h3><table>${bad.slice(0,30).map(it=>`<tr><td class="q">${qText(it)}</td><td class="no">${X().you}: ${it.given==null?'—':it.given}</td><td class="yes">✔ ${it.ans}</td></tr>`).join('')}</table>`:`<h3>${X().perfect}</h3>`; }
  body.innerHTML=''; const box=el('div','sp-res',head+extra+(stars2?`<p style="font-size:1.4rem">+${stars2} ⭐</p>`:'')+tbl+`<div class="row" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="sp-b go" data-a="a">${X().again}</button><button class="sp-b" data-a="h">${X().hub}</button><button class="sp-b" data-a="s">🔊</button></div>`);
  body.appendChild(box); giveStars(stars2); pill(); run=null;
  box.querySelector('[data-a=a]').onclick=()=>start({mode:r.mode,belt:r.belt,lvl:r.lvl,cfg:r.mode==='exam'||r.mode==='practice'?BELT[r.belt]:r.mode==='sprint'?Object.assign({},r.c,{tasks:999}):r.c});
  box.querySelector('[data-a=h]').onclick=hub; box.querySelector('[data-a=s]').onclick=()=>sp(speak); sp(speak); }
$('back').onclick=()=>{ if(view==='hub'){ stopRun(); root.hidden=true; } else hub(); };
window.openArena=()=>{ root.hidden=false; hub(); };
/* card în meniul Academiei Soroban */
window.__saArena=m=>{ const b=el('button','sa-arena',`<span class="ic">🏁</span><span><b>${X().title}</b><span class="s">${X().sub}</span></span><span class="bl">${beltSVG(Math.max(0,got-1))}</span>`); if(!got) b.querySelector('.bl').style.opacity='.35'; b.onclick=()=>window.openArena(); m.appendChild(b); };
(window.__LR=window.__LR||[]).push(()=>{ if(root.hidden) return; if(view==='hub') hub(); else if(view==='set') settings(); });
window.__sp={genSeq,genItem,BELT};
})();
