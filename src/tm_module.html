function gearPath(r,n){ let d=''; const ro=r, ri=r*.82; for(let i=0;i<n;i++){ const a0=i/n*2*Math.PI, a1=(i+.25)/n*2*Math.PI, a2=(i+.5)/n*2*Math.PI, a3=(i+.75)/n*2*Math.PI;
  const P=(rr,a)=>`${(rr*Math.sin(a)).toFixed(1)} ${(-rr*Math.cos(a)).toFixed(1)}`; d+=(i?'L':'M')+P(ri,a0)+'L'+P(ro,a1)+'L'+P(ro,a2)+'L'+P(ri,a3); } return d+'Z'; }
function clockSVG(id,cx,cy,r,o={}){
  let s=`<g id="${id}"><circle cx="${cx}" cy="${cy}" r="${r+r*.07}" fill="${o.rim||'#3BC48A'}"/><circle id="${id}-face" cx="${cx}" cy="${cy}" r="${r}" fill="#FFFDF5" stroke="#24325F" stroke-width="${r*.03}"/>`;
  s+=`<g id="${id}-gr" opacity="0" style="transition:opacity .5s">`;
  [[0,0,.42,24,'#FFC83D','m'],[-.36,.3,.2,12,'#FF8A65','i'],[.3,.36,.24,14,'#8C6CF2','h']].forEach(([dx,dy,rr,n,c,k])=>{ s+=`<g transform="translate(${cx+dx*r} ${cy+dy*r})"><path class="gr-${k}" d="${gearPath(rr*r,n)}" fill="${c}" stroke="#24325F" stroke-width="2"/><circle r="${rr*r*.25}" fill="#fff" stroke="#24325F" stroke-width="2"/></g>`; });
  s+=`</g><path id="${id}-pz" fill="#FFC83D" opacity=".85" stroke="#E0A000" stroke-width="2"/><g id="${id}-pzl"></g>`;
  for(let i=0;i<60;i++){ const a=i*6*Math.PI/180, l=i%5?r*.05:r*.1; s+=`<line x1="${cx+Math.sin(a)*(r*.95)}" y1="${cy-Math.cos(a)*(r*.95)}" x2="${cx+Math.sin(a)*(r*.95-l)}" y2="${cy-Math.cos(a)*(r*.95-l)}" stroke="#24325F" stroke-width="${i%5?r*.012:r*.025}"/>`; }
  for(let i=1;i<=12;i++){ const a=i*30*Math.PI/180; s+=`<text x="${cx+Math.sin(a)*r*.72}" y="${cy-Math.cos(a)*r*.72+r*.075}" font-size="${r*.2}" font-weight="800" text-anchor="middle" fill="#24325F">${i}</text>`; }
  if(o.mnums) for(let i=0;i<12;i++){ const a=i*30*Math.PI/180; s+=`<text x="${cx+Math.sin(a)*r*1.19}" y="${cy-Math.cos(a)*r*1.19+r*.04}" font-size="${r*.1}" font-weight="800" text-anchor="middle" fill="#E0507A">${String(i*5).padStart(2,'0')}</text>`; }
  s+=`<g id="${id}-h"><line x1="${cx}" y1="${cy+r*.08}" x2="${cx}" y2="${cy-r*.5}" stroke="#2E6BD6" stroke-width="${r*.085}" stroke-linecap="round"/></g>`;
  s+=`<g id="${id}-m"><line x1="${cx}" y1="${cy+r*.1}" x2="${cx}" y2="${cy-r*.84}" stroke="#FF5D7A" stroke-width="${r*.05}" stroke-linecap="round"/><circle cx="${cx}" cy="${cy-r*.84}" r="${r*.035}" fill="#FF5D7A"/></g>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${r*.06}" fill="#24325F"/><circle id="${id}-hit" cx="${cx}" cy="${cy}" r="${r*1.05}" fill="transparent"/></g>`; return s; }
function makeClock(svg,id,cx,cy,r,o={}){
  const c={total:o.total||0,step:o.step||1,only:o.only||null,locked:false,onChange:o.onChange||null,onEnd:o.onEnd||null,pizza:!!o.pizza,min:o.min!=null?o.min:null,max:o.max!=null?o.max:null};
  const H=svg.querySelector('#'+id+'-h'), M=svg.querySelector('#'+id+'-m'), PZ=svg.querySelector('#'+id+'-pz'), PZL=svg.querySelector('#'+id+'-pzl'), GR=svg.querySelector('#'+id+'-gr');
  function draw(){ const t=((c.total%1440)+1440)%1440, m=t%60, ha=(t%720)/2, ma=m*6;
    H.setAttribute('transform',`rotate(${ha} ${cx} ${cy})`); M.setAttribute('transform',`rotate(${ma} ${cx} ${cy})`);
    if(c.pizza&&m>0){ const a=ma*Math.PI/180, R2=r*.9; PZ.setAttribute('d',`M${cx} ${cy}L${cx} ${cy-R2}A${R2} ${R2} 0 ${ma>180?1:0} 1 ${cx+Math.sin(a)*R2} ${cy-Math.cos(a)*R2}Z`); } else PZ.setAttribute('d','');
    if(c.pizza&&!PZL.childNodes.length) PZL.innerHTML=[0,90,180,270].map(d=>{ const a=d*Math.PI/180; return `<line x1="${cx}" y1="${cy}" x2="${cx+Math.sin(a)*r*.9}" y2="${cy-Math.cos(a)*r*.9}" stroke="#E0A000" stroke-width="2" stroke-dasharray="6 6"/>`; }).join('');
    if(!c.pizza) PZL.innerHTML='';
    const T=c.total; svg.querySelectorAll('#'+id+' .gr-m').forEach(g=>g.setAttribute('transform',`rotate(${T*6})`)); svg.querySelectorAll('#'+id+' .gr-i').forEach(g=>g.setAttribute('transform',`rotate(${-T*6*24/12})`)); svg.querySelectorAll('#'+id+' .gr-h').forEach(g=>g.setAttribute('transform',`rotate(${T/2})`)); }
  c.draw=draw; c.gears=on=>{ GR.setAttribute('opacity',on?'1':'0'); svg.querySelector('#'+id+'-face').setAttribute('fill',on?'rgba(255,253,245,.55)':'#FFFDF5'); };
  c.set=(t,anim)=>new Promise(res=>{ if(!anim){ c.total=t; draw(); return res(); } const a=c.total, t0=performance.now(), D=Math.min(1600,300+Math.abs(t-a)*2);
    const f=now=>{ const k=Math.min(1,(now-t0)/D), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2; c.total=Math.round(a+(t-a)*e); draw(); if(k<1) raf=requestAnimationFrame(f); else { c.total=t; draw(); res(); } }; raf=requestAnimationFrame(f); });
  const ang=(x,y)=>{ let a=Math.atan2(x-cx,-(y-cy))*180/Math.PI; return (a+360)%360; };
  let drag=null;
  const clampT=t=>{ if(c.min!=null&&t<c.min) t=c.min; if(c.max!=null&&t>c.max) t=c.max; return t; };
  svg.addEventListener('pointerdown',e=>{ if(c.locked) return; const [x,y]=ptIn(svg,e), d=Math.hypot(x-cx,y-cy); if(d>r*1.1) return; e.preventDefault(); try{ svg.setPointerCapture(e.pointerId); }catch(_){}
    const a=ang(x,y), ha=(((c.total%720)+720)%720)/2, dif=Math.min(Math.abs(a-ha),360-Math.abs(a-ha));
    drag=c.only||(c.step>=60?'h':(d<r*.62&&dif<28)?'h':'m'); move(e); });
  function move(e){ if(!drag) return; const [x,y]=ptIn(svg,e), a=ang(x,y), t=c.total, m=((t%60)+60)%60;
    if(drag==='m'){ let nm=Math.round(a/6/c.step)*c.step%60, dl=nm-m; if(dl<-30) dl+=60; if(dl>30) dl-=60; if(dl){ c.total=clampT(t+dl); if(c.total!==t) tickS(); } }
    else { const hh=Math.round((a*2-m)/60), base=((hh%12)+12)%12*60+m; let best=t, bd=1e9; for(const k of [-1440,-720,0,720,1440]){ const cand=base+k+Math.floor(t/1440)*1440; if(Math.abs(cand-t)<bd){ bd=Math.abs(cand-t); best=cand; } } if(best!==t){ c.total=clampT(best); tickS(); } }
    if(c.min==null&&c.max==null) c.total=((c.total%1440)+1440)%1440;
    draw(); c.onChange&&c.onChange(c.total); }
  svg.addEventListener('pointermove',e=>{ if(drag){ e.preventDefault(); move(e); } });
  const up=()=>{ if(!drag) return; drag=null; c.onEnd&&c.onEnd(c.total); };
  svg.addEventListener('pointerup',up); svg.addEventListener('pointercancel',up);
  draw(); return c; }

const SKY=[[0,'#0B1640','#24325F'],[300,'#1A2558','#3B3F7A'],[390,'#FF9E7A','#FFE3B8'],[480,'#5DB8F5','#D6F0FF'],[1020,'#5DB8F5','#D6F0FF'],[1140,'#FF7E5F','#7B5FD0'],[1230,'#1A2558','#3B3F7A'],[1440,'#0B1640','#24325F']];
const hx=(a,b,k)=>{ const p=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)); const A=p(a),B=p(b); return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*k).toString(16).padStart(2,'0')).join(''); };
function skyCols(t){ t=((t%1440)+1440)%1440; for(let i=0;i<SKY.length-1;i++){ const [a,c1,c2]=SKY[i],[b,d1,d2]=SKY[i+1]; if(t>=a&&t<=b){ const k=(t-a)/(b-a); return [hx(c1,d1,k),hx(c2,d2,k)]; } } return ['#5DB8F5','#D6F0FF']; }

  return s; }
function updScene(svg,t,W,gy,x0,x1){ x0=x0==null?60:x0; x1=x1==null?W-60:x1; const [a,b]=skyCols(t); svg.querySelector('#tm-s1').setAttribute('stop-color',a); svg.querySelector('#tm-s2').setAttribute('stop-color',b);

    <rect id="tm-curL" x="530" y="30" width="80" height="235" rx="10" fill="#E86B8A" style="transition:transform 1s ease;transform-origin:530px 30px"/><rect id="tm-curR" x="770" y="30" width="80" height="235" rx="10" fill="#E86B8A" style="transition:transform 1s ease;transform-origin:850px 30px"/>
    <rect x="470" y="300" width="390" height="70" rx="20" fill="#7FB3FF"/><rect x="470" y="270" width="80" height="60" rx="18" fill="#FFFFFF"/><rect x="540" y="292" width="320" height="56" rx="18" fill="#FFC8D8"/>
    <g id="tm-wkP" style="transform-origin:600px 300px"><text id="tm-wkF" x="600" y="300" font-size="86" text-anchor="middle">😴</text>
    <g id="tm-wkZ"><text x="640" y="230" font-size="34" style="animation:tmZ 2.2s linear infinite">💤</text><text x="655" y="230" font-size="26" style="animation:tmZ 2.2s linear 1.1s infinite">💤</text></g></g>
    <rect x="70" y="380" width="250" height="30" rx="8" fill="#8A5A2B"/>
    <g id="tm-alarm" style="transform-origin:195px 230px"><circle cx="135" cy="80" r="26" fill="#FF5D7A"/><circle cx="255" cy="80" r="26" fill="#FF5D7A"/>${clockSVG('tc',195,230,150,{rim:'#FF5D7A',mnums:li>=3})}<line x1="120" y1="372" x2="140" y2="390" stroke="#24325F" stroke-width="10" stroke-linecap="round"/><line x1="270" y1="372" x2="250" y2="390" stroke="#24325F" stroke-width="10" stroke-linecap="round"/></g></svg>`;
  const svg=F.stage.firstChild, q=x=>svg.querySelector(x); const c=makeClock(svg,'tc',195,230,150,{step,only:step>=60?'h':null});
  function night(){ q('#tm-wk1').setAttribute('stop-color','#14204F'); q('#tm-wk2').setAttribute('stop-color','#2E3A78'); q('#tm-wkSky').textContent='🌙'; q('#tm-wkSt').setAttribute('opacity',1); q('#tm-curL').style.transform=''; q('#tm-curR').style.transform=''; q('#tm-wkF').textContent='😴'; q('#tm-wkZ').setAttribute('opacity',1); q('#tm-wkP').style.animation=''; q('#tm-alarm').style.animation=''; }
  async function show(){ F.ctrl.innerHTML=''; night(); const [h,m]=fresh('wk'+li,()=>[RR(5,10),step>=60?0:R(60/step)*step],step>=60?4:9); tg=h*60+m;
    let st; do{ st=RR(1,12)*60+(step>=60?0:R(60/step)*step); }while(st%720===tg%720); c.locked=false; await c.set(st);
    F.say(X().wakeTask(tSay(h,m))); F.ctrl.appendChild(btn(X().ring,'go',answer)); F.ctrl.appendChild(btn(X().listen,'',()=>F.say(X().wakeTask(tSay(h,m))))); }
  async function answer(){ if(busy) return; if(m12(c.total)!==m12(tg)){ errs++; boing(); const [a,b]=hmOf(m12(c.total)||720); F.say(X().wakeWrong(tSay(a,b))); return; }
    busy=true; c.locked=true; q('#tm-alarm').style.animation='tmShake .35s linear 5'; for(let i=0;i<6;i++) setTimeout(()=>snd(i%2?1760:1320,.12,'square',.07),i*170);
    await wait(1100); if(myGen!==gen) return; q('#tm-wk1').setAttribute('stop-color','#FFB27A'); q('#tm-wk2').setAttribute('stop-color','#BFE6FF'); q('#tm-wkSky').textContent='🌞'; q('#tm-wkSt').setAttribute('opacity',0);
    q('#tm-curL').style.transform='scaleX(.35)'; q('#tm-curR').style.transform='scaleX(.35)'; q('#tm-wkZ').setAttribute('opacity',0); q('#tm-wkF').textContent='🦊'; q('#tm-wkP').style.animation='tmJump .6s ease 3';
    chime(); award(); F.dot(ti+1); const [h,m]=hmOf(tg); await spW(X().wakeDone+' '+X().itIs(tSay(h,m)),1800); if(myGen!==gen) return; ti++; busy=false; if(ti>=PER) return levelDone('wake',li,errs); show(); }
  show(); }

/* ---------- 18. baloanele cu ore ---------- */
function gBalloon(li){ let ti=0, errs=0, busy=false, tg=0; const N=6; const F=frame('',N,'🎈'); const myGen=gen; const ms=[[0],[0,30],[0,15,30,45]][li];
  const sky=el('div'); sky.style.cssText='position:relative;width:100%;height:100%;overflow:hidden;border-radius:24px;background:linear-gradient(#8FD3FF,#E6F7FF)';
  sky.innerHTML=`<div style="position:absolute;left:0;top:12%;font-size:60px;animation:tmCloud 40s linear infinite">☁️</div><div style="position:absolute;left:0;top:40%;font-size:44px;animation:tmCloud 55s linear -20s infinite">☁️</div>`;
  F.stage.appendChild(sky); const lab=el('div','tm-read'); F.ctrl.appendChild(lab); const COLS=['#FF6B8A','#FFC83D','#7BD389','#6FA8FF','#B58CFF','#FF9F5A'];
  let alive=[];
  function spawn(t,slot,delay){ const b=el('div'); const col=pick(COLS); const sz='clamp(92px,15vh,140px)';
    b.style.cssText=`position:absolute;left:${6+slot*18.5}%;bottom:-200px;width:${sz};cursor:pointer;animation:tmFloatUp ${8+Math.random()*3}s linear ${delay}s forwards;display:flex;flex-direction:column;align-items:center`;
    b.innerHTML=`<div style="width:${sz};height:calc(${sz} * 1.15);border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 35% 30%,#fff9 0 12%,${col} 13%);display:flex;align-items:center;justify-content:center;box-shadow:inset -8px -10px 0 rgba(0,0,0,.08)"><svg viewBox="0 0 120 120" style="width:78%;height:auto">${staticClock(t,'bl'+Math.random().toString(36).slice(2,7),50)}</svg></div><div style="width:2px;height:70px;background:#555"></div>`;
    b.dataset.t=t; b.onclick=()=>pop(b); b.addEventListener('animationend',e=>{ if(e.animationName==='tmFloatUp'){ b.remove(); if(!busy&&myGen===gen&&!sky.querySelector(`[data-t="${tg}"]`)) round(true); } }); sky.appendChild(b); alive.push(b); }
  function round(again){ if(myGen!==gen) return; sky.querySelectorAll('[data-t]').forEach(x=>x.remove()); const set=new Set(); if(!again){ const [h,m]=fresh('bl'+li,()=>[RR(1,12),pick(ms)],8); tg=h*60+m; }
    set.add(tg); while(set.size<5){ const v=RR(1,12)*60+pick(ms); if(v%720!==tg%720) set.add(v); } shuf([...set]).forEach((t,i)=>spawn(t,i,i*.35+Math.random()*.4));
    const [h,m]=hmOf(tg); lab.innerHTML=`🎯 <b>${tShort(h,m)}</b>`; if(!again) F.say(X().balTask(tSay(h,m))); }
  async function pop(b){ if(busy) return; const t=+b.dataset.t; if(t%720!==tg%720){ errs++; boing(); b.firstChild.style.animation='tmShake .4s'; setTimeout(()=>{ if(b.firstChild) b.firstChild.style.animation=''; },450); const [h,m]=hmOf(tg); sp(X().balTask(tSay(h,m))); return; }
    busy=true; snd(220,.08,'square',.12); b.style.animationPlayState='paused'; b.firstChild.style.animation='tmPop .35s forwards'; chime(); award(); F.dot(ti+1); const [h,m]=hmOf(tg); await spW(X().itIs(tSay(h,m)),1000); if(myGen!==gen) return;
    ti++; busy=false; if(ti>=N) return levelDone('balloon',li,errs); round(false); }
  F.ctrl.appendChild(btn(X().listen,'',()=>{ const [h,m]=hmOf(tg); sp(X().balTask(tSay(h,m))); }));
  round(false); }

/* ================= meniuri ================= */
const WORLDS={clock:['explore','balloon','cuckoo','pizza','station','memo','oven'],day:['wake','order','dayclk','moments','ytm'],cal:['week','calm','months'],seas:['tree','dress','sort']};
const WBG={clock:'#FFE9A8',day:'#FFD9C2',cal:'#D9E4FF',seas:'#CDEFD2'};
const RUN={wake:gWake,balloon:gBalloon,explore:gExplore,cuckoo:gCuckoo,pizza:gPizza,station:gStation,memo:gMemo,oven:gOven,order:gOrder,dayclk:gDayClk,moments:gMoments,ytm:gYtm,week:gWeek,calm:gCal,months:gMonths,tree:gTree,dress:gDress,sort:gSort};
const FREE=['explore','tree'];
const nLv=k=>FREE.includes(k)?0:(X().lv[k]||[0]).length;
const gotStars=k=>[...Array(nLv(k))].reduce((s,_,i)=>s+(data.prog[k+i]||0),0);
function head(ic,txt){ const h=el('div','rb-head'); h.append(el('div','rb-face',`<div style="font-size:clamp(40px,7vh,58px);line-height:1">${ic}</div>`)); const b=el('div','rb-bubble'); b.textContent=txt; b.onclick=()=>sp(txt); h.append(b); return h; }
function todayText(){ const n=new Date(); const wd=X().days[(n.getDay()+6)%7], mo=X().months[n.getMonth()], s=X().seas[seasonOf(n.getMonth())]; return X().today(wd,n.getDate(),mo,s); }
function home(){ stopAll(); back=null; curLevels=null; $('title').textContent=X().title; $('back').textContent=X().back; $('all').hidden=true; pill(); main.innerHTML='';
  const tt=todayText(); main.append(head('🦊',tt));
  const lad=el('div','tm-ladder'); X().ladder.forEach((t,i)=>{ lad.appendChild(el('span',null,t)); if(i<3) lad.appendChild(el('span',null,'→')); }); main.appendChild(lad);
  const g=el('div','tm-worlds'); Object.keys(WORLDS).forEach(w=>{ const tot=WORLDS[w].reduce((s,k)=>s+nLv(k)*3,0), got=WORLDS[w].reduce((s,k)=>s+gotStars(k),0);
    const c=el('button','tm-world',`<span class="ic">${X().worlds[w][0]}</span><span class="t">${X().worlds[w][1]}</span><span class="p">⭐ ${got}/${tot}</span>`); c.style.background=WBG[w]; c.onclick=()=>{ blip(); world(w); }; g.appendChild(c); });
  main.appendChild(g); sp(tt); }
function world(w){ stopAll(); back=home; curLevels=null; $('all').hidden=true; $('title').textContent=X().worlds[w][0]+' '+X().worlds[w][1]; main.innerHTML='';
  main.append(head(X().worlds[w][0],X().worlds[w][1])); const g=el('div','tm-grid');
  WORLDS[w].forEach(k=>{ const L=nLv(k); const c=el('button','rb-card',`<span class="ic">${X().games[k][0]}</span><span class="t">${X().games[k][1]}</span>${L?`<span class="p">⭐ ${gotStars(k)}/${L*3}</span>`:''}`);
    c.dataset.lk='tm:'+k; c.onclick=()=>{ blip(); if(L>1) levels(k,w); else play(k,0,w); }; g.appendChild(c); });
  main.appendChild(g); sp(X().worlds[w][1]); }
const isOpen=(k,i)=>data.all||i===0||(data.prog[k+(i-1)]||0)>0;
const worldOf=k=>Object.keys(WORLDS).find(w=>WORLDS[w].includes(k));
function levels(k){ stopAll(); const w=worldOf(k); back=()=>world(w); curLevels=()=>levels(k); $('all').hidden=false; $('all').textContent=data.all?X().allOn:X().allOff; main.innerHTML='';
  main.append(head(X().games[k][0],X().games[k][1])); const g=el('div','tm-grid'); const names=X().lv[k]; const cur=names.findIndex((_,i)=>isOpen(k,i)&&!(data.prog[k+i]>0));
  names.forEach((nm,i)=>{ const open=isOpen(k,i), s=data.prog[k+i]||0; const c=el('button','rb-card'+(open?'':' lock')+(i===cur?' cur':''),`<span class="n">${X().lvl(i+1)}</span><span class="t">${nm}</span><span class="p">${'★'.repeat(s)}${'☆'.repeat(3-s)}</span>`);
    c.onclick=()=>{ if(!open){ sp(X().locked); return; } blip(); play(k,i); }; g.appendChild(c); });
  main.appendChild(g); sp(X().games[k][1]); }
function play(k,i){ stopAll(); const w=worldOf(k); back=nLv(k)>1?()=>levels(k):()=>world(w); curRestart=()=>play(k,i); $('all').hidden=true; $('title').textContent=X().games[k][0]+' '+X().games[k][1]; RUN[k](i); }
function levelDone(k,i,errs){ award(); finish(k+i,rate(errs),i<nLv(k)-1?()=>play(k,i+1):null); }
const __rm=f=>{ const w=(...a)=>{ __scr=()=>w(...a); return f(...a); }; return w; }; let __scr=null; levels=(f=>(k,...a)=>{ if(window.__gate&&window.__gate('tm',k)) return; return f(k,...a); })(levels); play=(f=>(k,...a)=>{ if(window.__gate&&window.__gate('tm',k)) return home(); return f(k,...a); })(play); home=__rm(home); world=__rm(world); levels=__rm(levels); play=__rm(play);
(window.__LR=window.__LR||[]).push(()=>{ if(root.hidden||!__scr) return; try{ $('title').textContent=X().title; $('back').textContent=X().back; }catch(e){} __scr(); });
window.openTime=()=>{ root.hidden=false; home(); };
window.__tm={tSay,digi,skyCols,data,play};
})();
