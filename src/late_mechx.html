<script>
/* Robotică › Mașini simple v3: cadoul misterios, roți dințate 6–10, bicicletă (ture aleatoare, traseu), rampă (gheață/nisip/coș), scripete, catapultă — 12 limbi */
(function(){
const M={
ro:{menu:{pulley:['🏗️','Scripetele'],cata:['🏹','Catapulta']},
 bike:[,,,,,'Fă două ture de pedală și numără: de câte ori se învârte roata din spate? Urmărește bulina roșie!','Traseu cu deal! Întrece melcul: viteză rapidă pe drum drept, ușoară la deal. Schimbă la timp!','Acum pedalele fac mai multe ture. Numără cu atenție turele roții din spate!'],
 bikeWhy:[,,,,,'','Campion! Cicliștii schimbă vitezele tot timpul: ușor la deal, rapid pe drum drept.',''],
 g:{t:[,,,,,'Ceasul mare are un gol lung! Umple-l cu roți dințate de orice mărime.','Mașina de curse trebuie să meargă repede și înainte! Gândește-te la mărime și la sens.','Macaraua trebuie să ridice elefantul în sus! Ai nevoie de putere și de sensul bun.','Umple golul, iar vaporul trebuie să meargă înainte! Câte roți îți trebuie?','Ultimul ceas e greu: ce roți umplu exact golul?'],
  why:[,,,,,'Super! Poți umple același gol în mai multe feluri: cu multe roți mici sau cu mai puține roți mari.','Roata mică dă viteză, iar numărul de roți hotărăște sensul. Ai rezolvat amândouă!','Roata mare dă putere, iar sensul bun ridică încărcătura. Ca o macara adevărată!','Fiecare roată schimbă sensul. Cu numărul potrivit de roți, vaporul merge înainte!','Doar două roți mari se potrivesc! Inginerii calculează exact mărimea roților.']},
 mx:{lvMys:'Un cadou misterios! Echilibrează balansoarul, apoi ghicește cât cântărește cadoul.',lvMysQ:'Cadoul cântărește cât…?',lvMysOk:w=>`Da! Cadoul cântărește cât ${['','un șoricel','un iepuraș','un cățel','un elefant'][w]}.`,lvMysNo:'Nu chiar. Gândește-te: ce animal pus în locul cadoului ar ține balansoarul drept?',
  gBack:'Merge în sensul greșit! Adaugă sau scoate o roată ca să schimbi sensul.',bkCount:(n,t)=>`Exact, de ${n} ori! Cu cât roata dințată din spate e mai mică, cu atât roata se învârte de mai multe ori.`,bkAgain:'Nu chiar. Hai să mai numărăm o dată!',bkTourLost:'Melcul a câștigat! Schimbă viteza: rapid pe drept, ușor la deal.',
  rIce:'Pe gheață bila alunecă mult mai departe!',rSand:'În nisip bila se oprește repede!',rGrass:'Acum e iarbă.',rBasket:'Bila trebuie să intre în coș!',rIceWhy:'Gheața e alunecoasă și aproape nu frânează bila: frecare mică!',rSandWhy:'Nisipul frânează bila puternic: frecare mare!',
  pIntro:'Scripetele! RoboPufi trebuie să ridice greutatea până la steag. Alege câți scripeți folosește, apoi ține apăsat 💪 ca să tragă.',pHeavy:'E prea greu! RoboPufi nu poate. Adaugă scripeți!',pN:v=>v===1?'Un scripete.':`${v} scripeți.`,
  pOk:n=>n===1?'Sus! Un scripete schimbă doar direcția: tragi în jos și greutatea urcă.':`Sus! Cu ${n} scripeți greutatea pare de ${n} ori mai ușoară, dar tragi de ${n} ori mai multă sfoară.`,pNext:'Acum altă greutate! Alege scripeții potriviți.',
  cIntro:'Catapulta! Trage piatra înapoi cu degetul, ca la praștie, și dă drumul. Lovește castelul!',cFar:'Castelul e departe! Trage mai tare.',cBalloon:'Sparge balonul din aer!',cWall:'Un zid! Aruncă piatra pe sus, peste zid.',cMulti:'Lovește toate țintele!',cOut:'Gata pietrele! Hai de la capăt.',
  cWhy:['Ai lovit! Cu cât tragi mai tare, cu atât piatra zboară mai departe.','Super! Ca să ajungi departe, țintește pe la jumătatea cerului, cam 45 de grade.','Bravo! Piatra zboară pe o curbă, pentru că gravitația o trage în jos.','Peste zid! Un unghi mare aruncă piatra sus.','Două baloane! Fiecare țintă are nevoie de altă forță și de alt unghi.','Campion! Ai folosit unghiuri și forțe diferite pentru fiecare țintă.','Maestru al catapultei! Așa calculau inginerii de demult.']}},
de:{menu:{pulley:['🏗️','Der Flaschenzug'],cata:['🏹','Das Katapult']},
 bike:[,,,,,'Tritt zwei Pedalrunden und zähl: Wie oft dreht sich das Hinterrad? Schau auf den roten Punkt!','Strecke mit Hügel! Schlag die Schnecke: schneller Gang auf gerader Strecke, leichter Gang am Hügel. Schalte rechtzeitig!','Jetzt drehen sich die Pedale öfter. Zähl die Runden des Hinterrads genau!'],
 bikeWhy:[,,,,,'','Champion! Radfahrer schalten ständig: leicht am Hügel, schnell auf gerader Strecke.',''],
 g:{t:[,,,,,'Die große Uhr hat eine lange Lücke! Füll sie mit Zahnrädern in beliebiger Größe.','Der Rennwagen soll schnell und vorwärts fahren! Denk an die Größe und an die Richtung.','Der Kran soll den Elefanten nach oben heben! Du brauchst Kraft und die richtige Richtung.','Füll die Lücke, und das Schiff soll vorwärts fahren! Wie viele Zahnräder brauchst du?','Die letzte Uhr ist schwer: Welche Zahnräder füllen die Lücke genau?'],
  why:[,,,,,'Super! Dieselbe Lücke kannst du auf viele Arten füllen: mit vielen kleinen oder wenigen großen Zahnrädern.','Das kleine Zahnrad bringt Tempo, die Anzahl der Zahnräder bestimmt die Richtung. Du hast beides geschafft!','Das große Zahnrad bringt Kraft, die richtige Richtung hebt die Last. Wie ein echter Kran!','Jedes Zahnrad dreht die Richtung um. Mit der richtigen Anzahl fährt das Schiff vorwärts!','Nur zwei große Zahnräder passen! Ingenieure berechnen die Größe der Zahnräder genau.']},
 mx:{lvMys:'Ein geheimnisvolles Geschenk! Bring die Wippe ins Gleichgewicht und rate dann, wie schwer das Geschenk ist.',lvMysQ:'Das Geschenk ist so schwer wie…?',lvMysOk:w=>`Ja! Das Geschenk ist so schwer wie ${['','eine Maus','ein Hase','ein Hund','ein Elefant'][w]}.`,lvMysNo:'Nicht ganz. Überleg mal: Welches Tier an der Stelle des Geschenks würde die Wippe gerade halten?',
  gBack:'Das geht in die falsche Richtung! Füg ein Zahnrad hinzu oder nimm eins weg, um die Richtung zu ändern.',bkCount:(n,t)=>`Genau, ${n} Mal! Je kleiner das hintere Zahnrad, desto öfter dreht sich das Rad.`,bkAgain:'Nicht ganz. Zählen wir nochmal!',bkTourLost:'Die Schnecke hat gewonnen! Schalte um: schnell auf gerader Strecke, leicht am Hügel.',
  rIce:'Auf Eis rutscht die Kugel viel weiter!',rSand:'Im Sand bleibt die Kugel schnell stehen!',rGrass:'Jetzt ist es Gras.',rBasket:'Die Kugel soll in den Korb!',rIceWhy:'Eis ist rutschig und bremst die Kugel kaum: wenig Reibung!',rSandWhy:'Sand bremst die Kugel stark: viel Reibung!',
  pIntro:'Der Flaschenzug! RoboPufi soll das Gewicht bis zur Fahne heben. Wähle, wie viele Rollen er benutzt, und halte dann 💪 gedrückt, damit er zieht.',pHeavy:'Das ist zu schwer! RoboPufi schafft es nicht. Nimm mehr Rollen!',pN:v=>v===1?'Eine Rolle.':`${v} Rollen.`,
  pOk:n=>n===1?'Oben! Eine Rolle ändert nur die Richtung: Du ziehst nach unten, und das Gewicht geht hoch.':`Oben! Mit ${n} Rollen fühlt sich das Gewicht ${n}-mal leichter an, aber du ziehst ${n}-mal mehr Seil.`,pNext:'Jetzt ein anderes Gewicht! Wähle die passenden Rollen.',
  cIntro:'Das Katapult! Zieh den Stein mit dem Finger zurück wie bei einer Schleuder und lass los. Triff die Burg!',cFar:'Die Burg ist weit weg! Zieh stärker.',cBalloon:'Lass den Ballon in der Luft platzen!',cWall:'Eine Mauer! Wirf den Stein hoch über die Mauer.',cMulti:'Triff alle Ziele!',cOut:'Keine Steine mehr! Nochmal von vorn.',
  cWhy:['Treffer! Je stärker du ziehst, desto weiter fliegt der Stein.','Super! Für weite Würfe zielst du halb in den Himmel, etwa 45 Grad.','Toll! Der Stein fliegt in einem Bogen, weil die Schwerkraft ihn nach unten zieht.','Über die Mauer! Ein großer Winkel wirft den Stein hoch.','Zwei Ballons! Jedes Ziel braucht eine andere Kraft und einen anderen Winkel.','Champion! Du hast für jedes Ziel andere Winkel und Kräfte benutzt.','Katapult-Meister! So haben Ingenieure früher gerechnet.']}},
en:{menu:{pulley:['🏗️','The pulley'],cata:['🏹','The catapult']},
 bike:[,,,,,'Do two pedal turns and count: how many times does the back wheel turn? Watch the red dot!','A route with a hill! Beat the snail: fast gear on the flat, easy gear on the hill. Change in time!','Now the pedals turn more times. Count the back wheel’s turns carefully!'],
 bikeWhy:[,,,,,'','Champion! Cyclists change gear all the time: easy on hills, fast on the flat.',''],
 g:{t:[,,,,,'The big clock has a long gap! Fill it with gears of any size.','The race car must go fast and forwards! Think about size and direction.','The crane must lift the elephant up! You need strength and the right direction.','Fill the gap, and the ship must go forwards! How many gears do you need?','The last clock is tricky: which gears fill the gap exactly?'],
  why:[,,,,,'Great! You can fill the same gap in many ways: with lots of small gears or fewer big ones.','The small gear gives speed, and the number of gears decides the direction. You solved both!','The big gear gives strength, and the right direction lifts the load. Like a real crane!','Every gear flips the direction. With the right number of gears, the ship goes forwards!','Only two big gears fit! Engineers work out the size of gears exactly.']},
 mx:{lvMys:'A mystery present! Balance the seesaw, then guess how heavy the present is.',lvMysQ:'The present is as heavy as…?',lvMysOk:w=>`Yes! The present is as heavy as ${['','a mouse','a bunny','a dog','an elephant'][w]}.`,lvMysNo:'Not quite. Think: which animal in the present’s place would keep the seesaw level?',
  gBack:'It is going the wrong way! Add or remove a gear to change the direction.',bkCount:(n,t)=>`Exactly, ${n} times! The smaller the back gear, the more times the wheel turns.`,bkAgain:'Not quite. Let’s count again!',bkTourLost:'The snail won! Change gear: fast on the flat, easy on the hill.',
  rIce:'On ice the ball slides much further!',rSand:'In sand the ball stops quickly!',rGrass:'Now it is grass.',rBasket:'The ball must land in the basket!',rIceWhy:'Ice is slippery and hardly slows the ball down: low friction!',rSandWhy:'Sand slows the ball down a lot: high friction!',
  pIntro:'The pulley! RoboPufi must lift the weight up to the flag. Choose how many pulleys he uses, then hold 💪 so he pulls.',pHeavy:'It is too heavy! RoboPufi can’t do it. Add pulleys!',pN:v=>v===1?'One pulley.':`${v} pulleys.`,
  pOk:n=>n===1?'Up! One pulley only changes the direction: you pull down and the weight goes up.':`Up! With ${n} pulleys the weight feels ${n} times lighter, but you pull ${n} times more rope.`,pNext:'Now another weight! Choose the right pulleys.',
  cIntro:'The catapult! Pull the stone back with your finger, like a slingshot, and let go. Hit the castle!',cFar:'The castle is far away! Pull harder.',cBalloon:'Pop the balloon in the air!',cWall:'A wall! Throw the stone high, over the wall.',cMulti:'Hit all the targets!',cOut:'No stones left! Let’s start again.',
  cWhy:['A hit! The harder you pull, the further the stone flies.','Great! To go far, aim halfway up the sky, about 45 degrees.','Well done! The stone flies in a curve because gravity pulls it down.','Over the wall! A big angle throws the stone high.','Two balloons! Each target needs a different strength and angle.','Champion! You used different angles and strengths for each target.','Catapult master! That is how engineers worked it out long ago.']}},
fr:{menu:{pulley:['🏗️','La poulie'],cata:['🏹','La catapulte']},
 bike:[,,,,,'Fais deux tours de pédale et compte : combien de fois la roue arrière tourne-t-elle ? Regarde le point rouge !','Un parcours avec une colline ! Bats l’escargot : vitesse rapide sur le plat, facile dans la côte. Change à temps !','Maintenant les pédales font plus de tours. Compte bien les tours de la roue arrière !'],
 bikeWhy:[,,,,,'','Champion ! Les cyclistes changent de vitesse tout le temps : facile en côte, rapide sur le plat.',''],
 g:{t:[,,,,,'La grande horloge a un long trou ! Remplis-le avec des engrenages de n’importe quelle taille.','La voiture de course doit aller vite et en avant ! Pense à la taille et au sens.','La grue doit soulever l’éléphant vers le haut ! Il faut de la force et le bon sens.','Remplis le trou, et le bateau doit avancer ! Combien d’engrenages te faut-il ?','La dernière horloge est difficile : quels engrenages remplissent exactement le trou ?'],
  why:[,,,,,'Super ! On peut remplir le même trou de plusieurs façons : beaucoup de petits engrenages ou moins de grands.','Le petit engrenage donne la vitesse, et le nombre d’engrenages décide du sens. Tu as réussi les deux !','Le grand engrenage donne la force, et le bon sens soulève la charge. Comme une vraie grue !','Chaque engrenage inverse le sens. Avec le bon nombre, le bateau avance !','Seuls deux grands engrenages vont ! Les ingénieurs calculent exactement la taille des engrenages.']},
 mx:{lvMys:'Un cadeau mystère ! Équilibre la balançoire, puis devine combien pèse le cadeau.',lvMysQ:'Le cadeau pèse autant que… ?',lvMysOk:w=>`Oui ! Le cadeau pèse autant ${['','qu’une souris','qu’un lapin','qu’un chien','qu’un éléphant'][w]}.`,lvMysNo:'Pas tout à fait. Réfléchis : quel animal à la place du cadeau garderait la balançoire droite ?',
  gBack:'Ça tourne dans le mauvais sens ! Ajoute ou enlève un engrenage pour changer le sens.',bkCount:(n,t)=>`Exactement, ${n} fois ! Plus l’engrenage arrière est petit, plus la roue tourne de fois.`,bkAgain:'Pas tout à fait. Comptons encore !',bkTourLost:'L’escargot a gagné ! Change de vitesse : rapide sur le plat, facile dans la côte.',
  rIce:'Sur la glace, la bille glisse beaucoup plus loin !',rSand:'Dans le sable, la bille s’arrête vite !',rGrass:'Maintenant c’est de l’herbe.',rBasket:'La bille doit tomber dans le panier !',rIceWhy:'La glace est glissante et freine à peine la bille : peu de frottement !',rSandWhy:'Le sable freine beaucoup la bille : beaucoup de frottement !',
  pIntro:'La poulie ! RoboPufi doit monter le poids jusqu’au drapeau. Choisis combien de poulies il utilise, puis garde le doigt sur 💪 pour qu’il tire.',pHeavy:'C’est trop lourd ! RoboPufi n’y arrive pas. Ajoute des poulies !',pN:v=>v===1?'Une poulie.':`${v} poulies.`,
  pOk:n=>n===1?'En haut ! Une poulie change seulement le sens : tu tires vers le bas et le poids monte.':`En haut ! Avec ${n} poulies le poids semble ${n} fois plus léger, mais tu tires ${n} fois plus de corde.`,pNext:'Maintenant un autre poids ! Choisis les bonnes poulies.',
  cIntro:'La catapulte ! Tire la pierre en arrière avec ton doigt, comme un lance-pierre, et lâche. Touche le château !',cFar:'Le château est loin ! Tire plus fort.',cBalloon:'Éclate le ballon dans les airs !',cWall:'Un mur ! Lance la pierre haut, par-dessus le mur.',cMulti:'Touche toutes les cibles !',cOut:'Plus de pierres ! On recommence.',
  cWhy:['Touché ! Plus tu tires fort, plus la pierre vole loin.','Super ! Pour aller loin, vise à mi-hauteur du ciel, environ 45 degrés.','Bravo ! La pierre vole en courbe, car la gravité la tire vers le bas.','Par-dessus le mur ! Un grand angle lance la pierre haut.','Deux ballons ! Chaque cible demande une autre force et un autre angle.','Champion ! Tu as utilisé des angles et des forces différents pour chaque cible.','Maître de la catapulte ! C’est ainsi que calculaient les ingénieurs d’autrefois.']}},
es:{menu:{pulley:['🏗️','La polea'],cata:['🏹','La catapulta']},
 bike:[,,,,,'Da dos vueltas de pedal y cuenta: ¿cuántas veces gira la rueda de atrás? ¡Mira el punto rojo!','¡Un recorrido con cuesta! Gana al caracol: marcha rápida en llano, fácil en la cuesta. ¡Cambia a tiempo!','Ahora los pedales dan más vueltas. ¡Cuenta bien las vueltas de la rueda de atrás!'],
 bikeWhy:[,,,,,'','¡Campeón! Los ciclistas cambian de marcha todo el rato: fácil en las cuestas, rápida en llano.',''],
 g:{t:[,,,,,'¡El reloj grande tiene un hueco largo! Llénalo con engranajes de cualquier tamaño.','¡El coche de carreras debe ir rápido y hacia delante! Piensa en el tamaño y en el sentido.','¡La grúa debe subir al elefante! Necesitas fuerza y el sentido correcto.','¡Llena el hueco y el barco debe ir hacia delante! ¿Cuántos engranajes necesitas?','El último reloj es difícil: ¿qué engranajes llenan justo el hueco?'],
  why:[,,,,,'¡Genial! Puedes llenar el mismo hueco de muchas maneras: con muchos engranajes pequeños o con menos grandes.','El engranaje pequeño da velocidad y el número de engranajes decide el sentido. ¡Has resuelto las dos cosas!','El engranaje grande da fuerza y el sentido correcto sube la carga. ¡Como una grúa de verdad!','Cada engranaje cambia el sentido. ¡Con el número justo, el barco va hacia delante!','¡Solo caben dos engranajes grandes! Los ingenieros calculan exactamente el tamaño de los engranajes.']},
 mx:{lvMys:'¡Un regalo misterioso! Equilibra el balancín y luego adivina cuánto pesa el regalo.',lvMysQ:'El regalo pesa como…?',lvMysOk:w=>`¡Sí! El regalo pesa como ${['','un ratón','un conejo','un perro','un elefante'][w]}.`,lvMysNo:'No exactamente. Piensa: ¿qué animal en el lugar del regalo mantendría recto el balancín?',
  gBack:'¡Va en sentido contrario! Añade o quita un engranaje para cambiar el sentido.',bkCount:(n,t)=>`¡Exacto, ${n} veces! Cuanto más pequeño es el engranaje de atrás, más vueltas da la rueda.`,bkAgain:'No exactamente. ¡Contemos otra vez!',bkTourLost:'¡Ganó el caracol! Cambia de marcha: rápida en llano, fácil en la cuesta.',
  rIce:'¡En el hielo la bola resbala mucho más lejos!',rSand:'¡En la arena la bola se para enseguida!',rGrass:'Ahora es hierba.',rBasket:'¡La bola debe entrar en la cesta!',rIceWhy:'El hielo resbala y casi no frena la bola: ¡poco rozamiento!',rSandWhy:'La arena frena mucho la bola: ¡mucho rozamiento!',
  pIntro:'¡La polea! RoboPufi debe subir el peso hasta la bandera. Elige cuántas poleas usa y mantén pulsado 💪 para que tire.',pHeavy:'¡Pesa demasiado! RoboPufi no puede. ¡Añade poleas!',pN:v=>v===1?'Una polea.':`${v} poleas.`,
  pOk:n=>n===1?'¡Arriba! Una polea solo cambia la dirección: tiras hacia abajo y el peso sube.':`¡Arriba! Con ${n} poleas el peso parece ${n} veces más ligero, pero tiras ${n} veces más cuerda.`,pNext:'¡Ahora otro peso! Elige las poleas adecuadas.',
  cIntro:'¡La catapulta! Tira de la piedra hacia atrás con el dedo, como un tirachinas, y suelta. ¡Dale al castillo!',cFar:'¡El castillo está lejos! Tira más fuerte.',cBalloon:'¡Explota el globo en el aire!',cWall:'¡Un muro! Lanza la piedra alto, por encima del muro.',cMulti:'¡Dale a todos los blancos!',cOut:'¡No quedan piedras! Empezamos de nuevo.',
  cWhy:['¡Diana! Cuanto más fuerte tiras, más lejos vuela la piedra.','¡Genial! Para llegar lejos, apunta a media altura del cielo, unos 45 grados.','¡Bravo! La piedra vuela en curva porque la gravedad la tira hacia abajo.','¡Por encima del muro! Un ángulo grande lanza la piedra alto.','¡Dos globos! Cada blanco necesita otra fuerza y otro ángulo.','¡Campeón! Usaste ángulos y fuerzas distintos para cada blanco.','¡Maestro de la catapulta! Así calculaban los ingenieros de antes.']}},
it:{menu:{pulley:['🏗️','La carrucola'],cata:['🏹','La catapulta']},
 bike:[,,,,,'Fai due giri di pedale e conta: quante volte gira la ruota dietro? Guarda il puntino rosso!','Un percorso con la salita! Batti la lumaca: marcia veloce in pianura, facile in salita. Cambia in tempo!','Ora i pedali fanno più giri. Conta bene i giri della ruota dietro!'],
 bikeWhy:[,,,,,'','Campione! I ciclisti cambiano marcia di continuo: facile in salita, veloce in pianura.',''],
 g:{t:[,,,,,'Il grande orologio ha un buco lungo! Riempilo con ingranaggi di qualsiasi misura.','L’auto da corsa deve andare veloce e in avanti! Pensa alla misura e al verso.','La gru deve sollevare l’elefante verso l’alto! Servono forza e il verso giusto.','Riempi il buco, e la nave deve andare avanti! Quanti ingranaggi ti servono?','L’ultimo orologio è difficile: quali ingranaggi riempiono esattamente il buco?'],
  why:[,,,,,'Super! Puoi riempire lo stesso buco in tanti modi: con tanti ingranaggi piccoli o con meno grandi.','L’ingranaggio piccolo dà velocità e il numero di ingranaggi decide il verso. Hai risolto tutte e due le cose!','L’ingranaggio grande dà forza e il verso giusto solleva il carico. Come una vera gru!','Ogni ingranaggio inverte il verso. Con il numero giusto, la nave va avanti!','Entrano solo due ingranaggi grandi! Gli ingegneri calcolano esattamente la misura degli ingranaggi.']},
 mx:{lvMys:'Un regalo misterioso! Metti in equilibrio l’altalena, poi indovina quanto pesa il regalo.',lvMysQ:'Il regalo pesa come…?',lvMysOk:w=>`Sì! Il regalo pesa come ${['','un topolino','un coniglio','un cane','un elefante'][w]}.`,lvMysNo:'Non proprio. Pensa: quale animale al posto del regalo terrebbe dritta l’altalena?',
  gBack:'Va nel verso sbagliato! Aggiungi o togli un ingranaggio per cambiare verso.',bkCount:(n,t)=>`Esatto, ${n} volte! Più piccolo è l’ingranaggio dietro, più giri fa la ruota.`,bkAgain:'Non proprio. Contiamo di nuovo!',bkTourLost:'Ha vinto la lumaca! Cambia marcia: veloce in pianura, facile in salita.',
  rIce:'Sul ghiaccio la pallina scivola molto più lontano!',rSand:'Nella sabbia la pallina si ferma presto!',rGrass:'Ora c’è l’erba.',rBasket:'La pallina deve entrare nel cestino!',rIceWhy:'Il ghiaccio è scivoloso e frena pochissimo la pallina: poco attrito!',rSandWhy:'La sabbia frena molto la pallina: tanto attrito!',
  pIntro:'La carrucola! RoboPufi deve sollevare il peso fino alla bandierina. Scegli quante carrucole usa, poi tieni premuto 💪 perché tiri.',pHeavy:'È troppo pesante! RoboPufi non ce la fa. Aggiungi carrucole!',pN:v=>v===1?'Una carrucola.':`${v} carrucole.`,
  pOk:n=>n===1?'Su! Una carrucola cambia solo la direzione: tiri giù e il peso sale.':`Su! Con ${n} carrucole il peso sembra ${n} volte più leggero, ma tiri ${n} volte più corda.`,pNext:'Ora un altro peso! Scegli le carrucole giuste.',
  cIntro:'La catapulta! Tira indietro la pietra con il dito, come una fionda, e lascia andare. Colpisci il castello!',cFar:'Il castello è lontano! Tira più forte.',cBalloon:'Fai scoppiare il palloncino in aria!',cWall:'Un muro! Lancia la pietra in alto, sopra il muro.',cMulti:'Colpisci tutti i bersagli!',cOut:'Pietre finite! Ricominciamo.',
  cWhy:['Colpito! Più tiri forte, più lontano vola la pietra.','Super! Per arrivare lontano, mira a metà cielo, circa 45 gradi.','Bravo! La pietra vola facendo una curva, perché la gravità la tira giù.','Sopra il muro! Un angolo grande lancia la pietra in alto.','Due palloncini! Ogni bersaglio vuole un’altra forza e un altro angolo.','Campione! Hai usato angoli e forze diversi per ogni bersaglio.','Maestro della catapulta! Così calcolavano gli ingegneri di una volta.']}},
pt:{menu:{pulley:['🏗️','A roldana'],cata:['🏹','A catapulta']},
 bike:[,,,,,'Dá duas voltas de pedal e conta: quantas vezes gira a roda de trás? Olha para a bolinha vermelha!','Um percurso com subida! Vence o caracol: mudança rápida no plano, fácil na subida. Muda a tempo!','Agora os pedais dão mais voltas. Conta bem as voltas da roda de trás!'],
 bikeWhy:[,,,,,'','Campeão! Os ciclistas mudam de mudança a toda a hora: fácil nas subidas, rápida no plano.',''],
 g:{t:[,,,,,'O relógio grande tem um espaço comprido! Enche-o com rodas dentadas de qualquer tamanho.','O carro de corrida tem de ir depressa e para a frente! Pensa no tamanho e no sentido.','A grua tem de levantar o elefante! Precisas de força e do sentido certo.','Enche o espaço, e o barco tem de andar para a frente! Quantas rodas precisas?','O último relógio é difícil: que rodas enchem exatamente o espaço?'],
  why:[,,,,,'Boa! Podes encher o mesmo espaço de muitas maneiras: com muitas rodas pequenas ou com menos grandes.','A roda pequena dá velocidade e o número de rodas decide o sentido. Resolveste as duas coisas!','A roda grande dá força e o sentido certo levanta a carga. Como uma grua a sério!','Cada roda muda o sentido. Com o número certo, o barco anda para a frente!','Só cabem duas rodas grandes! Os engenheiros calculam exatamente o tamanho das rodas.']},
 mx:{lvMys:'Um presente misterioso! Equilibra o baloiço e depois adivinha quanto pesa o presente.',lvMysQ:'O presente pesa tanto como…?',lvMysOk:w=>`Sim! O presente pesa tanto como ${['','um rato','um coelho','um cão','um elefante'][w]}.`,lvMysNo:'Não bem. Pensa: que animal no lugar do presente deixaria o baloiço direito?',
  gBack:'Está a andar no sentido errado! Junta ou tira uma roda para mudar o sentido.',bkCount:(n,t)=>`Exato, ${n} vezes! Quanto mais pequena a roda dentada de trás, mais voltas dá a roda.`,bkAgain:'Não bem. Vamos contar outra vez!',bkTourLost:'O caracol ganhou! Muda de mudança: rápida no plano, fácil na subida.',
  rIce:'No gelo a bola escorrega muito mais longe!',rSand:'Na areia a bola para depressa!',rGrass:'Agora é relva.',rBasket:'A bola tem de cair no cesto!',rIceWhy:'O gelo escorrega e quase não trava a bola: pouco atrito!',rSandWhy:'A areia trava muito a bola: muito atrito!',
  pIntro:'A roldana! O RoboPufi tem de levantar o peso até à bandeira. Escolhe quantas roldanas ele usa e mantém carregado 💪 para ele puxar.',pHeavy:'É pesado demais! O RoboPufi não consegue. Junta roldanas!',pN:v=>v===1?'Uma roldana.':`${v} roldanas.`,
  pOk:n=>n===1?'Para cima! Uma roldana só muda a direção: puxas para baixo e o peso sobe.':`Para cima! Com ${n} roldanas o peso parece ${n} vezes mais leve, mas puxas ${n} vezes mais corda.`,pNext:'Agora outro peso! Escolhe as roldanas certas.',
  cIntro:'A catapulta! Puxa a pedra para trás com o dedo, como uma fisga, e larga. Acerta no castelo!',cFar:'O castelo está longe! Puxa com mais força.',cBalloon:'Rebenta o balão no ar!',cWall:'Um muro! Atira a pedra alto, por cima do muro.',cMulti:'Acerta em todos os alvos!',cOut:'Acabaram as pedras! Vamos recomeçar.',
  cWhy:['Acertaste! Quanto mais forte puxas, mais longe voa a pedra.','Boa! Para ir longe, aponta a meio do céu, uns 45 graus.','Muito bem! A pedra voa em curva porque a gravidade a puxa para baixo.','Por cima do muro! Um ângulo grande atira a pedra alto.','Dois balões! Cada alvo precisa de outra força e de outro ângulo.','Campeão! Usaste ângulos e forças diferentes para cada alvo.','Mestre da catapulta! Era assim que calculavam os engenheiros antigos.']}},
nl:{menu:{pulley:['🏗️','De katrol'],cata:['🏹','De katapult']},
 bike:[,,,,,'Trap twee rondjes en tel: hoe vaak draait het achterwiel? Let op het rode stipje!','Een route met een heuvel! Versla de slak: snelle versnelling op het vlakke stuk, makkelijke op de heuvel. Schakel op tijd!','Nu draaien de trappers vaker rond. Tel de rondjes van het achterwiel goed!'],
 bikeWhy:[,,,,,'','Kampioen! Fietsers schakelen steeds: makkelijk op heuvels, snel op het vlakke stuk.',''],
 g:{t:[,,,,,'De grote klok heeft een lang gat! Vul het met tandwielen van elke maat.','De raceauto moet snel en vooruit rijden! Denk aan de maat en aan de richting.','De kraan moet de olifant omhoog tillen! Je hebt kracht en de goede richting nodig.','Vul het gat, en het schip moet vooruit varen! Hoeveel tandwielen heb je nodig?','De laatste klok is lastig: welke tandwielen vullen het gat precies?'],
  why:[,,,,,'Super! Je kunt hetzelfde gat op veel manieren vullen: met veel kleine of minder grote tandwielen.','Het kleine tandwiel geeft snelheid, het aantal tandwielen bepaalt de richting. Je hebt allebei opgelost!','Het grote tandwiel geeft kracht, de goede richting tilt de last op. Net een echte kraan!','Elk tandwiel draait de richting om. Met het goede aantal vaart het schip vooruit!','Er passen maar twee grote tandwielen! Ingenieurs rekenen de maat van tandwielen precies uit.']},
 mx:{lvMys:'Een geheimzinnig cadeau! Breng de wip in evenwicht en raad dan hoe zwaar het cadeau is.',lvMysQ:'Het cadeau is zo zwaar als…?',lvMysOk:w=>`Ja! Het cadeau is zo zwaar als ${['','een muis','een konijn','een hond','een olifant'][w]}.`,lvMysNo:'Niet helemaal. Denk na: welk dier op de plek van het cadeau houdt de wip recht?',
  gBack:'Hij draait de verkeerde kant op! Voeg een tandwiel toe of haal er een weg om de richting te veranderen.',bkCount:(n,t)=>`Precies, ${n} keer! Hoe kleiner het achterste tandwiel, hoe vaker het wiel draait.`,bkAgain:'Niet helemaal. We tellen nog een keer!',bkTourLost:'De slak heeft gewonnen! Schakel: snel op het vlakke stuk, makkelijk op de heuvel.',
  rIce:'Op ijs glijdt de bal veel verder!',rSand:'In zand stopt de bal snel!',rGrass:'Nu is het gras.',rBasket:'De bal moet in de mand!',rIceWhy:'IJs is glad en remt de bal bijna niet af: weinig wrijving!',rSandWhy:'Zand remt de bal flink af: veel wrijving!',
  pIntro:'De katrol! RoboPufi moet het gewicht tot aan het vlaggetje optillen. Kies hoeveel katrollen hij gebruikt en houd dan 💪 ingedrukt zodat hij trekt.',pHeavy:'Het is te zwaar! RoboPufi kan het niet. Neem meer katrollen!',pN:v=>v===1?'Eén katrol.':`${v} katrollen.`,
  pOk:n=>n===1?'Omhoog! Eén katrol verandert alleen de richting: jij trekt naar beneden en het gewicht gaat omhoog.':`Omhoog! Met ${n} katrollen voelt het gewicht ${n} keer lichter, maar je trekt ${n} keer meer touw.`,pNext:'Nu een ander gewicht! Kies de goede katrollen.',
  cIntro:'De katapult! Trek de steen met je vinger naar achteren, net als een katapult, en laat los. Raak het kasteel!',cFar:'Het kasteel is ver weg! Trek harder.',cBalloon:'Laat de ballon in de lucht knappen!',cWall:'Een muur! Gooi de steen hoog, over de muur.',cMulti:'Raak alle doelen!',cOut:'Geen stenen meer! We beginnen opnieuw.',
  cWhy:['Raak! Hoe harder je trekt, hoe verder de steen vliegt.','Super! Om ver te komen mik je halverwege de lucht, ongeveer 45 graden.','Goed zo! De steen vliegt in een boog, omdat de zwaartekracht hem naar beneden trekt.','Over de muur! Een grote hoek gooit de steen hoog.','Twee ballonnen! Elk doel heeft een andere kracht en een andere hoek nodig.','Kampioen! Je gebruikte voor elk doel andere hoeken en krachten.','Katapultmeester! Zo rekenden ingenieurs vroeger.']}},
pl:{menu:{pulley:['🏗️','Bloczek'],cata:['🏹','Katapulta']},
 bike:[,,,,,'Zrób dwa obroty pedałami i policz: ile razy obróci się tylne koło? Patrz na czerwoną kropkę!','Trasa z górką! Pokonaj ślimaka: szybki bieg na płaskim, łatwy na górce. Zmień w porę!','Teraz pedały robią więcej obrotów. Policz dokładnie obroty tylnego koła!'],
 bikeWhy:[,,,,,'','Mistrz! Rowerzyści cały czas zmieniają biegi: łatwy pod górkę, szybki na płaskim.',''],
 g:{t:[,,,,,'Duży zegar ma długą dziurę! Wypełnij ją zębatkami dowolnej wielkości.','Wyścigówka ma jechać szybko i do przodu! Pomyśl o wielkości i o kierunku.','Dźwig ma podnieść słonia do góry! Potrzebujesz siły i dobrego kierunku.','Wypełnij dziurę, a statek ma płynąć do przodu! Ile zębatek potrzebujesz?','Ostatni zegar jest trudny: które zębatki dokładnie wypełnią dziurę?'],
  why:[,,,,,'Super! Tę samą dziurę można wypełnić na wiele sposobów: wieloma małymi zębatkami albo mniejszą liczbą dużych.','Mała zębatka daje szybkość, a liczba zębatek decyduje o kierunku. Udało ci się jedno i drugie!','Duża zębatka daje siłę, a dobry kierunek podnosi ładunek. Jak prawdziwy dźwig!','Każda zębatka zmienia kierunek. Z dobrą liczbą zębatek statek płynie do przodu!','Pasują tylko dwie duże zębatki! Inżynierowie dokładnie obliczają wielkość zębatek.']},
 mx:{lvMys:'Tajemniczy prezent! Zrównoważ huśtawkę, a potem zgadnij, ile waży prezent.',lvMysQ:'Prezent waży tyle co…?',lvMysOk:w=>`Tak! Prezent waży tyle co ${['','myszka','królik','piesek','słoń'][w]}.`,lvMysNo:'Nie całkiem. Pomyśl: które zwierzątko w miejscu prezentu utrzymałoby huśtawkę prosto?',
  gBack:'Kręci się w złą stronę! Dodaj albo zabierz zębatkę, żeby zmienić kierunek.',bkCount:(n,t)=>`Dokładnie, ${n} razy! Im mniejsza tylna zębatka, tym więcej obrotów robi koło.`,bkAgain:'Nie całkiem. Policzmy jeszcze raz!',bkTourLost:'Ślimak wygrał! Zmień bieg: szybki na płaskim, łatwy pod górkę.',
  rIce:'Na lodzie kulka jedzie dużo dalej!',rSand:'W piasku kulka szybko się zatrzymuje!',rGrass:'Teraz jest trawa.',rBasket:'Kulka ma wpaść do koszyka!',rIceWhy:'Lód jest śliski i prawie nie hamuje kulki: małe tarcie!',rSandWhy:'Piasek mocno hamuje kulkę: duże tarcie!',
  pIntro:'Bloczek! RoboPufi ma podnieść ciężar aż do flagi. Wybierz, ile bloczków użyje, a potem przytrzymaj 💪, żeby ciągnął.',pHeavy:'Za ciężkie! RoboPufi nie da rady. Dodaj bloczki!',pN:v=>v===1?'Jeden bloczek.':`Bloczki: ${v}.`,
  pOk:n=>n===1?'Do góry! Jeden bloczek zmienia tylko kierunek: ciągniesz w dół, a ciężar idzie w górę.':`Do góry! Z ${n} bloczkami ciężar wydaje się ${n} razy lżejszy, ale ciągniesz ${n} razy więcej liny.`,pNext:'Teraz inny ciężar! Wybierz odpowiednie bloczki.',
  cIntro:'Katapulta! Odciągnij kamień palcem do tyłu, jak w procy, i puść. Traf w zamek!',cFar:'Zamek jest daleko! Pociągnij mocniej.',cBalloon:'Przebij balonik w powietrzu!',cWall:'Mur! Rzuć kamień wysoko, nad murem.',cMulti:'Traf we wszystkie cele!',cOut:'Koniec kamieni! Zaczynamy od nowa.',
  cWhy:['Trafiony! Im mocniej ciągniesz, tym dalej leci kamień.','Super! Żeby rzucić daleko, celuj w połowę nieba, mniej więcej 45 stopni.','Brawo! Kamień leci po łuku, bo grawitacja ciągnie go w dół.','Nad murem! Duży kąt rzuca kamień wysoko.','Dwa baloniki! Każdy cel potrzebuje innej siły i innego kąta.','Mistrz! Do każdego celu użyłeś innego kąta i innej siły.','Mistrz katapulty! Tak liczyli dawni inżynierowie.']}},
uk:{menu:{pulley:['🏗️','Блок'],cata:['🏹','Катапульта']},
 bike:[,,,,,'Зроби два оберти педалями й порахуй: скільки разів обернеться заднє колесо? Стеж за червоною цяткою!','Траса з гіркою! Обжени равлика: швидка передача на рівній дорозі, легка на гірці. Перемикай вчасно!','Тепер педалі роблять більше обертів. Уважно порахуй оберти заднього колеса!'],
 bikeWhy:[,,,,,'','Чемпіон! Велосипедисти весь час перемикають передачі: легка на гірці, швидка на рівному.',''],
 g:{t:[,,,,,'Великий годинник має довгу щілину! Заповни її шестернями будь-якого розміру.','Гоночна машина має їхати швидко й уперед! Подумай про розмір і напрям.','Кран має підняти слона вгору! Потрібні сила й правильний напрям.','Заповни щілину, і корабель має пливти вперед! Скільки шестерень тобі потрібно?','Останній годинник складний: які шестерні точно заповнять щілину?'],
  why:[,,,,,'Чудово! Ту саму щілину можна заповнити по-різному: багатьма маленькими шестернями або меншою кількістю великих.','Маленька шестерня дає швидкість, а кількість шестерень визначає напрям. Ти впорався з обома!','Велика шестерня дає силу, а правильний напрям піднімає вантаж. Як справжній кран!','Кожна шестерня змінює напрям. З правильною кількістю корабель пливе вперед!','Підходять лише дві великі шестерні! Інженери точно розраховують розмір шестерень.']},
 mx:{lvMys:'Таємничий подарунок! Зрівноваж гойдалку, а потім вгадай, скільки важить подарунок.',lvMysQ:'Подарунок важить як…?',lvMysOk:w=>`Так! Подарунок важить як ${['','мишка','зайчик','собачка','слон'][w]}.`,lvMysNo:'Не зовсім. Подумай: яка тваринка на місці подарунка тримала б гойдалку рівно?',
  gBack:'Крутиться не в той бік! Додай або прибери шестерню, щоб змінити напрям.',bkCount:(n,t)=>`Точно, ${n}! Що менша задня зірочка, то більше обертів робить колесо.`,bkAgain:'Не зовсім. Порахуймо ще раз!',bkTourLost:'Равлик переміг! Перемикай передачу: швидка на рівному, легка на гірці.',
  rIce:'На льоду кулька котиться набагато далі!',rSand:'У піску кулька швидко зупиняється!',rGrass:'Тепер трава.',rBasket:'Кулька має потрапити в кошик!',rIceWhy:'Лід слизький і майже не гальмує кульку: мале тертя!',rSandWhy:'Пісок сильно гальмує кульку: велике тертя!',
  pIntro:'Блок! РобоПуфі має підняти вантаж до прапорця. Обери, скільки блоків він використає, а потім тримай 💪, щоб він тягнув.',pHeavy:'Надто важко! РобоПуфі не може. Додай блоки!',pN:v=>v===1?'Один блок.':`Блоків: ${v}.`,
  pOk:n=>n===1?'Угору! Один блок лише змінює напрям: ти тягнеш униз, а вантаж іде вгору.':`Угору! З ${n} блоками вантаж здається в ${n} рази легшим, але ти тягнеш у ${n} рази більше мотузки.`,pNext:'Тепер інший вантаж! Обери потрібні блоки.',
  cIntro:'Катапульта! Відтягни камінь пальцем назад, як рогатку, і відпусти. Влуч у замок!',cFar:'Замок далеко! Тягни сильніше.',cBalloon:'Лусни кульку в повітрі!',cWall:'Стіна! Кинь камінь високо, через стіну.',cMulti:'Влуч у всі цілі!',cOut:'Каміння скінчилося! Почнімо знову.',
  cWhy:['Влучив! Що сильніше тягнеш, то далі летить камінь.','Чудово! Щоб кинути далеко, цілься на половину неба, приблизно 45 градусів.','Молодець! Камінь летить дугою, бо сила тяжіння тягне його вниз.','Через стіну! Великий кут кидає камінь високо.','Дві кульки! Кожна ціль потребує іншої сили й іншого кута.','Чемпіон! Ти використав різні кути й сили для кожної цілі.','Майстер катапульти! Так розраховували давні інженери.']}},
ru:{menu:{pulley:['🏗️','Блок'],cata:['🏹','Катапульта']},
 bike:[,,,,,'Сделай два оборота педалями и посчитай: сколько раз повернётся заднее колесо? Следи за красной точкой!','Трасса с горкой! Обгони улитку: быстрая передача на ровной дороге, лёгкая на горке. Переключай вовремя!','Теперь педали делают больше оборотов. Внимательно посчитай обороты заднего колеса!'],
 bikeWhy:[,,,,,'','Чемпион! Велосипедисты всё время переключают передачи: лёгкая на горке, быстрая на ровном.',''],
 g:{t:[,,,,,'У большого часов длинная щель! Заполни её шестерёнками любого размера.','Гоночная машина должна ехать быстро и вперёд! Подумай о размере и о направлении.','Кран должен поднять слона вверх! Нужны сила и правильное направление.','Заполни щель, и корабль должен плыть вперёд! Сколько шестерёнок тебе нужно?','Последние часы сложные: какие шестерёнки точно заполнят щель?'],
  why:[,,,,,'Отлично! Одну и ту же щель можно заполнить по-разному: многими маленькими шестерёнками или несколькими большими.','Маленькая шестерёнка даёт скорость, а количество шестерёнок решает направление. Ты справился с обоим!','Большая шестерёнка даёт силу, а правильное направление поднимает груз. Как настоящий кран!','Каждая шестерёнка меняет направление. С правильным количеством корабль плывёт вперёд!','Подходят только две большие шестерёнки! Инженеры точно рассчитывают размер шестерёнок.']},
 mx:{lvMys:'Таинственный подарок! Уравновесь качели, а потом угадай, сколько весит подарок.',lvMysQ:'Подарок весит как…?',lvMysOk:w=>`Да! Подарок весит как ${['','мышка','зайчик','собачка','слон'][w]}.`,lvMysNo:'Не совсем. Подумай: какой зверёк на месте подарка держал бы качели ровно?',
