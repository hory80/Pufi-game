<style>
/* ===== Școala lui Pufi: lecții animate de soroban ===== */
#sg-root{position:fixed;inset:0;z-index:57;display:flex;flex-direction:column;gap:8px;box-sizing:border-box;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(env(safe-area-inset-bottom,0px) + 10px);font-family:var(--display);color:var(--ink);background:linear-gradient(#E8F6FF,#FFF4E2);overflow:hidden}

.sg-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.sg-menu{flex:1;min-height:0;overflow:auto;width:100%;max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding-bottom:10px}
.sg-path{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(46%,200px),1fr));gap:12px}
.sg-card{font:inherit;position:relative;background:#fff;border:none;border-radius:24px;box-shadow:0 7px 0 #C9DDF0;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--ink);min-height:128px}
.sg-card:active{transform:translateY(5px);box-shadow:0 2px 0 #C9DDF0}
.sg-card .ic{font-size:clamp(2.2rem,6vh,3rem);line-height:1.1}
.sg-card .n{font-size:.85rem;opacity:.6;font-weight:700}
.sg-card .t{font-weight:800;font-size:clamp(1rem,2.3vw,1.2rem);text-align:center;line-height:1.15}
.sg-card .st{color:#F2A900;letter-spacing:2px;font-size:1.1rem}
.sg-card.lock{opacity:.45;filter:grayscale(.7)}
.sg-card.lock::after{content:'🔒';position:absolute;top:8px;right:10px}
.sg-card.cur{outline:4px solid #FFD43B;animation:sgBob 1.6s ease-in-out infinite}

.sg-par{font:inherit;font-weight:800;font-size:clamp(1.05rem,2.6vw,1.3rem);border:3px solid var(--ink);background:#fff;border-radius:999px;padding:8px 18px;cursor:pointer;align-self:center}

.sg-dots{display:flex;gap:6px}.sg-dots span{width:15px;height:15px;border-radius:50%;background:#D5E3F2}.sg-dots span.on{background:#3ECF8E}

.sg-board .beam.mk{animation:sgBlink .7s infinite}
.sg-board .lb{font:800 22px var(--display);text-anchor:middle}
.sg-board .fg{font-size:34px;pointer-events:none}
@keyframes sgBlink{50%{opacity:.35}}
.sg-hand{position:absolute;font-size:clamp(40px,7vh,60px);line-height:1;pointer-events:none;transition:left .55s ease,top .55s ease,opacity .3s;z-index:3;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3));transform:translate(-50%,0)}
.sg-ctrl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

.sg-fr span{background:#E8F6FF;border-radius:14px;padding:4px 10px;font-weight:800;font-size:1.2rem}
.sa-guide{font:inherit;width:100%;flex:none;border:none;border-radius:24px;padding:12px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;color:var(--ink);text-align:left;background:linear-gradient(120deg,#FFE27A,#FFB347);box-shadow:0 7px 0 #E09A2E;position:relative}

.sa-guide .ic{font-size:clamp(2.4rem,7vh,3.4rem);line-height:1}
.sa-guide b{display:block;font-size:clamp(1.25rem,3.2vw,1.7rem)}
.sa-guide span.s{font-weight:700;opacity:.85;font-size:clamp(.9rem,2.2vw,1.1rem)}
.sa-guide .fire{margin-left:auto;background:#fff;border-radius:999px;padding:4px 12px;font-weight:800;font-size:1.2rem;white-space:nowrap}

   'Rule 1, friends of 5: 1 and 4, 2 and 3. When there is no room to add 1-beads, add 5 and take away the friend. Example: 4 plus 3 is 4 plus 5 minus 2, which is 7.',

  t:['Questo è il soroban! Ogni asta verticale è una cifra.','La barra in mezzo si chiama ponte. Tocca il ponte!','La perla in alto vale 5. Tocca la perla da 5!','Le perle in basso valgono 1 ciascuna. Spingi una perla su fino al ponte!','Una perla conta solo quando tocca il ponte. Ora spingine su altre due!','Hai 3! Il punto bianco mostra l’asta delle unità.'],
  f:['Il pollice spinge su le perle in basso. Mostra 2!','L’indice porta giù le perle in basso. Fai 0!','L’indice muove anche la perla da 5. Mostra 5!','Ora tutte e due le dita insieme, come una pinza: mostra 7!','L’indice pulisce tutto. Fai 0!'],
  show:n=>`Mostra ${n}.`,up:n=>n===1?'Spingi su una perla da 1.':`Spingi su ${n} perle da 1.`,down:n=>n===1?'Porta giù una perla da 1.':`Porta giù ${n} perle da 1.`,h5on:'Porta giù la perla da 5.',h5off:'Porta su la perla da 5.',t10up:'Spingi su una perla sull’asta delle decine.',t10down:'Porta giù una perla sull’asta delle decine.',
  direct:'C’è posto! Muoviamo direttamente.',noRoom:b=>`Non c’è più posto per ${b}!`,notEnough:b=>`Non ci sono abbastanza perle per togliere ${b}!`,f5:(b,f)=>`L’amico di ${b} per fare 5 è ${f}.`,f10:(b,f)=>`L’amico di ${b} per fare 10 è ${f}.`,
  tryBlink:'Muovi le perle che lampeggiano.',have:v=>`Il soroban mostra ${v}. Riprova!`,right:n=>`Sì! ${n}!`,good:'Bravo!',ghost:'Le perle spariscono piano piano. Immaginale nella tua testa!',ghostLast:'Chiudi gli occhi e vedi il soroban nella tua testa. Quanto fa?',
  pg:['Che cos’è il soroban? Un abaco giapponese: ogni asta è una cifra. La perla in alto vale 5, le 4 perle in basso valgono 1 ciascuna. Una perla conta solo quando tocca la barra in mezzo.',
   'Regola 1, gli amici del 5: 1 e 4, 2 e 3. Quando non c’è più posto per aggiungere perle da 1, aggiungi 5 e togli l’amico. Esempio: 4 più 3 è 4 più 5 meno 2, cioè 7.',
   'Regola 2, gli amici del 10: 1 e 9, 2 e 8, 3 e 7, 4 e 6, 5 e 5. Quando non c’è più posto sull’asta delle unità, aggiungi 10 sull’asta a sinistra e togli l’amico. Esempio: 8 più 5 è 8 più 10 meno 5, cioè 13.',
   'Nella sottrazione è al contrario: meno 3 vuol dire più 2 meno 5, e meno 7 vuol dire meno 10 più 3.',
   'Le dita: il pollice spinge su le perle in basso. L’indice le porta giù e muove la perla da 5.',
   'Come esercitarsi: 10–15 minuti ogni giorno. Un soroban vero aiuta molto. Dopo qualche mese il bambino comincia a vedere il soroban nella testa. Questo si chiama anzan.',
   'Il percorso nell’app: la scuola di Pufi, poi l’Accademia Soroban, poi l’Arena Anzan con cinture e gare.']},
 es:{title:'La escuela de Pufi',sub:'Lecciones animadas de soroban, paso a paso',les:['Conoce el soroban','Los dedos mágicos','Los números del 0 al 9','Sumas directas','Los amigos del 5: suma','Los amigos del 5: resta','Los amigos del 10: suma','Los amigos del 10: resta','El soroban fantasma'],
  lvl:n=>`Lección ${n}`,back:'⬅ Volver',menu:'⬅ Lecciones',watch:'👀 Mira cómo lo hago',you:'🙌 ¡Ahora tú!',alone:'⭐ ¡Tú solo!',replay:'👀 Enséñame',hint:'💡 Ayuda',check:'✔ Listo',
  done:'¡Lección terminada! ¡Muy bien!',next:'▶ Siguiente lección',again:'↺ Otra vez',locked:'Primero termina la lección anterior.',parents:'👨‍👩‍👧 Guía para padres',close:'✖ Cerrar',streak:'días seguidos',
  t:['¡Este es el soroban! Cada varilla vertical es una cifra.','La barra del medio se llama puente. ¡Toca el puente!','La cuenta de arriba vale 5. ¡Toca la cuenta de 5!','Las cuentas de abajo valen 1 cada una. ¡Sube una cuenta hasta el puente!','Una cuenta solo cuenta cuando toca el puente. ¡Ahora sube dos más!','¡Tienes 3! El punto blanco muestra la varilla de las unidades.'],
  f:['El pulgar sube las cuentas de abajo. ¡Muestra 2!','El índice baja las cuentas de abajo. ¡Haz 0!','El índice también mueve la cuenta de 5. ¡Muestra 5!','Ahora los dos dedos juntos, como una pinza: ¡muestra 7!','El índice lo limpia todo. ¡Haz 0!'],
  show:n=>`Muestra ${n}.`,up:n=>n===1?'Sube una cuenta de 1.':`Sube ${n} cuentas de 1.`,down:n=>n===1?'Baja una cuenta de 1.':`Baja ${n} cuentas de 1.`,h5on:'Baja la cuenta de 5.',h5off:'Sube la cuenta de 5.',t10up:'Sube una cuenta en la varilla de las decenas.',t10down:'Baja una cuenta en la varilla de las decenas.',
  direct:'¡Hay sitio! Lo movemos directamente.',noRoom:b=>`¡No hay sitio para ${b}!`,notEnough:b=>`¡No hay cuentas suficientes para quitar ${b}!`,f5:(b,f)=>`El amigo de ${b} para hacer 5 es ${f}.`,f10:(b,f)=>`El amigo de ${b} para hacer 10 es ${f}.`,
  tryBlink:'Mueve las cuentas que parpadean.',have:v=>`El soroban muestra ${v}. ¡Inténtalo otra vez!`,right:n=>`¡Sí! ¡${n}!`,good:'¡Muy bien!',ghost:'Las cuentas desaparecen poco a poco. ¡Imagínalas en tu mente!',ghostLast:'Cierra los ojos y ve el soroban en tu mente. ¿Cuánto es?',
  pg:['¿Qué es el soroban? Un ábaco japonés: cada varilla es una cifra. La cuenta de arriba vale 5 y las 4 de abajo valen 1 cada una. Una cuenta solo cuenta cuando toca la barra del medio.',
   'Regla 1, los amigos del 5: 1 y 4, 2 y 3. Cuando no hay sitio para añadir cuentas de 1, se suma 5 y se quita el amigo. Ejemplo: 4 más 3 es 4 más 5 menos 2, o sea 7.',
   'Regla 2, los amigos del 10: 1 y 9, 2 y 8, 3 y 7, 4 y 6, 5 y 5. Cuando no hay sitio en la varilla de las unidades, se suma 10 en la varilla de la izquierda y se quita el amigo. Ejemplo: 8 más 5 es 8 más 10 menos 5, o sea 13.',
   'En la resta es al revés: menos 3 significa más 2 menos 5, y menos 7 significa menos 10 más 3.',
   'Los dedos: el pulgar sube las cuentas de abajo. El índice las baja y mueve la cuenta de 5.',
   'Cómo practicar: de 10 a 15 minutos cada día. Un soroban de verdad ayuda mucho. Después de unos meses el niño empieza a ver el soroban en su mente. Eso se llama anzan.',
   'El camino en la app: la escuela de Pufi, luego la Academia Soroban y después la Arena Anzan con cinturones y concursos.']},
 pt:{title:'A escola do Pufi',sub:'Aulas animadas de soroban, passo a passo',les:['Conheça o soroban','Os dedos mágicos','Os números de 0 a 9','Somas diretas','Os amigos do 5: soma','Os amigos do 5: subtração','Os amigos do 10: soma','Os amigos do 10: subtração','O soroban fantasma'],
  lvl:n=>`Aula ${n}`,back:'⬅ Voltar',menu:'⬅ Aulas',watch:'👀 Veja como eu faço',you:'🙌 Agora você!',alone:'⭐ Sozinho!',replay:'👀 Mostre de novo',hint:'💡 Ajuda',check:'✔ Pronto',
  done:'Aula concluída! Muito bem!',next:'▶ Próxima aula',again:'↺ De novo',locked:'Primeiro termine a aula anterior.',parents:'👨‍👩‍👧 Guia para os pais',close:'✖ Fechar',streak:'dias seguidos',
  t:['Este é o soroban! Cada haste vertical é um algarismo.','A barra do meio se chama ponte. Toque na ponte!','A conta de cima vale 5. Toque na conta de 5!','As contas de baixo valem 1 cada. Suba uma conta até a ponte!','Uma conta só vale quando encosta na ponte. Agora suba mais duas!','Você tem 3! O ponto branco mostra a haste das unidades.'],
  f:['O polegar sobe as contas de baixo. Mostre 2!','O indicador desce as contas de baixo. Faça 0!','O indicador também move a conta de 5. Mostre 5!','Agora os dois dedos juntos, como uma pinça: mostre 7!','O indicador limpa tudo. Faça 0!'],
  show:n=>`Mostre ${n}.`,up:n=>n===1?'Suba uma conta de 1.':`Suba ${n} contas de 1.`,down:n=>n===1?'Desça uma conta de 1.':`Desça ${n} contas de 1.`,h5on:'Desça a conta de 5.',h5off:'Suba a conta de 5.',t10up:'Suba uma conta na haste das dezenas.',t10down:'Desça uma conta na haste das dezenas.',
  direct:'Tem lugar! Movemos direto.',noRoom:b=>`Não tem mais lugar para ${b}!`,notEnough:b=>`Não há contas suficientes para tirar ${b}!`,f5:(b,f)=>`O amigo de ${b} para fazer 5 é ${f}.`,f10:(b,f)=>`O amigo de ${b} para fazer 10 é ${f}.`,
  tryBlink:'Mova as contas que piscam.',have:v=>`O soroban mostra ${v}. Tente de novo!`,right:n=>`Sim! ${n}!`,good:'Muito bem!',ghost:'As contas desaparecem aos poucos. Imagine-as na sua mente!',ghostLast:'Feche os olhos e veja o soroban na sua mente. Quanto dá?',
  pg:['O que é o soroban? Um ábaco japonês: cada haste é um algarismo. A conta de cima vale 5 e as 4 de baixo valem 1 cada. Uma conta só vale quando encosta na barra do meio.',
   'Regra 1, os amigos do 5: 1 e 4, 2 e 3. Quando não há lugar para somar contas de 1, soma-se 5 e tira-se o amigo. Exemplo: 4 mais 3 é 4 mais 5 menos 2, ou seja, 7.',
   'Regra 2, os amigos do 10: 1 e 9, 2 e 8, 3 e 7, 4 e 6, 5 e 5. Quando não há lugar na haste das unidades, soma-se 10 na haste da esquerda e tira-se o amigo. Exemplo: 8 mais 5 é 8 mais 10 menos 5, ou seja, 13.',
   'Na subtração é ao contrário: menos 3 significa mais 2 menos 5, e menos 7 significa menos 10 mais 3.',
   'Os dedos: o polegar sobe as contas de baixo. O indicador desce essas contas e move a conta de 5.',
   'Como praticar: de 10 a 15 minutos todos os dias. Um soroban de verdade ajuda muito. Depois de alguns meses a criança começa a ver o soroban na mente. Isso se chama anzan.',
   'O caminho no app: a escola do Pufi, depois a Academia Soroban e então a Arena Anzan com faixas e competições.']},
 nl:{title:'De school van Pufi',sub:'Geanimeerde sorobanlessen, stap voor stap',les:['Leer de soroban kennen','De toovervingers','De getallen 0–9','Direct optellen','Vrienden van 5: optellen','Vrienden van 5: aftrekken','Vrienden van 10: optellen','Vrienden van 10: aftrekken','De spooksoroban'],
  lvl:n=>`Les ${n}`,back:'⬅ Terug',menu:'⬅ Lessen',watch:'👀 Kijk hoe ik het doe',you:'🙌 Nu jij!',alone:'⭐ Helemaal zelf!',replay:'👀 Laat zien',hint:'💡 Hulp',check:'✔ Klaar',
  done:'Les klaar! Goed gedaan!',next:'▶ Volgende les',again:'↺ Nog eens',locked:'Maak eerst de les hiervoor af.',parents:'👨‍👩‍👧 Gids voor ouders',close:'✖ Sluiten',streak:'dagen op rij',
  t:['Dit is de soroban! Elke rechtopstaande staaf is één cijfer.','De balk in het midden heet de brug. Tik op de brug!','De bovenste kraal is 5 waard. Tik op de vijfkraal!','De onderste kralen zijn elk 1 waard. Duw één kraal omhoog naar de brug!','Een kraal telt alleen als hij de brug raakt. Duw er nog twee omhoog!','Je hebt 3! De witte stip wijst de staaf van de eenheden aan.'],
  f:['Je duim duwt de onderste kralen omhoog. Laat 2 zien!','Je wijsvinger schuift de onderste kralen omlaag. Maak 0!','Je wijsvinger beweegt ook de vijfkraal. Laat 5 zien!','Nu beide vingers samen, als een knijper: laat 7 zien!','Je wijsvinger ruimt alles op. Maak 0!'],
  show:n=>`Laat ${n} zien.`,up:n=>n===1?'Duw één eenkraal omhoog.':`Duw ${n} eenkralen omhoog.`,down:n=>n===1?'Schuif één eenkraal omlaag.':`Schuif ${n} eenkralen omlaag.`,h5on:'Schuif de vijfkraal omlaag.',h5off:'Schuif de vijfkraal omhoog.',t10up:'Duw één kraal omhoog op de staaf van de tientallen.',t10down:'Schuif één kraal omlaag op de staaf van de tientallen.',
  direct:'Er is plaats! We schuiven direct.',noRoom:b=>`Geen plaats meer voor ${b}!`,notEnough:b=>`Niet genoeg kralen om ${b} weg te halen!`,f5:(b,f)=>`De vriend van ${b} om 5 te maken is ${f}.`,f10:(b,f)=>`De vriend van ${b} om 10 te maken is ${f}.`,
  tryBlink:'Schuif de knipperende kralen.',have:v=>`De soroban laat ${v} zien. Probeer het nog eens!`,right:n=>`Ja! ${n}!`,good:'Goed zo!',ghost:'De kralen verdwijnen langzaam. Zie ze in je hoofd!',ghostLast:'Doe je ogen dicht en zie de soroban in je hoofd. Hoeveel is het?',
  pg:['Wat is een soroban? Een Japans telraam: elke staaf is één cijfer. De bovenste kraal is 5 waard, de 4 onderste kralen elk 1. Een kraal telt alleen als hij de middelste balk raakt.',
   'Regel 1, vrienden van 5: 1 en 4, 2 en 3. Als er geen plaats meer is om eenkralen toe te voegen, tel je 5 erbij en haal je de vriend weg. Voorbeeld: 4 plus 3 is 4 plus 5 min 2, dus 7.',
   'Regel 2, vrienden van 10: 1 en 9, 2 en 8, 3 en 7, 4 en 6, 5 en 5. Als er op de staaf van de eenheden geen plaats is, tel je 10 erbij op de staaf links en haal je de vriend weg. Voorbeeld: 8 plus 5 is 8 plus 10 min 5, dus 13.',
   'Bij aftrekken is het omgekeerd: min 3 betekent plus 2 min 5, en min 7 betekent min 10 plus 3.',
   'De vingers: de duim duwt de onderste kralen omhoog. De wijsvinger schuift ze omlaag en beweegt de vijfkraal.',
   'Zo oefen je: elke dag 10 tot 15 minuten. Een echte soroban helpt veel. Na een paar maanden begint het kind de soroban in het hoofd te zien. Dat heet anzan.',
   'De route in de app: de school van Pufi, dan de Soroban-academie, dan de Anzan-arena met banden en wedstrijden.']},
 pl:{title:'Szkoła Pufiego',sub:'Animowane lekcje sorobanu, krok po kroku',les:['Poznaj soroban','Magiczne palce','Liczby od 0 do 9','Dodawanie bezpośrednie','Przyjaciele 5: dodawanie','Przyjaciele 5: odejmowanie','Przyjaciele 10: dodawanie','Przyjaciele 10: odejmowanie','Soroban-duszek'],
  lvl:n=>`Lekcja ${n}`,back:'⬅ Wstecz',menu:'⬅ Lekcje',watch:'👀 Zobacz, jak to robię',you:'🙌 Teraz ty!',alone:'⭐ Samodzielnie!',replay:'👀 Pokaż mi',hint:'💡 Pomoc',check:'✔ Gotowe',
  done:'Lekcja ukończona! Brawo!',next:'▶ Następna lekcja',again:'↺ Jeszcze raz',locked:'Najpierw skończ poprzednią lekcję.',parents:'👨‍👩‍👧 Poradnik dla rodziców',close:'✖ Zamknij',streak:'dni z rzędu',
  t:['To jest soroban! Każdy pionowy pręt to jedna cyfra.','Belka pośrodku to most. Dotknij mostu!','Górny koralik jest wart 5. Dotknij koralika 5!','Dolne koraliki są warte po 1. Przesuń jeden koralik w górę do mostu!','Koralik liczy się tylko wtedy, gdy dotyka mostu. Teraz przesuń w górę jeszcze dwa!','Masz 3! Biała kropka pokazuje pręt jedności.'],
  f:['Kciuk przesuwa dolne koraliki w górę. Pokaż 2!','Palec wskazujący przesuwa dolne koraliki w dół. Zrób 0!','Palec wskazujący przesuwa też koralik 5. Pokaż 5!','Teraz oba palce naraz, jak szczypce: pokaż 7!','Palec wskazujący wszystko czyści. Zrób 0!'],
  show:n=>`Pokaż ${n}.`,up:n=>n===1?'Przesuń w górę jeden koralik 1.':`Przesuń w górę koraliki 1: ${n}.`,down:n=>n===1?'Przesuń w dół jeden koralik 1.':`Przesuń w dół koraliki 1: ${n}.`,h5on:'Przesuń w dół koralik 5.',h5off:'Przesuń w górę koralik 5.',t10up:'Przesuń w górę jeden koralik na pręcie dziesiątek.',t10down:'Przesuń w dół jeden koralik na pręcie dziesiątek.',
  direct:'Jest miejsce! Przesuwamy od razu.',noRoom:b=>`Nie ma już miejsca na ${b}!`,notEnough:b=>`Za mało koralików, żeby zabrać ${b}!`,f5:(b,f)=>`Przyjaciel liczby ${b} do 5 to ${f}.`,f10:(b,f)=>`Przyjaciel liczby ${b} do 10 to ${f}.`,
  tryBlink:'Przesuń migające koraliki.',have:v=>`Soroban pokazuje ${v}. Spróbuj jeszcze raz!`,right:n=>`Tak! ${n}!`,good:'Brawo!',ghost:'Koraliki powoli znikają. Wyobraź je sobie w głowie!',ghostLast:'Zamknij oczy i zobacz soroban w głowie. Ile to jest?',
  pg:['Co to jest soroban? Japońskie liczydło: każdy pręt to jedna cyfra. Górny koralik jest wart 5, a 4 dolne po 1. Koralik liczy się tylko wtedy, gdy dotyka środkowej belki.',
   'Zasada 1, przyjaciele 5: 1 i 4, 2 i 3. Gdy nie ma miejsca, by dodać koraliki 1, dodajemy 5 i zabieramy przyjaciela. Przykład: 4 plus 3 to 4 plus 5 minus 2, czyli 7.',
   'Zasada 2, przyjaciele 10: 1 i 9, 2 i 8, 3 i 7, 4 i 6, 5 i 5. Gdy na pręcie jedności nie ma miejsca, dodajemy 10 na pręcie po lewej i zabieramy przyjaciela. Przykład: 8 plus 5 to 8 plus 10 minus 5, czyli 13.',
   'Przy odejmowaniu jest odwrotnie: minus 3 to plus 2 minus 5, a minus 7 to minus 10 plus 3.',
   'Palce: kciuk przesuwa dolne koraliki w górę. Palec wskazujący przesuwa je w dół i porusza koralikiem 5.',
   'Jak ćwiczyć: 10–15 minut codziennie. Prawdziwy soroban bardzo pomaga. Po kilku miesiącach dziecko zaczyna widzieć soroban w głowie. To się nazywa anzan.',
   'Droga w aplikacji: Szkoła Pufiego, potem Akademia Sorobanu, a potem Arena Anzan z pasami i zawodami.']},
 hu:{title:'Pufi iskolája',sub:'Animált szorobán-leckék, lépésről lépésre',les:['Ismerd meg a szorobánt','A varázsujjak','A számok 0-tól 9-ig','Közvetlen összeadás','Az 5 barátai: összeadás','Az 5 barátai: kivonás','A 10 barátai: összeadás','A 10 barátai: kivonás','A szellem-szorobán'],
  lvl:n=>`${n}. lecke`,back:'⬅ Vissza',menu:'⬅ Leckék',watch:'👀 Nézd, hogyan csinálom',you:'🙌 Most te!',alone:'⭐ Egyedül!',replay:'👀 Mutasd meg',hint:'💡 Segítség',check:'✔ Kész',
  done:'Kész a lecke! Ügyes vagy!',next:'▶ Következő lecke',again:'↺ Újra',locked:'Előbb fejezd be az előző leckét.',parents:'👨‍👩‍👧 Útmutató szülőknek',close:'✖ Bezárás',streak:'nap egymás után',
  t:['Ez a szorobán! Minden függőleges rúd egy számjegy.','A középső léc neve híd. Érintsd meg a hidat!','A felső golyó 5-öt ér. Érintsd meg az ötös golyót!','Az alsó golyók 1-et érnek. Tolj fel egy golyót a hídig!','Egy golyó csak akkor számít, ha hozzáér a hídhoz. Most tolj fel még kettőt!','Megvan a 3! A fehér pötty mutatja az egyesek rúdját.'],
  f:['A hüvelykujj feltolja az alsó golyókat. Mutasd a 2-t!','A mutatóujj letolja az alsó golyókat. Legyen 0!','A mutatóujj az ötös golyót is mozgatja. Mutasd az 5-öt!','Most mindkét ujj együtt, mint egy csipesz: mutasd a 7-et!','A mutatóujj mindent letöröl. Legyen 0!'],
  show:n=>`Mutasd: ${n}.`,up:n=>n===1?'Tolj fel egy egyes golyót.':`Tolj fel egyes golyókat: ${n}.`,down:n=>n===1?'Tolj le egy egyes golyót.':`Tolj le egyes golyókat: ${n}.`,h5on:'Told le az ötös golyót.',h5off:'Told fel az ötös golyót.',t10up:'Tolj fel egy golyót a tízesek rúdján.',t10down:'Tolj le egy golyót a tízesek rúdján.',
  direct:'Van hely! Közvetlenül toljuk.',noRoom:b=>`Nincs több hely ennek: ${b}!`,notEnough:b=>`Nincs elég golyó, hogy elvegyük ezt: ${b}!`,f5:(b,f)=>`${b} barátja az 5-höz: ${f}.`,f10:(b,f)=>`${b} barátja a 10-hez: ${f}.`,
  tryBlink:'Mozgasd a villogó golyókat.',have:v=>`A szorobánon ez van: ${v}. Próbáld újra!`,right:n=>`Igen! ${n}!`,good:'Ügyes!',ghost:'A golyók lassan eltűnnek. Képzeld el őket a fejedben!',ghostLast:'Csukd be a szemed, és lásd a szorobánt a fejedben. Mennyi az eredmény?',
  pg:['Mi a szorobán? Japán golyós számológép: minden rúd egy számjegy. A felső golyó 5-öt ér, a 4 alsó golyó egyenként 1-et. Egy golyó csak akkor számít, ha hozzáér a középső léchez.',
   '1. szabály, az 5 barátai: 1 és 4, 2 és 3. Ha nincs hely egyes golyókat hozzáadni, hozzáadunk 5-öt, és elvesszük a barátot. Példa: 4 meg 3 az 4 meg 5 mínusz 2, vagyis 7.',
   '2. szabály, a 10 barátai: 1 és 9, 2 és 8, 3 és 7, 4 és 6, 5 és 5. Ha az egyesek rúdján nincs hely, a bal oldali rúdon hozzáadunk 10-et, és elvesszük a barátot. Példa: 8 meg 5 az 8 meg 10 mínusz 5, vagyis 13.',
   'Kivonásnál fordítva: mínusz 3 azt jelenti, plusz 2 mínusz 5, a mínusz 7 pedig mínusz 10 plusz 3.',
   'Az ujjak: a hüvelykujj feltolja az alsó golyókat. A mutatóujj letolja őket, és mozgatja az ötös golyót.',

    const a=t*10+u, st=stOf(a,nR), T=U-1; const s1=mv(st,T,{e:st[T].e-1}); const steps=[{st:s1,txt:X().t10down+' (−10)',mk:{r:T,ks:[st[T].e-1],fg:'☝️'}}]; stepsTo(s1,U,u+c).forEach(s=>steps.push(s));
    return {q:`${a} − ${b}`,ans:a-b,start:st,why:[X().notEnough(b),X().f10(b,c)],f:`−${b} = −10 + ${c}`,steps}; }
  if(L===8){ const k=R(4); return plan([3,4,5,6][k],nR); }
}
const NR=[1,1,1,1,1,1,2,2,2];
/* ---- interfață ---- */
const root=document.createElement('div'); root.id='sg-root'; root.hidden=true;

const $=id=>document.getElementById('sg-'+id);
let view='menu', L=0, tk=null, ti=0, errs=0, phase='', sv=null, stepI=0, token=0, busy=false;
const best=()=>LS.get('sg_best',{});

function menu(){ view='menu'; token++; try{ speechSynthesis.cancel(); }catch(e){} $('menu').hidden=false; $('play').hidden=true; $('title').textContent='🎓 '+X().title; $('back').textContent=X().back; pill();
  const m=$('menu'); m.innerHTML=''; const pb=document.createElement('button'); pb.className='sg-par'; pb.textContent=X().parents; pb.onclick=guide; m.appendChild(pb);
  const g=document.createElement('div'); g.className='sg-path'; const b=best(); const cur=X().les.findIndex((_,i)=>isOpen(i)&&!(b[i]>0));
  X().les.forEach((n,i)=>{ const c=document.createElement('button'); const open=isOpen(i); c.className='sg-card'+(open?'':' lock')+(i===cur?' cur':''); c.dataset.lk='sa:g'+i;
    c.innerHTML=`<span class="ic">${ICONS[i]}</span><span class="n">${X().lvl(i+1)}</span><span class="t">${n}</span><span class="st">${'★'.repeat(b[i]||0)}${'☆'.repeat(3-(b[i]||0))}</span>`;

  m.appendChild(g); }
function guide(){ const ov=document.createElement('div'); ov.className='sg-ov'; const P=X().pg;
  const fr5='<div class="sg-fr"><span>1 ↔ 4</span><span>2 ↔ 3</span></div>', fr10='<div class="sg-fr"><span>1 ↔ 9</span><span>2 ↔ 8</span><span>3 ↔ 7</span><span>4 ↔ 6</span><span>5 ↔ 5</span></div>';
  ov.innerHTML=`<div class="sg-guide"><h3>${X().parents}</h3>${P.map((p,i)=>`<div class="pp"><button data-i="${i}">🔊</button><p>${p}</p></div>${i===1?fr5:i===2?fr10:''}`).join('')}<div class="row"><button class="go" data-a="x">${X().close}</button></div></div>`;
  ov.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>sp(P[+b.dataset.i])); ov.querySelector('[data-a=x]').onclick=()=>{ try{ speechSynthesis.cancel(); }catch(e){} ov.remove(); };
  ov.onclick=e=>{ if(e.target===ov) ov.remove(); }; root.appendChild(ov); }
function dots(n,on){ const d=$('dots'); d.innerHTML=''; for(let i=0;i<n;i++){ const s=document.createElement('span'); if(i<on) s.className='on'; d.appendChild(s); } }
function enter(){ view='play'; $('menu').hidden=true; $('play').hidden=false; $('back').textContent=X().menu; $('replay').textContent=X().replay; $('hint').textContent=X().hint; $('check').textContent=X().check; pill(); }
function newBoard(nR){ const b=$('board'); const hand=$('hand'); b.innerHTML=''; b.appendChild(hand); const host=document.createElement('div'); host.style.cssText='width:100%;height:100%;display:flex;justify-content:center'; b.appendChild(host); sv=makeSor(host,nR); hand.style.opacity=0; return sv; }
/* mânuța: arată și mută bilele */
async function handTo(m,my){ const hand=$('hand'), b=$('board').getBoundingClientRect(); const k=m.k==='h'?'h':m.ks[m.fg==='👍'?0:m.ks.length-1];
  const el=sv.bd(m.r,k).getBoundingClientRect(); hand.textContent=m.fg==='👍'?'👍':'☝️';
  hand.style.left=(el.left-b.left+el.width/2)+'px'; hand.style.top=(m.fg==='👍'?el.bottom-b.top-6:el.top-b.top-hand.offsetHeight+10)+'px'; hand.style.opacity=1; await wait(650); return token===my; }
async function demo(){ const my=++token; busy=true; sv.lock=true; sv.unmark(); sv.setSt(tk.start); phase='demo'; $('phase').textContent=X().watch; await wait(300);
  for(const s of tk.steps){ if(token!==my) return; sv.mark([s.mk]); say2(s.txt); if(!await handTo(s.mk,my)) return; sv.setSt(s.st,true); clack(s.mk.r,sv.nR); await wait(1300); sv.unmark(); }
  if(token!==my) return; $('hand').style.opacity=0; await wait(500); if(token!==my) return; sv.setSt(tk.start); sv.lock=false; busy=false; }
async function guided(){ const my=++token; phase='guided'; $('phase').textContent=X().you; stepI=0; sv.setSt(tk.start); sv.lock=false; busy=false; showStep(my); }
function showStep(){ const s=tk.steps[stepI]; if(!s) return; sv.mark([s.mk]); say2(s.txt); }
function alone(){ token++; phase='alone'; $('phase').textContent=X().alone; sv.unmark(); sv.setSt(tk.start); sv.lock=false; busy=false; say2(tk.say||qs(tk.q)); }
function onBeads(){ if(busy||view!=='play') return;
  if(L===0||L===1) return scriptCheck();
  if(phase==='guided'){ const s=tk.steps[stepI]; const v=JSON.stringify(sv.st), want=JSON.stringify(s.st);
    if(v===want){ ding(); stepI++; sv.unmark(); if(stepI>=tk.steps.length) return win(); setTimeout(()=>{ if(phase==='guided') showStep(); },350); return; }
    /* pe drum spre țintă? (bilele de 1 mutate pe rând) */
    const prev=stepI?tk.steps[stepI-1].st:tk.start; const ok=sv.st.every((r,i)=>{ const a=prev[i], b=s.st[i]; return (r.h===a.h||r.h===b.h)&&r.e>=Math.min(a.e,b.e)&&r.e<=Math.max(a.e,b.e); });
    if(!ok){ errs++; try{ beep(false); }catch(e){} busy=true; say2(X().tryBlink); setTimeout(()=>{ sv.setSt(prev,true); busy=false; showStep(); },700); } return; }
  if(phase==='alone'&&sv.val()===tk.ans){ busy=true; setTimeout(win,250); } }
async function win(){ const my=++token; busy=true; sv.lock=true; ding(); try{ confetti(14); }catch(e){} try{ stars++; renderBar(); }catch(e){} markDay(); pill();
  ti++; dots(TASKS(),ti); await Promise.all([say2(X().right(tk.ans)+' '+X().good),wait(1300)]); if(token!==my) return; if(ti>=TASKS()) return finish(); nextTask(); }
const TASKS=()=>L===0||L===1?1:L===8?5:5;
function nextTask(){ tk=plan(L,NR[L]); if(L===8||!tk) return ghostTask(); sv.setSt(tk.start); $('ans').hidden=true;
  const fHTML=tk.f?`<span class="f hot">${tk.f}</span>`:''; $('task').innerHTML=`<span class="q">${tk.q}</span>${fHTML}`;
  const why=(tk.why||[]).join(' '); const intro=(why?why+' ':'');
  if(ti<2){ (async()=>{ const my=token; if(intro){ busy=true; sv.lock=true; await Promise.all([say2(qs(tk.q)+'. '+intro),wait(1500)]); } if(token!==my&&intro) return; await demo(); guided(); })(); }
  else if(ti<4){ (async()=>{ if(intro){ busy=true; sv.lock=true; const my=++token; await Promise.all([say2(intro),wait(1200)]); if(token!==my) return; } guided(); })(); }
  else alone(); }
/* lecția 8: sorobanul fantomă */
const GH=[1,.55,.3,.12,.04];
function ghostTask(){ tk=plan(8,NR[8]); const o=GH[Math.min(ti,GH.length-1)]; sv.setSt(tk.start); sv.opacity(o); $('task').innerHTML=`<span class="q">${tk.q}</span>`;
  if(ti===TASKS()-1){ /* ultimul: doar în minte, alege răspunsul */ sv.opacity(0); sv.lock=true; phase='mind'; $('phase').textContent='🧠'; say2(X().ghostLast);
    const box=$('ans'); box.innerHTML=''; box.hidden=false; const o2=new Set([tk.ans]); [tk.ans+1,tk.ans-1,tk.ans+5,tk.ans-5,tk.ans+10].forEach(v=>{ if(o2.size<3&&v>=0) o2.add(v); });
    [...o2].sort(()=>Math.random()-.5).forEach(v=>{ const b=document.createElement('button'); b.textContent=v; b.onclick=()=>{ if(busy) return; if(v===tk.ans){ box.hidden=true; sv.opacity(1); sv.setSt(stOf(tk.ans,sv.nR),true); win(); } else { errs++; b.disabled=true; b.style.opacity=.4; try{ beep(false); }catch(e){} } }; box.appendChild(b); }); return; }
  alone(); if(ti===0) say2(X().ghost+' '+qs(tk.q)); }
/* lecțiile 0 și 1: scenariu */
let scr=[], si=0;
function scripted(){ const T=X();
  if(L===0) scr=[{say:T.t[0],auto:1200},{say:T.t[1],beam:1},{say:T.t[2],want:5,mk:[{r:0,k:'h',fg:'☝️'}]},{say:T.t[3],want:1,reset:0,mk:[{r:0,ks:[0],fg:'👍'}]},{say:T.t[4],want:3,mk:[{r:0,ks:[1,2],fg:'👍'}]},{say:T.t[5],auto:2600}];
  else scr=[{say:T.f[0],want:2,mk:[{r:0,ks:[0,1],fg:'👍'}]},{say:T.f[1],want:0,mk:[{r:0,ks:[0,1],fg:'☝️'}]},{say:T.f[2],want:5,mk:[{r:0,k:'h',fg:'☝️'}]},{say:T.f[3],want:7,reset:0,mk:[{r:0,k:'h',fg:'☝️'},{r:0,ks:[0,1],fg:'👍'}]},{say:T.f[4],want:0,mk:[{r:0,k:'h',fg:'☝️'},{r:0,ks:[0,1],fg:'☝️'}]}];
  si=0; runScr(); }
async function runScr(){ const my=++token; const s=scr[si]; if(!s){ return finish(); } busy=false; sv.lock=!!(s.auto||s.beam); if(s.reset!=null) sv.set(s.reset); sv.unmark();
  if(s.beam){ sv.mark([{beam:1}]); sv.onBeam=()=>{ if(token!==my) return; sv.onBeam=null; ding(); si++; runScr(); }; }
  if(s.mk) sv.mark(s.mk); $('task').innerHTML=s.want!=null?`<span class="q">${s.want}</span>`:''; await say2(s.say);
  if(s.auto){ await wait(s.auto); if(token===my){ si++; runScr(); } } }
function scriptCheck(){ const s=scr[si]; if(!s||s.want==null) return; if(sv.val()===s.want){ busy=true; ding(); sv.unmark(); const my=token; setTimeout(()=>{ if(token!==my) return; si++; runScr(); },700); } }
function lesson(i){ L=i; ti=0; errs=0; enter(); newBoard(NR[i]); sv.on=onBeads; $('title').textContent=ICONS[i]+' '+X().les[i]; $('ans').hidden=true; $('task').innerHTML=''; sv.opacity(1);
  dots(TASKS(),0); const scriptedL=i<=1; $('replay').hidden=scriptedL||i===8; $('hint').hidden=scriptedL; $('check').hidden=scriptedL; $('clear').hidden=false;
  if(scriptedL){ phase='script'; $('phase').textContent=X().you; scripted(); } else nextTask(); }
function finish(){ try{ window.__lvDone&&window.__lvDone(1); }catch(_e){} token++; busy=true; const s=errs===0?3:errs<=2?2:1; const b=best(); b[L]=Math.max(b[L]||0,s); LS.set('sg_best',b); markDay(); try{ stars+=2; renderBar(); }catch(e){} pill(); try{ confetti(40); }catch(e){}
  const ov=document.createElement('div'); ov.className='sg-ov'; ov.innerHTML=`<div><div class="big">${'★'.repeat(s)}${'☆'.repeat(3-s)}</div><h3>${X().done}</h3><div class="row">${L<8?`<button class="go" data-a="n">${X().next}</button>`:''}<button data-a="a">${X().again}</button><button data-a="m">${X().menu}</button></div></div>`;
