 {id:3,ic:'🤖🤧',bg:'#D7F2E3',soon:1,t:{ro:['Robotul care strănută'],en:['The sneezing robot'],de:['Der niesende Roboter'],fr:['Le robot qui éternue'],es:['El robot que estornuda'],it:['Il robot che starnutisce'],pt:['O robô que espirra'],nl:['De niezende robot'],pl:['Kichający robot'],uk:['Робот, що чхає'],ru:['Чихающий робот'],hu:['A tüsszögő robot']}},
 {id:4,ic:'🦜🗺️',bg:'#FFD6D6',soon:1,t:{ro:['Comoara papagalului'],en:['The parrot’s treasure'],de:['Der Schatz des Papageis'],fr:['Le trésor du perroquet'],es:['El tesoro del loro'],it:['Il tesoro del pappagallo'],pt:['O tesouro do papagaio'],nl:['De schat van de papegaai'],pl:['Skarb papugi'],uk:['Скарб папуги'],ru:['Сокровище попугая'],hu:['A papagáj kincse']}}
];
const ET=e=>e.t[L()]||e.t.en;
const pad=n=>String(n).padStart(2,'0');
const img=(e,name)=>`benzi/ep${pad(e.id)}/${name}.jpg`;
/* „*cuvânt*” → părțile: înainte, cuvânt, după */
const split=s=>{ const m=s.match(/^(.*?)\*(.+?)\*(.*)$/); return m?{a:m[1],k:m[2],b:m[3]}:{a:s,k:'',b:''}; };
const upperOn=()=>{ try{ return localStorage.getItem('rd_case')!=='lower'; }catch(e){ return true; } };
const prog=()=>LS.get('cm_prog',{}); const recs=()=>LS.get('cm_recs',{});
const recKey=(e,i)=>`cm-${L()}-ep${e.id}-p${i+1}`;

let cur=null, tok=0, onBack=null;
function pill(){ try{ $('stars').textContent='⭐ '+(typeof stars!=='undefined'?stars:0); }catch(e){} }
function stopAll(){ tok++; try{ if(N){ N.call('rec.stop'); } }catch(e){} try{ speechSynthesis.cancel(); }catch(e){} }
function open(back){ onBack=back||null; root.hidden=false; $('title').textContent=U().title; $('back').textContent=U().back; pill(); library(); }
window.openComics=open;
$('back').onclick=()=>{ if(cur){ stopAll(); cur=null; library(); return; } stopAll(); root.hidden=true; if(onBack) onBack(); };

/* card în meniul Citire */
window.__comicCard=()=>{ const b=el('button','rd-card new',`<span class="ic">💬</span><span class="nm">${U().card}</span>`); b.id='rd-g-comic'; b.dataset.lk='cm:lib'; b.dataset.new=({ro:'NOU',de:'NEU',en:'NEW'})[lang]||(((window.L10N||{}).misc||{})[lang]||{}).newB||'NEW'; b.onclick=()=>open(); return b; };

/* ---------------- biblioteca ---------------- */
function library(){ cur=null; stopAll(); main.innerHTML=''; main.classList.remove('cm-film'); const p=prog();
  const h=el('div','cm-head'); h.append(el('div','cm-face','🦊')); const m=el('div','cm-msg'); m.textContent=U().pick; m.onclick=()=>sp(U().pick); h.append(m); main.append(h);
  const g=el('div','cm-lib');
  EPS.forEach((e,i)=>{ const lock=!e.soon&&i>0&&!p[EPS[i-1].id]; const c=el('button','cm-ep'+(e.soon?' soon':lock?' lock':''));
    c.dataset.lk='cm:ep'+e.id;
    const cv=el('div','cv'); cv.style.background=e.bg; cv.textContent=e.ic; if(!e.soon){ const im=new Image(); im.alt=''; im.onload=()=>{ cv.textContent=''; cv.append(im); }; im.src=img(e,'cover'); }
    c.append(cv, el('div','t',ET(e)[0]), el('div','st',e.soon?U().soon:p[e.id]?U().done:''));
    if(p[e.id]){ const f=el('button','cm-film-b',U().film); f.onclick=ev=>{ ev.stopPropagation(); if(window.__gate&&window.__gate('cm','ep'+e.id)) return; film(e); }; c.append(f); }
    c.onclick=()=>{ if(e.soon){ sp(U().soon); return; } if(lock){ sp(U().locked); return; } if(window.__gate&&window.__gate('cm','ep'+e.id)) return; read(e); };
    g.append(c); });
  main.append(g); sp(U().pick); }

/* ---------------- cititorul ---------------- */
function frame(e,i){ const f=el('div','cm-frame'); const ph=el('div','cm-ph',e.ph[i]); ph.style.background=`linear-gradient(${e.bg} 0 36%,#FFF8E6 36%)`; f.append(ph);
  const im=new Image(); im.alt=''; im.onload=()=>{ ph.remove(); f.prepend(im); }; im.src=img(e,'p'+(i+1)); return f; }
function bubble(e,i,state){ const s=split(ET(e)[1][i][1]); const b=el('div','cm-bub '+(upperOn()?'cm-uc':'cm-lc')); b.style.setProperty('--tx',e.tx[i]);
  const pu=(s.b.match(/^[^\s\p{L}]*/u)||[''])[0]; b.innerHTML=`${esc(s.a)}<span style="white-space:nowrap"><span class="cm-key${state?' '+state:''}">${esc(s.k)}</span>${esc(pu)}</span>${esc(s.b.slice(pu.length))}`; return {b,s}; }
const esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]);

function read(e){ cur={e,i:0,film:false}; panel(); }
async function panel(){ const my=++tok; const {e,i}=cur; const [nar]=ET(e)[1][i]; main.innerHTML=''; main.classList.remove('cm-film');
  const dots=el('div','cm-dots'); ET(e)[1].forEach((_,j)=>dots.append(el('i',j<i?'ok':j===i?'on':''))); main.append(dots);
  const cap=el('div','cm-cap',esc(nar)); cap.onclick=()=>sp(nar); main.append(cap);
  const pn=el('div','cm-panel'); const fr=frame(e,i); const {b,s}=bubble(e,i,''); fr.append(b); pn.append(fr); main.append(pn);
  const key=b.querySelector('.cm-key'); key.onclick=()=>sp(s.k.toLowerCase());
  const ctl=el('div','cm-ctrl'); main.append(ctl);
  /* Pufi citește narațiunea și balonul până la cuvântul-cheie; cuvântul îl citește copilul */
  await sp(nar); if(my!==tok) return; if(/\p{L}/u.test(s.a)){ await sp(s.a); if(my!==tok) return; }
  if(i===0) { await sp(N?U().readKey:U().readKeyWeb); if(my!==tok) return; } else snd(880,.12);
  const doneRead=async()=>{ key.classList.add('ok'); snd(660,.1); setTimeout(()=>snd(990,.12),120); if(/\p{L}/u.test(s.b)) await sp(s.b); if(my!==tok) return; next(); };
  const next=()=>{ ctl.innerHTML=''; const rep=el('button','sm','🔁'); rep.onclick=()=>{ panel(); }; const go=el('button','go',i<ET(e)[1].length-1?'▶':'🎬'); go.onclick=()=>{ if(i<ET(e)[1].length-1){ cur.i++; panel(); } else finishEp(e); }; ctl.append(rep);
    if(N&&recs()[recKey(e,i)]){ const me=el('button','sm',U().me); me.onclick=()=>N.call('rec.play',{key:recKey(e,i)}); ctl.append(me); } ctl.append(go); };
  const webBtn=()=>{ const r=el('button','go',U().read); r.onclick=doneRead; return r; };
  const help=el('button','sm','❓'); help.onclick=()=>sp(s.k.toLowerCase());
  if(N){ const mic=el('button','mic',U().mic); let on=false, t=null;
    const stopRec=async()=>{ clearTimeout(t); if(!on) return; on=false; mic.classList.remove('rec'); mic.textContent=U().mic; await N.call('rec.stop'); const r=recs(); r[recKey(e,i)]=1; LS.set('cm_recs',r);
      key.classList.add('say'); await N.call('rec.play',{key:recKey(e,i)}); if(my!==tok) return; key.classList.remove('say'); doneRead(); };
    mic.onclick=async()=>{ if(on) return stopRec(); let ok=false; try{ ok=!!await N.call('rec.start',{key:recKey(e,i)}); }catch(err){} if(my!==tok) return;
      if(!ok){ sp(U().micNo); ctl.innerHTML=''; ctl.append(help,webBtn()); return; }
      on=true; mic.classList.add('rec'); mic.textContent=U().stop; t=setTimeout(stopRec,5000); };
    ctl.append(help,mic); }
  else ctl.append(help,webBtn()); }

function finishEp(e){ const p=prog(); const first=!p[e.id]; p[e.id]=1; LS.set('cm_prog',p);
  if(first){ try{ stars+=3; renderBar(); }catch(err){} pill(); try{ window.__lvDone&&window.__lvDone(1); }catch(err){} }
  try{ confetti(20); }catch(err){} sp(U().filmSay).then(()=>{ if(cur&&cur.e===e) film(e); }); }

/* ---------------- filmul: povestea cu vocea copilului ---------------- */
async function film(e){ cur={e,i:0,film:true}; const my=++tok; const R=recs(); const n=ET(e)[1].length;
  for(let i=0;i<n;i++){ if(my!==tok) return; cur.i=i; const [nar]=ET(e)[1][i]; main.innerHTML=''; main.classList.add('cm-film');
    const dots=el('div','cm-dots'); ET(e)[1].forEach((_,j)=>dots.append(el('i',j<i?'ok':j===i?'on':''))); main.append(dots);
    main.append(el('div','cm-cap',esc(nar))); const pn=el('div','cm-panel'); const fr=frame(e,i); const {b,s}=bubble(e,i,'ok'); fr.append(b); pn.append(fr); main.append(pn);
    await sp(nar); if(my!==tok) return; if(/\p{L}/u.test(s.a)){ await sp(s.a); if(my!==tok) return; }
    const k=b.querySelector('.cm-key'); k.classList.add('say');
    if(N&&R[recKey(e,i)]) await N.call('rec.play',{key:recKey(e,i)}); else await sp(s.k.toLowerCase());
    if(my!==tok) return; k.classList.remove('say'); if(/\p{L}/u.test(s.b)) await sp(s.b); if(my!==tok) return; await wait(700); }
  main.classList.remove('cm-film'); if(my!==tok) return; const end=el('div','cm-ctrl'); const a=el('button','go',U().again); a.onclick=()=>film(e); const l=el('button','sm',U().lib); l.onclick=()=>library(); end.append(a,l); main.append(end); sp(U().end); }

(window.__LR=window.__LR||[]).push(()=>{ if(root.hidden) return; $('title').textContent=U().title; $('back').textContent=U().back; if(!cur) library(); });
})();
</script>
