  t:{ro:["Oul misterios", [["Pufi se plimbă pe plajă. Deodată vede ceva în nisip.", "Un ou!"], ["Oul e cât Pufi de mare. Și se mișcă!", "E mare!"], ["Crac! Oul se sparge și iese cineva.", "Un pui!"], ["Puiul de dinozaur are foame. Îi ia lui Pufi mărul.", "Mărul meu!"], ["Puiul e trist și plânge. Vrea la mama lui.", "Unde e mama?"], ["Urmele mari duc prin junglă. Acolo e mama lui!", "Ura!"]]],en:["The mystery egg", [["Pufi is walking on the beach. Suddenly he sees something in the sand.", "An egg!"], ["The egg is as big as Pufi. And it is moving!", "It is big!"], ["Crack! The egg breaks and someone comes out.", "A dino!"], ["The baby dinosaur is hungry. It takes Pufi’s apple.", "My apple!"], ["The baby is sad and cries. It wants its mom.", "Where is mom?"], ["The big footprints lead into the jungle. There is its mom!", "Yes!"]]],de:["Das geheimnisvolle Ei", [["Pufi geht am Strand spazieren. Plötzlich sieht er etwas im Sand.", "Ein Ei!"], ["Das Ei ist so groß wie Pufi. Und es bewegt sich!", "So groß!"], ["Krach! Das Ei bricht auf und jemand kommt heraus.", "Ein Dino!"], ["Der kleine Dino hat Hunger. Er nimmt Pufis Apfel.", "Mein Apfel!"], ["Der Kleine ist traurig und weint. Er will zu seiner Mama.", "Wo ist Mama?"], ["Die großen Spuren führen in den Dschungel. Da ist seine Mama!", "Hurra!"]]],fr:["L’œuf mystérieux", [["Pufi se promène sur la plage. Soudain, il voit quelque chose dans le sable.", "Un œuf !"], ["L’œuf est aussi grand que Pufi. Et il bouge !", "Il est gros !"], ["Crac ! L’œuf se casse et quelqu’un sort.", "Un dino !"], ["Le bébé dinosaure a faim. Il prend la pomme de Pufi.", "Ma pomme !"], ["Le bébé est triste et pleure. Il veut sa maman.", "Où est maman ?"], ["Les grandes traces mènent dans la jungle. Voilà sa maman !", "Bravo !"]]],es:["El huevo misterioso", [["Pufi pasea por la playa. De pronto ve algo en la arena.", "¡Un huevo!"], ["El huevo es tan grande como Pufi. ¡Y se mueve!", "¡Qué grande!"], ["¡Crac! El huevo se rompe y sale alguien.", "¡Un dino!"], ["El bebé dinosaurio tiene hambre. Toma la manzana de Pufi.", "¡Mi manzana!"], ["El bebé está triste y llora. Quiere a su mamá.", "¿Dónde está mamá?"], ["Las huellas grandes llevan a la selva. ¡Ahí está su mamá!", "¡Bien!"]]],it:["L’uovo misterioso", [["Pufi passeggia sulla spiaggia. All’improvviso vede qualcosa nella sabbia.", "Un uovo!"], ["L’uovo è grande come Pufi. E si muove!", "È grande!"], ["Crac! L’uovo si rompe ed esce qualcuno.", "Un dino!"], ["Il piccolo dinosauro ha fame. Prende la mela di Pufi.", "La mia mela!"], ["Il piccolo è triste e piange. Vuole la sua mamma.", "Dov’è la mamma?"], ["Le grandi impronte portano nella giungla. Ecco la sua mamma!", "Evviva!"]]],pt:["O ovo misterioso", [["Pufi passeia na praia. De repente, ele vê algo na areia.", "Um ovo!"], ["O ovo é do tamanho do Pufi. E está mexendo!", "Que grande!"], ["Crec! O ovo quebra e sai alguém.", "Um dino!"], ["O bebê dinossauro está com fome. Ele pega a maçã do Pufi.", "Minha maçã!"], ["O bebê está triste e chora. Ele quer a mamãe.", "Cadê a mamãe?"], ["As pegadas grandes levam para a floresta. Lá está a mamãe dele!", "Oba!"]]],nl:["Het geheimzinnige ei", [["Pufi wandelt op het strand. Opeens ziet hij iets in het zand.", "Een ei!"], ["Het ei is zo groot als Pufi. En het beweegt!", "Zo groot!"], ["Krak! Het ei breekt en er komt iemand uit.", "Een dino!"], ["Het dinokindje heeft honger. Het pakt de appel van Pufi.", "Mijn appel!"], ["Het kleintje is verdrietig en huilt. Het wil naar zijn mama.", "Waar is mama?"], ["De grote sporen gaan de jungle in. Daar is zijn mama!", "Hoera!"]]],pl:["Tajemnicze jajko", [["Pufi spaceruje po plaży. Nagle widzi coś w piasku.", "Jajko!"], ["Jajko jest duże jak Pufi. I się rusza!", "Jakie duże!"], ["Trach! Jajko pęka i ktoś wychodzi.", "Mały dino!"], ["Mały dinozaur jest głodny. Bierze jabłko Pufiego.", "Moje jabłko!"], ["Maluch jest smutny i płacze. Chce do mamy.", "Gdzie mama?"], ["Wielkie ślady prowadzą do dżungli. Tam jest jego mama!", "Hura!"]]],uk:["Таємниче яйце", [["Пуфі гуляє пляжем. Раптом він бачить щось у піску.", "Яйце!"], ["Яйце велике, як Пуфі. І воно рухається!", "Яке велике!"], ["Трісь! Яйце розбивається, і хтось вилазить.", "Дино!"], ["Маленький динозавр голодний. Він бере яблуко Пуфі.", "Моє яблуко!"], ["Малюк сумний і плаче. Він хоче до мами.", "Де мама?"], ["Великі сліди ведуть у джунглі. Ось його мама!", "Ура!"]]],ru:["Таинственное яйцо", [["Пуфи гуляет по пляжу. Вдруг он видит что-то в песке.", "Яйцо!"], ["Яйцо большое, как Пуфи. И оно шевелится!", "Какое большое!"], ["Трах! Яйцо раскалывается, и кто-то вылезает.", "Дино!"], ["Маленький динозавр голодный. Он берёт яблоко Пуфи.", "Моё яблоко!"], ["Малыш грустит и плачет. Он хочет к маме.", "Где мама?"], ["Большие следы ведут в джунгли. Вот его мама!", "Ура!"]]],hu:["A titokzatos tojás", [["Pufi a tengerparton sétál. Hirtelen lát valamit a homokban.", "Egy tojás!"], ["A tojás akkora, mint Pufi. És mozog!", "De nagy!"], ["Reccs! A tojás feltörik, és kibújik valaki.", "Egy dinó!"], ["A kis dinó éhes. Elveszi Pufi almáját.", "Az almám!"], ["A kicsi szomorú és sír. Az anyukájához akar menni.", "Hol van anya?"], ["A nagy nyomok a dzsungelbe vezetnek. Ott van az anyukája!", "Hurrá!"]]]}},

  t:{ro:["Racheta din cutie", [["Pufi face o rachetă dintr-o cutie. Vrea să zboare în spațiu.", "Zbor sus!"], ["Pufi numără: trei, doi, unu…", "Start!"], ["Racheta zboară printre planete și stele.", "Ce de stele!"], ["Pe Lună, dintr-o groapă, iese cineva mic și mov.", "Eu sunt Pufi!"], ["Pufi și extraterestrul se joacă cu o stea.", "Hop! Prinde!"], ["Pufi doarme în cutie. A fost un vis? La fereastră clipește ceva.", "Noapte bună!"]]],en:["The box rocket", [["Pufi makes a rocket from a box. He wants to fly into space.", "Up I go!"], ["Pufi counts: three, two, one…", "Go!"], ["The rocket flies past planets and stars.", "So many stars!"], ["On the Moon, someone small and purple comes out of a hole.", "I am Pufi!"], ["Pufi and the alien play with a star.", "Hop! Catch!"], ["Pufi sleeps in the box. Was it a dream? Something blinks at the window.", "Good night!"]]],de:["Die Kisten-Rakete", [["Pufi baut eine Rakete aus einer Kiste. Er will ins Weltall fliegen.", "Ab nach oben!"], ["Pufi zählt: drei, zwei, eins…", "Los!"], ["Die Rakete fliegt an Planeten und Sternen vorbei.", "So viele Sterne!"], ["Auf dem Mond kommt jemand Kleines, Lilanes aus einem Loch.", "Ich bin Pufi!"], ["Pufi und das kleine Wesen spielen mit einem Stern.", "Hopp! Fang!"], ["Pufi schläft in der Kiste. War es ein Traum? Am Fenster blinkt etwas.", "Gute Nacht!"]]],fr:["La fusée en carton", [["Pufi fabrique une fusée avec une boîte. Il veut voler dans l’espace.", "Je vole !"], ["Pufi compte : trois, deux, un…", "Partez !"], ["La fusée vole entre les planètes et les étoiles.", "Que d’étoiles !"], ["Sur la Lune, quelqu’un de petit et violet sort d’un trou.", "Je suis Pufi !"], ["Pufi et l’extraterrestre jouent avec une étoile.", "Hop ! Attrape !"], ["Pufi dort dans la boîte. C’était un rêve ? Quelque chose clignote à la fenêtre.", "Bonne nuit !"]]],es:["El cohete de caja", [["Pufi hace un cohete con una caja. Quiere volar al espacio.", "¡A volar!"], ["Pufi cuenta: tres, dos, uno…", "¡Ya!"], ["El cohete vuela entre planetas y estrellas.", "¡Cuántas estrellas!"], ["En la Luna, alguien pequeño y morado sale de un hoyo.", "¡Soy Pufi!"], ["Pufi y el extraterrestre juegan con una estrella.", "¡Hop! ¡Atrapa!"], ["Pufi duerme en la caja. ¿Fue un sueño? Algo brilla en la ventana.", "¡Buenas noches!"]]],it:["Il razzo di cartone", [["Pufi costruisce un razzo con una scatola. Vuole volare nello spazio.", "Si vola!"], ["Pufi conta: tre, due, uno…", "Via!"], ["Il razzo vola tra pianeti e stelle.", "Quante stelle!"], ["Sulla Luna, da una buca esce qualcuno piccolo e viola.", "Sono Pufi!"], ["Pufi e l’alieno giocano con una stella.", "Hop! Prendi!"], ["Pufi dorme nella scatola. Era un sogno? Qualcosa brilla alla finestra.", "Buona notte!"]]],pt:["O foguete de caixa", [["Pufi faz um foguete com uma caixa. Ele quer voar para o espaço.", "Vou voar!"], ["Pufi conta: três, dois, um…", "Já!"], ["O foguete voa entre planetas e estrelas.", "Quantas estrelas!"], ["Na Lua, alguém pequeno e roxo sai de um buraco.", "Eu sou o Pufi!"], ["Pufi e o alienígena brincam com uma estrela.", "Opa! Pega!"], ["Pufi dorme na caixa. Foi um sonho? Algo pisca na janela.", "Boa noite!"]]],nl:["De dozenraket", [["Pufi maakt een raket van een doos. Hij wil de ruimte in.", "Ik vlieg!"], ["Pufi telt: drie, twee, één…", "Start!"], ["De raket vliegt langs planeten en sterren.", "Zoveel sterren!"], ["Op de maan komt iemand kleins en paars uit een kuil.", "Ik ben Pufi!"], ["Pufi en het ruimtewezentje spelen met een ster.", "Hop! Vang!"], ["Pufi slaapt in de doos. Was het een droom? Bij het raam knippert iets.", "Slaap lekker!"]]],pl:["Rakieta z pudełka", [["Pufi robi rakietę z pudełka. Chce polecieć w kosmos.", "Lecę!"], ["Pufi liczy: trzy, dwa, jeden…", "Start!"], ["Rakieta leci obok planet i gwiazd.", "Ile gwiazd!"], ["Na Księżycu z dołka wychodzi ktoś mały i fioletowy.", "Jestem Pufi!"], ["Pufi i kosmita bawią się gwiazdką.", "Hop! Łap!"], ["Pufi śpi w pudełku. Czy to był sen? Coś mruga w oknie.", "Dobranoc!"]]],uk:["Ракета з коробки", [["Пуфі робить ракету з коробки. Він хоче полетіти в космос.", "Лечу!"], ["Пуфі рахує: три, два, один…", "Старт!"], ["Ракета летить повз планети й зірки.", "Скільки зірок!"], ["На Місяці з ямки виходить хтось маленький і фіолетовий.", "Я Пуфі!"], ["Пуфі й інопланетянин граються зіркою.", "Гоп! Лови!"], ["Пуфі спить у коробці. Це був сон? У вікні щось блимає.", "Добраніч!"]]],ru:["Ракета из коробки", [["Пуфи делает ракету из коробки. Он хочет полететь в космос.", "Лечу!"], ["Пуфи считает: три, два, один…", "Пуск!"], ["Ракета летит мимо планет и звёзд.", "Сколько звёзд!"], ["На Луне из ямки вылезает кто-то маленький и фиолетовый.", "Я Пуфи!"], ["Пуфи и инопланетянин играют звёздочкой.", "Гоп! Лови!"], ["Пуфи спит в коробке. Это был сон? В окне что-то мигает.", "Спокойной ночи!"]]],hu:["A dobozrakéta", [["Pufi rakétát épít egy dobozból. Az űrbe akar repülni.", "Repülök!"], ["Pufi számol: három, kettő, egy…", "Start!"], ["A rakéta bolygók és csillagok között repül.", "Mennyi csillag!"], ["A Holdon egy gödörből kibújik valaki kicsi és lila.", "Én Pufi vagyok!"], ["Pufi és az űrlény egy csillaggal játszanak.", "Hopp! Kapd el!"], ["Pufi a dobozban alszik. Csak álom volt? Az ablakban valami villog.", "Jó éjt!"]]]}},

  t:{ro:["Robotul care strănută", [["Pufi și robotul Bip fac o prăjitură. Au ouă, făină și un tel.", "Facem un tort!"], ["Deodată, Bip strănută: hapciu! Făina zboară peste tot.", "Vai, făina!"], ["Bip strănută din nou. Șosetele zboară prin bucătărie!", "Hei, stai!"], ["Pufi se uită în nasul lui Bip cu o lupă. Acolo e ceva mic și moale.", "O pană!"], ["Pufi scoate pana cu o pensetă. Bip nu mai strănută.", "Gata!"], ["Bip și Pufi termină prăjitura. Pana stă sus, pe tort.", "Ce tort bun!"]]],en:["The sneezing robot", [["Pufi and Bip the robot are baking a cake. They have eggs, flour and a whisk.", "We bake a cake!"], ["Suddenly Bip sneezes: achoo! Flour flies everywhere.", "Oh no, the flour!"], ["Bip sneezes again. Socks fly around the kitchen!", "Hey, stop!"], ["Pufi looks into Bip’s nose with a magnifying glass. There is something small and soft.", "A feather!"], ["Pufi pulls out the feather with tweezers. Bip stops sneezing.", "All done!"], ["Bip and Pufi finish the cake. The feather sits on top.", "Yum, cake!"]]],de:["Der niesende Roboter", [["Pufi und der Roboter Bip backen einen Kuchen. Sie haben Eier, Mehl und einen Schneebesen.", "Wir backen!"], ["Plötzlich niest Bip: hatschi! Das Mehl fliegt überall hin.", "Oh nein, das Mehl!"], ["Bip niest noch einmal. Socken fliegen durch die Küche!", "He, halt!"], ["Pufi schaut mit einer Lupe in Bips Nase. Da ist etwas Kleines, Weiches.", "Eine Feder!"], ["Pufi zieht die Feder mit einer Pinzette heraus. Bip niest nicht mehr.", "Fertig!"], ["Bip und Pufi backen den Kuchen fertig. Die Feder steckt oben drauf.", "Lecker!"]]],fr:["Le robot qui éternue", [["Pufi et le robot Bip font un gâteau. Ils ont des œufs, de la farine et un fouet.", "On fait un gâteau !"], ["Soudain, Bip éternue : atchoum ! La farine vole partout.", "Oh non, la farine !"], ["Bip éternue encore. Des chaussettes volent dans la cuisine !", "Hé, stop !"], ["Pufi regarde dans le nez de Bip avec une loupe. Il y a quelque chose de petit et doux.", "Une plume !"], ["Pufi enlève la plume avec une pince. Bip n’éternue plus.", "Fini !"], ["Bip et Pufi terminent le gâteau. La plume est posée dessus.", "Miam !"]]],es:["El robot que estornuda", [["Pufi y el robot Bip hacen una tarta. Tienen huevos, harina y unas varillas.", "¡A cocinar!"], ["De pronto, Bip estornuda: ¡achís! La harina vuela por todas partes.", "¡Ay, la harina!"], ["Bip estornuda otra vez. ¡Los calcetines vuelan por la cocina!", "¡Eh, para!"], ["Pufi mira en la nariz de Bip con una lupa. Hay algo pequeño y suave.", "¡Una pluma!"], ["Pufi saca la pluma con unas pinzas. Bip ya no estornuda.", "¡Listo!"], ["Bip y Pufi terminan la tarta. La pluma está encima.", "¡Qué rica!"]]],it:["Il robot che starnutisce", [["Pufi e il robot Bip fanno una torta. Hanno uova, farina e una frusta.", "Facciamo la torta!"], ["All’improvviso Bip starnutisce: etciù! La farina vola dappertutto.", "Oh no, la farina!"], ["Bip starnutisce ancora. I calzini volano per la cucina!", "Ehi, basta!"], ["Pufi guarda nel naso di Bip con una lente. C’è qualcosa di piccolo e morbido.", "Una piuma!"], ["Pufi toglie la piuma con una pinzetta. Bip non starnutisce più.", "Fatto!"], ["Bip e Pufi finiscono la torta. La piuma è in cima.", "Che buona!"]]],pt:["O robô que espirra", [["Pufi e o robô Bip fazem um bolo. Eles têm ovos, farinha e um batedor.", "Vamos fazer bolo!"], ["De repente, Bip espirra: atchim! A farinha voa para todo lado.", "Ai, a farinha!"], ["Bip espirra de novo. As meias voam pela cozinha!", "Ei, pare!"], ["Pufi olha o nariz do Bip com uma lupa. Tem algo pequeno e macio.", "Uma pena!"], ["Pufi tira a pena com uma pinça. Bip para de espirrar.", "Pronto!"], ["Bip e Pufi terminam o bolo. A pena fica em cima.", "Que gostoso!"]]],nl:["De niezende robot", [["Pufi en robot Bip bakken een taart. Ze hebben eieren, bloem en een garde.", "We bakken!"], ["Opeens niest Bip: hatsjoe! De bloem vliegt overal.", "O nee, de bloem!"], ["Bip niest nog een keer. Sokken vliegen door de keuken!", "Hé, stop!"], ["P n.", "Hier is het!"], ["Pufi graaft en graaft. De hoek van een kist komt tevoorschijn!", "Een kist!"], ["In de kist zitten boeken en koekjes. Pufi geeft de papegaai een koekje.", "Neem er een!"]]],pl:["Skarb papugi", [["Fale przynoszą na plażę butelkę. W środku jest stara mapa.", "Mapa!"], ["Nagle przylatuje papuga i zabiera Pufiemu mapę!", "To moje!"], ["Papuga leci między palmami. Pufi biegnie za nią.", "Wracaj!"], ["Papuga upuszcza mapę na piasek, obok dwóch skrzyżowanych patyków.", "Tu jest!"], ["Pufi kopie i kopie. Wystaje róg skrzyni!", "Skrzynia!"], ["W skrzyni są książki i ciastka. Pufi daje papudze ciastko.", "Masz jedno!"]]],uk:["Скарб папуги", [["Хвилі приносять на пляж пляшку. Усередині стара мапа.", "Мапа!"], ["Раптом прилітає папуга й вихоплює в Пуфі мапу!", "Це моє!"], ["Папуга летить між пальмами. Пуфі біжить за нею.", "Вернися!"], ["Папуга кидає мапу на пісок біля двох схрещених паличок.", "Ось тут!"], ["Пуфі копає і копає. Показується край скрині!", "Скриня!"], ["У скрині книжки й печиво. Пуфі дає папузі печиво.", "Тримай!"]]],ru:["Сокровище попугая", [["Волны приносят на пляж бутылку. Внутри старая карта.", "Карта!"], ["Вдруг прилетает попугай и выхватывает у Пуфи карту!", "Это моё!"], ["Попугай летит между пальмами. Пуфи бежит за ним.", "Вернись!"], ["Попугай роняет карту на песок рядом с двумя скрещёнными палками.", "Вот тут!"], ["Пуфи копает и копает. Показывается угол сундука!", "Сундук!"], ["В сундуке книжки и печенье. Пуфи даёт попугаю печенье.", "Держи!"]]],hu:["A papagáj kincse", [["A hullámok egy üveget sodornak a partra. Benne egy régi térkép van.", "Egy térkép!"], ["Hirtelen jön egy papagáj, és kikapja Pufi kezéből a térképet!", "Az enyém!"], ["A papagáj a pálmafák között repül. Pufi utána fut.", "Gyere vissza!"], ["A papagáj a homokra ejti a térképet, két keresztbe tett bot mellé.", "Itt van!"], ["Pufi ás és ás. Előbukkan egy láda sarka!", "Egy láda!"], ["A ládában könyvek és kekszek vannak. Pufi ad egy kekszet a papagájnak.", "Vegyél te is!"]]]}}
];
const ET=e=>e.t[L()]||e.t.en;
const pad=n=>String(n).padStart(2,'0');
const img=(e,name)=>`benzi/ep${pad(e.id)}/${name}.jpg`;
/* „*cuvânt*” → părțile: înainte, cuvânt, după */
const split=s=>{ const m=s.match(/^(.*?)\*(.+?)\*(.*)$/); return m?{a:m[1],k:m[2],b:m[3]}:{a:s,k:'',b:''}; };
const upperOn=()=>{ try{ return localStorage.getItem('rd_case')!=='lower'; }catch(e){ return true; } };
const prog=()=>LS.get('cm_prog',{}); const recs=()=>LS.get('cm_recs',{});
const recKey=(e,i)=>`cm-${L()}-ep${e.id}-p${i+1}`;

let cur=null, tok=0, onBack=null;
/* vocea copilului (asr.playLast / rec.play) nu poate fi oprită din joc: o urmărim și nu pornim pagina următoare până nu se termină */
let playP=Promise.resolve(), playing=false;
const playBack=(m,a)=>{ if(!N) return Promise.resolve(); playing=true; const p=Promise.resolve(N.call(m,a)).catch(()=>{}).then(()=>{ playing=false; }); playP=p; return p; };
const quiet=()=>playing?Promise.race([playP,wait(15000)]):Promise.resolve();
function pill(){ try{ $('stars').textContent='⭐ '+(typeof stars!=='undefined'?stars:0); }catch(e){} }
function stopAll(){ tok++; try{ if(N){ N.call('rec.stop'); N.call('asr.stop'); } }catch(e){} try{ speechSynthesis.cancel(); }catch(e){} }
function open(back){ onBack=back||null; root.hidden=false; $('title').textContent=U().title; $('back').textContent=U().back; pill(); library(); }
window.openComics=open;
$('back').onclick=()=>{ if(cur){ stopAll(); cur=null; library(); return; } stopAll(); root.hidden=true; if(onBack) onBack(); };

/* card în meniul Citire */
window.__comicCard=()=>{ const b=el('button','rd-card new',`<span class="ic">💬</span><span class="nm">${U().card}</span>`); b.id='rd-g-comic'; b.dataset.lk='cm:lib'; b.dataset.new=({ro:'NOU',de:'NEU',en:'NEW'})[lang]||(((window.L10N||{}).misc||{})[lang]||{}).newB||'NEW'; b.onclick=()=>open(); return b; };

/* ---------------- biblioteca ---------------- */
function library(){ cur=null; stopAll(); main.innerHTML=''; main.classList.remove('cm-film'); const p=prog();
  const h=el('div','cm-head'); h.append(el('div','cm-face','🦊')); const m=el('div','cm-msg'); m.textContent=U().pick; m.onclick=()=>sp(U().pick); h.append(m); main.append(h);
  const g=el('div','cm-lib');
  EPS.forEach((e,i)=>{ const lock=!e.soon&&i>0&&!p[EPS[i-1].id]; const c=el('button','cm-ep'+(e.soon?' soon':lock?' lock':''));
    c.dataset.lk='cm:ep'+e.id;
    const cv=el('div','cv'); cv.style.background=e.bg; cv.textContent=e.ic; if(!e.soon){ const im=new Image(); im.alt=''; im.onload=()=>{ cv.textContent=''; cv.append(im); }; im.src=img(e,'cover'); }
    c.append(cv, el('div','t',ET(e)[0]), el('div','st',e.soon?U().soon:p[e.id]?U().done:''));
    if(p[e.id]){ const f=el('button','cm-film-b',U().film); f.onclick=ev=>{ ev.stopPropagation(); if(window.__gate&&window.__gate('cm','ep'+e.id)) return; film(e); }; c.append(f); }
    c.onclick=()=>{ if(e.soon){ sp(U().soon); return; } if(lock){ sp(U().locked); return; } if(window.__gate&&window.__gate('cm','ep'+e.id)) return; read(e); };
    g.append(c); });
  main.append(g); sp(U().pick); }

/* ---------------- cititorul ---------------- */
function frame(e,i){ const f=el('div','cm-frame'); const ph=el('div','cm-ph',e.ph[i]); ph.style.background=`linear-gradient(${e.bg} 0 36%,#FFF8E6 36%)`; f.append(ph);
  const im=new Image(); im.alt=''; im.onload=()=>{ ph.remove(); f.prepend(im); }; im.src=img(e,'p'+(i+1)); return f; }
/* balonul îl citește copilul în întregime (1–3 cuvinte); fiecare cuvânt e un span, pentru recunoașterea vocii */
function bubble(e,i,state){ const txt=ET(e)[1][i][1].replace(/\*/g,''); const b=el('div','cm-bub '+(upperOn()?'cm-uc':'cm-lc')+(state?' '+state:''));
  const pos=(e.pos||[])[i]||'c'; if(pos==='l'){ b.style.left='3%'; b.style.transform='none'; b.style.setProperty('--bx','0px'); b.style.maxWidth='46%'; }
  requestAnimationFrame(()=>{ try{ const pr=b.parentNode.getBoundingClientRect(), br=b.getBoundingClientRect(); const target=(e.sx?e.sx[i]:50)/100*pr.width; const rel=Math.max(22,Math.min(br.width-22,target-(br.left-pr.left))); b.style.setProperty('--tx',rel+'px'); }catch(err){} });
  const spans=[]; txt.split(/(\s+)/).forEach(part=>{ if(!part) return; if(/^\s+$/.test(part)){ b.append(' '); return; }
    const m=part.match(/^([^\p{L}\p{N}]*)(.*?)([^\p{L}\p{N}]*)$/u); if(m[1]) b.append(m[1]); if(m[2]){ const w=el('span','cm-w'); w.textContent=m[2]; spans.push({sp:w}); b.append(w); } if(m[3]) b.append(m[3]); });
  return {b,spans,txt}; }
const esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]);

function read(e){ cur={e,i:0,film:false}; panel(); }
/* o casetă are două momente clare:
   1. „👂 Ascultă” – Pufi citește textul de sus (propoziții întregi); balonul e estompat;
   2. „🎤 Rândul tău” – balonul se aprinde; în aplicație microfonul ascultă singur și cuvintele se fac verzi pe rând,
      iar când a citit tot balonul se oprește singur (fără butoane de pornit/oprit); în browser: „✔ Am citit”. */
async function panel(){ const my=++tok; const {e,i}=cur; const [nar]=ET(e)[1][i]; try{ if(N) N.call('rec.stop'); }catch(err){} main.innerHTML=''; main.classList.remove('cm-film');
  const alive=()=>my===tok&&!root.hidden&&!!cur&&!cur.film;
  const dots=el('div','cm-dots'); ET(e)[1].forEach((_,j)=>dots.append(el('i',j<i?'ok':j===i?'on':''))); main.append(dots);
  const cap=el('div','cm-cap now',esc(nar)); cap.onclick=()=>sp(nar); main.append(cap);
  const pn=el('div','cm-panel'); const fr=frame(e,i); const {b,spans,txt}=bubble(e,i,'wait'); fr.append(b); pn.append(fr); main.append(pn);
  const st=el('div','cm-turn',U().listen); main.append(st); const hint=el('div','cm-hint'); main.append(hint); const ctl=el('div','cm-ctrl'); main.append(ctl);
  spans.forEach(o=>o.sp.onclick=()=>{ if(!b.classList.contains('wait')) sp(o.sp.textContent); });
  await quiet(); if(!alive()) return; /* întâi se termină vocea copilului, apoi vorbește Pufi */
  await sp(nar); if(!alive()) return;
  cap.classList.remove('now'); b.classList.remove('wait'); b.classList.add('turn'); st.textContent=U().label; st.classList.add('go'); snd(880,.15); setTimeout(()=>snd(1175,.18),150);
  const useMic=!!(N&&window.__micRead);
  await sp(i===0?(useMic?U().turnLong:U().turnLongWeb):U().turn); if(!alive()) return;
  let done=false;
  const success=async()=>{ if(done||!alive()) return; done=true; b.classList.remove('turn'); b.classList.add('done'); spans.forEach(o=>o.sp.classList.add('ok')); st.textContent='✅'; st.classList.remove('go'); snd(660,.1); setTimeout(()=>snd(990,.12),120);
    if(useMic){ try{ const r=await N.call('asr.saveLast',{key:recKey(e,i)}); if(r===true){ const R=recs(); R[recKey(e,i)]=1; LS.set('cm_recs',R); } }catch(err){} }
    else await sp(txt); /* în browser, Pufi repetă balonul ca să-l audă întreg */
    if(!alive()) return; nextBtns(); };
  const webBtn=()=>{ const r=el('button','go',U().read); r.onclick=()=>{ r.remove(); success(); }; ctl.append(r); };
  function nextBtns(){ if(!useMic) ctl.innerHTML=''; else ctl.querySelectorAll('button').forEach(x=>{ x.onclick=()=>{ if(!playing) playBack('asr.playLast'); }; }); const rep=el('button','sm','🔁'); rep.onclick=()=>panel(); const go=el('button','go',i<ET(e)[1].length-1?'▶':'🎬');
    go.onclick=async()=>{ if(go.disabled) return; go.disabled=true; await quiet(); if(!alive()) return; if(i<ET(e)[1].length-1){ cur.i++; panel(); } else finishEp(e); }; ctl.append(rep,go); }
  if(useMic){ window.__micRead({spans,row:ctl,task:hint,alive:()=>alive()&&!done,onDone:success});
    /* dacă microfonul nu pornește, trecem pe „Am citit” */
    setTimeout(()=>{ if(alive()&&!done&&!ctl.querySelector('.nt-mic')&&!ctl.querySelector('.go')) webBtn(); },2500); }
  else webBtn(); }

function finishEp(e){ if(playing){ quiet().then(()=>finishEp(e)); return; } const p=prog(); const first=!p[e.id]; p[e.id]=1; LS.set('cm_prog',p);
  if(first){ try{ stars+=3; renderBar(); }catch(err){} pill(); try{ window.__lvDone&&window.__lvDone(1); }catch(err){} }
  try{ confetti(20); }catch(err){} sp(U().filmSay).then(()=>{ if(cur&&cur.e===e) film(e); }); }

/* ---------------- filmul: povestea cu vocea copilului ---------------- */
async function film(e){ cur={e,i:0,film:true}; const my=++tok; const R=recs(); const n=ET(e)[1].length;
  for(let i=0;i<n;i++){ if(my!==tok) return; cur.i=i; const [nar]=ET(e)[1][i]; main.innerHTML=''; main.classList.add('cm-film');
    const dots=el('div','cm-dots'); ET(e)[1].forEach((_,j)=>dots.append(el('i',j<i?'ok':j===i?'on':''))); main.append(dots);
    const cap=el('div','cm-cap now',esc(nar)); main.append(cap); const pn=el('div','cm-panel'); const fr=frame(e,i); const {b,txt}=bubble(e,i,'wait'); fr.append(b); pn.append(fr); main.append(pn);
    await sp(nar); if(my!==tok) return; cap.classList.remove('now'); b.classList.remove('wait'); b.classList.add('turn');
    if(N&&R[recKey(e,i)]) await playBack('rec.play',{key:recKey(e,i)}); else await sp(txt);
    if(my!==tok) return; b.classList.remove('turn'); b.classList.add('done'); await wait(700); }
  main.classList.remove('cm-film'); if(my!==tok) return; const end=el('div','cm-ctrl'); const a=el('button','go',U().again); a.onclick=()=>film(e); const l=el('button','sm',U().lib); l.onclick=()=>library(); end.append(a,l); main.append(end); sp(U().end); }

(window.__LR=window.__LR||[]).push(()=>{ if(root.hidden) return; $('title').textContent=U().title; $('back').textContent=U().back; if(!cur) library(); });
})();
</script>
