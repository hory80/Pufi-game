  W.ents.forEach(e=>{ if(!((e.t==='pstar'||e.t==='rstar')&&e.rise>0)&&e.x>camX-TS*2&&e.x<camX+VW+TS) drawEnt(e); });
  if(state!=='won'||true) drawPufi();
  for(let ty=0;ty<ROWS;ty++) for(let tx=c0;tx<=c1;tx++){ const c=W.g[ty][tx]; if(c==='['||c===']'||c==='{'||c==='}') tileDraw(c,tx,ty); }
  parts.forEach(p=>{ g2.globalAlpha=Math.min(1,p.life*2); if(p.star) drawStar(p.x,p.y,p.r,time*4); else if(p.sq){ g2.fillStyle=p.c; g2.fillRect(p.x-p.r,p.y-p.r,p.r*2,p.r*2); } else { g2.fillStyle=p.c; g2.beginPath(); g2.arc(p.x,p.y,p.r,0,7); g2.fill(); } }); g2.globalAlpha=1;
  g2.restore();
  if(THEMES[W.theme].dark&&W.theme!=='night'){ const gx=(P.x+P.w/2-camX)*scale, gy=offY+(P.y+P.h/2)*scale, rg=g2.createRadialGradient(gx,gy,60*scale,gx,gy,460*scale); rg.addColorStop(0,'rgba(0,0,0,0)'); rg.addColorStop(1,'rgba(0,0,0,.45)'); g2.fillStyle=rg; g2.fillRect(0,0,CW,CH); } }

/* ---------- control ---------- */
function bind(el,k){ const ids=new Set(); const upd=()=>{ const was=keys[k]; keys[k]=ids.size>0; el.classList.toggle('on',keys[k]); if(!was&&keys[k]){ if(k==='j') jumpPress=true; if(k==='d') downPress=true; } };
  el.addEventListener('pointerdown',e=>{ e.preventDefault(); ids.add(e.pointerId); try{ el.setPointerCapture(e.pointerId); }catch(_){} try{ ac&&ac.resume&&ac.resume(); }catch(_){} upd(); });
  ['pointerup','pointercancel','lostpointercapture','pointerleave'].forEach(ev=>el.addEventListener(ev,e=>{ ids.delete(e.pointerId); upd(); }));
  el.addEventListener('contextmenu',e=>e.preventDefault()); el._clear=()=>{ ids.clear(); upd(); }; }
const BTN={bL:'l',bR:'r',bD:'d',bJ:'j'}; Object.keys(BTN).forEach(id=>bind($(id),BTN[id]));
function clearKeys(){ Object.keys(BTN).forEach(id=>$(id)._clear&&$(id)._clear()); keys.l=keys.r=keys.d=keys.j=false; }
addEventListener('blur',clearKeys); document.addEventListener('visibilitychange',clearKeys);
const KM={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowDown:'d',KeyS:'d',ArrowUp:'j',KeyW:'j',Space:'j'};
addEventListener('keydown',e=>{ if(root.hidden) return; const k=KM[e.code]; if(!k) return; e.preventDefault(); if(!keys[k]){ if(k==='j') jumpPress=true; if(k==='d') downPress=true; } keys[k]=true; });
addEventListener('keyup',e=>{ const k=KM[e.code]; if(k) keys[k]=false; });
root.addEventListener('touchmove',e=>e.preventDefault(),{passive:false}); root.addEventListener('gesturestart',e=>e.preventDefault());

/* ---------- ecrane ---------- */
function showMap(){ state='map'; clearKeys(); $('winOv').hidden=true; $('mapOv').hidden=false; $('title').textContent=X().title; $('sub').textContent=X().sub; $('help').textContent=X().help; $('exit').textContent=X().exit;
  const m=$('map'); m.innerHTML=''; for(let i=0;i<NLV;i++){ const open=i<prog.un, b=document.createElement('button'); b.className='pq-lv'+(open?'':' lock'); b.dataset.lk='pq:'+i; b.style.background=LBG[i]; const md=prog.best[i]||0;
    b.innerHTML=`<span class="ic">${LIC[i]}</span><span class="t">${i+1}. ${X().names[i]}</span><span class="m">${'🌟'.repeat(md)}${'☆'.repeat(3-md)}</span>`; b.onclick=()=>{ if(!open) return; try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); ac.resume&&ac.resume(); }catch(e){} startLevel(i); }; m.appendChild(b); } }
function showWin(){ if(state!=='won'||root.hidden) return; const last=LI===NLV-1; prog.best[LI]=Math.max(prog.best[LI]||0,medals.size); prog.un=Math.max(prog.un,Math.min(NLV,LI+2)); saveP(); cpX=null;
  try{ if(typeof stars!=='undefined'){ stars+=1+medals.size; renderBar&&renderBar(); } }catch(e){}
  $('winHero').textContent=last?'🏆🦊🎉':'🏠🦊🎉'; $('winT').textContent=last?X().allDone:X().won; $('winS').textContent=X().winS(sc,medals.size);
  $('next').textContent=last?X().map:X().next; $('again').textContent=X().again; $('toMap').textContent=X().map; $('winOv').hidden=false; sp((last?X().allDone:X().won)+' '+X().winS(sc,medals.size).replace(/[⭐🌟·]/g,' ')); }
$('next').onclick=()=>{ if(LI<NLV-1) startLevel(LI+1); else showMap(); };
$('again').onclick=()=>startLevel(LI); $('toMap').onclick=showMap; $('menu').onclick=showMap;
$('mute').onclick=()=>{ muted=!muted; try{ localStorage.setItem('pq_mute',muted?'1':'0'); }catch(e){} $('mute').textContent=muted?'🔇':'🔊'; if(muted) try{ speechSynthesis.cancel(); }catch(e){} };
$('exit').onclick=()=>{ state='map'; root.hidden=true; try{ speechSynthesis.cancel(); }catch(e){} };

/* ---------- buclă (protejată: o eroare nu mai blochează jocul) ---------- */
let lastT=performance.now();
function loop(now){ try{ const dt=Math.min(.05,(now-lastT)/1000); lastT=now;
    if(!root.hidden&&W){ if(state!=='map'){ const n=Math.ceil(dt/(1/120)); for(let i=0;i<n;i++) step(dt/n); } else time+=dt; drawWorld(); } }
  catch(err){ try{ console.warn('pq',err); if(P){ unstick(P); state=state==='map'?'map':'play'; anim=null; } }catch(_){} }
  requestAnimationFrame(loop); }
resize(); MAIN=W=LV(0).main; P=newP(2*TS,GY*TS); requestAnimationFrame(loop);
(window.__LR=window.__LR||[]).push(()=>{ if(!root.hidden&&state==='map') showMap(); });
startLevel=(f=>(i,...a)=>{ if(window.__gate&&window.__gate('pq',i)){ showMap(); return; } return f(i,...a); })(startLevel);
window.openPufi=lg=>{ root.hidden=false; resize(); $('mute').textContent=muted?'🔇':'🔊'; showMap(); };
window.__pq={start:startLevel,get P(){return P},get W(){return W},get state(){return state},keys,press:k=>{ if(k==='j') jumpPress=true; if(k==='d') downPress=true; },grow,LV,set hearts(v){hearts=v}};
})();
</script>
